 left out because the API would reject their input schema, and why", "中文内容": "改进了`/mcp`以显示有多少服务器工具因 API 会拒绝其输入模式而被遗漏，以及原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the \"Not now\" choice when Claude Code asks to turn on the mods it writes in a session: it now says when they load", "中文内容": "改进了当 Claude Code 要求打开它在会话中编写的 mod 时的“现在不”选择：它现在会显示它们何时加载"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the error for an MCP tool call whose connector ID is mistyped by a character or two: for a server that the host application registered, it now names the tool to call", "中文内容": "改进了连接器 ID 输错一两个字符的 MCP 工具调用的错误：对于主机应用程序注册的服务器，它现在命名要调用的工具"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved Claude Desktop and cloud sessions for claude.ai accounts with more than 2,000 plugins turned on: a shorter wait at startup, and Claude can now say why plugins are missing", "中文内容": "改进了 claude.ai 帐户的 Claude 桌面和云会话，打开了 2,000 多个插件：启动时的等待时间更短，Claude 现在可以说出插件缺失的原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved memory use with many subagents: a finished subagent's transcript is freed sooner instead of staying in memory while later subagents run", "中文内容": "改进了许多子代理的内存使用：完成的子代理的转录本会更快地释放，而不是在稍后的子代理运行时保留在内存中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved installing with the install script: the latest version is no longer downloaded twice", "中文内容": "改进了使用安装脚本的安装：最新版本不再下载两次"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved WebFetch speed and memory use on deeply nested pages", "中文内容": "改进了深层嵌套页面上的 WebFetch 速度和内存使用"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the `cleanupPeriodDays` cleanup to count folders it can't read as errors", "中文内容": "改进了`cleanupPeriodDays`清理以计算无法读取为错误的文件夹"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the Claude apps gateway's `/v1/models` to state `max_input_tokens` for models whose context window is certain on every upstream", "中文内容": "改进了克劳德应用程序网关的`/v1/models`，以针对每个上游上下文窗口都确定的模型声明`max_input_tokens`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved `ToolSearch` to say when a tool Claude searched for by its short name is already available, instead of only reporting no match", "中文内容": "改进了`ToolSearch`，当 Claude 通过短名称搜索的工具已经可用时，会显示该工具，而不是仅报告不匹配"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved start-up on Linux when `/home` is an autofs map: Claude Code no longer looks up files in `/home` itself. Set `CLAUDE_CODE_AUTOMOUNT_ROOTS` for a map root deeper than one folder below `/`", "中文内容": "当`/home`是 autofs 映射时，改进了 Linux 上的启动：Claude Code 不再在`/home`本身中查找文件。为比`/`下面的一个文件夹更深的地图根设置`CLAUDE_CODE_AUTOMOUNT_ROOTS`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the Fable limit message in `-p`, SDK, IDE and cloud sessions: it now says when the limit resets, along with how to continue", "中文内容": "改进了`-p`、SDK、IDE 和云会话中的 Fable 限制消息：现在它会显示限制何时重置以及如何继续"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `/security-review` to ask before Claude runs it, and skills' inline git commands to stop in bare-repository worktrees and similar folders until you allow them, outside auto mode and bypass", "中文内容": "更改了`/security-review`，以在 Claude 运行之前进行询问，并且将技能的内联 git 命令更改为在裸存储库工作树和类似文件夹中停止，直到您允许它们，在自动模式之外并绕过"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed how many messages each of your sessions on the same machine can send the others without a prompt from you, from about 20 to 100,000", "中文内容": "更改了同一计算机上的每个会话可以在没有提示的情况下向其他会话发送的消息数量，从大约 20 到 100,000"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the number of messages a Claude Desktop Code tab session can send to your other sessions before it waits for you to type again from 20 to 100,000", "中文内容": "将 Claude Desktop Code 选项卡会话在等待您再次键入之前可以发送到其他会话的消息数从 20 更改为 100,000"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed organization settings and policy requests to no longer use a proxy set only by `ALL_PROXY`; set `HTTPS_PROXY` if your network needs a proxy for them", "中文内容": "更改了组织设置和策略请求，不再使用仅由`ALL_PROXY`设置的代理；如果您的网络需要代理，请设置`HTTPS_PROXY`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the context window assumed for a model ID that Claude Code doesn't recognize from 200K to 1M; use `/autocompact` to compact earlier, or `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` to keep 200K", "中文内容": "将 Claude Code 无法识别的模型 ID 假定的上下文窗口从 200K 更改为 1M；使用 `/autocompact` 提前压缩，或使用 `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` 保留 200K"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed sessions on other vendors' models with a smaller window: once full, they can fail every turn until `/clear`, so set `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` before they fill", "中文内容": "使用较小的窗口更改了其他供应商模型上的会话：一旦填满，它们每次都会失败，直到`/clear`，因此在填充之前设置`CLAUDE_CODE_DISABLE_1M_CONTEXT=1`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed Claude Code's own ripgrep and most internal git commands to run without most of its sign-in tokens and API keys, so a credential helper or hook under such a git command no longer finds them", "中文内容": "更改了 Claude Code 自己的 ripgrep 和大多数内部 git 命令，使其在没有大部分登录令牌和 API 密钥的情况下运行，因此此类 git 命令下的凭证帮助程序或挂钩不再找到它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `MCP_SDK_GENERATION=v1` to run the v2 MCP client in a compatibility mode (earlier handshake, relaxed OAuth sign-in checks), because the v1 MCP client is removed", "中文内容": "更改了`MCP_SDK_GENERATION=v1`以在兼容模式下运行 v2 MCP 客户端（较早的握手、宽松的 OAuth 登录检查），因为 v1 MCP 客户端已被删除"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the tool Claude uses to finish an MCP server sign-in so that it asks you to confirm, even in bypass and auto modes; where nobody can be asked, such as in `dontAsk` mode, use `/mcp`", "中文内容": "更改了 Claude 用于完成 MCP 服务器登录的工具，以便它要求您确认，即使在旁路和自动模式下也是如此；在无法询问任何人的情况下，例如在`dontAsk`模式下，请使用`/mcp`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Self-hosted runner: Changed a session at a connector's approval prompt or sign-in inside a running tool to be released as paused at the idle or lifetime limit; a late answer resumes from a fresh clone", "中文内容": "自托管运行器：在连接器的批准提示或登录运行工具中更改会话，以在空闲或生命周期限制时以暂停状态释放；迟到的答案从新的克隆中恢复"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed artifact updates to ask first, even under an allow rule, when people outside your organization can see the artifact or Claude can't check who can", "中文内容": "更改了工件更新，即使在允许规则下，当组织外部的人员可以查看工件或 Claude 无法检查谁可以查看工件时，也会首先询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `glab config set` without `--global` or `--host`, and `glab config edit --local`, to fail read-only inside the Bash sandbox; run them outside it", "中文内容": "更改了不带`--global`或`--host`的`glab config set`，以及`glab config edit --local`，以在 Bash 沙箱内以只读方式失败；将它们运行到外面"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the Bash sandbox on macOS, Linux and WSL to ignore write access granted through a symlink in a writable folder that leads elsewhere or to a missing path; grant the real path instead", "中文内容": "更改了 macOS、Linux 和 WSL 上的 Bash 沙箱，以忽略通过可写文件夹中的符号链接授予的写入访问权限，该符号链接通向其他地方或丢失的路径；授予真实路径"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed \"don't ask again\" so an allow rule that looks like it holds a secret, or would be saved to a `settings.local.json` that git tracks, lasts for the session only and isn't saved", "中文内容": "更改了“不再询问”，因此看起来像是持有秘密的允许规则，或者将被保存到 git 跟踪的 `settings.local.json` 中，仅持续会话并且不保存"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the sandbox on macOS and Linux: `git worktree add`, `move` and `remove` now fail read-only, as do commits in a worktree the session wasn't started in or given, even one inside the project", "中文内容": "更改了 macOS 和 Linux 上的沙箱：`git worktree add`、`move`和`remove`现在以只读方式失败，就像工作树中的提交一样，会话未在其中启动或给出，即使是项目内部的会话也是如此"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed start-up to stop when a `--settings` file isn't valid JSON and has a `sandbox` key, even one that turns the sandbox off", "中文内容": "将启动更改为当`--settings`文件不是有效的 JSON 并且具有“沙箱”密钥（甚至是关闭沙箱的密钥）时停止"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed what happens when a tool's permission check fails with an error after a `PreToolUse` hook returned \"allow\": Claude Code now decides the call as if no hook had answered", "中文内容": "更改了在`PreToolUse`钩子返回“允许”后工具的权限检查失败并出现错误时发生的情况：Claude Code 现在决定调用，就好像没有钩子应答一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed what happens when a tool's permission check fails on input that a `PermissionRequest` hook rewrote: Claude Code now asks again, or refuses the call where nobody can answer", "中文内容": "更改了当工具的权限检查在`PermissionRequest`钩子重写的输入上失败时发生的情况：克劳德代码现在再次询问，或者拒绝无人可以应答的呼叫"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the GitLab merge request badge to show only for the repository a sandboxed session opened in", "中文内容": "更改了 GitLab 合并请求徽章，仅显示在以下位置打开的沙盒会话的存储库"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the `claude mcp add --help` example to a local command", "中文内容": "将 `claude mcp add --help` 示例更改为本地命令"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed mods: a `*`, namespace or negated hook on `engine.create` now only observes. To add or withhold a `$` noun, hook `engine.create` by name", "中文内容": "更改了 mods：`engine.create`上的`*`、名称空间或否定挂钩现在仅观察。要添加或保留`$`名词，请按名称挂钩`engine.create`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `claude plugin validate` to fail a mod whose `engine.create` hook isn't written in the one accepted form; installed mods keep loading", "中文内容": "更改了`claude plugin validate`，使其`engine.create`挂钩未以一种可接受的形式编写的 mod 失败；已安装的模组继续加载"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed marketplace and plugin installs to fail when a git submodule isn't on the commit its repository records", "中文内容": "更改了当 git 子模块不在提交其存储库记录时市场和插件安装失败的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed project (`.mcp.json`) MCP server approvals to match the server's exact name; an approval entry written in another spelling now asks again", "中文内容": "更改了项目 (`.mcp.json`) MCP 服务器批准以匹配服务器的确切名称；用另一种拼写编写的批准条目现在再次询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed self-hosted runners under `--trust-workspace false` and VS Code sessions in an untrusted folder: the repository's settings can no longer disable your hooks or turn plugins on or off", "中文内容": "更改了不受信任文件夹中`--trust-workspace false`和 VS Code 会话下的自托管运行器：存储库的设置无法再禁用您的挂钩或打开或关闭插件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `tool.list` plugin hooks so the tools they add or remove apply to the model and every agent", "中文内容": "更改了`tool.list`插件挂钩，以便它们添加或删除的工具适用于模型和每个代理"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `claude plugin install` and `/plugin` to show a warning instead of success when a plugin's install command writes to stderr", "中文内容": "更改了 `claude plugin install` 和 `/plugin` 以在插件的安装命令写入 stderr 时显示警告而不是成功"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed claude.ai chats and Cowork tasks to check a plugin file for secret keys before sending it, and to ask first if it may hold one", "中文内容": "更改了 claude.ai 聊天和 Cowork 任务，以便在发送插件文件之前检查其密钥，并首先询问它是否可以保存密钥"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `claude rm` and the agents view to say a session is removed from the list, not deleted; `claude rm` help says the conversation is kept and `claude --resume` lists it", "中文内容": "更改了“claude rm”和代理视图，表示会话已从列表中删除，而不是删除； `claude rm` 帮助表示保留对话，并且 `claude --resume` 列出它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `/stickers` to say that the sticker pack is all claimed for now, instead of opening a page in the browser", "中文内容": "更改了`/stickers`以表示贴纸包目前已全部认领，而不是在浏览器中打开页面"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed a managed settings `policyHelper` to no longer take environment variables from user or `--settings` files; set what it needs in managed `env` or the launching shell", "中文内容": "更改了托管设置`policyHelper`，不再从用户或`--settings`文件中获取环境变量；在托管`env`或启动 shell 中设置所需内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed a `/skill` or `@file` typed between two files picked in claude.ai or the desktop app, or after a picked file and a link, to no longer take effect", "中文内容": "更改了在 claude.ai 或桌面应用程序中选取的两个文件之间或在选取的文件和链接之后键入的`/skill`或`@file`，使其不再生效"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed split-pane agent teammates to check that requests come from their team lead: one that outlives its lead has its asks refused, and plan approvals must be re-sent after `/clear` or `/resume`", "中文内容": "更改了分割窗格代理队友，以检查请求是否来自其团队负责人：比其负责人寿命更长的人的请求会被拒绝，并且必须在`/clear`或`/resume`之后重新发送计划批准"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed worktree creation to refuse checkouts whose `.git` folders are links or hold hard links, such as git-new-workdir layouts and `cp -al` copies; use a plain clone", "中文内容": "更改了工作树的创建，以拒绝`.git`文件夹是链接或包含硬链接的签出，例如 git-new-workdir 布局和`cp -al`副本；使用普通克隆"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed what Claude is told after safeguards stop a forked skill or a workflow agent: retry with a narrower prompt or tell you, instead of doing the work itself", "中文内容": "更改了防护措施停止分叉技能或工作流程代理后克劳德被告知的内容：使用更窄的提示重试或告诉您，而不是自行完成工作"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed browser tool calls (Claude in Chrome, the desktop browser pane) to refuse some escaped or JSON-text inputs and tell Claude how to respell them", "中文内容": "更改了浏览器工具调用（Chrome 中的 Claude，桌面浏览器窗格）以拒绝某些转义或 JSON 文本输入，并告诉 Claude 如何重新拼写它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed workflows so that a prompt an app marks as not typed no longer reaches their agents as your request", "中文内容": "更改了工作流程，以便应用程序标记为未键入的提示不再按照您的请求到达其代理"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed computer use on macOS to refuse key chords that hold Space with Control or Option, and more system shortcuts that need your grant", "中文内容": "更改了 macOS 上的计算机使用，以拒绝使用 Control 或 Option 按住 Space 的键和弦，以及更多需要您授权的系统快捷方式"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed first-run setup in Terminal.app to name the \"Use Option as Meta key\" setting, what Option stops typing, and how to undo it before you agree", "中文内容": "更改了 Terminal.app 中的首次运行设置，将“使用 Option 作为元键”设置命名为“使用 Option 作为元键”设置、什么 Option 会停止输入，以及如何在您同意之前撤消它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the maximum of `CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS` from 64000 to 300000", "中文内容": "将`CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS`的最大值从 64000 更改为 300000"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed workflows in the desktop app's Code tab to pause at a usage limit and continue after it resets", "中文内容": "更改了桌面应用程序“代码”选项卡中的工作流程，以在使用限制时暂停并在重置后继续"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the spend limit and 1M context errors, and `/usage-credits`, in cloud sessions and under Remote Control: they no longer give a web address", "中文内容": "更改了云会话和远程控制下的支出限制和 1M 上下文错误以及`/usage-credits`：它们不再提供网址"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed which MCP servers are reported by name in OpenTelemetry exports to follow the current connector directory", "中文内容": "更改了 OpenTelemetry 导出中按名称报告的 MCP 服务器，以遵循当前连接器目录"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `/logout` in a background session, which had no effect: it now signs out every session on the computer, deletes stored MCP logins and plugin secrets, and ends the session, as in a terminal", "中文内容": "在后台会话中更改了`/logout`，这没有任何效果：它现在注销计算机上的每个会话，删除存储的 MCP 登录名和插件机密，并结束会话，就像在终端中一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "macOS: Changed the Bash sandbox so `lsof` and similar tools may show less about processes a command did not start", "中文内容": "macOS：更改了 Bash 沙箱，因此`lsof`和类似工具可能会显示较少的有关命令未启动的进程的信息"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed cloud scheduled tasks: a `PostToolUse` hook from your own settings can no longer replace the plan in `ExitPlanMode`'s result", "中文内容": "更改了云计划任务：您自己的设置中的`PostToolUse`挂钩无法再替换`ExitPlanMode`结果中的计划"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `CLAUDE_AUTOCOMPACT_PCT_OVERRIDE` in Anthropic-hosted cloud sessions to stop applying to auto-memory extraction and, in some sessions, to `/btw`; the main conversation still follows it", "中文内容": "更改了 Anthropic 托管的云会话中的`CLAUDE_AUTOCOMPACT_PCT_OVERRIDE`，以停止应用自动内存提取，并在某些会话中更改为`/btw`；主要对话仍然遵循它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "移除", "内容": "Removed the `subagentStatusLine` setting: subagent rows always use the default look, and settings files that still hold the key load as before", "中文内容": "删除了`subagentStatusLine`设置：子代理行始终使用默认外观，并且仍然像以前一样保存键加载的设置文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "移除", "内容": "Deprecated a plugin's `agent` setting: it still applies, and now warns at startup, in `claude plugin list` and in `claude plugin validate`", "中文内容": "已弃用插件的“代理”设置：它仍然适用，现在在启动时在“克劳德插件列表”和“克劳德插件验证”中发出警告"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Added a Claude Code trust prompt before the first session in a folder you haven't trusted; declining leaves the folder's settings and MCP servers unused", "中文内容": "[VSCode] 在您不信任的文件夹中的第一个会话之前添加了 Claude Code 信任提示；拒绝使文件夹的设置和 MCP 服务器未使用"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Added the live output of a running Bash or PowerShell command to the chat, under the command's card", "中文内容": "[VSCode] 将正在运行的 Bash 或 PowerShell 命令的实时输出添加到命令卡下的聊天中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed a response that was discarded because its tool call could not be parsed still showing after Claude retried", "中文内容": "[VSCode] 修复了因工具调用无法解析而被丢弃的响应，在 Claude 重试后仍然显示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed a queued message missing from a conversation or fork when it directly followed a compaction summary", "中文内容": "[VSCode] 修复了直接遵循压缩摘要时对话或分叉中缺少排队消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the \"Buy usage credits on claude.ai\" button counting as agreement to pay for Fable while usage credits were off", "中文内容": "[VSCode] 修复了“在 claude.ai 上购买使用积分”按钮在使用积分关闭时被视为同意支付《神鬼寓言》的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the \"extensions want to relaunch the terminal\" warning coming back on open terminals after every window reload or restart", "中文内容": "[VSCode] 修复了每次窗口重新加载或重新启动后打开的终端上出现的“扩展想要重新启动终端”警告"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed \"Couldn't load this conversation's saved history\" appearing in a new chat whose Claude process had restarted before the first prompt", "中文内容": "[VSCode] 修复了在第一次提示之前 Claude 进程已重新启动的新聊天中出现的“无法加载此对话的已保存历史记录”的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the sign-in screen showing the login choices again after a pasted code; it now shows \"Signing in…\" until the sign-in finishes", "中文内容": "[VSCode] 修复了粘贴代码后登录屏幕再次显示登录选项的问题；现在显示“正在登录...”，直到登录完成"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the \"You've hit your Fable limit\" line staying in the VS Code and JetBrains panels after you pick another model", "中文内容": "[VSCode] 修复了选择另一个模型后 VS Code 和 JetBrains 面板中保留的“您已达到寓言限制”行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the Fable usage warning in the VS Code and JetBrains panels naming usage credits when they're off or used up", "中文内容": "[VSCode] 修复了 VS Code 和 JetBrains 面板中的 Fable 使用警告，在关闭或用完时命名使用积分"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the diff tab not opening for multi-line edits on files with CRLF line endings", "中文内容": "[VSCode] 修复了在以 CRLF 行结尾的文件上进行多行编辑时无法打开 diff 选项卡的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed dictation continuing to record after switching sessions", "中文内容": "[VSCode] 修复了切换会话后听写继续记录的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Improved sign-in errors behind TLS-inspecting proxies: a certificate failure now says what to do, as the terminal does", "中文内容": "[VSCode] 改进了 TLS 检查代理背后的登录错误：证书失败现在会告诉您要做什么，就像终端一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Changed opening a Claude Code on the web session in a folder where Claude Code's sandbox is on: the extension no longer switches to the session's branch for you, and the dialog says why", "中文内容": "[VSCode] 更改了在 Claude Code 沙箱所在文件夹中的 Web 会话上打开 Claude Code 的方式：扩展程序不再为您切换到会话的分支，并且对话框会说明原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Improved the message when a file fails to upload to a cloud or Remote Control session: it now gives the reason, such as too many pages, a password or a time-out", "中文内容": "[网络上的克劳德代码] 改进了文件无法上传到云或远程控制会话时的消息：它现在给出原因，例如页面太多、密码或超时"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Improved adding a repository Claude can't access to a cloud session: a short message and a Reconnect GitHub button replace the long error", "中文内容": "[网络上的 Claude 代码] 改进了添加存储库 Claude 无法访问云会话：一条短消息和一个重新连接 GitHub 按钮替换了长错误"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed self-hosted sessions staying on \"Starting Claude Code\" after it had started, when you reopened a paused session without sending a message", "中文内容": "[网络上的克劳德代码] 修复了当您重新打开暂停的会话而不发送消息时，自托管会话在启动后停留在“正在启动克劳德代码”上的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed a paused session in a self-hosted environment sometimes  const rg=(x,y)=>x>=y?`${y}`:`${x}–${y}`,rng=[rg(1,th[0]),rg(th[0]+1,th[1]),rg(th[1]+1,th[2]),`>${th[2]}`];
 return `<h4 style="margin:12px 0 4px;font-size:14px">${ti}</h4><div class="lg">${cs.map((x,i)=>`<span><i style="background:${x};width:12px;height:12px"></i>${i?rng[i-1]:'0'}</span>`).join('')}</div><div class="sc heat"><svg width="${28+cols*(c+g)}" height="${20+7*(c+g)}">${s}</svg></div>`}
function heat(D){const zh=L==='zh',tot=r=>ORDER.reduce((a,q)=>a+r[q],0);
 return `<div class="ch"><h3>${zh?'功能更新量示意图':'Feature update map'}</h3><div class="note">${zh?'每格一天，每列一周；颜色越深当天条数越多（按全部有更新日子的四分位分 4 档）。点格子看当天内容':'One cell per day; darker = more entries (4 quartile levels). Click for details'}</div>`
 +hmap(D,tot,['var(--line)','var(--h1)','var(--h2)','var(--h3)','var(--h4)'],zh?'每日更新总量':'Daily total updates')
 +hmap(D,r=>r.新增,['var(--line)','var(--n1)','var(--n2)','var(--n3)','var(--n4)'],zh?'每日新增量':'Daily added features')+'</div>'}
function cum(D){const zh=L==='zh',H=260,top=20,bot=40,lft=40,rt=44,bw=3,W=lft+rt+D.length*bw,h=H-top-bot;
 const vs=new Set();let n=0;const pts=D.map(r=>{r.v.forEach(v=>vs.add(v));n+=r.新增;return{k:r.k,v:vs.size,n}});
 const mv=pts[pts.length-1].v,mn=pts[pts.length-1].n,Yv=v=>top+h-v/mv*h,Yn=v=>top+h-v/mn*h;let s='';
 for(let i=0;i<=4;i++){const yy=top+h-h*i/4;s+=`<line x1="${lft}" x2="${W-rt}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${lft-4}" y="${yy+3}" text-anchor="end" style="fill:var(--acc)">${Math.round(mv*i/4)}</text><text x="${W-rt+4}" y="${yy+3}" style="fill:var(--add-fg)">${Math.round(mn*i/4)}</text>`}
 pts.forEach((p,i)=>{if(p.k.slice(8)==='01')s+=`<text x="${lft+i*bw}" y="${H-bot+14}" text-anchor="middle">${p.k.slice(2,7)}</text>`});
 const line=(f,c)=>`<polyline points="${pts.map((p,i)=>`${lft+i*bw},${f(p)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/>`;
 s+=line(p=>Yv(p.v),'var(--acc)')+line(p=>Yn(p.n),'var(--add-fg)');
 return `<div class="ch"><h3>${zh?'发布累计版本量和累计新增需求量':'Cumulative versions & added features'}</h3><div class="note">${zh?`截至 ${last}：累计 ${mv} 个版本、${mn} 项新增`:`As of ${last}: ${mv} versions, ${mn} new features`}</div><div class="lg"><span><i style="background:var(--acc)"></i>${zh?'累计版本数（左轴）':'Cumulative versions (left)'}</span><span><i style="background:var(--add-fg)"></i>${zh?'累计新增数（右轴）':'Cumulative new (right)'}</span></div><div class="sc"><svg width="${W}" height="${H}">${s}</svg></div></div>`}
function grow(D){const zh=L==='zh',H=260,top=20,bot=40,lft=44,rt=20,bw=3,W=lft+rt+D.length*bw,h=H-top-bot;
 let a=0,b=0;const pts=D.map(r=>({k:r.k,a:a+=r.新增,b:b+=r.改进})),la=pts[pts.length-1],mx=Math.max(la.a,la.b),Y=v=>top+h-v/mx*h;let s='';
 for(let i=0;i<=4;i++){const v=Math.round(mx*i/4);s+=`<line x1="${lft}" x2="${W-rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${lft-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`}
 pts.forEach((p,i)=>{if(p.k.slice(8)==='01')s+=`<text x="${lft+i*bw}" y="${H-bot+14}" text-anchor="middle">${p.k.slice(2,7)}</text>`});
 const line=(f,c)=>`<polyline points="${pts.map((p,i)=>`${lft+i*bw},${Y(f(p))}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2"/>`;
 s+=line(p=>p.b,'var(--imp-fg)').replace('2.2','3.5')+line(p=>p.a,'var(--add-fg)');const ex=lft+(pts.length-1)*bw;s+=`<text x="${ex-4}" y="${Y(la.a)-6}" text-anchor="end" style="fill:var(--add-fg);font-size:12px">${zh?'新增':'Added'} ${la.a}</text><text x="${ex-4}" y="${Y(la.b)+16}" text-anchor="end" style="fill:var(--imp-fg);font-size:12px">${zh?'改进':'Improved'} ${la.b}</text>`;
 return `<div class="ch"><h3>${zh?'功能增长曲线':'Feature growth curve'}</h3><div class="note">${zh?`新增 = 功能点增长（做得多宽）；改进 = 功能完善性增长（做得多深）。截至 ${last}：累计新增 ${la.a}、累计改进 ${la.b}`:`Added = breadth, Improved = depth. As of ${last}: added ${la.a}, improved ${la.b}`}</div><div class="lg"><span><i style="background:var(--add-fg)"></i>${zh?'累计新增':'Cumulative new'}</span><span><i style="background:var(--imp-fg)"></i>${zh?'累计改进':'Cumulative improved'}</span></div><div class="sc"><svg width="${W}" height="${H}">${s}</svg></div></div>`}
function stats(){const t=T[L],zh=L==='zh',el=document.getElementById('vs');
 // 公开站首屏只有最近 7 个发布日，全部历史没到之前不画图（否则只有两三列，还会误导）
 if(!FULL){el.innerHTML=`<div class="ch"><div class="note">${FAIL?(zh?'全部历史没加载成功，请刷新页面重试':'Could not load full history, please refresh'):t.loading}</div></div>`;return}
 const D=agg(d=>key(d)),Wk=agg(d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return key(x)}),M=agg(d=>key(d).slice(0,7));
 const lg=`<div class="lg"><span class="t 新增">${t.k.新增}</span><span class="t 改进">${t.k.改进}</span><span class="t 修复">${t.k.修复}</span><span class="t 移除">${t.k.移除}</span><span class="t 其他">${t.k.其他}</span></div><div class="lg">${zh?'虚线 = 各类占当期总更新量的比例（右轴）：':'Dashed = share of each type (right axis): '}${ORDER.map(q=>`<span data-q="${q}" style="cursor:pointer;${HID.has(q)?'opacity:.35;text-decoration:line-through':''}"><i style="border-top:2px dashed ${({新增:'var(--add-fg)',修复:'var(--fix-fg)',改进:'var(--imp-fg)',移除:'var(--rm-fg)',其他:'var(--oth-fg)'})[q]};height:0;margin-bottom:3px"></i>${t.k[q]}%</span>`).join('')}</div>`;
 const card=(ti,note,rows,bw,v,legV)=>`<div class="ch"><h3>${ti}</h3><div class="note">${note}</div>${lg}${legV?`<div class="lg"><span style="color:var(--acc)">${zh?'柱顶橙色数字 = 版本数':'Orange number on top = versions'}</span></div>`:''}<div class="sc">${chart(rows,bw,v)}</div></div>`;
 const DD=R90?D.slice(-90):D,rb=`<button class="btn rb" style="margin-left:8px;height:26px;padding:0 10px;font-size:12px">${R90?(zh?'看全部':'Show all'):(zh?'只看近 90 天':'Last 90 days')}</button>`;
 el.innerHTML=heat(D)+card(zh?'每日更新量':'Daily updates',(zh?`${R90?'近 90 天':`全部 ${D.length} 天`}，鼠标悬停看明细；点虚线图例可隐藏/显示该线`:`${R90?'Last 90 days':`All ${D.length} days`}; hover for details; click dashed legend to toggle`)+rb,DD,R90?9:7,false,false)
  +card(zh?'每周更新量与版本数':'Weekly updates & versions',zh?'周一到周日为一周，横轴是周一日期':'Weeks start Monday',Wk,22,true,true)
  +card(zh?'每月更新量与版本数':'Monthly updates & versions','',M,48,true,true)+cum(D)+grow(D);
 el.querySelectorAll('.sc').forEach(x=>x.scrollLeft=x.scrollWidth);
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;HID.has(q)?HID.delete(q):HID.add(q);try{localStorage.setItem('hid',JSON.stringify([...HID]))}catch(e){}stats()});
 el.querySelector('.rb').onclick=()=>{R90=!R90;try{localStorage.setItem('r90',R90?'1':'0')}catch(e){}stats()};
 el.querySelectorAll('.heat rect').forEach(b=>{if(by[b.dataset.k])b.onclick=()=>{sel=b.dataset.k;y=+sel.slice(0,4);m=+sel.slice(5,7)-1;draw();show();view('m');window.scrollTo(0,0)}})}

// 搜索：输入 2 个字以上，在英文原文和中文里找
const QI=document.getElementById('q');
function search(){const v=QI.value.trim().toLowerCase(),sr=document.getElementById('sr'),zh=L==='zh';QI.placeholder=zh?'搜索更新内容…':'Search updates…';
 if(v.length<2){sr.innerHTML='';sr.style.display='none';view(V);return}
 ['vl','vm','vy','vs','vf','detail'].forEach(i=>document.getElementById(i).style.display='none');sr.style.display='';
 const hit=DATA.filter(x=>x.内容.toLowerCase().includes(v)||(x.中文内容||'').toLowerCase().includes(v)).sort((a,b)=>b.日期.localeCompare(a.日期)),sh=hit.slice(0,300);
 sr.innerHTML=`<div class="ch"><h3>${zh?`搜索「${esc(QI.value)}」：${hit.length} 条`:`"${esc(QI.value)}": ${hit.length} results`}${hit.length>300?(zh?'（只显示最近 300 条）':' (latest 300 shown)'):''}</h3><ul>${sh.map(x=>`<li><a href="#" data-k="${x.日期}" style="color:var(--acc);margin-right:6px">${x.日期||'?'} v${x.版本}</a><span class="t ${x.类型}">${T[L].k[x.类型]}</span>${esc(zh&&x.中文内容?x.中文内容:x.内容)}</li>`).join('')}</ul></div>`;
 sr.querySelectorAll('a[data-k]').forEach(a=>a.onclick=e=>{e.preventDefault();const k=a.dataset.k;if(!by[k])return;sel=k;y=+k.slice(0,4);m=+k.slice(5,7)-1;F=null;QI.value='';search();view('m');draw();show();document.getElementById('detail').scrollIntoView()})}
QI.oninput=search;
document.getElementById('p').innerHTML=icon('prev');document.getElementById('nx').innerHTML=icon('next');
const dlg=document.getElementById('dlg'),subb=document.getElementById('subb');subb.hidden=!SRC;subb.onclick=()=>{WH={s:'',v:'',busy:false};subD();dlg.showModal()};dlg.addEventListener('submit',e=>{if(e.target.matches('[data-whf]')){e.preventDefault();whAct('sub')}});dlg.onclick=e=>{if(e.target===dlg)return dlg.close();const m=e.target.closest('[data-cm]'),d=e.target.closest('[data-dl]'),i=e.target.closest('.inf');tipX(e.target);if(i){const t=i.closest('.so').querySelector('.tip');t.hidden=!t.hidden;i.setAttribute('aria-expanded',!t.hidden)}if(m){CM=m.dataset.cm;subD()}if(d)dlCard(d.dataset.dl);const w=e.target.closest('[data-wh]');if(w)whAct(w.dataset.wh)};
// ⓘ 提示卡：点外面关，Esc 先关提示卡再关弹窗
function tipX(el){let n=0;dlg.querySelectorAll('.tip:not([hidden])').forEach(t=>{const b=t.closest('.so').querySelector('.inf');if(el&&(t.contains(el)||b.contains(el)))return;t.hidden=true;b.setAttribute('aria-expanded',false);n++});return n}
dlg.addEventListener('cancel',e=>{if(tipX(null))e.preventDefault()});
draw();show();view(V);search();goHash();
// 公开站：后台加载全部历史（data/all.json，英文字段），换成页面用的中文字段后重画
if(SRC)fetch(SRC).then(r=>r.json()).then(j=>{const K={new:'新增',improved:'改进',fixed:'修复',removed:'移除',other:'其他'};
 PT=j.published||PT;DATA=j.entries.map(r=>({日期:r.date,版本:r.version,类型:K[r.type],内容:r.en,中文内容:r.zh}));index();FULL=true;draw();show();
 if(QI.value.trim().length>=2)search();else if(V!=='l')view(V);goHash()}).catch(()=>{document.getElementById('sub').textContent+=' ⚠';FAIL=true;if(V==='s')stats();if(V==='y')year()});
</script>
