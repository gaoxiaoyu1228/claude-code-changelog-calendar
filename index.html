: "其他", "内容": "[Claude Tag] Fixed the Channels tab in Claude Tag admin settings splitting a workspace from its channels across pages; channels now appear right under their workspace", "中文内容": "[Claude Tag] 修复了 Claude Tag 管理设置中的“频道”选项卡将工作区与其跨页面的频道分开的问题；频道现在出现在他们的工作区的正下方"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Fixed the Set for Claude Tag link on the Cloud environments admin page not leading to the environment setting; it now opens the Slack page's Advanced tab, where you set it", "中文内容": "[Claude Tag] 修复了云环境管理页面上的 Set for Claude Tag 链接无法跳转到环境设置的问题；现在它会打开 Slack 页面的“高级”选项卡，您可以在其中进行设置"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Code Review] Added a Download CSV button to Code Review admin settings: export review costs per repository by month, week or day, for one repository, one GitHub organization or all", "中文内容": "[代码审查] 在代码审查管理设置中添加了下载 CSV 按钮：按月、周或日导出每个存储库的审查成本，适用于一个存储库、一个 GitHub 组织或全部"}, {"日期": "2026-11-10", "版本": "2.1.322", "类型": "新增", "内容": "Added fast mode on Vertex in the global, us and eu regions, falling back to standard speed if Vertex refuses it", "中文内容": "在全球、美国和欧盟地区的 Vertex 上添加了快速模式，如果 Vertex 拒绝，则恢复到标准速度"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "新增", "内容": "Added Claude Fable 5.2 (`claude-fable-5-2`), now the default Fable model — 1M context, $8/$40 per Mtok with $0.20/Mtok cache reads", "中文内容": "添加了 Claude Fable 5.2 (`claude-fable-5-2`)，现在是默认的 Fable 模型 — 1M 上下文，每个 Mtok 8 美元/40 美元，每 Mtok 缓存读取 0.20 美元"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "新增", "内容": "Added `--settings <file>` to `claude remote-control`, which applies a settings file to every session it starts; if the file changes, no new session starts until you restart `claude remote-control`", "中文内容": "在“claude Remote-control”中添加了`--settings <file>`，它将设置文件应用于它启动的每个会话；如果文件发生更改，则在重新启动“claude Remote-control”之前不会启动新会话"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed MCP OAuth requests sending secrets such as refresh tokens to another host when a server redirected them", "中文内容": "修复了 MCP OAuth 请求在服务器重定向时将刷新令牌等机密发送到另一台主机的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a case where a read-only Bash command ran outside the sandbox without a permission prompt", "中文内容": "修复了只读 Bash 命令在沙箱外运行而没有权限提示的情况"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a case where Bash permission checks judged a file write from the wrong folder and didn't prompt", "中文内容": "修复 Bash 权限检查判断文件写入错误文件夹且不提示的情况"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed deny rules and protected-file prompts not applying to the file that a `cp` or `mv` into a directory writes", "中文内容": "修复了拒绝规则和受保护文件提示不适用于`cp`或`mv`写入目录的文件"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed the \"Draws from usage credits\" note showing after a switch to Fable on Enterprise seats whose plan includes Fable", "中文内容": "修复了在计划包含《神鬼寓言》的企业席位上切换到《神鬼寓言》后显示的“从使用积分中提取”注释"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed the fallback model sometimes declining a request or mentioning a stopped response when the first model was blocked before replying", "中文内容": "修复了当第一个模型在回复之前被阻止时，后备模型有时会拒绝请求或提及停止响应的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `claude mcp login` printing a SEP-2352 issuer warning each time you sign in again to a server that Claude Code registered with", "中文内容": "修复了每次再次登录 Claude Code 注册的服务器时`claude mcp login`打印 SEP-2352 颁发者警告的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `NotebookEdit` deleting or overwriting a notebook's first cell when the call named no cell, on network paths (UNC shares, WSL folders, `/net` mounts)", "中文内容": "修复了`NotebookEdit`在网络路径（UNC 共享、WSL 文件夹、`/net`挂载）上调用无单元格时删除或覆盖笔记本的第一个单元格的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Edit changing the first of several matches, replacing a whole file on an empty `old_string`, or editing a notebook as text, on network paths (UNC shares, WSL folders, `/net` mounts)", "中文内容": "修复了在网络路径（UNC 共享、WSL 文件夹、`/net` 安装）上更改多个匹配项中的第一个、替换空`old_string`上的整个文件或将笔记本编辑为文本的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `/config` showing Manual as the default permission mode when new sessions start in auto mode; pressing Space on \"Auto (default)\" now saves Don't Ask, not Plan", "中文内容": "修复了当新会话以自动模式启动时`/config`显示手动作为默认权限模式的问题；在“自动（默认）”上按空格键现在可以保存“不要询问”，而不是“计划”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Windows: Fixed `FileChanged` hooks stopping for paths set through `watchPaths` after the first shell command, when the session's working directory had a lowercase drive letter", "中文内容": "Windows：修复了当会话的工作目录具有小写驱动器号时，在第一个 shell 命令之后通过`watchPaths`设置的路径，`FileChanged`挂钩会停止"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `--plugin-dir .` and `--plugin-dir ./builtin` writing generated type files for Claude Code's built-in plugins into a `builtin` folder", "中文内容": "修复了 `--plugin-dir .` 和 `--plugin-dir ./builtin` 将 Claude Code 内置插件生成的类型文件写入到 `builtin` 文件夹中的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed context usage estimates overcounting tool definitions when exact token counts are unavailable", "中文内容": "修复了当确切的令牌计数不可用时上下文使用估计会过度计算工具定义的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `/compact` showing twice in Remote Control on web and mobile", "中文内容": "修复了`/compact`在网络和移动设备上的远程控制中显示两次的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed plugin auto-updates and `/plugin` marketplace updates downloading a plugin again for each worktree or folder of a repository", "中文内容": "修复了插件自动更新和`/plugin`市场更新，为存储库的每个工作树或文件夹再次下载插件"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed auto mode losing a background subagent's report that had started a turn when the conversation was compacted before Claude answered it", "中文内容": "修复了自动模式丢失后台子代理的报告，该报告在克劳德回答之前压缩对话时已开始轮流"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed project skills, commands and agents staying missing after their folder was removed and came back mid-session, such as with `git stash`, including after entering a worktree", "中文内容": "修复了项目技能、命令和代理在文件夹被删除并在会话中返回后仍然丢失的问题，例如使用`git stash`，包括进入工作树之后"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `claude -p` sometimes telling Claude that background commands get 30 minutes when they are stopped after 10", "中文内容": "修复了`claude -p`有时会告诉 Claude 后台命令在 10 分钟后停止时会持续 30 分钟的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `pkill`, `pgrep` and `pidwait` in cloud sessions matching the session's own parent processes", "中文内容": "修复了云会话中与会话自己的父进程匹配的`pkill`、`pgrep`和`pidwait`"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Claude in Chrome and computer use server processes staying alive after their parent exits behind a proxy that stalls connections", "中文内容": "修复了 Chrome 中的 Claude 和计算机使用服务器进程在其父进程退出代理后仍保持活动状态的问题，该代理会停止连接"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a large hook output pointing Claude to a file that held another hook's output from the same tool call", "中文内容": "修复了一个大钩子输出，将克劳德指向一个文件，该文件保存来自同一工具调用的另一个钩子的输出"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed apps that embed Claude Code getting their own PreToolUse hook's `ask` reason instead of another hook's when both asked", "中文内容": "修复了嵌入 Claude Code 的应用程序在同时询问时获取自己的 PreToolUse 挂钩的“询问”原因，而不是另一个挂钩的原因"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a PreToolUse hook's `ask` being lost when another hook's `defer` finished first and could not be honored", "中文内容": "修复了当另一个钩子的`defer`先完成且无法执行时 PreToolUse 钩子的`ask`丢失的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a rare crash on permission prompts and background tasks", "中文内容": "修复了权限提示和后台任务中罕见的崩溃问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed project skills, commands and agents disappearing from the menu in SDK and desktop sessions after Claude entered a worktree", "中文内容": "修复了 Claude 进入工作树后项目技能、命令和代理从 SDK 和桌面会话的菜单中消失的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `/desktop` on macOS saying Claude Desktop is not installed when it is in `~/Applications`", "中文内容": "修复了 macOS 上的`/desktop`，当 Claude Desktop 位于`~/Applications`中时，未安装该桌面"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed OpenTelemetry repository attributes (`vcs.*`) missing from Claude Desktop sessions that start on a pre-started process", "中文内容": "修复了在预启动进程上启动的 Claude Desktop 会话中缺少 OpenTelemetry 存储库属性 (`vcs.*`)"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed WebFetch passing \"No response from model\" to Claude as page content when the model reading the page returned no text; the call now fails with a clear error", "中文内容": "修复了当模型读取页面没有返回文本时，WebFetch 将“模型没有响应”作为页面内容传递给 Claude；现在调用失败并出现明显错误"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed screen reader mode delaying the prompt at startup when the system clock moved back while Claude Code was starting", "中文内容": "修复了屏幕阅读器模式在 Claude Code 启动时系统时钟向后移动时延迟启动时的提示的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a command's panel sometimes not coming back after a dialog closed, leaving no panel or prompt on screen until the next redraw", "中文内容": "修复了命令面板有时在对话框关闭后不会返回的问题，直到下一次重绘之前屏幕上不会留下任何面板或提示"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a project's MCP server being disconnected after the first message in a Claude Desktop Code tab session when the desktop app has an MCP server or extension of the same name", "中文内容": "修复了当桌面应用程序具有 MCP 服务器或同名扩展时，项目的 MCP 服务器在 Claude Desktop Code 选项卡会话中出现第一条消息后断开连接的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a turn ending with \"API Error: EPROTO: The TLS handshake failed\" when the connection broke partway through a reply; the partial reply is kept or the request is retried, as before 2.1.302", "中文内容": "修复了当连接在回复中途中断时以“API 错误：EPROTO：TLS 握手失败”结束的回合；保留部分回复或重试请求，如 2.1.302 之前"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed high memory use in long sessions that repeatedly read single lines from large files", "中文内容": "修复了从大文件中重复读取单行的长会话中的高内存使用量"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed fast mode losing replies, switching models or retrying for minutes when fast serving is rate-limited, overloaded or failing; it now tries standard speed on the same model first", "中文内容": "修复了快速模式在快速服务受到速率限制、过载或失败时丢失回复、切换模型或重试几分钟的问题；现在它首先在同一型号上尝试标准速度"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed one request carrying far more background agent reports than intended after Claude was stopped while several were waiting", "中文内容": "修复了克劳德被阻止而几个人正在等待后，一个请求携带的后台代理报告远多于预期的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed messages from a Claude Desktop Code tab session to your other sessions staying paused after you typed while Claude was still working", "中文内容": "修复了在 Claude 仍在工作时键入内容后，从 Claude 桌面代码选项卡会话到其他会话的消息保持暂停状态"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `claude agents` ignoring `--permission-mode`, `--dangerously-skip-permissions`, `--model`, `--effort` or `--agent` typed before `agents` when a flag such as `--verbose` was also on the line", "中文内容": "修复了当`--verbose`等标志也在线时，“claude Agents”忽略在`agents`之前键入的`--permission-mode`、`--dangerously-skip-permissions`、`--model`、`--effort`或`--agent`的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a case where Remote Control showed as off with \"login expired\" in the desktop app while its connection was still up, because the app was briefly unable to hand over a sign-in token", "中文内容": "修复了以下情况：远程控制在桌面应用程序中显示为“登录已过期”，但其连接仍处于连接状态，因为该应用程序暂时无法移交登录令牌"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a Remote Control message sent with \"Queue for later\" reaching Claude in the middle of the running turn", "中文内容": "修复了在运行回合中途到达克劳德时发送的“稍后排队”的远程控制消息"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed the git status given to Claude at session start reading as clean when git status failed; it now reads as unavailable", "中文内容": "修复了当 git status 失败时，在会话开始时给予 Claude 的 git status 读取为干净的问题；现在显示为不可用"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed the git status given to Claude at session start showing the first listed file as staged when its changes were not staged", "中文内容": "修复了会话开始时给予 Claude 的 git 状态，显示第一个列出的文件已暂存，但其更改未暂存"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a hang or out-of-memory crash when a connector in a cloud session lists resources with very long names", "中文内容": "修复了云会话中的连接器列出名称很长的资源时出现的挂起或内存不足崩溃问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Remote Control showing as connected after its connection closed for good while the session's history was still uploading", "中文内容": "修复了远程控制在连接永久关闭但会话历史记录仍在上传后显示为已连接的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed screen reader mode turning off when you return to a conversation from agent view", "中文内容": "修复了当您从代理视图返回对话时屏幕阅读器模式关闭的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed screen reader mode y/n questions taking as yes a stray \"y\" at the end of text typed as the question opened", "中文内容": "修复了屏幕阅读器模式 y/n 问题，将问题打开时键入的文本末尾的杂散“y”视为是"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed cloud sessions telling Claude that a host is probably not allowed when it is allowed and the network proxy could not connect to it", "中文内容": "修复了云会话告诉 Claude 主机在允许且网络代理无法连接到该主机时可能不被允许的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed an MCP server sometimes showing as connected with no tools after it was reconnected or the session's directory changed while its tools were still loading", "中文内容": "修复了 MCP 服务器在重新连接后有时显示为未使用任何工具进行连接或会话目录在其工具仍在加载时发生更改的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Bash commands sometimes running in the wrong folder when Claude sent several at once and an earlier one changed folders", "中文内容": "修复了当 Claude 一次发送多个命令且较早的命令更改了文件夹时，Bash 命令有时会在错误的文件夹中运行的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed files Claude sends from cloud and Remote Control sessions failing at once when an upload gets an HTTP 507 from a proxy; the upload now gets a second try", "中文内容": "修复了当上传从代理获取 HTTP 507 时，Claude 从云和远程控制会话发送的文件立即失败的问题；现在可以再次尝试上传"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed new messages not being saved, and `claude -p`, SDK and VS Code sessions hanging, when memory ran out while the transcript was being read", "中文内容": "修复了读取记录时内存耗尽时未保存新消息以及`claude -p`、SDK 和 VS Code 会话挂起的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed sign-in, token refresh and logout waiting indefinitely when something on the network accepts the connection but never answers the TLS handshake", "中文内容": "修复了当网络上的某些内容接受连接但从不应答 TLS 握手时，登录、令牌刷新和注销无限期等待的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a sent file showing under a different name in the Claude apps when its name hid text-direction or control characters; Claude now refuses to send such a file", "中文内容": "修复了当名称隐藏文本方向或控制字符时，已发送的文件在克劳德应用程序中显示为不同名称的问题；克劳德现在拒绝发送这样的文件"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed sub-agent progress summaries running a request to its end after the model replied with a tool call", "中文内容": "修复了模型通过工具调用回复后运行请求结束的子代理进度摘要"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Bash reads such as `grep -r foo \"$PWD/src\"` asking for permission when the same command with the path typed out runs without asking", "中文内容": "修复了当带有输入路径的相同命令在不询问的情况下运行时请求许可的 Bash 读取，例如“grep -r foo“$PWD/src””"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Claude apps gateway refusing to start when a `desktop` setting holds a field newer than the gateway, such as a managed MCP server's `oauth.omitResource`; it now warns and serves it", "中文内容": "修复了当“桌面”设置包含比网关更新的字段（例如托管 MCP 服务器的`oauth.omitResource`）时，克劳德应用程序网关拒绝启动的问题；现在它会发出警告并为其提供服务"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Bash commands coming back empty for zsh users whose `.zshrc` sets `KSH_OPTION_PRINT`", "中文内容": "修复了`.zshrc`设置`KSH_OPTION_PRINT`的 zsh 用户的 Bash 命令返回为空的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "macOS: Fixed \"Unable to read managed policy settings\" at startup when a valid MDM profile was slow to read: the read is retried once, and a timeout is now reported as a timeout", "中文内容": "macOS：修复了启动时有效 MDM 配置文件读取速度缓慢时“无法读取托管策略设置”的问题：重试一次读取，现在将超时报告为超时"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed agent view erasing another agent view's saved input text when it restarted for an update with nothing typed", "中文内容": "修复了代理视图在重新启动以进行更新但未键入任何内容时会删除另一个代理视图已保存的输入文本的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed remote sessions giving no reply after a restart when a `UserPromptSubmit` hook blocked a replayed permission answer; these hooks no longer run on that replay", "中文内容": "修复了当`UserPromptSubmit`挂钩阻止重播权限答案时，远程会话在重新启动后没有回复的问题；这些钩子不再在该重播中运行"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `claude remote-control` accepting a `y` typed without Enter at its first-run question when the terminal's input ended", "中文内容": "修复了当终端输入结束时，“claude Remote-control”在首次运行问题时接受不输入 Enter 的`y`的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Claude Desktop not showing spend limit warnings behind a Claude apps gateway whose policy has no `code:` rules", "中文内容": "修复了 Claude Desktop 在策略没有“代码：”规则的 Claude 应用程序网关后面不显示支出限制警告的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed fullscreen sessions with some plugins ending with an error when a tool result that had got shorter scrolled off the top of the screen", "中文内容": "修复了某些插件的全屏会话，当工具结果变短滚动到屏幕顶部时，会出现错误"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed prompt suggestions making extra API requests when the model replied with a tool call", "中文内容": "修复了当模型通过工具调用回复时发出额外 API 请求的提示建议"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `PreToolUse` `mcp_tool` hooks on stdio and HTTP MCP servers being skipped when their answer was over 16 MiB; the tool call is now refused", "中文内容": "修复了 stdio 和 HTTP MCP 服务器上的`PreToolUse``mcp_tool`挂钩在其答案超过 16 MiB 时被跳过的问题；工具调用现在被拒绝"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed skill and command names holding a Bamum letter that some fonts draw as blank: they are now refused", "中文内容": "修复了带有 Bamum 字母且某些字体绘制为空白的技能和命令名称：它们现在被拒绝"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed `claude -p` on Linux exiting 0 in silence when a full NFS export or a used-up NFS quota lost transcript lines: it now prints an error and, in text and json output, exits 1", "中文内容": "修复了当完整 NFS 导出或用完的 NFS 配额丢失转录行时，Linux 上的`claude -p`默默退出 0：它现在打印错误，并在文本和 json 输出中退出 1"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed background agents being reported as stopped by the user, and refused a resume, when a service interrupted a cloud session and nobody pressed Stop", "中文内容": "修复了当服务中断云会话并且没有人按下“停止”时，后台代理被报告为被用户停止并拒绝恢复的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed NotebookEdit reporting success to hooks and telemetry when the edit failed, for example when the notebook changed while the permission prompt was open", "中文内容": "修复了编辑失败时 NotebookEdit 向挂钩和遥测报告成功的问题，例如，当权限提示打开时笔记本发生更改时"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a blank screen or no answer at startup, and empty `claude mcp list` output, when a stored MCP sign-in record was null", "中文内容": "修复了当存储的 MCP 登录记录为空时，启动时出现空白屏幕或无应答以及空`claude mcp list`输出的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed the Artifact tool telling Claude to add filters when an artifact's database collection is too large to sort; it now says to read the collection page by page and sort the results", "中文内容": "修复了 Artifact 工具，当工件的数据库集合太大而无法排序时，告诉 Claude 添加过滤器；现在它说逐页读取集合并对结果进行排序"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a restarted cloud session dropping a message with a large image when the restart came before Claude's first reply to it", "中文内容": "修复了在克劳德首次回复之前重新启动的云会话会丢弃带有大图像的消息的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a restarted cloud session leaving a subagent's message to the main conversation unanswered", "中文内容": "修复了重新启动的云会话导致子代理发送给主对话的消息未得到答复的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Claude not being told when you stop or pause a running workflow, so it no longer says the workflow is still running", "中文内容": "修复了当您停止或暂停正在运行的工作流程时克劳德没有被告知的问题，因此它不再表示工作流程仍在运行"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the `/model` picker: \"More models\" is now an unnumbered row below every other, and older models open under it without renumbering the rest", "中文内容": "改进了`/model`选择器：“更多模型”现在是每行下方的未编号行，旧模型在其下打开，而无需重新编号其余模型"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Gateway: Improved spend limits on a busy replica, which now skips fewer checks and records spend sooner", "中文内容": "网关：改进了繁忙副本的支出限制，现在可以跳过更少的检查并更快地记录支出"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the Claude apps gateway's sign-in limit messages in Claude Code and on the `/device` page: they no longer name gateway settings, which the gateway's own log still names", "中文内容": "改进了克劳德代码和`/device`页面上克劳德应用程序网关的登录限制消息：它们不再命名网关设置，网关自己的日志仍然命名该设置"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved `claude install` and the install scripts: they finish 2 to 4 seconds sooner", "中文内容": "改进了`claude install`和安装脚本：它们更快完成 2 到 4 秒"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved how soon a Remote Control session whose process crashed can pick up a new message", "中文内容": "改进了进程崩溃的远程控制会话接收新消息的速度"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Windows: Improved startup and first-command time by finding programs on PATH without starting a helper process", "中文内容": "Windows：通过在 PATH 上查找程序而无需启动帮助程序进程，从而改进了启动和首次命令时间"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved auto mode in headless sessions, the desktop app and VS Code: reports from background subagents that wait together are answered in one model call, as in the terminal", "中文内容": "改进了无头会话、桌面应用程序和 VS Code 中的自动模式：来自一起等待的后台子代理的报告在一个模型调用中得到应答，就像在终端中一样"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the agent view's row for a `claude --bg --worktree` session that couldn't set up its worktree: it now shows the error from its beginning, not an internal tag or its last 200 characters", "中文内容": "改进了无法设置其工作树的`claude --bg --worktree`会话的代理视图行：它现在从头开始显示错误，而不是内部标记或其最后 200 个字符"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the messages shown when an artifact is in another organization: `/login` is offered only if it's one of yours, and Claude now says where a copy may be after an account move", "中文内容": "改进了当工件位于另一个组织中时显示的消息：仅当它是您的组织之一时才提供`/login`，并且克劳德现在会显示帐户移动后副本可能位于的位置"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved sessions with more images than fit in one request: Claude is told whether it has already seen a dropped image, and repeat reads of an unchanged image are limited", "中文内容": "改进了会话，图像数量超出了一次请求的容纳范围：Claude 被告知是否已经看到了已删除的图像，并且对未更改图像的重复读取受到限制"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved `claude remote-control`'s messages for an unanswered first-run question: each now says what to do next", "中文内容": "改进了“克劳德远程控制”针对未回答的首次运行问题的消息：现在每个消息都会说明下一步该做什么"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved start-up time by loading trusted TLS certificates faster", "中文内容": "通过更快地加载受信任的 TLS 证书来缩短启动时间"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved Claude apps gateway error messages to show the gateway's address without any user name or password", "中文内容": "改进了 Claude 应用程序网关错误消息，以显示网关地址，无需任何用户名或密码"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the Claude apps gateway's spend limit error: the reset now shows in your local time, such as \"resets 4pm (America/Los_Angeles)\"", "中文内容": "改进了克劳德应用程序网关的支出限制错误：重置现在显示为您当地时间，例如“重置下午 4 点（美国/洛杉矶）”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Windows: Improved startup time with a standard Git for Windows install by no longer checking which git.exe to run on every launch", "中文内容": "Windows：通过不再检查每次启动时运行哪个 git.exe，使用适用于 Windows 安装的标准 Git 改进了启动时间"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Updated the session-feedback message and the `allowedProviders` setting description to name Ultra alongside Pro and Max, and the `forceLoginMethod` description to cover every paid Claude plan", "中文内容": "更新了会话反馈消息和`allowedProviders`设置描述，将 Ultra 与 Pro 和 Max 一起命名，并更新了`forceLoginMethod`描述以涵盖每个付费 Claude 计划"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Updated the bundled dataviz skill to suggest a list of meters, one row per item, for several ratios that each have their own limit", "中文内容": "更新了捆绑的数据可视化技能，以建议一个仪表列表，每个项目一行，针对多个比率，每个比率都有自己的限制"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Updated the \"Upgrade to Max\" options to say \"Upgrade to Max or Ultra\"", "中文内容": "将“升级到 Max”选项更新为“升级到 Max 或 Ultra”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed mods Claude writes to turn on without asking in auto and bypass modes, even with managed `allowUnsandboxedCommands: false` or `allowManagedDomainsOnly`, and not to load in `dontAsk` mode", "中文内容": "更改了 Claude 写入的模组，使其在自动和旁路模式下无需询问即可打开，即使使用托管`allowUnsandboxedCommands: false`或`allowManagedDomainsOnly`，也不会在`dontAsk`模式下加载"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed mods' own tool calls (`$.tool.call`, `$.mcp.call`) to raise no permission prompt, even under your own ask rules or in `dontAsk` and `-p` runs; deny rules and organization policy still apply", "中文内容": "更改了 mods 自己的工具调用（`$.tool.call`、`$.mcp.call`）以引发无权限提示，即使在您自己的询问规则下或在 `dontAsk` 和 `-p` 运行中也是如此；拒绝规则和组织政策仍然适用"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed saved Fable 5.1 model picks to move to `fable`: on Pro and Max plans at once, on Team and Enterprise plans once your organization allows it; use `/model claude-fable-5-1` to switch back", "中文内容": "更改了已保存的《神鬼寓言 5.1》模型选择，以移至“寓言”：立即使用 Pro 和 Max 计划，一旦您的组织允许，就使用 Team 和 Enterprise 计划；使用 `/model claude-`fable`-5-1` 切换回来"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the fast mode labels in `/fast`, `/config` and `/model` to name your current model when it supports fast mode, and removed \"(Opus only)\" from the VS Code row", "中文内容": "更改了 `/fast`、`/config` 和 `/model` 中的快速模式标签，以在支持快速模式时命名当前模型，并从 VS Code 行中删除“(仅限 Opus)”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed nested skill loading: `.claude/skills` folders inside `~/.claude/plugins` no longer load when Claude works on files there", "中文内容": "更改了嵌套技能加载：当克劳德处理其中的文件时，`~/.claude/plugins`内的`.claude/skills`文件夹不再加载"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Self-hosted runner: Changed an on-demand runner that the server refuses because it is not needed (session ended or paused, work order superseded) to exit 0 instead of 1", "中文内容": "自托管运行程序：更改了服务器拒绝的按需运行程序，因为不需要它（会话结束或暂停，工作订单被取代）以退出 0 而不是 1"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Windows: Changed how Claude Code finds programs it starts itself, such as git, to skip relative and UNC PATH entries and links onto a network share, and to pick up PATH changes from settings", "中文内容": "Windows：更改了 Claude Code 查找自身启动的程序（例如 git）的方式，以跳过相对路径和 UNC 路径条目以及网络共享的链接，并从设置中获取路径更改"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed OpenTelemetry hook events in non-interactive sessions to leave two built-in hooks out of `num_hooks` and `num_success` after Bash and PowerShell calls", "中文内容": "更改了非交互式会话中的 OpenTelemetry 挂钩事件，以在 Bash 和 PowerShell 调用后将两个内置挂钩保留在`num_hooks`和`num_success`之外"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the number of messages a Claude Desktop Code tab session can send to your other sessions before it waits for you to type again from 10 to 20", "中文内容": "将 Claude Desktop Code 选项卡会话在等待您再次键入之前可以发送到其他会话的消息数从 10 更改为 20"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed `AskUserQuestion` in `claude -p` and SDK sessions to deny a host's permission answer that sets the undocumented `afkTimeoutMs` input field", "中文内容": "更改了`claude -p`和 SDK 会话中的`AskUserQuestion`，以拒绝设置未记录的`afkTimeoutMs`输入字段的主机权限答案"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed managed `extraKnownMarketplaces`: a declared name can't be added from another source, an entry from elsewhere is hidden, and plugins the declared marketplace lists are reinstalled from it", "中文内容": "更改了托管`extraKnownMarketplaces`：无法从其他来源添加声明的名称，隐藏来自其他地方的条目，并且从其中重新安装声明的市场列表的插件"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed Claude in Chrome tools that an app running Claude Code provides, such as the Claude desktop app's Code tab, to follow your organization's Claude in Chrome policy", "中文内容": "更改了运行 Claude Code 的应用程序提供的 Claude in Chrome 工具（例如 Claude 桌面应用程序的“代码”选项卡），以遵循组织的 Claude in Chrome 政策"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed `policy_mode: layered` in the Claude apps gateway: managed MCP servers now add up over every matching policy, `match: {}` included, so a gateway already on it serves more after the upgrade", "中文内容": "更改了 Claude 应用程序网关中的“policy_mode：分层”：托管 MCP 服务器现在在每个匹配策略（包括`match: {}`）上进行累加，因此升级后其上已有的网关可以提供更多服务"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Gateway: Changed Bedrock, Vertex and Foundry upstreams to ignore the `ANTHROPIC_*_BASE_URL` variables in the gateway's environment. Set `base_url` on the upstream to use another endpoint", "中文内容": "网关：更改了 Bedrock、Vertex 和 Foundry 上游，以忽略网关环境中的`ANTHROPIC_*_BASE_URL`变量。在上游设置 `base_url` 以使用另一个端点"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed headless sessions to reload mods in `.claude/skills` when their files change; set `CLAUDE_CODE_PLUGIN_DIR_WATCH=0` to turn this off", "中文内容": "更改了无头会话，以便在文件更改时重新加载`.claude/skills`中的模组；设置 `CLAUDE_CODE_PLUGIN_DIR_WATCH=0` 将其关闭"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the Cyber Verification Program sentence on a cyber safeguard block to use the same words as claude.ai", "中文内容": "更改了网络安全块上的网络验证计划句子，以使用与 claude.ai 相同的单词"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed Cowork cloud sessions: a PostToolUse hook can no longer replace the answer to AskUserQuestion or the plan in ExitPlanMode's result; Claude reads the originals", "中文内容": "更改了 Cowork 云会话：PostToolUse 挂钩无法再替换 AskUserQuestion 的答案或 ExitPlanMode 结果中的计划；克劳德读原著"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed `cp` and `mv` spelled by a path, such as `/bin/cp`, to get the same path checks as `cp` and `mv`", "中文内容": "更改了路径拼写的`cp`和`mv`，例如`/bin/cp`，以获得与`cp`和`mv`相同的路径检查"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed background command notifications and TaskStop results to show Claude only the start and end of a command over 1,000 characters, which saves context", "中文内容": "更改了后台命令通知和 TaskStop 结果，以仅向 Claude 显示超过 1,000 个字符的命令的开头和结尾，从而节省了上下文"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed artifact design guidance to treat Inter and Space Grotesk as good default typefaces", "中文内容": "更改了工件设计指南，将 Inter 和 Space Grotesk 视为良好的默认字体"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the account email check to refuse only a shell command that holds your email and names a User-Agent, without asking, so other commands and scheduled runs no longer stop at its prompt", "中文内容": "更改了帐户电子邮件检查，仅拒绝保存您的电子邮件并命名用户代理的 shell 命令，无需询问，因此其他命令和计划运行不再在提示符处停止"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed Remote Control sessions to keep the folder they were started in: a connected client can no longer move a session to another folder", "中文内容": "更改了远程控制会话以保留它们启动的文件夹：连接的客户端无法再将会话移动到另一个文件夹"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed managed `extraKnownMarketplaces` take-overs from an undeclared source: saved data is set aside for `cleanupPeriodDays`, and options and secrets until `claude plugin restore-set-aside`", "中文内容": "更改了未声明来源的托管`extraKnownMarketplaces`接管：保存的数据预留给`cleanupPeriodDays`，以及选项和秘密，直到“claude插件恢复设置预留”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "[VSCode] Added a warning above the prompt box when both an auth token and an API key are set, matching the terminal's startup warning", "中文内容": "[VSCode] 在设置 auth token 和 API key 时在提示框上方添加警告，与终端的启动警告相匹配"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "[VSCode] Fixed a plugin's permission request showing a name with hidden characters: it now reads \"a plugin\"", "中文内容": "[VSCode] 修复了插件的权限请求显示带有隐藏字符的名称：现在显示为“插件”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed auto mode with telemetry or feature flags off, including behind LLM gateways: calls the server can't check are asked about or denied, with no fallback to the built-in classifier; set `CLAUDE_CODE_AUTO_MODE_SERVER=0` to keep using it (Bedrock, Vertex and Foundry are unchanged)", "中文内容": "更改了遥测或功能标记关闭的自动模式，包括在 LLM 网关后面：服务器无法检查的呼叫会被询问或拒绝，不会回退到内置分类器；设置 `CLAUDE_CODE_AUTO_MODE_SERVER=0` 以继续使用它（Bedrock、Vertex 和 Foundry 不变）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed auto mode behind an LLM gateway: `CLAUDE_CODE_AUTO_MODE_SERVER=1` turns on the server-side check even with `CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS` set; if managed settings set the latter, they must set the `1` too", "中文内容": "更改了 LLM 网关后面的自动模式：即使设置了`CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS`，`CLAUDE_CODE_AUTO_MODE_SERVER=1`也会打开服务器端检查；如果托管设置设置了后者，则它们也必须设置`1`"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added support for MCP tasks in the terminal: when an MCP server runs a tool call as a task, Claude Code moves it to the background right away and tells Claude the result when it finishes", "中文内容": "添加了对终端中 MCP 任务的支持：当 MCP 服务器将工具调用作为任务运行时，Claude Code 会立即将其移动到后台，并在完成时告诉 Claude 结果"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added the `CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND` environment variable to make Claude Code wait for an MCP task inside its tool call instead of moving it to the background right away", "中文内容": "添加了`CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND`环境变量，使 Claude Code 在其工具调用中等待 MCP 任务，而不是立即将其移动到后台"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `permissions.denyInsteadOfPrompting` setting: a tool call that would wait on a permission prompt is denied and the turn continues, in terminal sessions, subagents and teammates", "中文内容": "添加了`permissions.denyInsteadOfPrompting`设置：在终端会话、子代理和队友中，将等待权限提示的工具调用被拒绝，并且轮流继续"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `/claude-api latency-optimize` to find where your Claude API code makes people wait and try faster settings against your eval", "中文内容": "添加了 `/claude-api Latent-optimize` 来查找您的 Claude API 代码让人们等待的地方，并针对您的评估尝试更快的设置"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added the `CLAUDE_CODE_DISABLE_FEATURE_FLAGS` environment variable, which stops feature-flag fetching without turning off telemetry; every flag then uses its built-in default", "中文内容": "添加了`CLAUDE_CODE_DISABLE_FEATURE_FLAGS`环境变量，该变量可在不关闭遥测的情况下停止功能标志获取；然后每个标志都使用其内置默认值"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added spend for today, this week and this month to `/usage` for developers behind a Claude apps gateway who have no spend limit, when the gateway runs this version or later", "中文内容": "当网关运行此版本或更高版本时，为没有支出限制的 Claude 应用程序网关背后的开发人员添加了今天、本周和本月的支出到`/usage`"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `admin.pooled_conflict_rule` and `admin.pooled_priority_order` to the Claude apps gateway, to set which pooled group budget pays first for a developer in several groups", "中文内容": "在 Claude 应用程序网关中添加了`admin.pooled_conflict_rule`和`admin.pooled_priority_order`，以设置哪个集合组预算首先为多个组中的开发人员支付"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added an optional `login_notice` setting to the Claude apps gateway that shows an operator-defined message on the gateway's browser verification page and on Claude Code's sign-in screen", "中文内容": "向 Claude 应用程序网关添加了可选的`login_notice`设置，该设置在网关的浏览器验证页面和 Claude Code 的登录屏幕上显示运营商定义的消息"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `CLAUDE_GATEWAY_LOG_FORMAT=json` to the Claude apps gateway: operational log lines become JSON with `severity`, `time` and `message`, for log collectors that read the level from a field", "中文内容": "在 Claude 应用程序网关中添加了`CLAUDE_GATEWAY_LOG_FORMAT=json`：对于从字段读取级别的日志收集器，操作日志行变为带有“严重性”、“时间”和“消息”的 JSON"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a Claude apps gateway boot warning for a case where another policy's `availableModels` also allows a custom model id that one policy lists by name", "中文内容": "添加了克劳德应用程序网关启动警告，针对另一种策略的`availableModels`也允许一个策略按名称列出的自定义模型 ID 的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added start-up warnings to the Claude apps gateway for policies with no `desktopHome` that rely on `coworkTabEnabled: false` or `chatSessionRetentionDays`, ahead of Claude Desktop's November 10 change", "中文内容": "在 Claude Desktop 于 11 月 10 日进行更改之前，向 Claude 应用程序网关添加了启动警告，以针对没有依赖于`coworkTabEnabled: false`或`chatSessionRetentionDays`的`desktopHome`的策略"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a warning when your claude.ai login ends and Claude Code continues on the sign-in from `ant auth login`, which bills usage to your Claude Console organization", "中文内容": "添加了当您的 claude.ai 登录结束并且 Claude Code 继续从`ant auth login`登录时添加的警告，这会向您的 Claude Console 组织收取使用费用"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a line at startup naming the Claude Console organization that is billed in a case where Claude Code uses the sign-in from `ant auth login`", "中文内容": "在启动时添加了一行，命名 Claude Console 组织，该组织在 Claude Code 使用`ant auth login`登录的情况下计费"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added an \"Earlier in this session\" row to `/tasks` that lists finished subagents, so you can reopen one and message it even after it leaves the list or you restart", "中文内容": "在`/tasks`中添加了“本次会话中的较早”行，其中列出了已完成的子代理，因此即使在它离开列表或重新启动后，您也可以重新打开一个子代理并向其发送消息"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a note to `/loop` confirmations in cloud sessions that a timer stops with its container, with an offer of a loop that survives", "中文内容": "在云会话中的`/loop`确认中添加了一条注释，即计时器随其容器停止，并提供了一个存活的循环"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed MCP servers on the older handshake failing to connect, or returning empty results, because Claude Code declared an extension that it only uses with newer servers", "中文内容": "修复了旧握手上的 MCP 服务器无法连接或返回空结果的问题，因为 Claude Code 声明了一个仅与较新服务器一起使用的扩展"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a long-running MCP tool call on a claude.ai connector sometimes never reporting its result after `--resume`", "中文内容": "修复了 claude.ai 连接器上长时间运行的 MCP 工具调用有时在`--resume`之后从不报告其结果的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a session's diff failing to load on claude.ai and the mobile apps when the folder Claude Code runs in has a file or folder named `HEAD`", "中文内容": "修复了当 Claude Code 运行的文件夹包含名为`HEAD`的文件或文件夹时，会话的差异无法在 claude.ai 和移动应用程序上加载的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/diff` showing \"Diff unavailable\" when a git repository has a file or folder named `HEAD` at its top level", "中文内容": "修复了当 git 存储库在其顶层有名为`HEAD`的文件或文件夹时`/diff`显示“Diff unavailable”的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the `/diff` pane opening blank in sessions where 64 or more turns edited files", "中文内容": "修复了在 64 个或更多轮次编辑文件的会话中打开空白的`/diff`窗格"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed slash commands typed after a leading space, tab or newline being sent to Claude as plain text instead of running", "中文内容": "修复了在前导空格、制表符或换行符之后键入的斜杠命令以纯文本形式发送给 Claude，而不是运行"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a request that kept failing with a 401 refreshing your login on every retry and causing 401s in your other sessions", "中文内容": "修复了每次重试时始终失败并出现 401 刷新登录信息并导致其他会话出现 401 错误的请求"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/context` sending its full visual grid to Claude on every later turn; Claude now reads only the table", "中文内容": "修复了`/context`在以后的每个回合中将其完整的视觉网格发送给克劳德的问题；克劳德现在只读取表格"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude -p` exiting 0 in auto mode when its actions were refused because no safety check was available: text and JSON output now exit 1", "中文内容": "修复了`claude -p`在自动模式下退出 0 的问题，因为没有可用的安全检查，其操作被拒绝：文本和 JSON 输出现在退出 1"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where Claude Code listed every project file at start on Linux for projects on a network file system (NFS, SMB, Lustre and similar)", "中文内容": "修复了 Claude Code 在 Linux 上启动时列出网络文件系统（NFS、SMB、Lustre 等）项目的每个项目文件的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where auto mode was wrongly refused when a client sent a model change and a request for auto mode back to back", "中文内容": "修复了客户端连续发送模型更改和自动模式请求时错误拒绝自动模式的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/status` showing \"Auto mode server: Enabled\" when the server-side review isn't reaching the session, for example behind an LLM gateway that drops it", "中文内容": "修复了当服务器端审核未到达会话时显示“自动模式服务器：已启用”的`/status`，例如在将其丢弃的 LLM 网关后面"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Claude-drafted feedback, surveys and `/feedback` continuing to appear after the server refused feedback for your organization", "中文内容": "修复了服务器拒绝为您的组织提供反馈后，克劳德起草的反馈、调查和“/反馈”继续出现的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Claude drafting feedback on third-party gateways, where it can't be sent", "中文内容": "修复了克劳德在第三方网关上起草反馈无法发送的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed auto mode refusing actions without saying why when permission rules or `autoMode` settings are very large: it now explains and, unless `autoMode` deny rules are set, asks you in the terminal", "中文内容": "修复了当权限规则或`autoMode`设置非常大时自动模式拒绝操作而不说明原因的问题：现在它会进行解释，除非设置了`autoMode`拒绝规则，否则会在终端中询问您"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where Bash deny and ask rules missed commands written with quoted words", "中文内容": "修复了 Bash 拒绝和询问规则错过用引号括起来的命令的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed subagent hand-back reports showing an internal marker and provenance note when expanded outside verbose mode", "中文内容": "修复了在详细模式之外扩展时显示内部标记和出处注释的子代理返还报告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude -p --resume` with a prompt losing a deferred tool call when its MCP server is missing: the run now exits 1, keeps the call and refuses later input", "中文内容": "修复了`claude -p --resume`，当其 MCP 服务器丢失时提示丢失延迟的工具调用：运行现在退出 1，保留调用并拒绝稍后的输入"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where text was dropped from informational messages sent to SDK clients", "中文内容": "修复了发送到 SDK 客户端的信息消息中文本被删除的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where Agent SDK hosts got a generic exit-code error instead of a failed run's own error message when the disk was full", "中文内容": "修复了磁盘已满时 Agent SDK 主机收到通用退出代码错误而不是运行失败自己的错误消息的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` re-running a turn that was interrupted in plan mode when the session resumes in another permission mode", "中文内容": "修复了当会话在另一种权限模式下恢复时`CLAUDE_CODE_RESUME_INTERRUPTED_TURN`重新运行在计划模式下中断的回合"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed edits to a settings file being ignored when made within a few seconds of Claude Code writing that file", "中文内容": "修复了在克劳德代码写入该文件的几秒钟内对设置文件进行的编辑被忽略的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a config file left at the legacy name hiding your setup with no warning: Claude Code now says on stderr when a home holds two config files, and which is in use", "中文内容": "修复了保留在旧名称中的配置文件隐藏您的设置且没有任何警告：克劳德代码现在在标准错误上显示当一个家庭拥有两个配置文件并且正在使用中时"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `~/.claude.json`, settings and edited files ending up empty or cut off when the disk fills during a save in a read-only folder or to a bind-mounted file (one session saving at a time)", "中文内容": "修复了`~/.claude.json`、设置和编辑的文件在保存到只读文件夹或绑定安装文件期间磁盘已满时最终为空或被切断的问题（一次保存一个会话）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Write ending the turn as a refusal when it couldn't read the file to overwrite", "中文内容": "修复了写入在无法读取要覆盖的文件时以拒绝结束回合的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed background Bash commands that finish almost instantly losing their output while being reported as completed", "中文内容": "修复了后台 Bash 命令在报告为已完成时几乎立即丢失其输出的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the Bash tool's diff of changed files missing a file that the command wrote just before it ended", "中文内容": "修复了 Bash 工具的已更改文件的差异，缺少该命令在结束之前写入的文件"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a mistyped model name, such as `opus-5-5`, telling you to update Claude Code instead of suggesting the model you meant", "中文内容": "修复了错误输入的模型名称，例如`opus-5-5`，告诉您更新 Claude Code，而不是建议您想要的模型"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where `NotebookEdit` changed the wrong cell when the notebook changed while a permission prompt was open", "中文内容": "修复了打开权限提示时笔记本更改时`NotebookEdit`更改错误单元格的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a ~0.5s hang after pressing Enter on the `/login` success screen: the dialog now dismisses immediately and the post-login refresh runs in the background", "中文内容": "修复了在`/login`成功屏幕上按 Enter 后大约 0.5 秒的挂起：对话框现在立即关闭，登录后刷新在后台运行"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Ctrl+G not opening the external editor while typing an \"Other\" answer to a question in screen reader mode", "中文内容": "修复了在屏幕阅读器模式下键入问题的“其他”答案时 Ctrl+G 未打开外部编辑器的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Monitor's WebSocket watch failing with \"could not resolve\" behind a proxy when `CLAUDE_CODE_PROXY_RESOLVES_HOSTS` is set and the machine has no DNS of its own", "中文内容": "修复了当设置了`CLAUDE_CODE_PROXY_RESOLVES_HOSTS`并且计算机没有自己的 DNS 时，监视器的 WebSocket 监视失败，并在代理后面显示“无法解析”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude plugin eval` warnings suggesting `max: 0` for a tool that must not be called, which could never pass", "中文内容": "修复了`claude plugin eval`警告，建议不得调用工具的`max: 0`，该工具永远无法通过"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed background plugin auto-update not installing a dependency added by the updated plugin version", "中文内容": "修复了后台插件自动更新未安装更新的插件版本添加的依赖项的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Cmd+click not opening links in Ghostty over tmux in sessions opened from the agents view", "中文内容": "修复了在从代理视图打开的会话中 Cmd+click 无法通过 tmux 打开 Ghostty 中的链接的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a mod's hot reload in `.claude/skills` missing a file that was deleted just after it appeared, and missing its return", "中文内容": "修复了`.claude/skills`中 mod 的热重载缺少一个在出现后立即被删除的文件，并且缺少其返回的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/rewind` failing with \"No files were restored\" when restoring code to a checkpoint from before `/branch`", "中文内容": "修复了将代码从`/branch`之前恢复到检查点时`/rewind`失败并显示“未恢复文件”的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the `/claude-api` skill saying Console web settings don't apply to Managed Agents sessions, and tightened its credential and permission examples", "中文内容": "修复了`/claude-api`技能说控制台 Web 设置不适用于托管代理会话，并收紧了其凭据和权限示例"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed needless permission prompts for read-only commands wrapped in a plain `timeout DURATION`, such as `timeout 30 rg foo`", "中文内容": "修复了包装在普通`timeout DURATION`中的只读命令的不必要的权限提示，例如`timeout 30 rg foo`"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed WebFetch describing claude.ai shared-chat links as empty pages; it now says shared chats can't be read and to paste the conversation instead", "中文内容": "修复了 WebFetch 将 claude.ai 共享聊天链接描述为空页面的问题；现在它说无法读取共享聊天并粘贴对话"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Artifact database calls being re-sent to artifacts without a database; errors now say whether republishing helps", "中文内容": "修复了工件数据库调用被重新发送到没有数据库的工件的问题；现在错误表明重新发布是否有帮助"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where artifact database reads that save to a folder (`out_dir`) were refused", "中文内容": "修复了保存到文件夹（`out_dir`）的工件数据库读取被拒绝的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed detailed beta tracing not presenting `CLAUDE_CODE_CLIENT_CERT` to collectors that require a client certificate", "中文内容": "修复了详细的测试版跟踪不向需要客户端证书的收集器提供`CLAUDE_CODE_CLIENT_CERT`的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the OpenTelemetry `claude_code.session.count` metric counting Agent SDK `prewarm()` processes that were never claimed; a pre-started process now counts once, when it is claimed", "中文内容": "修复了从未声明的 OpenTelemetry `claude_code.session.count` 指标计数 Agent SDK `prewarm()` 进程；预先启动的进程现在在声明时计算一次"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/clear` killing running commands of background agents, teammates and workflows that keep running, and foreground subagents of background agents and teammates", "中文内容": "修复了`/clear`杀死后台代理、队友和持续运行的工作流程以及后台代理和队友的前台子代理的运行命令"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a terminal whose Claude apps gateway sign-in had expired sending telemetry and managed-settings requests that the gateway refused and logged as `invalid_token`", "中文内容": "修复了克劳德应用程序网关登录已过期的终端，发送网关拒绝并记录为`invalid_token`的遥测和托管设置请求"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the agents view appearing to send a reply to a background session waiting on a permission prompt; the reply now stays in the box with a hint to open the session and answer", "中文内容": "修复了代理视图似乎向等待权限提示的后台会话发送回复的问题；回复现在保留在框中，并提示打开会话并回答"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed agent view removing a draft saved by another agent view in the same directory when exiting", "中文内容": "修复了退出时代理视图删除同一目录中另一个代理视图保存的草稿的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where agent view came back with another agent view's input text after restarting itself for an update", "中文内容": "修复了代理视图在重新启动更新后返回另一个代理视图的输入文本的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the agents view preview cutting off long commands, results and status lines without an ellipsis, and dropping `**`, backticks and tags from commands waiting for approval", "中文内容": "修复了代理视图预览在没有省略号的情况下截断长命令、结果和状态行，并从等待批准的命令中删除`**`、反引号和标签"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Claude in Chrome reporting the extension as not connected when the connection dropped mid-action; Claude now checks the page before repeating an action that may have run", "中文内容": "修复了 Chrome 中的 Claude 在操作过程中连接断开时报告扩展程序未连接的问题；克劳德现在在重复可能已运行的操作之前检查页面"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Remote Control sessions still showing \"Limit reached\" on other devices after a usage limit was lifted outside the session", "中文内容": "修复了在会话外解除使用限制后，远程控制会话在其他设备上仍显示“已达到限制”的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the file card sometimes missing in the Claude iOS app when Claude sent a single file", "中文内容": "修复了克劳德发送单个文件时，克劳德 iOS 应用程序有时会丢失文件卡的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed self-hosted runner sessions failing with no explanation when the server keeps refusing to renew model access: the runner now retries sooner and posts a warning in the session", "中文内容": "修复了当服务器不断拒绝更新模型访问权限时，自托管运行器会话失败且没有任何解释的问题：运行器现在会更快地重试并在会话中发布警告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/permissions` in cloud sessions replying only that it isn't available; it now says where the session's rules live and how to change them", "中文内容": "修复了云会话中的`/permissions`仅回复不可用的问题；现在它会说明会话规则的位置以及如何更改它们"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed cloud sessions losing session-scoped deny and ask permission rules, such as those a PermissionRequest hook adds, when the session moves to a new worker", "中文内容": "修复了当会话移动到新工作人员时，云会话丢失会话范围的拒绝和询问权限规则，例如 PermissionRequest 挂钩添加的规则"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed mod hot-reloading turning off for the session when you typed three messages instead of answering its question in a cloud session", "中文内容": "修复了当您键入三条消息而不是在云会话中回答其问题时，会话的 mod 热重载关闭"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed background tasks that keep running after `/clear` disappearing from the task list in Claude Code on the web until another task started or ended", "中文内容": "修复了`/clear`从网络上 Claude Code 的任务列表中消失后继续运行的后台任务，直到另一个任务开始或结束为止"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed hidden commands appearing in the slash command menu of cloud sessions on mobile and web", "中文内容": "修复了移动和 Web 上云会话的斜线命令菜单中出现的隐藏命令"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where `/rewind` could restore or delete a file through a directory symlink", "中文内容": "修复了`/rewind`可以通过目录符号链接恢复或删除文件的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where a `sed` command could skip the permission check in accept-edits and auto mode", "中文内容": "修复了`sed`命令可以在接受编辑和自动模式下跳过权限检查的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where `CLAUDE_CODE_AUTO_MODE_SERVER=1` in managed settings was ignored behind an LLM gateway when the gateway's URL is set only there and server-managed settings can't be fetched", "中文内容": "修复了当仅在此处设置网关的 URL 并且无法提取服务器管理的设置时，托管设置中的`CLAUDE_CODE_AUTO_MODE_SERVER=1`在 LLM 网关后面被忽略的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a Bash permission bypass where a crafted environment prefix could hide part of a command from permission checks", "中文内容": "修复了 Bash 权限绕过问题，其中精心设计的环境前缀可能会隐藏部分命令以防止权限检查"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where deny and ask rules, hook matchers and `disallowedTools` entries written with a claude.ai connector's terminal name (`mcp__claude_ai_Slack`) were ignored in Claude Desktop (takes effect once Claude Desktop includes this version)", "中文内容": "修复了在 Claude Desktop 中忽略拒绝和询问规则、挂钩匹配器和使用 claude.ai 连接器的终端名称 (`mcp__claude_ai_Slack`) 编写的 `disallowedTools` 条目的情况（Claude Desktop 包含此版本后生效）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a sandbox escape when creating a worktree", "中文内容": "修复了创建工作树时的沙箱逃逸问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed self-hosted runners: `--trust-workspace false` now also stops hooks in the repository's settings files and skills from running", "中文内容": "修复了自托管运行程序：`--trust-workspace false`现在还会阻止存储库设置文件和技能中的挂钩运行"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where idle background sessions started through a shell-exported LLM gateway left the gateway after an update", "中文内容": "修复了更新后通过 shell 导出的 LLM 网关启动的空闲后台会话离开网关的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed help links in `/status` and the auto mode billing notice opening only part of the address when they wrap", "中文内容": "修复了`/status`中的帮助链接和自动模式计费通知在换行时仅打开部分地址的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where certificate errors behind a TLS-inspecting proxy persisted when `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` was set. With it set, Claude Code now makes a TLS handshake with the configured API host after a certificate failure, through your http:// proxy if one is set; it sends no API request", "中文内容": "修复了设置`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC`时，TLS 检查代理后面的证书错误仍然存在的情况。设置完成后，Claude Code 现在会在证书失败后通过您的 http:// 代理（如果已设置）与配置的 API 主机进行 TLS 握手；它不发送 API 请求"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude remote-control` exiting silently with status 0 when a first-run question gets no answer (scripts, services, batch jobs, Ctrl+C); it now says why and exits 1", "中文内容": "修复了当首次运行的问题没有得到答案时“claude Remote-control”以状态 0 静默退出的问题（脚本、服务、批处理作业、Ctrl+C）；现在它会说明原因并退出 1"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude remote-control` ignoring a piped `y` that has no newline after it at the first-run question; it now counts as a yes", "中文内容": "修复了“claude Remote-control”在首次运行问题时忽略管道`y`后没有换行符的问题；现在算作“是”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/rename` reporting plain success when the new name could not be saved to the session transcript; it now warns that the new name may not last", "中文内容": "修复了当新名称无法保存到会话记录中时`/rename`报告简单成功的问题；现在警告新名称可能不会持续"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `${CLAUDE_PLUGIN_ROOT}` not being substituted in a plugin-provided `subagentStatusLine` command, which can now reference the plugin's own scripts", "中文内容": "修复了`${CLAUDE_PLUGIN_ROOT}`在插件提供的`subagentStatusLine`命令中未被替换的问题，该命令现在可以引用插件自己的脚本"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude plugin update` and `/plugin` \"Update now\" not installing dependencies added by the new plugin version", "中文内容": "修复了`claude插件更新`和`/plugin`“立即更新”不安装新插件版本添加的依赖项的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed subagents being told after compaction to expect a completion notice for background agents they neither started nor took over", "中文内容": "修复了子代理在压缩后被告知等待后台代理完成通知的问题，他们既没有启动也没有接管"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where a background agent's later report was lost silently: the notification now says it was refused and how to ask for it", "中文内容": "修复了后台特工后来的报告默默丢失的情况：通知现在显示被拒绝以及如何索取"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved config saves on Windows: Claude Code waits longer for a file another program has open, so a kill during a save is less likely to leave `~/.claude.json` empty", "中文内容": "改进了 Windows 上的配置保存：Claude Code 等待另一个程序打开的文件的时间更长，因此保存期间的终止不太可能使 `~/.claude.json` 为空"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved Claude in Chrome after a brief disconnect: it waits up to 6 seconds for the session's own browser to return before picking another", "中文内容": "改进了 Chrome 中短暂断开连接后的 Claude：在选择另一个浏览器之前，它会等待最多 6 秒让会话自己的浏览器返回"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved Claude in Chrome: `javascript_tool` results of up to 60,000 characters now stay in the conversation instead of being saved to a file", "中文内容": "改进了 Chrome 中的 Claude：最多 60,000 个字符的`javascript_tool`结果现在保留在对话中，而不是保存到文件中"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved `claude purge` and the clean-up of old sessions to retry a folder that could not be fully deleted, and to report it as an error if it remains", "中文内容": "改进了`claude purge`和旧会话的清理，以重试无法完全删除的文件夹，并将其报告为错误（如果仍然存在）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the refusal for a path outside the working directories on macOS and Windows: when only its letter case differs from a path inside them, the message names that spelling", "中文内容": "改进了对 macOS 和 Windows 上工作目录之外的路径的拒绝：当仅其字母大小写与其中的路径不同时，消息名称的拼写"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the contrast of faint gray secondary text, such as hints, details in `/stats`, `/model` and `/sandbox`, and rejected-action messages", "中文内容": "改进了淡灰色辅助文本的对比度，例如提示、`/stats`、`/model`和`/sandbox`中的详细信息以及拒绝操作消息"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the artifact database error when an update targets a document that does not exist, and when the service pauses repeated refused writes", "中文内容": "改进了更新目标不存在的文档以及服务暂停重复拒绝写入时的工件数据库错误"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the Claude apps gateway's warnings about a failed upstream call: each now names the upstream, not only its provider", "中文内容": "改进了克劳德应用程序网关有关上游调用失败的警告：每个现在都命名上游，而不仅仅是其提供商"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the Claude apps gateway's spend limit error: it reads \"spend limit reached · resets Dec 1\", then `admin.blocked_message` if one is set", "中文内容": "改进了克劳德应用程序网关的支出限制错误：它显示“已达到支出限制·重置 12 月 1 日”，然后是`admin.blocked_message`（如果设置了）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the `/model` picker: older models are now grouped under a \"More models\" row instead of being listed after the current ones", "中文内容": "改进了`/model`选择器：旧模型现在分组在“更多模型”行下，而不是列在当前模型之后"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved `/context` at the terminal so the table Claude reads stays short: each list keeps its 10 largest rows, and MCP tools that load on demand share one row per server until they're called", "中文内容": "改进了终端上的`/context`，因此克劳德读取的表保持简短：每个列表保留其最大的 10 行，按需加载的 MCP 工具在每个服务器上共享一行，直到它们被调用"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved `/usage` in cloud sessions: it now links to Settings → Usage on claude.ai in a case where plan limits can't be shown", "中文内容": "改进了云会话中的`/usage`：现在，在无法显示计划限制的情况下，它会链接到 claude.ai 上的“设置”→“使用情况”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "[VSCode] Improved the confirmation for removing a plugin marketplace: it now checks which of its plugins are installed at that moment", "中文内容": "[VSCode] 改进了删除插件市场的确认：现在它会检查当时安装了哪些插件"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed MCP tasks to work in the terminal without feature-flag fetching (Bedrock, Vertex, Foundry, LLM gateways, `DISABLE_TELEMETRY`); set `CLAUDE_CODE_DISABLE_MCP_TASKS=1` to turn them off", "中文内容": "将 MCP 任务更改为在终端中工作，无需获取功能标志（Bedrock、Vertex、Foundry、LLM 网关、`DISABLE_TELEMETRY`）；设置 `CLAUDE_CODE_DISABLE_MCP_TASKS=1` 将其关闭"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed auto mode so that a project's settings files or a plugin can no longer switch its server-side check back on once you have switched it off outside the project", "中文内容": "更改了自动模式，以便项目的设置文件或插件在您在项目外部关闭后无法再重新打开其服务器端检查"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed Monitor's WebSocket watch to follow a rule on every Bash command: a deny refuses it, and under an ask rule an allow on Monitor, bypass mode or auto mode no longer skips the prompt", "中文内容": "更改了 Monitor 的 WebSocket 监视以遵循每个 Bash 命令的规则：拒绝拒绝它，并且在询问规则下允许 Monitor、旁路模式或自动模式不再跳过提示"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed `CLAUDE_CODE_PROXY_RESOLVES_HOSTS` so that settings files can no longer set it where the host manages the network; set it in the process environment", "中文内容": "更改了`CLAUDE_CODE_PROXY_RESOLVES_HOSTS`，以便设置文件不能再在主机管理网络的地方设置它；在进程环境中设置"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed a session's exact Bash or PowerShell ask rule to be refused, not asked about, when a broader deny rule covers the command", "中文内容": "当更广泛的拒绝规则涵盖命令时，更改了会话的确切 Bash 或 PowerShell 询问规则被拒绝，而不是询问"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed the Bash tool to ask for permission before running `which` with flags outside a lookup/display set", "中文内容": "更改了 Bash 工具，在使用查找/显示集之外的标志运行`which`之前请求许可"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed `--add-dir` directories to register plugin marketplaces only once that directory's own trust dialog has been accepted", "中文内容": "仅在接受该目录自己的信任对话框后，更改`--add-dir`目录以注册插件市场"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed nested skill loading: with the Bash sandbox on, skills in `.claude/skills` folders below the starting folder load only if you start Claude Code there or `/cd` there", "中文内容": "更改了嵌套技能加载：在打开 Bash 沙箱的情况下，仅当您启动 Claude Code 或启动`/cd`时，才会加载起始文件夹下`.claude/skills`文件夹中的技能"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed self-paced `/loop` to end when a turn finishes without rescheduling, instead of scheduling a fallback wakeup; set `CLAUDE_CODE_LOOP_KEEPALIVE=1` to keep the old behavior", "中文内容": "将自定进度的`/loop`更改为在回合结束时结束而不重新安排，而不是安排后备唤醒；设置`CLAUDE_CODE_LOOP_KEEPALIVE=1`以保留旧行为"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed PostToolUse hooks to run, with up to 10 seconds to finish, on tool calls that finish after a new message interrupts the turn", "中文内容": "更改了 PostToolUse 挂钩，以在新消息中断轮流后完成的工具调用上运行，最长需要 10 秒才能完成"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed what Claude is told after safeguards stop a subagent: retry with a narrower prompt or tell you, instead of doing the work itself", "中文内容": "更改了防护措施停止子代理后克劳德被告知的内容：用更窄的提示重试或告诉您，而不是自行完成工作"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed cloud sessions to drop session-scoped allow rules at a move to a new worker when their deny and ask rules can't all be kept, so you may be asked again", "中文内容": "更改了云会话，当拒绝和询问规则无法全部保留时，在移动到新工作人员时删除会话范围的允许规则，因此可能会再次询问您"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed the automatic certificate repair behind a TLS-inspecting proxy: it no longer runs when `ALL_PROXY` is the only proxy variable set. Set `HTTPS_PROXY` to the proxy's http:// URL instead", "中文内容": "更改了 TLS 检查代理后面的自动证书修复：当`ALL_PROXY`是唯一的代理变量集时，它不再运行。将 `HTTPS_PROXY` 设置为代理的 http:// URL"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed artifact database saves of rows others may have written: each file gets a hidden marker file, and existing files without one, earlier versions' exports among them, are left alone and reported", "中文内容": "更改的工件数据库保存其他人可能已写入的行：每个文件都会获得一个隐藏的标记文件，而没有标记文件的现有文件（其中早期版本的导出）将被单独保留并报告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Updated `/claude-api managed-agents-onboard` templates to match the Claude Console: removed Performance tuner, renamed two, and turned off web search and fetch in five whose prompts don't use them", "中文内容": "更新了“/claude-api Managed-agents-onboard”模板以匹配 Claude Console：删除了性能调优器，重命名为两个，并关闭了 5 个提示不使用它们的网络搜索和获取"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "移除", "内容": "Removed `shortcuts_list` and `shortcuts_execute`, which listed and started shortcuts saved in the extension, from Claude Code's built-in Claude in Chrome tools", "中文内容": "从 Claude Code 的 Chrome 内置 Claude 工具中删除了 `shortcuts_list` 和 `shortcuts_execute`，它们列出并启动了扩展程序中保存的快捷方式"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Gateway: Added startup warnings for upstreams that mix AWS GovCloud with other upstreams, and for base URL variables in the gateway's environment", "中文内容": "网关：添加了针对将 AWS GovCloud 与其他上游混合的上游以及网关环境中的基本 URL 变量的启动警告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Gateway: Added a start-up log warning when managed settings name an Amazon Bedrock guardrail in a header, which the gateway doesn't forward, and no `bedrock` upstream sets a `guardrail`", "中文内容": "网关：当托管设置在标头中命名 Amazon Bedrock 护栏时添加了启动日志警告，网关不会转发该护栏，并且没有`bedrock`上游设置“护栏”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Gateway: Fixed Claude Desktop offering a web search tool that always failed when every upstream is Amazon Bedrock", "中文内容": "Gateway：修复了 Claude Desktop 提供的 Web 搜索工具在每个上游都是 Amazon Bedrock 时总是失败的问题"}, {"日期": "20  rows.forEach((r,i)=>{const x=lft+i*bw+bw*.15,w=bw*.7,tot=r.新增+r.修复+r.改进+r.移除+r.其他;let y0=top+h;
  ORDER.map(k=>[k,`var(--${{新增:'add',修复:'fix',改进:'imp',移除:'rm',其他:'oth'}[k]}-bg)`]).forEach(([k,c])=>{if(!r[k])return;const hh=r[k]/max*h;y0-=hh;s+=`<rect x="${x}" y="${y0}" width="${w}" height="${hh}" fill="${c}"><title>${r.k}\n${ORDER.map(q=>`${t.k[q]} ${r[q]}`).join(' · ')}\n${L==='zh'?'版本数':'Versions'} ${r.v.size}</title></rect>`});
  if(tot)ORDER.forEach(q=>P[q].push([x+w/2,top+h-r[q]/tot*h]));
  if(showV&&r.v.size)s+=`<text x="${x+w/2}" y="${Y(tot)-4}" text-anchor="middle" style="fill:var(--acc)">${r.v.size}</text>`;
  if(i%step===0)s+=`<text x="${x+w/2}" y="${H-bot+14}" text-anchor="middle">${r.k.slice(2)}</text>`});
 ORDER.filter(q=>!HID.has(q)).forEach(q=>s+=`<path d="${sm(P[q])}" fill="none" stroke="var(--card)" stroke-width="3.4" opacity=".9"/><path d="${sm(P[q])}" fill="none" stroke="${DK[q]}" stroke-width="1.4" stroke-dasharray="5 4"/>`);
 return `<svg width="${W}" height="${H}">${s}</svg>`}
function hmap(D,f,cs,ti){const zh=L==='zh',vals=D.map(f).filter(v=>v>0).sort((a,b)=>a-b),q=p=>vals[Math.floor((vals.length-1)*p)]||1,th=[q(.25),q(.5),q(.75)];
 const lv=n=>!n?0:n<=th[0]?1:n<=th[1]?2:n<=th[2]?3:4,c=13,g=3,off=new Date(D[0].k).getDay(),wd=zh?['','一','','三','','五','']:['','Mon','','Wed','','Fri',''];
 const cols=Math.ceil((D.length+off)/7);let s='',lastM='';
 wd.forEach((w,i)=>s+=`<text x="0" y="${20+i*(c+g)+10}">${w}</text>`);
 D.forEach((r,i)=>{const j=i+off,x=28+Math.floor(j/7)*(c+g),y=20+(j%7)*(c+g),n=f(r);
  const mo=r.k.slice(0,7);if(mo!==lastM&&+r.k.slice(8)<=7&&j%7===0){s+=`<text x="${x}" y="12">${zh?(+mo.slice(5))+'月':new Date(r.k).toLocaleString('en',{month:'short'})}</text>`;lastM=mo}
  s+=`<rect x="${x}" y="${y}" width="${c}" height="${c}" rx="2" fill="${cs[lv(n)]}" data-k="${r.k}" style="cursor:${n?'pointer':'default'}"><title>${r.k}  ${ti} ${n}</title></rect>`});
 const rg=(x,y)=>x>=y?`${y}`:`${x}–${y}`,rng=[rg(1,th[0]),rg(th[0]+1,th[1]),rg(th[1]+1,th[2]),`>${th[2]}`];
 return `<h4 style="margin:12px 0 4px;font-size:14px">${ti}</h4><div class="lg">${cs.map((x,i)=>`<span><i style="background:${x};width:12px;height:12px"></i>${i?rng[i-1]:'0'}</span>`).join('')}</div><div class="sc heat"><svg width="${28+cols*(c+g)}" height="${20+7*(c+g)}">${s}</svg></div>`}
function heat(D){const zh=L==='zh',tot=r=>ORDER.reduce((a,q)=>a+r[q],0);
 return `<div class="ch"><h3>${zh?'功能更新量示意图':'Feature update map'}</h3><div class="note">${zh?'每格一天，每列一周；颜色越深当天条数越多（按全部有更新日子的四分位分 4 档）。点格子看当天内容':'One cell per day; darker = more entries (4 quartile levels). Click for details'}</div>`
 +hmap(D,tot,['var(--line)','var(--h1)','var(--h2)','var(--h3)','var(--h4)'],zh?'每日更新总量':'Daily total updates')
 +hmap(D,r=>r.新增,['var(--line)','var(--n1)','var(--n2)','var(--n3)','var(--n4)'],zh?'每日新增量':'Daily added features')+'</div>'}
function cum(D){const zh=L==='zh',H=260,top=20,bot=40,lft=40,rt=44,bw=3,W=lft+rt+D.length*bw,h=H-top-bot;
 const vs=new Set();let n=0;const pts=D.map(r=>{r.v.forEach(v=>vs.add(v));n+=r.新增;return{k:r.k,v:vs.size,n}});
 const mv=pts[pts.length-1].v,mn=pts[pts.length-1].n,Yv=v=>top+h-v/mv*h,Yn=v=>top+h-v/mn*h;let s='';
 for(let i=0;i<=4;i++){const yy=top+h-h*i/4;s+=`<line x1="${lft}" x2="${W-rt}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${lft-4}" y="${yy+3}" text-anchor="end" style="fill:var(--acc)">${Math.round(mv*i/4)}</text><text x="${W-rt+4}" y="${yy+3}" style="fill:var(--add-fg)">${Math.round(mn*i/4)}</text>`}
 pts.forEach((p,i)=>{if(p.k.slice(8)==='01')s+=`<text x="${lft+i*bw}" y="${H-bot+14}" text-anchor="middle">${p.k.slice(2,7)}</text>`});
 const line=(f,c)=>`<polyline points="${pts.map((p,i)=>`${lft+i*bw},${f(p)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/>`;
 s+=line(p=>Yv(p.v),'var(--acc)')+line(p=>Yn(p.n),'var(--add-fg)');
 return `<div class="ch"><h3>${zh?'发布累计版本量和累计新增需求量':'Cumulative versions & added features'}</h3><div class="note">${zh?`截至 ${last}：累计 ${mv} 个版本、${mn} 项新增`:`As of ${last}: ${mv} versions, ${mn} new features`}</div><div class="lg"><span><i style="background:var(--acc)"></i>${zh?'累计版本数（左轴）':'Cumulative versions (left)'}</span><span><i style="background:var(--add-fg)"></i>${zh?'累计新增数（右轴）':'Cumulative new (right)'}</span></div><div class="sc"><svg width="${W}" height="${H}">${s}</svg></div></div>`}
function grow(D){const zh=L==='zh',H=260,top=20,bot=40,lft=44,rt=20,bw=3,W=lft+rt+D.length*bw,h=H-top-bot;
 let a=0,b=0;const pts=D.map(r=>({k:r.k,a:a+=r.新增,b:b+=r.改进})),la=pts[pts.length-1],mx=Math.max(la.a,la.b),Y=v=>top+h-v/mx*h;let s='';
 for(let i=0;i<=4;i++){const v=Math.round(mx*i/4);s+=`<line x1="${lft}" x2="${W-rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${lft-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`}
 pts.forEach((p,i)=>{if(p.k.slice(8)==='01')s+=`<text x="${lft+i*bw}" y="${H-bot+14}" text-anchor="middle">${p.k.slice(2,7)}</text>`});
 const line=(f,c)=>`<polyline points="${pts.map((p,i)=>`${lft+i*bw},${Y(f(p))}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2"/>`;
 s+=line(p=>p.b,'var(--imp-fg)').replace('2.2','3.5')+line(p=>p.a,'var(--add-fg)');const ex=lft+(pts.length-1)*bw;s+=`<text x="${ex-4}" y="${Y(la.a)-6}" text-anchor="end" style="fill:var(--add-fg);font-size:12px">${zh?'新增':'Added'} ${la.a}</text><text x="${ex-4}" y="${Y(la.b)+16}" text-anchor="end" style="fill:var(--imp-fg);font-size:12px">${zh?'改进':'Improved'} ${la.b}</text>`;
 return `<div class="ch"><h3>${zh?'功能增长曲线':'Feature growth curve'}</h3><div class="note">${zh?`新增 = 功能点增长（做得多宽）；改进 = 功能完善性增长（做得多深）。截至 ${last}：累计新增 ${la.a}、累计改进 ${la.b}`:`Added = breadth, Improved = depth. As of ${last}: added ${la.a}, improved ${la.b}`}</div><div class="lg"><span><i style="background:var(--add-fg)"></i>${zh?'累计新增':'Cumulative new'}</span><span><i style="background:var(--imp-fg)"></i>${zh?'累计改进':'Cumulative improved'}</span></div><div class="sc"><svg width="${W}" height="${H}">${s}</svg></div></div>`}
function stats(){const t=T[L],zh=L==='zh',el=document.getElementById('vs');
 // 公开站首屏只有最近 7 个发布日，全部历史没到之前不画图（否则只有两三列，还会误导）
 if(!FULL){el.innerHTML=`<div class="ch"><div class="note">${FAIL?(zh?'全部历史没加载成功，请刷新页面重试':'Could not load full history, please refresh'):t.loading}</div></div>`;return}
 const D=agg(d=>key(d)),Wk=agg(d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return key(x)}),M=agg(d=>key(d).slice(0,7));
 const lg=`<div class="lg"><span class="t 新增">${t.k.新增}</span><span class="t 改进">${t.k.改进}</span><span class="t 修复">${t.k.修复}</span><span class="t 移除">${t.k.移除}</span><span class="t 其他">${t.k.其他}</span></div><div class="lg">${zh?'虚线 = 各类占当期总更新量的比例（右轴）：':'Dashed = share of each type (right axis): '}${ORDER.map(q=>`<span data-q="${q}" style="cursor:pointer;${HID.has(q)?'opacity:.35;text-decoration:line-through':''}"><i style="border-top:2px dashed ${({新增:'var(--add-fg)',修复:'var(--fix-fg)',改进:'var(--imp-fg)',移除:'var(--rm-fg)',其他:'var(--oth-fg)'})[q]};height:0;margin-bottom:3px"></i>${t.k[q]}%</span>`).join('')}</div>`;
 const card=(ti,note,rows,bw,v,legV)=>`<div class="ch"><h3>${ti}</h3><div class="note">${note}</div>${lg}${legV?`<div class="lg"><span style="color:var(--acc)">${zh?'柱顶橙色数字 = 版本数':'Orange number on top = versions'}</span></div>`:''}<div class="sc">${chart(rows,bw,v)}</div></div>`;
 const DD=R90?D.slice(-90):D,rb=`<button class="btn rb" style="margin-left:8px;height:26px;padding:0 10px;font-size:12px">${R90?(zh?'看全部':'Show all'):(zh?'只看近 90 天':'Last 90 days')}</button>`;
 el.innerHTML=heat(D)+card(zh?'每日更新量':'Daily updates',(zh?`${R90?'近 90 天':`全部 ${D.length} 天`}，鼠标悬停看明细；点虚线图例可隐藏/显示该线`:`${R90?'Last 90 days':`All ${D.length} days`}; hover for details; click dashed legend to toggle`)+rb,DD,R90?9:7,false,false)
  +card(zh?'每周更新量与版本数':'Weekly updates & versions',zh?'周一到周日为一周，横轴是周一日期':'Weeks start Monday',Wk,22,true,true)
  +card(zh?'每月更新量与版本数':'Monthly updates & versions','',M,48,true,true)+cum(D)+grow(D);
 el.querySelectorAll('.sc').forEach(x=>x.scrollLeft=x.scrollWidth);
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;HID.has(q)?HID.delete(q):HID.add(q);try{localStorage.setItem('hid',JSON.stringify([...HID]))}catch(e){}stats()});
 el.querySelector('.rb').onclick=()=>{R90=!R90;try{localStorage.setItem('r90',R90?'1':'0')}catch(e){}stats()};
 el.querySelectorAll('.heat rect').forEach(b=>{if(by[b.dataset.k])b.onclick=()=>{sel=b.dataset.k;y=+sel.slice(0,4);m=+sel.slice(5,7)-1;draw();show();view('m');window.scrollTo(0,0)}})}

// 搜索：输入 2 个字以上，在英文原文和中文里找
const QI=document.getElementById('q');
function search(){const v=QI.value.trim().toLowerCase(),sr=document.getElementById('sr'),zh=L==='zh';QI.placeholder=zh?'搜索更新内容…':'Search updates…';
 if(v.length<2){sr.innerHTML='';sr.style.display='none';view(V);return}
 ['vl','vm','vy','vs','vf','detail'].forEach(i=>document.getElementById(i).style.display='none');sr.style.display='';
 const hit=DATA.filter(x=>x.内容.toLowerCase().includes(v)||(x.中文内容||'').toLowerCase().includes(v)).sort((a,b)=>b.日期.localeCompare(a.日期)),sh=hit.slice(0,300);
 sr.innerHTML=`<div class="ch"><h3>${zh?`搜索「${esc(QI.value)}」：${hit.length} 条`:`"${esc(QI.value)}": ${hit.length} results`}${hit.length>300?(zh?'（只显示最近 300 条）':' (latest 300 shown)'):''}</h3><ul>${sh.map(x=>`<li><a href="#" data-k="${x.日期}" style="color:var(--acc);margin-right:6px">${x.日期||'?'} v${x.版本}</a><span class="t ${x.类型}">${T[L].k[x.类型]}</span>${esc(zh&&x.中文内容?x.中文内容:x.内容)}</li>`).join('')}</ul></div>`;
 sr.querySelectorAll('a[data-k]').forEach(a=>a.onclick=e=>{e.preventDefault();const k=a.dataset.k;if(!by[k])return;sel=k;y=+k.slice(0,4);m=+k.slice(5,7)-1;F=null;QI.value='';search();view('m');draw();show();document.getElementById('detail').scrollIntoView()})}
QI.oninput=search;
document.getElementById('p').innerHTML=icon('prev');document.getElementById('nx').innerHTML=icon('next');
const dlg=document.getElementById('dlg'),subb=document.getElementById('subb');subb.hidden=!SRC;subb.onclick=()=>{WH={s:'',v:'',busy:false};subD();dlg.showModal()};dlg.addEventListener('submit',e=>{if(e.target.matches('[data-whf]')){e.preventDefault();whAct('sub')}});dlg.onclick=e=>{if(e.target===dlg)return dlg.close();const m=e.target.closest('[data-cm]'),d=e.target.closest('[data-dl]'),i=e.target.closest('.inf');tipX(e.target);if(i){const t=i.closest('.so').querySelector('.tip');t.hidden=!t.hidden;i.setAttribute('aria-expanded',!t.hidden)}if(m){CM=m.dataset.cm;subD()}if(d)dlCard(d.dataset.dl);const w=e.target.closest('[data-wh]');if(w)whAct(w.dataset.wh)};
// ⓘ 提示卡：点外面关，Esc 先关提示卡再关弹窗
function tipX(el){let n=0;dlg.querySelectorAll('.tip:not([hidden])').forEach(t=>{const b=t.closest('.so').querySelector('.inf');if(el&&(t.contains(el)||b.contains(el)))return;t.hidden=true;b.setAttribute('aria-expanded',false);n++});return n}
dlg.addEventListener('cancel',e=>{if(tipX(null))e.preventDefault()});
draw();show();view(V);search();goHash();
// 公开站：后台加载全部历史（data/all.json，英文字段），换成页面用的中文字段后重画
if(SRC)fetch(SRC).then(r=>r.json()).then(j=>{const K={new:'新增',improved:'改进',fixed:'修复',removed:'移除',other:'其他'};
 PT=j.published||PT;DATA=j.entries.map(r=>({日期:r.date,版本:r.version,类型:K[r.type],内容:r.en,中文内容:r.zh}));index();FULL=true;draw();show();
 if(QI.value.trim().length>=2)search();else if(V!=='l')view(V);goHash()}).catch(()=>{document.getElementById('sub').textContent+=' ⚠';FAIL=true;if(V==='s')stats();if(V==='y')year()});
</script>
