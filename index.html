ixed MCP prompts disappearing when two servers have nearly identical names", "中文内容": "修复了当两个服务器名称几乎相同时 MCP 提示消失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a tool call to an MCP server that an SDK host had just removed reconnecting to it, or reporting that it needs authentication", "中文内容": "修复了对 SDK 主机刚刚删除的 MCP 服务器的工具调用，重新连接到它，或报告它需要身份验证"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude not being told that a remote MCP server's question was declined when the server then failed the tool call", "中文内容": "修复了当服务器工具调用失败时克劳德没有被告知远程 MCP 服务器的问题被拒绝的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed MCP tools with a root `anyOf` or `oneOf` showing Claude only the first branch's form of an argument; text such as `42` can now arrive as a number where another branch takes one", "中文内容": "修复了根`anyOf`或`oneOf`的 MCP 工具，仅显示 Claude 参数的第一个分支形式；诸如`42`之类的文本现在可以作为数字到达，而另一个分支则采用数字"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude not being told when an approved MCP resource tool was unavailable after a cloud session's worker was replaced", "中文内容": "修复了在更换云会话工作人员后，批准的 MCP 资源工具不可用时克劳德没有被告知的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/mcp` not showing why a local (stdio) MCP server failed to start", "中文内容": "修复了`/mcp`未显示本地（stdio）MCP 服务器无法启动的原因"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc doing nothing while an MCP server reconnects: Esc, or Ctrl+C pressed twice, now closes the wait and the reconnect continues in the background", "中文内容": "修复了 MCP 服务器重新连接时 Esc 不执行任何操作的问题：Esc 或按两次 Ctrl+C，现在会关闭等待，重新连接将在后台继续"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Enable in `/mcp` showing no progress for a slow server, and a second Enter disabling it again", "中文内容": "修复了`/mcp`中的“启用”显示慢速服务器没有进度，第二个 Enter 再次禁用它的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude mcp add-json` answering most mistakes with \"Invalid configuration: : Invalid input\"; it now says what to change", "中文内容": "修复了`claude mcp add-json`回答大多数错误“无效配置：：无效输入”的问题；它现在说明要更改什么"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+C hint on a background MCP task's question saying \"cancel\" when the second press leaves the question to answer later", "中文内容": "修复了当第二次按下将问题留待稍后回答时，后台 MCP 任务的问题上的 Ctrl+C 提示显示“取消”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed pressing `c` to copy an MCP sign-in URL leaving a stray `c` in the paste field", "中文内容": "修复了按`c`复制 MCP 登录 URL，在粘贴字段中留下杂散的`c`的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Tab and Shift+Tab not moving between fields in an MCP server's input form, and a required field there keeping its tick after being emptied", "中文内容": "修复了 Tab 和 Shift+Tab 不在 MCP 服务器输入表单中的字段之间移动，以及必填字段在清空后保持勾选状态的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Fixed a session disconnecting mid-reply when the server was briefly unavailable", "中文内容": "远程控制：修复了服务器短暂不可用时会话在回复中断开连接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Fixed the QR code in `/remote-control` being cut off in short terminal windows such as 80×24", "中文内容": "远程控制：修复了`/remote-control`中的二维码在短终端窗口（例如80×24）中被切断的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Fixed terminal sessions showing as idle on your phone while background subagents were still running; Stop on your phone or the web now ends them together with the turn", "中文内容": "远程控制：修复了当后台子代理仍在运行时终端会话在手机上显示为空闲的问题；停止在你的手机或网络上，现在将它们与转弯一起结束"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Remote Control showing a session as running while it waited on a prompt that can only be answered in the terminal, and as idle when turned on while a tool was running", "中文内容": "修复了远程控制在等待只能在终端中应答的提示时显示会话正在运行的问题，以及在工具运行时打开会话时显示为空闲的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a reply in a remote session running again after a restart when Stop had been pressed while Claude Code was restarting", "中文内容": "修复了在 Claude Code 重新启动时按下“停止”时重新启动后再次运行的远程会话中的回复"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Stop in cloud and self-hosted runner sessions sometimes waiting for slow MCP servers to connect before taking effect", "中文内容": "修复了云中的停止和自托管运行器会话有时会等待慢速 MCP 服务器连接才能生效的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed files Claude sends from cloud and Remote Control sessions failing at once when a proxy answers an upload with its own HTTP 502, 504 or 520 to 524; the upload now gets a second try", "中文内容": "修复了当代理使用自己的 HTTP 502、504 或 520 到 524 应答上传时，Claude 从云和远程控制会话发送的文件立即失败的问题；现在可以再次尝试上传"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed claude.ai chats and Cowork tasks sometimes not sending a file after you chose \"Send it\" at the check for secret keys", "中文内容": "修复了在检查密钥时选择“发送”后，claude.ai 聊天和 Cowork 任务有时不发送文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed claude.ai chats and Cowork tasks asking about a plugin file only because it holds a Word, Excel or other zip-type file; such files are now read for secret keys first", "中文内容": "修复了 claude.ai 聊天和 Cowork 任务仅因为插件文件包含 Word、Excel 或其他 zip 类型文件而询问插件文件的问题；现在首先读取此类文件的密钥"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude self-hosted-runner` asking for new tokens nonstop when a refreshed token was already due, such as when the machine's clock runs ahead", "中文内容": "修复了`claude self-hosted-runner`在刷新令牌已到期时不间断地请求新令牌的问题，例如当机器时钟提前运行时"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/autofix-pr` reporting a run as cancelled when its cloud session could not be stopped; it now links the session so you can stop it", "中文内容": "修复了`/autofix-pr`在云会话无法停止时报告运行已取消的问题；它现在链接会话，以便您可以停止它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/teleport` hiding a session from its list in narrow terminals", "中文内容": "修复了`/teleport`在狭窄终端的列表中隐藏会话的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed artifact publishing refusing files in a background session's temporary folder", "中文内容": "修复了工件发布拒绝后台会话临时文件夹中的文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed subagents whose `disallowedTools` lists `Artifact` still being offered artifact tools in some cloud sessions", "中文内容": "修复了`disallowedTools`列出`Artifact`的子代理在某些云会话中仍提供工件工具的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude calling a just-published artifact private when people with access to its folder can open it", "中文内容": "修复了当有权访问其文件夹的人可以打开刚刚发布的工件时，克劳德将其称为私有的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the terminal not showing an artifact's link after Claude publishes or updates it", "中文内容": "修复了克劳德发布或更新工件后终端不显示工件的链接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the main conversation of a terminal session waiting in silence for a background subagent that another subagent had messaged: it's now told which agent the subagent reports to", "中文内容": "修复了终端会话的主要对话，默默地等待另一个子代理发送消息的后台子代理：现在被告知子代理向哪个代理报告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed background agents being told you refused their tool call when a session ended by Ctrl+C twice at the exit dialog, or after an interface crash", "中文内容": "修复了在退出对话框中按 Ctrl+C 两次结束会话时或界面崩溃后后台代理被告知您拒绝其工具调用的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Up and Esc moving the main conversation's queued messages into the prompt box of a subagent or teammate you are viewing", "中文内容": "修复了向上和 Esc 将主对话的排队消息移动到您正在查看的子代理或队友的提示框中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the agent rows under the prompt showing an agent as busy after its turn ended: the row now says what it is waiting on, and `/tasks` names the subagent behind each background command", "中文内容": "修复了提示下的代理行在轮次结束后显示代理忙的问题：该行现在显示正在等待的内容，并且`/tasks`命名每个后台命令后面的子代理"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed stopped and failed agents looking like running ones in the agent rows under the prompt, or showing \"Done\" when run in parallel, and a stopped agent's last command still showing \"Running…\"", "中文内容": "修复了停止和失败的代理看起来像在提示下的代理行中正在运行的代理，或者在并行运行时显示“完成”，并且停止的代理的最后一个命令仍然显示“正在运行...”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an opened background agent showing a normal spinner while its requests were being retried", "中文内容": "修复了打开的后台代理在重试其请求时显示正常旋转器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"background agents launched\" line stopping at two when Claude starts three or more agents in one reply", "中文内容": "修复了当克劳德在一次回复中启动三个或更多代理时，“启动后台代理”行停止在两个的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed every earlier turn's \"done\" line showing \"1 shell still running\" while a background task ran", "中文内容": "修复了后台任务运行时每个较早回合的“完成”行显示“1 个 shell 仍在运行”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed subagent tool counts in auto mode including the call that delivers the agent's final report", "中文内容": "修复了自动模式下的子代理工具计数，包括提供代理最终报告的调用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the welcome header outside fullscreen mode showing the session's model while viewing a subagent or teammate that runs on a different model", "中文内容": "修复了全屏模式外的欢迎标题在查看在不同模型上运行的子代理或队友时显示会话模型的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed images pasted while viewing a background agent arriving as the text `[Image #1]`", "中文内容": "修复了查看以文本“[图像 #1]”形式到达的后台代理时粘贴的图像"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long background agent and background command results wrapping under the bullet instead of lining up with their text", "中文内容": "修复了长后台代理和后台命令结果包裹在项目符号下方而不是与其文本对齐的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude --worktree` showing nothing while a slow worktree is set up", "中文内容": "修复了设置慢速工作树时`claude --worktree`不显示任何内容的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the worktree exit dialog counting a new folder as one uncommitted file", "中文内容": "修复了工作树退出对话框将新文件夹计为一个未提交文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed workflow resume telling Claude every finished agent would be reused after a call failed; Claude is now told how many results were reused and where reuse stopped", "中文内容": "修复了工作流程恢复，告诉克劳德每个完成的代理将在呼叫失败后重新使用；克劳德现在被告知有多少结果被重复使用以及重复使用在哪里停止"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a hang on malformed glob patterns in settings, plugin marketplace entries and Grep file filters", "中文内容": "修复了设置、插件市场条目和 Grep 文件过滤器中格式错误的 glob 模式的挂起"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed plugin and marketplace requests waiting forever when `ALL_PROXY` is the only proxy set and the proxy never answers; they now fail after 25 seconds", "中文内容": "修复了当`ALL_PROXY`是唯一代理集并且代理永远不会应答时插件和市场请求永远等待的问题；他们现在会在 25 秒后失败"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/` menu, `/skills` and `/plugin` repeating rows and losing the cursor when two skills or commands in one place share a name", "中文内容": "修复了`/`菜单、`/skills`和`/plugin`重复行并在一个位置的两个技能或命令共享名称时丢失光标的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed search in `/resume`, `/plugin`, `/permissions` and `/config` ignoring IME input, dictation and fast typing", "中文内容": "修复了`/resume`、`/plugin`、`/permissions`和`/config`中的搜索忽略 IME 输入、听写和快速打字的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the cursor disappearing after clearing a search on the `/plugin` Installed tab", "中文内容": "修复了清除`/plugin`已安装选项卡上的搜索后光标消失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a mod's `Text` with `wrap=\"truncate-end\"` losing rows on the terminal when it holds a line feed", "中文内容": "修复了带有 `wrap=\"truncate-end\"` 的 mod 的 `Text` 在保存换行符时在终端上丢失行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/model` showing your saved model as \"Default (recommended)\": Default now names your plan's default model, and choosing it in the terminal switches you back to that default", "中文内容": "修复了`/model`将您保存的模型显示为“默认（推荐）”的问题：默认现在命名您计划的默认模型，并在终端中选择它会将您切换回默认值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a first skill, command or agent created during a session not being found right away", "中文内容": "修复了无法立即找到会话期间创建的第一个技能、命令或代理的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/clear --help` and other built-in commands running at an idle prompt instead of showing usage; added `/help <command>`", "中文内容": "修复了`/clear --help`和其他内置命令在空闲提示符下运行而不是显示用法的问题；添加了 `/help <命令>`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a half-written reply sitting frozen with no spinner while Claude Code retried after a mid-response server error", "中文内容": "修复了克劳德代码在中间响应服务器错误后重试时，半写回复冻结且没有旋转器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the API retry notice sitting at \"Retrying in 0s\" during the next attempt, now \"retrying…\", and the \"will retry in\" countdown freezing when a reply stalled or with Reduce motion on", "中文内容": "修复了 API 重试通知在下一次尝试期间处于“0 秒内重试”状态，现在“正在重试...”，以及当回复停滞或打开“减少”动作时“将重试”倒计时冻结"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the transcript dropping a few rows, or the prompt jumping up, as a reply started streaming", "中文内容": "修复了当回复开始流式传输时，文字记录会丢失几行，或者提示会跳起的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a line of a long list or code block going missing from scrollback, and text jumping a row, while a response streams", "中文内容": "修复了长列表或代码块中的一行在回滚时丢失，以及文本在响应流时跳跃一行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a long queued message hiding Claude's reply while it streams, and erasing it from scrollback in the classic renderer", "中文内容": "修复了一条长队消息在流式传输时隐藏克劳德的回复，并在经典渲染器中将其从回滚中删除"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed fullscreen text jumping when a reply finishes while you're scrolled up or after answering an Edit or Write prompt, and losing your place or jumping turns when resizing", "中文内容": "修复了当您向上滚动或回答“编辑”或“写入”提示后回复完成时全屏文本跳转，以及在调整大小时丢失位置或跳转的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the fullscreen transcript going blank when searching or jumping far back, and freezing partway through a fast scroll, in long sessions", "中文内容": "修复了在长时间会话中搜索或向后跳转时全屏文字记录变为空白，以及在快速滚动过程中冻结的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the pinned prompt in fullscreen showing an older question while a reply streams, and being copied with the reply when you drag a selection past the top", "中文内容": "修复了全屏固定提示在回复流时显示较旧的问题，以及当您将选择拖过顶部时与回复一起复制的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the screen going blank and dropping keys after picking a model in `/model`, and `/model <alias>` and `/effort <level>` briefly hiding the prompt and dropping letters typed right after", "中文内容": "修复了在`/model`中选择模型后屏幕变黑并丢失按键的问题，以及`/model <alias>`和`/effort <level>`短暂隐藏提示并丢失之后键入的字母"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the screen scrambling after `/tui default` in a long conversation, or when the `tui` setting changed in another window (anthropics/claude-code#94879)", "中文内容": "修复了长时间对话中`/tui default`之后或在另一个窗口中更改`tui`设置时的屏幕乱码 (anthropics/claude-code#94879)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the screen freezing for seconds when showing long newly created files in the permission prompt and the Ctrl+O transcript", "中文内容": "修复了在权限提示和 Ctrl+O 记录中显示长的新创建文件时屏幕冻结几秒钟的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed some very long Bash or PowerShell commands freezing the session for seconds", "中文内容": "修复了一些非常长的 Bash 或 PowerShell 命令将会话冻结几秒钟的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Shift+Enter or Option+Enter pressed right after a paste sending the prompt instead of adding a new line", "中文内容": "修复了粘贴后立即按下 Shift+Enter 或 Option+Enter 发送提示而不是添加新行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Up, Down, End and mouse clicks putting the cursor on the wrong row of a prompt that wraps", "中文内容": "修复了向上、向下、结束和鼠标单击将光标置于换行提示的错误行上的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed undo (Ctrl+_) losing the last words typed when pressed after deleting a line or word", "中文内容": "修复了删除行或单词后按下撤消 (Ctrl+_) 时丢失最后输入的单词的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed code or a diff pasted into a prompt losing its indentation in the transcript, and a pasted diff's added lines showing as removed", "中文内容": "修复了粘贴到提示中的代码或差异在转录中丢失缩进的问题，并且粘贴差异的添加行显示为已删除"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `[Image #N]` landing in the middle of a word when typing right after pasting, and a pasted image not being sent after deleting its placeholder and pasting it back with Ctrl+Y", "中文内容": "修复了粘贴后立即输入时`[Image #N]`落在单词中间的问题，以及删除其占位符并使用 Ctrl+Y 将其粘贴回来后未发送粘贴的图像的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed asterisks disappearing from your own prompts in the transcript, such as `src/**/*.ts` or `2*3*4`", "中文内容": "修复了转录中您自己的提示中星号消失的问题，例如`src/**/*.ts`或`2*3*4`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude -p` showing nothing in the terminal while it retried an overloaded or failing API request, or when it failed with its text output redirected or captured", "中文内容": "修复了`claude -p`在重试超载或失败的 API 请求时，或者在其文本输出重定向或捕获失败时在终端中不显示任何内容的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Windows paths in Claude's responses losing the backslash before folders like `.claude` or `_build`", "中文内容": "修复了 Claude 响应中的 Windows 路径在`.claude`或`_build`等文件夹之前丢失反斜杠的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed bold text showing as raw `**` in Japanese, Chinese and Korean replies when it starts or ends with punctuation", "中文内容": "修复了日语、中文和韩语回复中以标点符号开头或结尾时显示为原始`**`的粗体文本"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/memory` opening a read-only file with no warning that changes may not save", "中文内容": "修复了`/memory`打开只读文件时没有警告更改可能无法保存的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude editing `~/.claude/keybindings.json`, which has no effect in Claude Desktop, when asked to change a shortcut there", "中文内容": "修复了克劳德编辑`~/.claude/keybindings.json`的问题，当要求更改那里的快捷方式时，该编辑在克劳德桌面中不起作用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude saying that an administrator can turn on Claude in Chrome when your organization's policy disables it, in apps that provide its tools such as Claude Desktop's Code tab", "中文内容": "修复了 Claude 表示，当您的组织的策略禁用 Chrome 时，管理员可以在提供其工具（例如 Claude Desktop 的“代码”选项卡）的应用程序中打开 Claude 的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the suggested next prompt sometimes being a bare tag, such as `<signal type=\"empty\" />`", "中文内容": "修复了建议的下一个提示有时是裸标签的问题，例如`<signal type=\"empty\" />`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long command output ending mid-line in the expanded view with no sign it was cut; it now names the saved file", "中文内容": "修复了长命令输出在展开视图中以中线结束且没有被剪切的迹象；它现在命名保存的文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed collapsed tool lines reading \"Ran\" or \"Called\" while still asking permission, and \"Running…\" or \"Reading…\" again when a panel opened after a call was stopped or refused", "中文内容": "修复了折叠工具行在仍在请求许可的情况下读取“Ran”或“Called”的问题，以及在呼叫停止或拒绝后打开面板时再次“Running...”或“Reading...”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed failed, blocked or refused commands looking like passing ones in a collapsed tool line: it now shows \"· 1 failed\" or says they did not run", "中文内容": "修复了失败、阻止或拒绝的命令，看起来像是在折叠的工具行中传递命令：它现在显示“· 1 失败”或说它们没有运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"done\" line showing after a turn that failed or was refused at a permission prompt", "中文内容": "修复了在权限提示下失败或被拒绝的回合后显示的“完成”行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed failed or refused skill and agent calls still showing \"Initializing…\"", "中文内容": "修复了失败或拒绝的技能以及代理呼叫仍显示“正在初始化...”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/btw` showing only a lead-in such as \"Let me check that file.\" with no notice when the model tried to use a tool (anthropics/claude-code#90314)", "中文内容": "修复了仅显示导入内容的`/btw`，例如“让我检查该文件”。当模型尝试使用工具时没有任何通知（anthropics/claude-code#90314）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long `/btw` answers looking finished and ignoring PgUp, PgDn, Home, End and the mouse wheel", "中文内容": "修复了长`/btw`答案看起来已完成并忽略 PgUp、PgDn、Home、End 和鼠标滚轮的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/resume` search saying \"No sessions match\" for older sessions that exist, and a typed number opening a session instead of searching", "中文内容": "修复了`/resume`搜索对存在的较旧会话显示“没有会话匹配”的问题，以及输入数字打开会话而不是搜索的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed pressing Ctrl+R again in fullscreen prompt search not moving to the next older match", "中文内容": "修复了在全屏提示搜索中再次按 Ctrl+R 不会移至下一个旧匹配的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Tab not completing file names without a slash in shell mode (`!`), and completed paths with spaces or shell characters not being quoted", "中文内容": "修复了在 shell 模式下 Tab 无法完成没有斜线的文件名 (`!`) 的问题，以及未用引号引起来的包含空格或 shell 字符的完整路径"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a rebound `chat:submit` key doing nothing while the slash command or @ file menu was open", "中文内容": "修复了当斜杠命令或@文件菜单打开时反弹“聊天：提交”键不执行任何操作的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed holding Esc over typed text opening Rewind after the text was cleared", "中文内容": "修复了在清除文本后按住 Esc 键在键入的文本上打开“倒带”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc over typed text cancelling a pending `/loop`", "中文内容": "修复了键入文本上的 Esc 取消挂起的`/loop`的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"Esc again to clear\" staying on screen after a second Esc would no longer clear the prompt", "中文内容": "修复了第二次 Esc 后“再次 Esc 清除”停留在屏幕上将不再清除提示的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed typing landing in the wrong place in a question's note after going back to it or editing it in an external editor", "中文内容": "修复了返回问题注释或在外部编辑器中编辑问题注释后在问题注释中的错误位置输入登陆的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"paste again to expand\" hint hiding the mode and \"esc to interrupt\" after a paste was sent or deleted", "中文内容": "修复了发送或删除粘贴后“再次粘贴以展开”提示隐藏模式和“ESC 以中断”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"paste again to expand\" hiding the middle of a paste longer than 10,000 characters in fullscreen mode, and a prompt collapsing while you type past that length", "中文内容": "修复了“再次粘贴以展开”在全屏模式下隐藏超过 10,000 个字符的粘贴中间部分，以及当您输入超过该长度时提示崩溃的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the arrow keys and `q` not working in a pager that `claude --help` is piped to, as in `claude --help | less`", "中文内容": "修复了箭头键和`q`在`claude --help`通过管道传输到的寻呼机中不起作用的问题，如“claude --help |”中所示。少`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude Desktop's Code tab blaming the internet connection when a certificate's signature couldn't be verified", "中文内容": "修复了当无法验证证书签名时 Claude Desktop 的“代码”选项卡会指责互联网连接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Web Search showing nothing while its request was being retried", "中文内容": "修复了重试请求时 Web 搜索不显示任何内容的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed desktop notifications not being sent inside tmux (with `allow-passthrough` on), or to iTerm2 over SSH, on the default setting", "中文内容": "修复了在默认设置下，桌面通知未在 tmux 内发送（启用`allow-passthrough`）或通过 SSH 发送至 iTerm2 的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/copy` and `/export` saying \"copied to clipboard\" over SSH when the terminal may not have copied anything", "中文内容": "修复了当终端可能没有复制任何内容时通过 SSH 说`/copy`和`/export`“复制到剪贴板”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/usage-credits` saying \"Request sent to your admin\" when the request was refused; people who have billing access themselves are now pointed to the usage settings page", "中文内容": "修复了`/usage-credits`在请求被拒绝时显示“请求已发送至您的管理员”的问题；本身具有计费访问权限的人现在会被指向使用设置页面"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the transcript share question for Pro and Max users staying open after the next message, `/clear` or `/resume`", "中文内容": "修复了 Pro 和 Max 用户在下一条消息`/clear`或`/resume`后保持打开状态的文字记录共享问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an upgrade hint appearing under an old usage limit message after the limit had reset", "中文内容": "修复了重置限制后旧使用限制消息下出现的升级提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the effort level notice reappearing after every permission prompt or dialog, and the usage limit warning and other notices not appearing while the context warning showed", "中文内容": "修复了每次权限提示或对话框后重新出现工作量级别通知，以及在显示上下文警告时不出现使用限制警告和其他通知的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/tui default` saying it had switched back to the classic renderer when a setting kept fullscreen on; after a `/tui` that can't switch, Claude Code now says what keeps the renderer", "中文内容": "修复了`/tui default`，表示当设置保持全屏打开时它已切换回经典渲染器；在无法切换的`/tui`之后，Claude Code 现在会说明是什么保留了渲染器"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a new account's first session using a different renderer from later ones", "中文内容": "修复了新帐户的第一个会话使用与后续帐户不同的渲染器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Reduce motion and Show tips in `/config` applying only to the current folder", "中文内容": "修复了仅适用于当前文件夹的`/config`中的减少运动和显示提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed typing and spinners redrawing the whole pane in tmux 3.7", "中文内容": "修复了 tmux 3.7 中打字和旋转器重绘整个窗格的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Option+T typing † instead of toggling thinking over SSH from iTerm2 when Option isn't set as Meta", "中文内容": "修复了 Option+T 键入 †，而不是在 Option 未设置为 Meta 时从 iTerm2 切换对 SSH 的思考"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/terminal-setup` not naming the tmux settings that Shift+Enter needs, and promising Shift+Enter in Windows Terminal before 1.25, where it sends the prompt", "中文内容": "修复了 `/terminal-setup` 未命名 Shift+Enter 所需的 tmux 设置，并承诺在 1.25 之前的 Windows 终端中使用 Shift+Enter 发送提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Program Status Protocol (OSC 7501) terminals showing a finished turn after idle compaction, or no status for background sessions opened with `claude agents`, `claude attach` or `--resume`", "中文内容": "修复了程序状态协议 (OSC 7501) 终端在空闲压缩后显示已完成的回合，或者使用“claude Agents”、“claude Attach”或`--resume`打开的后台会话没有状态的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed terminals that support the Program Status Protocol (OSC 7501) not seeing Claude Code as waiting on you while the folder trust prompt is open (anthropics/claude-code#105801)", "中文内容": "修复了支持程序状态协议 (OSC 7501) 的终端在文件夹信任提示打开时看不到 Claude Code 正在等待您的问题 (anthropics/claude-code#105801)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the terminal progress bar showing Claude as working while it waited for your answer or was suspended with Ctrl+Z, and disappearing in Ghostty after 15 seconds while Claude was still working", "中文内容": "修复了终端进度条在等待您的答复时显示 Claude 正在工作或使用 Ctrl+Z 暂停，并在 Claude 仍在工作时 15 秒后在 Ghostty 中消失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed fullscreen giving no sign that a permission prompt or question was waiting while you were scrolled up", "中文内容": "修复了全屏向上滚动时没有任何迹象表明权限提示或问题正在等待的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the fullscreen tool group headline naming a finished or queued call instead of the running one", "中文内容": "修复了全屏工具组标题命名已完成或排队的呼叫而不是正在运行的呼叫"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed finished tool groups in fullscreen counting a search or listing also as a shell command, and the tool timer there counting time at a permission prompt or queued behind another command", "中文内容": "修复了全屏中已完成的工具组也将搜索或列表也作为 shell 命令进行计数，以及工具计时器在权限提示下计算时间或在另一个命令后面排队的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a multi-line shell command filling the screen in fullscreen while it runs", "中文内容": "修复了多行 shell 命令在运行时以全屏方式填充屏幕的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `!` shell commands showing no output for their first three seconds", "中文内容": "修复了`!` shell 命令在前三秒内没有显示输出的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a running command showing no output or timer when its collapsed row was clicked open in fullscreen mode", "中文内容": "修复了在全屏模式下单击打开折叠行时运行命令不显示输出或计时器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the jump-to-bottom pill disappearing in fullscreen while more of the reply was still below", "中文内容": "修复了跳至底部药丸在全屏下消失而更多回复仍在下方的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the prompt disappearing in short fullscreen windows while a survey or notice showed above it", "中文内容": "修复了提示在短全屏窗口中消失而上方显示调查或通知的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the custom status line disappearing and the screen jumping on Ctrl+C, in `!` shell mode and while pasting an image", "中文内容": "修复了在 `!` shell 模式下以及粘贴图像时自定义状态行消失和按 Ctrl+C 时屏幕跳转的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a custom status line keeping its old width, folder and session name after a terminal resize, `/cd` or `/rename` (anthropics/claude-code#107291)", "中文内容": "修复了自定义状态行在终端调整大小、`/cd`或`/rename`后保留其旧宽度、文件夹和会话名称的问题 (anthropics/claude-code#107291)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"esc to interrupt\" missing beside a custom status line and showing while Esc would go to a panel or footer item", "中文内容": "修复了自定义状态行旁边缺少“ESC 中断”并在 Esc 转到面板或页脚项目时显示的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed mouse escape codes being typed into the shell after exiting fullscreen mode", "中文内容": "修复了退出全屏模式后在 shell 中键入鼠标转义代码的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+Z message printing over the prompt box outside fullscreen", "中文内容": "修复了全屏之外的提示框上打印 Ctrl+Z 消息的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude logs` painting over and mixing with what was already in the terminal", "中文内容": "修复了“克劳德日志”的绘制并与终端中已有的内容混合"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the spinner tip flashing back and the screen bouncing as a reply finished", "中文内容": "修复了回复完成时旋转器尖端闪烁和屏幕弹跳的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"Reading 1 file…\" line blinking out and the prompt jumping when a tool call finished streaming", "中文内容": "修复了工具调用完成流式传输时“正在读取 1 个文件...”行闪烁和提示跳转的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `claude --resume` session preview being garbled and not scrolling in fullscreen mode", "中文内容": "修复了`claude --resume`会话预览出现乱码并且在全屏模式下不滚动的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc not leaving the \"Connect to your IDE automatically?\" question in `/ide`, where Ctrl+C twice quit Claude Code", "中文内容": "修复了 Esc 未离开“自动连接到您的 IDE？”的问题`/ide` 中的问题，其中 Ctrl+C 两次退出 Claude Code"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed first-run terminal setup saying nothing about what it changed or could not set up", "中文内容": "修复了首次运行终端设置未说明其更改或无法设置的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/status` showing installation warnings twice", "中文内容": "修复了`/status`显示安装警告两次的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the footer's PR badge showing the previous branch's pull request after switching branches", "中文内容": "修复了页脚的 PR 徽章在切换分支后显示上一个分支的拉取请求的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"Pushed to\" summary naming the fetched branch when a command fetched or pulled first, and \"Merged PR\" or \"Closed PR\" showing when `gh` refused the action and the exit code was hidden", "中文内容": "修复了当首先提取或拉取命令时命名提取分支的“推送到”摘要，以及当`gh`拒绝操作且隐藏退出代码时显示的“合并 PR”或“关闭 PR”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed URLs that wrap over several lines not being clickable in terminals with link support that Claude Code doesn't recognize, and labeled links in the Rex terminal", "中文内容": "修复了在具有 Claude Code 无法识别的链接支持的终端中无法单击的多行换行 URL，以及 Rex 终端中的标记链接"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+O transcript hinting Ctrl+B to background a command in fullscreen, where it pages up, and showing no sign that Claude is still working", "中文内容": "修复了 Ctrl+O 脚本提示 Ctrl+B 在全屏中将命令设置为背景的问题，该命令会向上翻页，并且没有显示克劳德仍在工作的迹象"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+R search, the model picker, plan approval, question previews, background shell output and `/plugin` install choices being cut off in short fullscreen windows", "中文内容": "修复了 Ctrl+R 搜索、模型选择器、计划批准、问题预览、后台 shell 输出和`/plugin`安装选项在短全屏窗口中被切断的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/context` grid, API errors such as \"Credit balance too low\", \"Waiting for API response\" and retry notices, \"esc to interrupt\" and \"Interrupted\" being cut off or jumbled in narrow terminals", "中文内容": "修复了 `/context` 网格、API 错误，例如“信用余额过低”、“等待 API 响应”和重试通知、“esc 中断”和“中断”在狭窄终端中被切断或混乱"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed wide tables breaking apart in plans and subagent prompts, cutting short words in half beside a long cell, and showing stray words and blank rows when drawn as label and value lists", "中文内容": "修复了宽表在计划和子代理提示中分开、将长单元格旁边的短单词切成两半以及在绘制为标签和值列表时显示杂散单词和空白行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed code keywords, added diff lines, the slow-reply spinner and \"thinking\" being hard to read in some themes and terminals", "中文内容": "修复了代码关键字、添加了差异行、缓慢回复的旋转器以及在某些主题和终端中难以阅读的“思考”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed code in diffs and file previews being invisible when the theme and the terminal background differ", "中文内容": "修复了主题和终端背景不同时差异和文件预览中的代码不可见的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the unused part of `/usage` bars looking full in the light and ANSI themes", "中文内容": "修复了`/usage`栏未使用的部分在灯光和 ANSI 主题中看起来很完整的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/effort` slider ignoring mouse clicks in fullscreen mode", "中文内容": "修复了`/effort`滑块在全屏模式下忽略鼠标点击的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed text being drawn out of place after skin-tone or joined emoji, symbols such as ✌ and ☝, and Hindi, Tamil and other Indic vowel signs in terminals that draw them wider", "中文内容": "修复了终端中的肤色或连接表情符号、✌和☝等符号以及印地语、泰米尔语和其他印度语元音符号后绘制不正确的文本，这些符号将它们拉得更宽"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed joined emoji pushing rows out of place in GNU screen", "中文内容": "修复了连接的表情符号在 GNU 屏幕中将行推错位的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the last item of JSON lists and right-aligned numbers losing their indent in command and tool output", "中文内容": "修复了 JSON 列表的最后一项和右对齐数字在命令和工具输出中丢失缩进的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed diffs numbering \"No newline at end of file\" as a line of code, which shifted the line numbers after it", "中文内容": "修复了将“文件末尾无换行符”编号为代码行的差异编号，这会移动其后的行号"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long single-line messages showing \"(0 lines hidden)\" instead of how much text is hidden", "中文内容": "修复了长单行消息显示“（隐藏 0 行）”而不是隐藏了多少文本的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed notebook edits showing no tool row when Claude left out the cell type or deleted a cell, and showing `@undefined` when inserting a cell at the top", "中文内容": "修复了当克劳德遗漏单元格类型或删除单元格时笔记本编辑不显示工具行，以及在顶部插入单元格时显示`@undefined`的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"Switch model?\" and \"Change effort level?\" questions showing no key hints", "中文内容": "修复了“切换型号？”和“改变努力水平？”没有显示关键提示的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `?` shortcuts list running its columns together in narrow terminals and being cut off at the bottom in short fullscreen windows", "中文内容": "修复了`?`快捷方式列表在狭窄的终端中一起运行其列并在短的全屏窗口中在底部被切断的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed leftover hint text in screen reader mode on macOS and Linux after closing the `/permissions` search when the rule list was taller than the terminal", "中文内容": "修复了当规则列表高于终端时关闭`/permissions`搜索后 macOS 和 Linux 上屏幕阅读器模式下的剩余提示文本"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Bash permission checks: some commands now ask first, or are refused where no one can answer", "中文内容": "改进了 Bash 权限检查：某些命令现在首先询问，或者在无人回答的情况下被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved permission checks in Code Mode; more sandboxed commands now ask or are refused", "中文内容": "改进了代码模式中的权限检查；更多沙盒命令现在询问或被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the messages shown when Code Mode can't be turned on, so they say what you can do", "中文内容": "改进了代码模式无法打开时显示的消息，以便它们告诉您可以做什么"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Bash sandbox protections on macOS, Linux and WSL", "中文内容": "改进了 macOS、Linux 和 WSL 上的 Bash 沙箱保护"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed edits in a session's mods folder to ask more often, and sandboxed commands to write to fewer folders; if every edit asks, remove any link there to an unreadable or network path", "中文内容": "更改了会话 mods 文件夹中的编辑以更频繁地询问，并沙盒命令以写入更少的文件夹；如果每次编辑都要求，请删除指向不可读或网络路径的任何链接"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Claude's sandbox instructions on Linux to explain that a server is reachable only from the command that started it", "中文内容": "改进了 Linux 上的克劳德沙箱指令，以解释服务器只能通过启动它的命令访问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved how secrets are masked in push notifications from Remote Control and cloud sessions", "中文内容": "改进了远程控制和云会话的推送通知中隐藏秘密的方式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/logout` and `claude auth logout` in the terminal to retry revoking the login, and to say where to revoke it if the server doesn't confirm", "中文内容": "改进了终端中的`/logout`和`claude auth logout`，以重试撤销登录，并说明如果服务器未确认，在哪里撤销登录"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Remote Control: replies from `claude remote-control`, Claude Desktop and VS Code sessions now stream to your phone or browser as they are written", "中文内容": "改进的远程控制：来自“claude 远程控制”、Claude 桌面和 VS Code 会话的回复现在会在写入时流式传输到您的手机或浏览器"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved typing, streaming and resize responsiveness, especially in long sessions", "中文内容": "改进了打字、流媒体和调整大小的响应能力，尤其是在长时间会话中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved response time after reading or editing files, most noticeably on Windows", "中文内容": "改进了读取或编辑文件后的响应时间，尤其是在 Windows 上"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved idle CPU use: an idle session now wakes the machine less often", "中文内容": "改进了空闲 CPU 使用情况：空闲会话现在唤醒机器的频率降低了"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved CPU use when more than 20 subagents are running: token counts of background agents whose transcript isn't open now update every 5 seconds", "中文内容": "当超过 20 个子代理运行时，改进了 CPU 使用率：未打开脚本的后台代理的令牌计数现在每 5 秒更新一次"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Windows: Improved the speed of a session's first Bash command by about a second", "中文内容": "Windows：将会话第一个 Bash 命令的速度提高了约一秒"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved response time of the first message after `/compact` in git repositories", "中文内容": "改进了 git 存储库中`/compact`之后第一条消息的响应时间"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved response time in Claude Desktop for messages queued while Claude finishes a reply", "中文内容": "改进了 Claude Desktop 中 Claude 完成回复时排队消息的响应时间"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved time to first response in Claude Desktop's new sessions: the first turn no longer waits up to 500 ms for local MCP servers whose tools load on demand", "中文内容": "改进了 Claude Desktop 新会话中的首次响应时间：对于按需加载工具的本地 MCP 服务器，首次响应不再等待长达 500 毫秒"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved how a PreToolUse hook's `updatedInput` is kept when more than one hook answers a tool call; the rewrite now runs in more cases", "中文内容": "改进了当多个钩子应答工具调用时 PreToolUse 钩子的`updatedInput`的保留方式；重写现在在更多情况下运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the error when a PreToolUse hook exits 127, saying its check may not have run", "中文内容": "改进了 PreToolUse 挂钩退出时的错误 127，表示其检查可能未运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved hook failures, blocks and timeouts in the transcript: failures are now red instead of grey, a hook that stops Claude is yellow, and the reason is shown under them", "中文内容": "改进了记录中的钩子失败、阻塞和超时：失败现在是红色而不是灰色，阻止克劳德的钩子是黄色的，原因显示在它们下面"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the folder trust prompt, at launch and in `/cd`, to name the project settings files Claude Code will load; at launch it also marks files that run commands", "中文内容": "改进了启动时和`/cd`中的文件夹信任提示，以命名 Claude Code 将加载的项目设置文件；在启动时它还标记运行命令的文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the folder trust prompt to say why Claude Code exited", "中文内容": "改进了文件夹信任提示，说明 Claude Code 退出的原因"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the message in non-interactive runs and background agents when a permission check fails with an error, so it names the cause", "中文内容": "改进了权限检查因错误而失败时非交互式运行和后台代理中的消息，因此它指出了原因"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Claude in Chrome permission requests from a terminal session over Remote Control: on claude.ai they now name the site Claude wants to act on, also when it is already allowed", "中文内容": "改进了 Chrome 中通过远程控制从终端会话发出的 Claude 权限请求：在 claude.ai 上，他们现在将 Claude 想要操作的网站命名为 Claude 想要操作的网站，即使该网站已被允许"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved MCP tool errors in cloud sessions: when a call through the session's proxy is cut off after it was sent, Claude is told that the outcome is unknown", "中文内容": "改进了云会话中的 MCP 工具错误：当通过会话代理的呼叫发送后被切断时，Claude 被告知结果未知"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/update-config` in the terminal to use about 13,000 tokens of context instead of 93,000, and a rejected settings edit to quote only the changed settings", "中文内容": "改进了终端中的`/update-config`，使用大约 13,000 个上下文标记而不是 93,000 个，并且拒绝设置编辑以仅引用更改的设置"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Program Status Protocol (OSC 7501) reports: background commands, monitors and MCP tasks are listed, and a session waiting on them shows as working instead of done", "中文内容": "改进的程序状态协议 (OSC 7501) 报告：列出后台命令、监视器和 MCP 任务，等待它们的会话显示为正在运行而不是已完成"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Monitor: when a watch expires with no events and its command wrote to stderr, Claude is now told so and told which file holds the output", "中文内容": "改进的监视器：当监视到期且没有事件且其命令写入 stderr 时，Claude 现在会被告知并被告知哪个文件保存输出"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Claude in Chrome: a long `browser_batch` call now has 150 seconds to answer, up from 90, so fewer finished results are lost", "中文内容": "Chrome 中的 Claude 改进：长的`browser_batch`调用现在有 150 秒的时间来应答，从 90 秒增加到这样，因此丢失的最终结果更少"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/doctor` to share findings as it works instead of staying silent until the full report", "中文内容": "改进了`/doctor`，以便在工作时分享发现，而不是在完整报告发布之前保持沉默"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the error for a settings or `.mcp.json` file with broken JSON: it now gives the line and column", "中文内容": "改进了 JSON 损坏的设置或`.mcp.json`文件的错误：它现在提供行和列"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved commands that are off for your provider, sign-in or an environment variable such as `DISABLE_TELEMETRY` to say why instead of \"Unknown command\"", "中文内容": "改进了对您的提供商、登录或环境变量（例如`DISABLE_TELEMETRY`）关闭的命令，以说明原因而不是“未知命令”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the `CERT_SIGNATURE_FAILURE` connection error to name a possible cause after a CA renewal and what IT can change", "中文内容": "改进了`CERT_SIGNATURE_FAILURE`连接错误，以指出 CA 续订后可能的原因以及 IT 可以更改的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the message shown when a team's pooled group budget is used up: it now says when the budget resets", "中文内容": "改进了团队的集体预算用完时显示的消息：现在显示预算何时重置"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the error shown when the API refuses a Console sign-in: it now says to run `/login` instead of pointing to an admin setting", "中文内容": "改进了 API 拒绝控制台登录时显示的错误：现在显示运行`/login`，而不是指向管理设置"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved sign-in prompts: pasting a verification code or a web address now says what to do instead, and the prompt stays so you can paste the right code (anthropics/claude-code#97)", "中文内容": "改进的登录提示：粘贴验证码或网址现在会说明要做什么，并且提示会保留，以便您可以粘贴正确的代码 (anthropics/claude-code#97)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the `/login` screen: the code goes in a proper text field, a rejected code says why under it, and pasting in a short window scrolls the field into view", "中文内容": "改进了`/login`屏幕：代码进入正确的文本字段，被拒绝的代码在其下方说明原因，粘贴到短窗口中会将字段滚动到视图中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/design-login`, `/install-github-app` and MCP sign-in screens to match `/login`; the first two now mask the pasted code", "中文内容": "改进了 `/design-login`、`/install-github-app` 和 MCP 登录屏幕以匹配 `/login`；前两个现在掩盖了粘贴的代码"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the Claude apps gateway sign-in screens: the sign-in address is a link and `c` copies it", "中文内容": "改进了 Claude apps 网关登录屏幕：登录地址是一个链接，`c`复制它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Discover and marketplace lists: they fit short windows with the cursor and key hints on screen, and Home, End, PgUp, PgDn, the mouse wheel and clicks now work", "中文内容": "改进的`/plugin`发现和市场列表：它们适合短窗口，屏幕上有光标和按键提示，Home、End、PgUp、PgDn、鼠标滚轮和点击现在可以使用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Marketplaces and Add marketplace: a compact list, a clearer remove confirmation, a clear text field and shorter errors when adding fails", "中文内容": "改进了`/plugin`市场和添加市场：紧凑的列表、更清晰的删除确认、清晰的文本字段以及添加失败时更短的错误"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Installed tab: Home, End, PgUp, PgDn and clicks now work, and hidden rows are counted", "中文内容": "改进的`/plugin`已安装选项卡：Home、End、PgUp、PgDn 和点击现在可以使用，并且隐藏行会被计数"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Errors and Stats tabs: long errors no longer fill the screen, uninstalling from an error asks first, and long skill names no longer break the table", "中文内容": "改进了`/plugin`错误和统计选项卡：长错误不再填满屏幕，首先从错误中卸载，长技能名称不再破坏表格"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `claude plugin`, `mcp`, `update`, `doctor` and `auth logout` output on a terminal to mark success, failure and warnings the same way (piped output keeps its old form)", "中文内容": "改进了终端上的`claude plugin`、`mcp`、`update`、`doctor`和`auth logout`输出，以相同的方式标记成功、失败和警告（管道输出保持其旧形式）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved wording across the terminal: `/plugin`, `/mcp`, sign-in, setup, settings, the agent view, `/teleport`, Remote Control, update messages, spinner tips, `/powerup` and `claude --help`", "中文内容": "改进了整个终端的措辞：`/plugin`、`/mcp`、登录、设置、设置、代理视图、`/teleport`、远程控制、更新消息、旋转提示、`/powerup`和`claude --help`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved key hints in many dialogs and the `?` lists: they show the keys that work, in one order and wording, and fit narrow windows; deeper screens in `/hooks` and `/permissions` say Esc goes back", "中文内容": "改进了许多对话框和“？”列表中的按键提示：它们以一种顺序和措辞显示可用的按键，并且适合狭窄的窗口； `/hooks`和`/permissions`中更深的屏幕显示 Esc 返回"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved text fields in `/add-dir`, `/export`, `/permissions`, `/feedback`, `/install-github-app` and Bedrock and Vertex setup: one look, long text wraps, and a refused value can be corrected in place", "中文内容": "改进了`/add-dir`、`/export`、`/permissions`、`/feedback`、`/install-github-app`以及 Bedrock 和 Vertex 设置中的文本字段：一看、长文本换行以及可以就地纠正拒绝值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved dialogs, panels and the transcript: errors, warnings and confirmations in many dialogs start with ✘, ⚠ or ✔, and loading lines, status rows, counts and durations look and read more alike", "中文内容": "改进的对话框、面板和文字记录：许多对话框中的错误、警告和确认以 ✘、⚠ 或 ✔ 开头，加载行、状态行、计数和持续时间看起来和读起来更加相似"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved long menus such as `/permissions`, `/resume` and `/model` to say how many rows are above and below, and the `/` and `@` menus to count hidden rows outside fullscreen and screen reader mode", "中文内容": "改进了长菜单，例如`/permissions`、`/resume`和`/model`，用于说明上方和下方有多少行，以及`/`和`@`菜单，用于计算全屏和屏幕阅读器模式之外的隐藏行数"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved list navigation: more lists wrap at both ends, checkbox lists in slash commands take Home and End, and `/permissions` says when a search finds nothing", "中文内容": "改进的列表导航：更多列表在两端换行，斜杠命令中的复选框列表采用 Home 和 End，当搜索找不到任何内容时，`/permissions`会显示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the pickers in agent view to take Home, End and paging", "中文内容": "改进了座席视图中的选择器以获取 Home、End 和寻呼"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved agent view and the agent rows under the prompt to mark the selected row with the same pointer and color as other lists", "中文内容": "改进了座席视图和提示下的座席行，以与其他列表相同的指针和颜色标记所选行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the footer after Ctrl+C stops background agents: it now offers `↓ to resume subagent` while a stopped subagent is listed", "中文内容": "改进了 Ctrl+C 停止后台代理后的页脚：现在在列出已停止的子代理时提供“↓ 恢复子代理”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved fullscreen mode: the prompt's borders now show how many lines of a long prompt are out of view", "中文内容": "改进的全屏模式：提示的边框现在显示长提示中有多少行在视图之外"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/autocompact` and `/scroll-speed` with a slider that shows every value, takes Home, End and (in fullscreen) clicks, and fits narrow terminals", "中文内容": "改进了`/autocompact`和`/scroll-speed`，带有滑块，可显示每个值，进行 Home、End 和（全屏）点击，并适合窄终端"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved on/off settings to read `on` / `off` in `/config`, `/memory` and auto mode setup", "中文内容": "改进了开/关设置，以读取`/config`、`/memory`和自动模式设置中的`on`/`off`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the send-now hint under queued messages: it now says \"Queued\" and no longer looks like part of your message", "中文内容": "改进了排队消息下的立即发送提示：它现在显示“已排队”，并且不再看起来像消息的一部分"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved terminal setup to list every change before making it", "中文内容": "改进了终端设置，可在进行更改之前列出所有更改"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved alignment and spacing in `/btw`, `/help`, `/scroll-speed`, the settings error dialog and dialogs that suggest a plugin or setting", "中文内容": "改进了`/btw`、`/help`、`/scroll-speed`中的对齐和间距、设置错误对话框以及建议插件或设置的对话框"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed terminal and VS Code sessions in organizations with the Claude Code + Cowork HIPAA configuration to start in auto mode by default; `disableAutoMode` turns it off", "中文内容": "将具有 Claude Code + Cowork HIPAA 配置的组织中的终端和 VS Code 会话更改为默认以自动模式启动； `disableAutoMode` 将其关闭"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed terminal and VS Code sessions with no mode set to start in auto mode, not Manual mode, when your organization's policy hasn't loaded", "中文内容": "当组织的策略尚未加载时，将没有模式设置的终端和 VS Code 会话更改为以自动模式启动，而不是手动模式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed a `managed-mcp.json` added mid-session so it may apply at the next check; restart open sessions for it to apply in full", "中文内容": "更改了在会话中添加的“management-mcp.json”，以便它可以在下一次检查时应用；重新启动开放会话以使其完全应用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Code Mode's `$` shell helper to refuse some values with an error; nothing runs", "中文内容": "更改了代码模式的 `$` shell 帮助程序以拒绝某些带有错误的值；没有运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode to stop some shell commands that ran before", "中文内容": "更改了自动模式以停止之前运行的一些 shell 命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some Bash commands on macOS that ran before to ask or be refused", "中文内容": "更改了 macOS 上之前运行的一些 Bash 命令来询问或被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed a hook's `\"decision\": \"block\"` to hold in more cases, so a hook that always prints one may start blocking calls", "中文内容": "更改了挂钩的“决定”：“阻止”以在更多情况下保持不变，因此始终打印一个的挂钩可能会开始阻止调用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed sessions that start in auto by default to take a server-managed `defaultMode` once settings load, or Manual if settings fail with no stored copy and policy fails or requires it", "中文内容": "更改了默认情况下自动启动的会话，以在加载设置后采用服务器管理的`defaultMode`，或者如果设置失败且没有存储副本并且策略失败或需要它，则更改为手动"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode for organizations with the Claude Code + Cowork HIPAA configuration: on a direct Anthropic API connection, the server-side classifier now checks actions, as for other organizations", "中文内容": "更改了具有 Claude Code + Cowork HIPAA 配置的组织的自动模式：在直接 Anthropic API 连接上，服务器端分类器现在检查操作，与其他组织一样"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox to keep its state in some cases during a session, until you run `/sandbox` or `/cd`; Bash may ask first", "中文内容": "更改了 Bash 沙箱以在会话期间的某些情况下保持其状态，直到您运行`/sandbox`或`/cd`； Bash 可能会先询问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed sandboxed commands on macOS, Linux and WSL to no longer write to some sensitive home folders by default; some can be allowed with `sandbox.filesystem.allowWrite` in user or managed settings", "中文内容": "更改了 macOS、Linux 和 WSL 上的沙盒命令，默认情况下不再写入某些敏感的主文件夹；有些可以通过用户或托管设置中的`sandbox.filesystem.allowWrite`来允许"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox to set aside unexpected entries in a repository's `.git` folder after a command", "中文内容": "更改了 Bash 沙箱，以在执行命令后在存储库的`.git`文件夹中保留意外条目"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox on Linux and WSL to create some missing `--add-dir` folders before each sandboxed command, so commands that create them can fail, skip, or land inside them", "中文内容": "更改了 Linux 和 WSL 上的 Bash 沙箱，在每个沙箱命令之前创建一些缺失的`--add-dir`文件夹，因此创建它们的命令可能会失败、跳过或落在其中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed commands that a permission hook or SDK host rewrites while approving to stay in the sandbox if the original was checked as sandboxed; the approver can add `dangerouslyDisableSandbox: true`", "中文内容": "更改了权限挂钩或 SDK 主机重写的命令，同时批准保留在沙箱中（如果原始文件被检查为沙箱）；审批者可以添加 `dangerouslyDisableSandbox: true`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `claude mcp serve` to ignore `sandbox.excludedCommands`", "中文内容": "更改了“claude mcpserve”以忽略`sandbox.excludedCommands`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `/rewind` on macOS, Linux and WSL to leave some files untouched and report them as skipped when the sandbox is on", "中文内容": "更改了 macOS、Linux 和 WSL 上的`/rewind`，以保持某些文件不变，并在沙盒打开时将其报告为已跳过"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox to ask before some lines that set environment variables when auto-allow is off; unattended runs can refuse them", "中文内容": "更改了 Bash 沙箱，以在自动允许关闭时设置环境变量的某些行之前进行询问；无人值守运行可以拒绝它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Claude's file tools to refuse writes to Claude Code's sign-in files, such as `.credentials.json`", "中文内容": "更改了 Claude 的文件工具以拒绝写入 Claude Code 的登录文件，例如`.credentials.json`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash permission check to ask before more commands reach Claude Code's sign-in files", "中文内容": "更改了 Bash 权限检查，以在更多命令到达 Claude Code 的登录文件之前进行询问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some file tools to refuse some device and process files", "中文内容": "更改了一些文件工具以拒绝某些设备和进程文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some `cp` and `mv` commands to ask first", "中文内容": "更改了一些`cp`和`mv`命令以首先询问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some tool calls in bypass permissions mode to ask for approval, or be denied where no one can be asked", "中文内容": "更改了绕过权限模式下的一些工具调用以请求批准，或者在无人可以请求的情况下被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash permission check to ask about some commands with very long values it can't finish checking, or to refuse them where a deny rule may apply or no one can answer", "中文内容": "更改了 Bash 权限检查，以询问一些无法完成检查的具有很长值的命令，或者在可能适用拒绝规则或无人回答的情况下拒绝它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed subagents isolated in a worktree to refuse, in any repository, some git commands in Bash that can rewrite branches shared with your checkout; sessions are not affected", "中文内容": "更改了工作树中隔离的子代理，以拒绝任何存储库中的 Bash 中的某些 git 命令，这些命令可以重写与结帐共享的分支；会话不受影响"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `ExitWorktree` to refuse removing a worktree while a background subagent or shell command may still be running in it, unless Claude passes `discard_changes`", "中文内容": "更改了 `ExitWorktree` 以拒绝删除工作树，同时后台子代理或 shell 命令可能仍在其中运行，除非 Claude 通过 `discard_changes`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the computer use macOS permissions panel to ignore j and k; the arrow keys and Ctrl+P/Ctrl+N still move the selection", "中文内容": "更改了计算机使用 macOS 权限面板以忽略 j 和 k；箭头键和 Ctrl+P/Ctrl+N 仍会移动所选内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the PowerShell tool to ask before some more commands; unattended runs refuse them unless an allow rule, auto mode or bypass permissions mode allows them", "中文内容": "更改了 PowerShell 工具，以在更多命令之前询问；无人值守运行会拒绝它们，除非允许规则、自动模式或绕过权限模式允许它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the PowerShell tool to ask about some more commands, even in bypass permissions mode, and to refuse some of them", "中文内容": "更改了 PowerShell 工具，以询问更多命令（即使在绕过权限模式下），并拒绝其中一些命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some malformed PowerShell commands to be denied", "中文内容": "更改了拒绝某些格式错误的 PowerShell 命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some PowerShell tool commands that define a function named like a built-in command to be refused, so Claude can rename it", "中文内容": "更改了一些 PowerShell 工具命令，这些命令定义的函数名称类似于要拒绝的内置命令，以便 Claude 可以重命名它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode to ignore some wildcard shell allow rules, such as ones that name no program or that start with `$HOME`, so the safety check decides those commands", "中文内容": "更改了自动模式以忽略某些通配符 shell 允许规则，例如未命名任何程序或以`$HOME`开头的规则，因此安全检查会决定这些命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode to judge wildcard allow rules whose program is a Windows backslash path, so those calls can be blocked; exact rules keep their allow; we plan to restore rules that start with `.\\`", "中文内容": "更改了自动模式来判断程序是Windows反斜杠路径的通配符允许规则，因此可以阻止这些调用；确切的规则保持其允许；我们计划恢复以`.\\`开头的规则"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed a managed `autoMode.environment` list without `\"$defaults\"` to replace every built-in entry in Claude Desktop and Agent SDK apps too; add `\"$defaults\"` or copy the sensitive-target ones", "中文内容": "更改了不带“$defaults”的托管`autoMode.environment`列表，以替换 Claude Desktop 和 Agent SDK 应用程序中的每个内置条目；添加“$defaults”或复制敏感目标"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `--add-dir` and `/add-dir` in local terminal sessions to show the trust prompt for a folder you have not trusted yet; `claude --bg` refuses such a folder", "中文内容": "更改了本地终端会话中的 `--add-dir` 和 `/add-dir` 以显示您尚未信任的文件夹的信任提示； `claude --bg` 拒绝这样的文件夹"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed self-hosted runners under `--trust-workspace false` to ignore more repository settings; set such values in user or managed settings", "中文内容": "更改了`--trust-workspace false`下的自托管运行器以忽略更多存储库设置；在用户或托管设置中设置此类值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed how permission answers over Remote Control and on self-hosted runners save \"always allow\" choices", "中文内容": "更改了通过远程控制和自托管运行器保存“始终允许”选项的权限应答方式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed enabled plugins that were refused for a malformed `plugin.json` display field: they now load, with their hooks and MCP servers; administrators should check the plugins they deploy", "中文内容": "更改了因格式错误的`plugin.json`显示字段而被拒绝的已启用插件：它们现在使用其挂钩和 MCP 服务器加载；管理员应该检查他们部署的插件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed how `allowedHttpHookUrls` and `httpHookAllowedEnvVars` apply to hooks from managed settings", "中文内容": "更改了`allowedHttpHookUrls`和`httpHookAllowedEnvVars`如何应用于托管设置中的挂钩"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed HTTP hooks to ignore `Content-Length` and `Transfer-Encoding` in their `headers` setting; the request's length comes from its body", "中文内容": "更改了 HTTP 挂钩以忽略`headers`设置中的`Content-Length`和`Transfer-Encoding`；请求的长度来自其主体"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed plugin uninstall to also delete the files extracted from the plugin's MCP bundles (`.mcpb`, `.dxt`), unless another plugin uses the same bundle", "中文内容": "更改了插件卸载，同时删除从插件的 MCP 包（`.mcpb`、`.dxt`）中提取的文件，除非另一个插件使用相同的包"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some worktree sessions to skip some plugin settings; a notice names what was skipped", "中文内容": "更改了一些工作树会话以跳过一些插件设置；通知指出了跳过的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `/plugin` uninstall, remove and switch questions to lists answered with the arrow keys and Enter, or Esc to cancel; `y`, `n` and `u` no longer answer them", "中文内容": "更改了`/plugin`卸载、删除和切换问题至使用箭头键和 Enter 或 Esc 取消回答的列表； `y`、`n` 和 `u` 不再回答它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed automatic compaction in plan mode to use the model answering you, such as Opus with `opusplan`, so it can cost more", "中文内容": "更改了计划模式下的自动压缩以使用回答您的模型，例如带有`opusplan`的 Opus，因此可能会花费更多"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Cowork cloud sessions to hold an organization's OpenTelemetry export until the first turn; a session that gets no message now sends nothing, so `claude_code.session.count` can fall", "中文内容": "更改了 Cowork 云会话以保留组织的 OpenTelemetry 导出直到第一轮；没有收到消息的会话现在不会发送任何内容，因此 `claude_code.session.count` 可能会下降"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Claude's messages to a session on another machine to be refused when your session uses an API key, auth token, profile or workload identity beside a saved claude.ai login", "中文内容": "将 Claude 的消息更改为另一台计算机上的会话，当您的会话在保存的 claude.ai 登录旁边使用 API 密钥、身份验证令牌、配置文件或工作负载身份时，该消息将被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `--bare` sessions on an unapproved API key: moving one to the background is now refused in most setups, and `claude --bare --bg` exits with an error if the background service lacks the key", "中文内容": "更改了未经批准的 API 密钥上的`--bare`会话：现在在大多数设置中都会拒绝将其移至后台，如果后台服务缺少密钥，则`claude --bare --bg`会退出并出现错误"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed \"Continue automatically at usage limit\" to stop with a notice, sending nothing, when your login changes or ends during the wait", "中文内容": "更改了“在使用限制下自动继续”，以在您的登录更改或在等待期间结束时停止并发出通知，不发送任何内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Changed how it connects through a proxy: requests now use a CONNECT tunnel, so a proxy that refuses CONNECT stops Remote Control with an error", "中文内容": "远程控制：更改了通过代理连接的方式：请求现在使用 CONNECT 隧道，因此拒绝 CONNECT 的代理会停止远程控制并出现错误"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Changed the session debug logs written under `--verbose` to go to `~/.claude/child-logs/`", "中文内容": "远程控制：将`--verbose`下写入的会话调试日志更改为`~/.claude/child-logs/`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Self-hosted runner: Changed Linux and macOS sessions with no `gh` to get a built-in `gh api` by default, via Anthropic, which adds their GitHub sign-in, if any; `--use-anthropic-gh false` turns it off", "中文内容": "自托管运行器：更改了没有`gh`的 Linux 和 macOS 会话，默认情况下通过 Anthropic 获取内置`gh api`，这会添加 GitHub 登录（如果有）； `--use-anthropic-gh false` 将其关闭"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed agent view so that quitting with Ctrl+C twice, Ctrl+D twice or `/exit` after pressing `←` in an empty conversation ends that session, instead of leaving it running for 5 minutes", "中文内容": "更改了代理视图，以便在空对话中按 Ctrl+C 两次、Ctrl+D 两次或按`←`后按`/exit`退出会结束该会话，而不是让它运行 5 分钟"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `--await-initialize` to be refused with `--bg` or `--worktree --tmux`, which never read the initialize request, instead of starting without the fields it carries", "中文内容": "将`--await-initialize`更改为用`--bg`或`--worktree --tmux`拒绝，它们从不读取初始化请求，而不是在没有其携带的字段的情况下启动"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed worktree creation, `/teleport` and IDE checkouts to run git with a stricter `PATH`; a git filter or helper may need its full path", "中文内容": "更改了工作树创建、`/teleport`和 IDE 签出，以使用更严格的`PATH`运行 git； git 过滤器或助手可能需要其完整路径"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the card for approving a subagent's plan to two choices, \"Yes, and switch to default (ask each time) for this session\" and \"No\", chosen with the arrow keys and Enter (typed text moves to No)", "中文内容": "将用于批准子代理计划的卡更改为两个选项，“是，并切换到此会话的默认值（每次询问）”和“否”，使用箭头键和 Enter 选择（键入的文本移至“否”）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the `/claude-api` skill to build agents on Managed Agents by default, unless you want to host the agent loop yourself", "中文内容": "更改了`/claude-api`技能以默认在托管代理上构建代理，除非您想自己托管代理循环"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `/usage` in fullscreen mode to show plan limit bars before session cost for subscribers; `/cost` still starts with cost", "中文内容": "更改了全屏模式下的`/usage`，以在订阅者的会话费用之前显示计划限制栏； `/cost` 仍然以 cost 开头"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the wording of some messages that `claude` subcommands print; JSON output is unchanged", "中文内容": "更改了`claude`子命令打印的一些消息的措辞； JSON 输出不变"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed first-run setup to preselect the \"Auto (match terminal)\" theme instead of Dark mode", "中文内容": "更改了首次运行设置以预先选择“自动（匹配终端）”主题而不是黑暗模式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed fullscreen `/cd` to refuse \"Yes\" while its trust prompt doesn't fit, with a line saying to make the window taller", "中文内容": "更改全屏`/cd`以拒绝“是”，而其信任提示不适合，其中一行表示使窗口更高"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "移除", "内容": "Removed the tmux notice that said the mouse wheel needs `set -g mouse on` in fullscreen; the wheel scrolls without it", "中文内容": "删除了 tmux 提示，全屏时鼠标滚轮需要 `set -g mouse on`；没有它滚轮就会滚动"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "移除", "内容": "Removed the spinner tip that suggested `/clear` 30 minutes into a running turn", "中文内容": "删除了在运行转弯 30 分钟后建议`/clear`的旋转提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Added a `claudeCode.promptSuggestions` setting that turns prompt suggestions off", "中文内容": "[VSCode] 添加了`claudeCode.promptSuggestions`设置，可关闭提示建议"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed \"Rewind code to here\" in a forked conversation sometimes undoing one turn too many and deleting files created in that turn", "中文内容": "[VSCode] 修复了分叉对话中的“将代码倒回此处”有时会撤消一轮过多并删除该轮中创建的文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the Sandbox dialog creating empty files and folders in the home directory and the project's `.git` folder while the sandbox is off", "中文内容": "[VSCode] 修复了沙箱关闭时沙箱对话框在主目录和项目的`.git`文件夹中创建空文件和文件夹的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the saved sign-in being lost on some networks", "中文内容": "[VSCode] 修复了保存的登录在某些网络上丢失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed sign-in ending when a verification code, a web address or a code from another sign-in attempt is pasted; the panel now says what to paste instead", "中文内容": "[VSCode] 修复了粘贴验证码、网址或其他登录尝试的代码时登录结束的问题；面板现在显示要粘贴的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the sign-in screen showing briefly each time a panel or window opened while signed in to Console without an API key", "中文内容": "[VSCode] 修复了在没有 API 密钥的情况下登录控制台时每次打开面板或窗口时短暂显示的登录屏幕"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the usage-limit banner's \"Request more\" button for Team and Enterprise members coming back after each press without sending anything, after you signed in again during a session", "中文内容": "[VSCode] 修复了使用限制横幅的“请求更多”按钮，以便团队和企业成员在会话期间再次登录后每次按下后返回而不发送任何内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed `/ide` in a second Claude Code session silently losing the editor connection back to the first session; the newest connection now wins and the displaced session shows how to switch back", "中文内容": "[VSCode] 修复了第二个 Claude Code 会话中的 `/ide` 默默地失去了与第一个会话的编辑器连接；现在最新的连接获胜，替换的会话显示如何切换回来"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed saved memories not being listed in the Memory dialog, or RAM use growing without end, when the memory folder held symlink loops, and a hang when it held a named pipe", "中文内容": "[VSCode] 修复了当内存文件夹持有符号链接循环时，保存的内存未在“内存”对话框中列出，或者 RAM 使用量无休止地增长，以及当它持有命名管道时挂起的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed a running command's live output stopping after one failed read", "中文内容": "[VSCode] 修复了正在运行的命令的实时输出在一次读取失败后停止的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed \"Open in Terminal\" showing only the shell's error when `claude` could not be started: in bash, zsh, fish and Git Bash, a notice now explains why and links to the install guide", "中文内容": "[VSCode] 修复了“在终端中打开”在无法启动 `claude` 时仅显示 shell 的错误：在 bash、zsh、fish 和 Git Bash 中，现在有一条通知解释了原因并链接到安装指南"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the panel showing no \"Open artifact\" link after Claude publishes an artifact", "中文内容": "[VSCode] 修复了 Claude 发布工件后面板不显示“打开工件”链接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the prompt suggestion hiding the \"attach selected text\" hint while the chat panel is unfocused", "中文内容": "[VSCode] 修复了聊天面板未聚焦时隐藏“附加所选文本”提示的提示建议"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed buttons with no visible border in the high-contrast themes, and the dark welcome art on the sign-in screen in Light High Contrast", "中文内容": "[VSCode] 修复了高对比度主题中没有可见边框的按钮以及浅高对比度登录屏幕上的深色欢迎艺术"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Improved Edit and Write speed: no wait for new problems on files that are not open in a tab when the editor has been reporting none for such files", "中文内容": "[VSCode] 改进的编辑和写入速度：当编辑器未报告未在选项卡中打开的文件时，无需等待此类文件出现新问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Changed a running command's live output in the chat to look like the command card's OUT row", "中文内容": "[VSCode] 更改了聊天中正在运行的命令的实时输出，使其看起来像命令卡的 OUT 行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Changed the text of extension errors in event listeners, views and activation to stay out of the editor's own error telemetry", "中文内容": "[VSCode] 更改了事件侦听器、视图和激活中的扩展错误文本，以远离编辑器自己的错误遥测"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a security issue in how zstd-compressed responses are decoded", "中文内容": "修复了 zstd 压缩响应解码方式的安全问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "新增", "内容": "Added a spinner tip in VS Code and similar integrated terminals about re-running a notebook cell, shown once Claude has read or edited a Jupyter notebook", "中文内容": "在 VS Code 和类似的集成终端中添加了有关重新运行笔记本单元的旋转提示，一旦 Claude 阅读或编辑了 Jupyter 笔记本就会显示"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "新增", "内容": "Added a line under the error shown when your organization's policy blocks a request, saying how to continue: run `/rewind` and change the message, or run `/clear`", "中文内容": "在您的组织的策略阻止请求时显示的错误下添加了一行，说明如何继续：运行`/rewind`并更改消息，或运行`/clear`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "新增", "内容": "Added a note for Claude when a sandboxed `git checkout`, `git stash` or autostash pull cannot update protected files such as those in `.claude`", "中文内容": "当沙盒`git checkout`、`git stash`或 autostash pull 无法更新受保护文件（例如`.claude`中的文件）时，为 Claude 添加了一条注释"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/security-review` and skills' inline git commands stopping with an error in worktrees of bare repositories, `--separate-git-dir` checkouts and Android `repo` checkouts", "中文内容": "修复了`/security-review`和技能内联 git 命令在裸存储库、`--separate-git-dir`签出和 Android`repo`签出的工作树中因错误而停止的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed subagents with their own model being moved to the plan-mode model when the model setting is `opusplan` or `haiku`", "中文内容": "当模型设置为`opusplan`或`haiku`时，修复了子代理将其自己的模型移至计划模式模型的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed subagents on a different model sizing file reads and MCP results with the main session's model", "中文内容": "修复了不同模型上的子代理，使用主会话的模型调整文件读取和 MCP 结果"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed sessions on many third-party gateways and Foundry stopping with a context length error on every turn instead of compacting", "中文内容": "修复了许多第三方网关和 Foundry 上的会话每次都会因上下文长度错误而停止而不是压缩的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed recent turns sometimes going missing from a resumed session after Claude Code stopped without a clean exit", "中文内容": "修复了克劳德代码在没有干净退出的情况下停止后有时会从恢复的会话中丢失最近的回合"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed shell commands running in the launch directory after the working directory was deleted; the command now fails with a message and can be re-issued", "中文内容": "修复了删除工作目录后在启动目录中运行的 shell 命令；该命令现在失败并显示一条消息，可以重新发出"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an approved plan edit being lost when the `plansDirectory` folder can't take it: the plan is now saved in the default plans folder, and a warning says where and why", "中文内容": "修复了当`plansDirectory`文件夹无法接受时已批准的计划编辑丢失的问题：该计划现在保存在默认计划文件夹中，并有一条警告说明位置和原因"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a saved `sonnet[1m]` model setting being rewritten on a new install to a model id the API rejects", "中文内容": "修复了保存的`sonnet[1m]`模型设置在新安装时被重写为 API 拒绝的模型 ID"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed focus view hiding the reply to your prompt when a scheduled task replied after it", "中文内容": "修复了当计划任务在提示后回复时，焦点视图会隐藏对提示的回复"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the prompt sometimes missing from a background subagent's view when fullscreen is off", "中文内容": "修复了全屏关闭时后台子代理视图中有时会丢失提示的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed long options in lists and permission prompts being partly overwritten when they wrap, and first-run screens losing lines on narrow terminals", "中文内容": "修复了列表中的长选项和权限提示在换行时被部分覆盖，以及首次运行的屏幕在狭窄终端上丢失行的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed startup warnings about permission rules and the \"N MCP servers need authentication\" notice being recorded as seen when they were scrolled out of view", "中文内容": "修复了有关权限规则的启动警告以及滚动到视图之外时记录的“N MCP 服务器需要身份验证”通知"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the welcome header showing control characters or splitting across lines when an agent's name or the working folder contains them or a line break", "中文内容": "修复了当代理的名称或工作文件夹包含控制字符或换行符时显示控制字符或跨行拆分的欢迎标题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the red error shown when Claude tries a command only you can run: a dim line now says it runs only when you type it at the prompt", "中文内容": "修复了克劳德尝试仅您可以运行的命令时显示的红色错误：一条暗线现在表示它仅在您在提示符下键入时运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/stats` showing an Active days total that was one day too high", "中文内容": "修复了`/stats`显示总活跃天数过高的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/insights` saying a report was ready when no session qualified for analysis, and writing two values into its HTML report without escaping them", "中文内容": "修复了`/insights`在没有符合分析资格的会话时表示报告已准备就绪的问题，并将两个值写入其 HTML 报告而不转义它们"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/voice` saying voice mode changed when managed settings, `--settings`, or the project's `.claude/settings.json` or `.claude/settings.local.json` kept it as it was; it now says what holds it", "中文内容": "修复了`/voice`表示当托管设置、`--settings`或项目的`.claude/settings.json`或`.claude/settings.local.json`保持原样时语音模式发生变化的问题；现在它说出了它的持有者是什么"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the IDE welcome dialog showing Cmd+Esc for Quick Launch on Windows and Linux", "中文内容": "修复了在 Windows 和 Linux 上显示用于快速启动的 Cmd+Esc 的 IDE 欢迎对话框"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Slack app tips showing when your organization's policy denies cloud sessions", "中文内容": "修复了 Slack 应用程序提示在组织的策略拒绝云会话时显示的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude purge` hanging silently when there is no terminal to read keys from, and its project picker and `-i` prompts ignoring the keyboard when stdin is piped", "中文内容": "修复了当没有终端可以读取密钥时`claude purge`静默挂起的问题，并且当标准输入通过管道传输时，其项目选择器和`-i`提示忽略键盘"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude plugin eval --output-dir ''` writing the report into the current folder; it now exits with an error", "中文内容": "修复了 `claude plugin eval --output-dir ''` 将报告写入当前文件夹的问题；现在退出并出现错误"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude -p` text output on a terminal passing control sequences other than text styling; pipes and files are unchanged", "中文内容": "修复了终端上传递除文本样式之外的控制序列的`claude -p`文本输出；管道和文件未更改"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed leftover `.oauth_refresh.lock.owner.tmp.*` files piling up in the config directory", "中文内容": "修复了配置目录中堆积的剩余`.oauth_refresh.lock.owner.tmp.*`文件"}, {"日期": "2026-11-13", "版本": "2.1.325
