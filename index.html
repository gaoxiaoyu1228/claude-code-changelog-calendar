", "类型": "修复", "内容": "Fixed `/fast` saying \"Fast mode has been disabled by your organization\" under the keyless Console sign-in, where Claude Code had not asked the server", "中文内容": "修复了在无密钥控制台登录下`/fast`显示“您的组织已禁用快速模式”的问题，其中 Claude Code 未询问服务器"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/model` saying that your organization restricts a model when Claude Code could not check that, for example with no network", "中文内容": "修复了`/model`，表示当 Claude Code 无法检查该模型时，您的组织会限制该模型，例如没有网络"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed \"Sign in with your Console account\" in `/login` replacing your existing login when you pressed Esc right after the browser step", "中文内容": "修复了`/login`中的“使用您的控制台帐户登录”，当您在浏览器步骤之后按下 Esc 时，替换您现有的登录信息"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the browser showing the sign-in success page in some cases where sign-in failed or was canceled", "中文内容": "修复了浏览器在某些情况下登录失败或被取消时显示登录成功页面的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude auth status` and other short commands leaving a lock behind on a Console profile, which made the next session hang for about a minute", "中文内容": "修复了`claude auth status`和其他短命令在控制台配置文件上留下锁，导致下一个会话挂起大约一分钟的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed background sessions started on your claude.ai login using (and billing) an API key or token from the shell that started the background service", "中文内容": "修复了使用启动后台服务的 shell 中的 API 密钥或令牌（并计费）在 claude.ai 登录时启动的后台会话"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed more cases of a session moving to another sign-in in the background; these moves are now refused, with a message saying what works", "中文内容": "修复了更多会话在后台转移到另一个登录的情况；这些举措现在被拒绝，并有一条消息说明什么是有效的"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a second Enter in the exit dialog stopping background work after the move to the background was refused", "中文内容": "修复了拒绝移动到后台后退出对话框中的第二个 Enter 停止后台工作的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed token counting on Amazon Bedrock sending the conversation to Bedrock when the `allowedProviders` managed setting does not allow it", "中文内容": "修复了当`allowedProviders`托管设置不允许时，Amazon Bedrock 将对话发送到 Bedrock 时的令牌计数"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed AWS `credential_process` helpers and Google Cloud default credentials failing when Claude Code is started without a `HOME` environment variable", "中文内容": "修复了在没有`HOME`环境变量的情况下启动 Claude Code 时 AWS`credential_process`帮助程序和 Google Cloud 默认凭证失败的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a session sometimes going back to an earlier permission mode after a subagent's plan was approved", "中文内容": "修复了子代理的计划获得批准后，会话有时会返回到较早的权限模式的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed one invalid value in an Agent SDK `applyFlagSettings()` call silently discarding all settings from earlier calls; a call that would do this is now refused with an error", "中文内容": "修复了 Agent SDK`applyFlagSettings()`调用中的一个无效值，以静默方式丢弃先前调用中的所有设置；现在，执行此操作的调用会被拒绝并出现错误"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed sessions showing as waiting for input when a finished pull request only needed your own review or merge", "中文内容": "当完成的拉取请求仅需要您自己的审查或合并时，修复了会话显示为等待输入的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an unrecognized `teammateMode` settings value being ignored without a warning: `claude -p`, the startup warning and `claude doctor` now list it as a skipped entry (still not applied)", "中文内容": "修复了无法识别的`teammateMode`设置值在没有警告的情况下被忽略的问题：`claude -p`、启动警告和`claude doctor`现在将其列为跳过的条目（仍未应用）"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `--worktree` skipping a `WorktreeCreate` hook from a plugin in `CLAUDE_CODE_PLUGIN_SEED_DIR` on the first run in a new home directory", "中文内容": "修复了`--worktree`在新主目录中首次运行时从`CLAUDE_CODE_PLUGIN_SEED_DIR`中的插件跳过`WorktreeCreate`挂钩的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed brief-mode sessions, such as Dispatch, sending a reply again after the turn had already replied", "中文内容": "修复了简短模式会话，例如调度，在回合已经回复后再次发送回复"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude saying a working Atlassian, Asana or Sentry connector had failed in cloud sessions when a plugin listed it at a different URL", "中文内容": "修复了 Claude 说当插件在不同 URL 列出工作 Atlassian、Asana 或 Sentry 连接器时在云会话中失败的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude Desktop and SDK sessions listing a folder's own MCP servers (`.mcp.json`, local) as host-added or not at all, and not connecting WebSocket ones, after a folder move or pre-warmed start", "中文内容": "修复了 Claude Desktop 和 SDK 会话，在文件夹移动或预热启动后，将文件夹自己的 MCP 服务器（`.mcp.json`，本地）列为添加主机或根本不添加主机，并且不连接 WebSocket 服务器"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/mcp` still listing a plugin's MCP server after a plugin reload removed it while it was connecting", "中文内容": "修复了`/mcp`在插件重新加载并在连接时将其删除后仍列出插件的 MCP 服务器的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an MCP server staying \"needs authentication\", and its `mcp_tool` hooks being skipped, after a token refresh that was refused only for a moment", "中文内容": "修复了 MCP 服务器保持“需要身份验证”状态，并且在令牌刷新仅被拒绝片刻后，其`mcp_tool`挂钩被跳过"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed MCP elicitation requests being cancelled without asking in headless mode after a server's connection was replaced during a tool call", "中文内容": "修复了在工具调用期间替换服务器连接后，MCP 诱导请求被取消而无需在无头模式下询问的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed MCP tool calls from an SDK host answering \"Not connected\" after a tool call had reconnected the MCP server", "中文内容": "修复了工具调用重新连接 MCP 服务器后，来自 SDK 主机的 MCP 工具调用回答“未连接”的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an MCP task getting stuck after its question was closed with Esc or asked again: the footer now says it needs your input, and Enter in `/tasks` shows the question again", "中文内容": "修复了 MCP 任务在使用 Esc 关闭其问题或再次询问后卡住的问题：页脚现在表示它需要您的输入，并且在`/tasks`中输入再次显示该问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed background MCP tasks that stopped updating after another call to the same server lost the connection, when a later call reconnects", "中文内容": "修复了后台 MCP 任务在对同一服务器的另一次调用失去连接后停止更新（当稍后的调用重新连接时）"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a background MCP task's question opening over a message you were still typing; it now waits until you send or clear the draft, and the spinner and turn timer keep running", "中文内容": "修复了后台 MCP 任务在您仍在输入的消息上打开的问题；现在它会等待，直到您发送或清除草稿，并且旋转器和转动计时器继续运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `worktree.sparsePaths` and sparse plugin and marketplace clones leaving out the repository's root files on older git versions, such as 2.34", "中文内容": "修复了`worktree.sparsePaths`以及稀疏插件和市场克隆，在较旧的 git 版本（例如 2.34）上遗漏了存储库的根文件"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed self-hosted runner sessions with several repositories being unable to use a repository added mid-session", "中文内容": "修复了多个存储库无法使用在会话中添加的存储库的自托管运行器会话"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude asking for permission before reading your own artifact or its data", "中文内容": "修复了克劳德在读取您自己的工件或其数据之前请求许可的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed deny and ask permission rules and hooks for the Artifact tool not applying in some cloud sessions", "中文内容": "修复了 Artifact 工具的拒绝和询问权限规则和挂钩在某些云会话中不适用的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Code Mode scripts ignoring a worktree entered with `EnterWorktree`, writing `~` paths into the project, and leaving `/mcp` showing an MCP server as connected after its sign-in expired", "中文内容": "修复了代码模式脚本忽略使用`EnterWorktree`输入的工作树，将`~`路径写入项目，并在登录过期后留下`/mcp`显示 MCP 服务器已连接的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed words typed with a Yes at a permission dialog or plan approval not reaching Claude in Code Mode", "中文内容": "修复了在代码模式下克劳德无法在权限对话框或计划批准中输入“是”的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude starting work by itself when you resumed a session that ended during a Code Mode script; it now waits for your next prompt", "中文内容": "修复了当您恢复在代码模式脚本期间结束的会话时克劳德自行开始工作的问题；它现在等待您的下一个提示"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a missing OpenTelemetry `user_prompt` event for a message sent while tool calls run. The event has `delivery.mode: \"mid_turn\"` and the running turn's `prompt.id`", "中文内容": "修复了工具调用运行时发送的消息丢失的 OpenTelemetry`user_prompt`事件。该事件具有 `delivery.mode: \"mid_turn\"` 和正在运行的回合的 `prompt.id`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the OpenTelemetry `user_prompt` event leaving out earlier messages' text when queued messages merged into one turn in VS Code, or when one message had an image", "中文内容": "修复了当排队消息在 VS Code 中合并到一轮中或当一条消息具有图像时，OpenTelemetry`user_prompt`事件会遗漏早期消息的文本"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a slash command's `allowed-tools` grants applying to background agents woken during or after its turn", "中文内容": "修复了斜线命令的“允许工具”授予应用于在其轮次期间或之后唤醒的后台代理的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/feedback` and `/bug` to upload other sessions only when they were recorded by the signed-in account or organization", "中文内容": "修复了`/feedback`和`/bug`，仅在登录帐户或组织记录其他会话时上传其他会话"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed relative deny and ask permission rules (e.g. `Read(./.env)`) no longer covering the project after a `cd`; they now also apply in added directories", "中文内容": "修复了相对拒绝和询问权限规则（例如`Read(./.env)`）在`cd`之后不再覆盖项目；它们现在也适用于添加的目录"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed deny and ask permission rules starting with `mcp__plugin_*_` missing a plugin's MCP server or tool spelled in another letter case", "中文内容": "修复了以`mcp__plugin_*_`开头的拒绝和询问权限规则，缺少以另一个字母大小写拼写的插件的 MCP 服务器或工具"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed deny rules not being applied to a permission approval that arrives after Claude Code restarts, in self-hosted runner and `claude remote-control` sessions", "中文内容": "修复了在自托管运行程序和“claude 远程控制”会话中，拒绝规则未应用于 Claude Code 重新启动后到达的权限批准的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where a committed `.claude/settings.local.json` could be treated as the user's own when Claude Code was started in certain subfolders of a repository", "中文内容": "修复了当 Claude Code 在存储库的某些子文件夹中启动时，提交的`.claude/settings.local.json`可能被视为用户自己的文件的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed some deny and ask rules not applying to certain Bash commands", "中文内容": "修复了一些不适用于某些 Bash 命令的拒绝和询问规则"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a gap in Bash permission checks where some compound commands could run without asking; these now ask for permission", "中文内容": "修复了 Bash 权限检查中的一个漏洞，其中某些复合命令可以在不询问的情况下运行；这些现在请求许可"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where a Bash allow rule could run a different program than the one it names", "中文内容": "修复了 Bash 允许规则可以运行与其命名的程序不同的程序的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a connector tool's approval prompt in cloud sessions being answered automatically while plugins were still loading", "中文内容": "修复了云会话中连接器工具的批准提示在插件仍在加载时自动应答的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed some subagents changing an artifact that people outside your organization can see, or uploading files to it, without asking first when an allow rule is set or uploads were approved earlier", "中文内容": "修复了一些子代理更改组织外部人员可以看到的工件或将文件上传到其中，而不先询问何时设置允许规则或先前批准上传的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed some artifact publishes skipping the confirmation for pages that people outside your organization can see when \"don't ask again\" had been chosen for Artifact", "中文内容": "修复了当为 Artifact 选择“不再询问”时，某些工件发布会跳过组织外部人员可以看到的页面的确认"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed auto mode judging only the first change to an artifact that people outside your organization can see; its yes now covers that change alone", "中文内容": "修复了自动模式仅判断组织外部人员可以看到的工件的第一次更改；现在它的“是”仅涵盖了这一变化"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a managed `strictPluginOnlyCustomization` lock on agents and skills not taking effect in sessions that were already running", "中文内容": "修复了代理和技能上的托管`strictPluginOnlyCustomization`锁定在已运行的会话中未生效的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed sandboxed commands being able to write to the native updater's download folder in some cases", "中文内容": "修复了沙盒命令在某些情况下能够写入本机更新程序的下载文件夹的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where the Bash sandbox did not fully protect a worktree's settings and hooks", "中文内容": "修复了 Bash 沙箱未完全保护工作树的设置和挂钩的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where the Bash sandbox did not fully protect a linked worktree's shared git folder", "中文内容": "修复了 Bash 沙箱未完全保护链接工作树的共享 git 文件夹的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/teleport`'s stash choice in some unusual git states: it now stops and says what to do", "中文内容": "修复了`/teleport`在一些不寻常的 git 状态下的存储选择：它现在停止并说明要做什么"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "Windows: Fixed a start-up stall that could last about a second when a PATH entry sits under a folder your account cannot open", "中文内容": "Windows：修复了当 PATH 条目位于您的帐户无法打开的文件夹下时，启动停滞可能持续约一秒钟的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/resume` on Windows refusing or hiding sessions whose folder was recorded with a different drive-letter case or slashes", "中文内容": "修复了 Windows 上的`/resume`拒绝或隐藏其文件夹使用不同驱动器盘符大小写或斜杠记录的会话的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an in-session `/resume` on Windows dropping a project's saved trust when the session was recorded with a different drive-letter case", "中文内容": "修复了 Windows 上的会话中`/resume`，当使用不同的驱动器盘符大小写记录会话时，会删除项目已保存的信任"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "Linux: Fixed sandboxed Bash commands failing with `bwrap: Can't create file` when the working directory was below an `allowRead` folder inside a `denyRead`, such as under a symlinked home directory", "中文内容": "Linux：修复了当工作目录位于`denyRead`内的`allowRead`文件夹下方（例如在符号链接主目录下）时，沙盒 Bash 命令失败并显示“bwrap：无法创建文件”"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude Desktop's third-party deployments staying on \"Stopping\" until a token renewal finished (once it includes this version)", "中文内容": "修复了 Claude Desktop 的第三方部署一直处于“停止”状态，直到令牌续订完成（一旦包含此版本）"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved subagents cut off at the output token limit: they are now asked for the whole answer again, more briefly, instead of returning only its end", "中文内容": "改进的子代理在输出令牌限制处被切断：现在，他们被要求再次更简短地提供整个答案，而不是仅返回其结尾"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved startup with a keyless Console sign-in or other Anthropic profile login: a token that is still valid is read without waiting for the credentials lock", "中文内容": "改进了无密钥控制台登录或其他人性配置文件登录的启动：无需等待凭据锁定即可读取仍然有效的令牌"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the account email check: it now also refuses your email as a client's identity in scripts a command runs, file writes, web fetches and MCP calls", "中文内容": "改进了帐户电子邮件检查：它现在还拒绝将您的电子邮件作为命令运行、文件写入、Web 获取和 MCP 调用脚本中的客户端身份"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the `HTTPS authentication failed` message for private plugin marketplaces: it now says git's terminal prompts and askpass programs are disabled, and it also appears with newer git versions", "中文内容": "改进了私有插件市场的“HTTPS 身份验证失败”消息：现在显示 git 的终端提示和 Askpass 程序已禁用，并且它也会出现在较新的 git 版本中"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the add-marketplace confirmations, plugin recommendation prompts and plugin install warning to say that plugins can run code on your computer, with access to your files and shell", "中文内容": "改进了添加市场确认、插件推荐提示和插件安装警告，表明插件可以在您的计算机上运行代码，并可以访问您的文件和 shell"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the `claude --desktop` sign-in error to name the API key, provider or setting that stops a Claude account sign-in from working", "中文内容": "改进了`claude --desktop`登录错误，以命名阻止 Claude 帐户登录工作的 API 密钥、提供程序或设置"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the `/voice` \"No audio detected\" message on macOS and Windows: it now says where to pick your microphone", "中文内容": "改进了 macOS 和 Windows 上的`/voice`“未检测到音频”消息：它现在显示在哪里选择麦克风"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved MCP tasks: Claude is now told when a task is waiting for your answer, and can point you to `/tasks`", "中文内容": "改进的 MCP 任务：当任务正在等待您的答复时，克劳德现在会被告知，并且可以将您指向`/tasks`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved `claude remote-control`: it now exits with status 4 when it stops by itself (single-session runs still exit 0) and 69 when it can't register, so a service manager can start it again", "中文内容": "改进了“claude远程控制”：现在，当它自行停止时，它会以状态4退出（单会话运行仍然退出0），当它无法注册时，它会以状态69退出，因此服务管理器可以再次启动它"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the messages shown when a background session can't use its session's API key or token: they no longer suggest adding the key to settings", "中文内容": "改进了后台会话无法使用其会话的 API 密钥或令牌时显示的消息：它们不再建议将密钥添加到设置中"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the bundled dataviz skill's part-to-whole advice for static images and for parts with a natural order, such as age bands", "中文内容": "改进了捆绑数据可视化技能对静态图像和具有自然顺序的部分（例如年龄范围）的部分到整体建议"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed sandboxed Bash commands to follow the normal permission flow by default; set `sandbox.autoAllowBashIfSandboxed: true` to keep running them without prompts", "中文内容": "更改了沙盒 Bash 命令以默认遵循正常权限流程；设置 `sandbox.autoAllowBashIfSandboxed: true` 以在没有提示的情况下继续运行它们"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed managed settings that turn the sandbox on: to keep commands running without prompts, set `sandbox.autoAllowBashIfSandboxed: true` in your highest-ranking managed source", "中文内容": "更改了打开沙箱的托管设置：要保持命令在没有提示的情况下运行，请在排名最高的托管源中设置 `sandbox.autoAllowBashIfSandboxed: true`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed read-only git commands to ask first in a repository that isn't the project's or one you trusted; name it with `--add-dir`, not the `additionalDirectories` setting, to run them without prompts", "中文内容": "更改了只读 git 命令，以首先询问不是项目的或您信任的存储库；使用`--add-dir`命名它，而不是`additionalDirectories`设置，以便在没有提示的情况下运行它们"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed scheduled tasks and `/loop` to ask before running a skill that declares `allowed-tools` or hooks; add `Skill(name)` to `permissions.allow` to run it unattended", "中文内容": "更改了计划任务和`/loop`，以在运行声明`allowed-tools`或钩子的技能之前进行询问；将`Skill(name)`添加到`permissions.allow`以无人值守运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed \"Always allow\" in Desktop, IDE and SDK hosts: a rule alone is offered only when saving it would allow that command again, so a scheduled task that relied on one can now wait for you", "中文内容": "更改了桌面、IDE 和 SDK 主机中的“始终允许”：仅在保存时才提供一条规则，该规则将再次允许该命令，因此依赖于该命令的计划任务现在可以等待您"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed the sandbox to refuse sandboxed writes to `.claude` settings, skills, agents, commands and hooks in added directories, as it does in the launch folder", "中文内容": "更改了沙箱以拒绝对添加目录中的`.claude`设置、技能、代理、命令和挂钩进行沙箱写入，就像在启动文件夹中一样"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed worktree isolation: an isolated worktree session or agent is now refused `git bisect run`, `git maintenance register|start` and `scalar`'s set-up commands, and is told what still works", "中文内容": "更改了工作树隔离：隔离的工作树会话或代理现在被拒绝`git bisect run`、“git Maintenance register|start”和`scalar`的设置命令，并被告知哪些命令仍然有效"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugin MCP bundles (`.mcpb`, `.dxt`) to unpack under the plugins directory, not `.mcpb-cache` in the plugin's folder, so read-only plugin folders load; one fetched by URL downloads again once", "中文内容": "更改了插件 MCP 包（`.mcpb`、`.dxt`）以在插件目录下解压，而不是在插件文件夹中的`.mcpb-cache`，因此加载只读插件文件夹；通过 URL 获取的内容会再次下载一次"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugins of a remote marketplace that managed settings declare, enable and list in `prependPlugins` or `appendPlugins` to count as the organization's; `pluginDigests` is deprecated and ignored", "中文内容": "更改了远程市场的插件，管理设置在`prependPlugins`或`appendPlugins`中声明、启用和列出，以计为组织的插件； `pluginDigests` 已弃用并被忽略"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugin loading to skip, and `claude plugin validate` to report, some unsafe paths and links in a plugin's folder", "中文内容": "更改了插件加载以跳过，并更改了`claude plugin validate`以报告插件文件夹中的一些不安全路径和链接"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed nested skill loading: `.claude/skills` folders in `--plugin-dir` plugins no longer load from a session started above them; start Claude Code in the plugin folder instead", "中文内容": "更改了嵌套技能加载：`--plugin-dir`插件中的`.claude/skills`文件夹不再从在其上方启动的会话加载；在插件文件夹中启动 Claude Code"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed EnterWorktree to refuse a `WorktreeCreate` hook path that goes through a symlink inside the project; have the hook print the real path", "中文内容": "更改了 EnterWorktree 以拒绝通过项目内部符号链接的`WorktreeCreate`挂钩路径；让钩子打印真实路径"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed tmux and iTerm2 teammates, and new sessions from the agents view opened with ←, to start in the session's folder instead of where the shell last ran `cd`", "中文内容": "更改了 tmux 和 iTerm2 队友，以及使用 ← 打开的代理视图中的新会话，以在会话的文件夹中启动，而不是 shell 上次运行`cd`的位置"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed prompt suggestions in the terminal to refresh less often after 8 turns in a row started by background or scheduled tasks, saving usage until you press a key or return to the terminal", "中文内容": "更改了终端中的提示建议，以在由后台或计划任务启动的连续 8 轮后刷新频率降低，从而节省使用量，直到您按下某个键或返回终端"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed Esc on a background MCP task's question to \"answer later\": nothing is sent to the server, and the question stays in `/tasks`", "中文内容": "将后台 MCP 任务问题上的 Esc 更改为“稍后回答”：没有任何内容发送到服务器，问题保留在`/tasks`中"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `CLAUDE_CODE_MAX_CONTEXT_TOKENS` to also set the context window of unrecognized model IDs that start with `claude-`, such as a gateway's `claude-sonnet-latest`", "中文内容": "更改了`CLAUDE_CODE_MAX_CONTEXT_TOKENS`，以设置以`claude-`开头的无法识别的模型 ID 的上下文窗口，例如网关的`claude-sonnet-latest`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `/login` to ask for permission to change your privacy settings", "中文内容": "更改了`/login`以请求更改您的隐私设置的权限"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `/cost`, `$.session.usage()`, `--max-budget-usd` and the cost and token metrics to count a mod's `$.model.complete` and `$.model.classify` calls", "中文内容": "更改了 `/cost`、`$.session.usage()`、`--max-budget-usd` 以及成本和令牌指标以计算 mod 的 `$.model.complete` 和 `$.model.classify` 调用"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed the programs that Claude Code's sandbox starts for its own use, such as its network bridge, to run without Claude Code's sign-in tokens and API keys in their environment", "中文内容": "更改了 Claude Code 沙箱为其自身使用而启动的程序（例如其网桥），使其在其环境中无需 Claude Code 的登录令牌和 API 密钥即可运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed ripgrep, local git commands and the sandbox runtime's own helper programs to run without the mTLS client key's passphrase in their environment", "中文内容": "更改了 ripgrep、本地 git 命令和沙箱运行时自己的帮助程序，使其在其环境中无需 mTLS 客户端密钥的密码短语即可运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "Remote Control: Changed `/resume` and `/teleport` to disconnect first when the connected session has a share link, or when that can't be checked; run `/remote-control` to connect again", "中文内容": "远程控制：将`/resume`和`/teleport`更改为当连接的会话有共享链接或无法检查时首先断开连接；运行 `/remote-control` 再次连接"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed Claude Code on the web, cloud scheduled tasks and Cowork cloud sessions to start despite `sandbox.failIfUnavailable`: the hosted container has no command sandbox", "中文内容": "更改了 Web 上的 Claude 代码、云计划任务和 Cowork 云会话，以尽管`sandbox.failIfUnavailable`启动：托管容器没有命令沙箱"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed requests for settings, permission rules, hooks or status over a cloud or self-hosted session's connection to return less or be refused; what applies in the session is unchanged", "中文内容": "更改了通过云或自托管会话连接对设置、权限规则、挂钩或状态的请求，以减少返回或被拒绝；会话中适用的内容没有改变"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `claude -p` with no cached account data to wait for that data before its first request, so a first run in a clean environment can start a few seconds later", "中文内容": "更改了没有缓存帐户数据的`claude -p`，以在第一个请求之前等待该数据，因此干净环境中的首次运行可以在几秒钟后开始"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed Claude's instructions to keep files you'll want out of its temporary scratchpad folder, which can be cleared", "中文内容": "更改了克劳德的说明，将您想要的文件保留在临时暂存文件夹中，该文件夹可以被清除"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed marketplace `ref` to accept the full ID of any commit on a branch or tag; clients before this version can't clone such a pin, so a marketplace pinned this way stops loading there", "中文内容": "更改了市场`ref`以接受分支或标签上任何提交的完整 ID；此版本之前的客户端无法克隆此类 pin，因此以这种方式固定的市场将停止加载"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugin marketplace and plugin downloads to use a CONNECT tunnel when `ALL_PROXY` is the only proxy set; a proxy that refuses CONNECT now fails them", "中文内容": "当`ALL_PROXY`是唯一的代理集时，更改了插件市场和插件下载以使用 CONNECT 隧道；拒绝 CONNECT 的代理现在让他们失败"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `-p` and SDK runs in a worktree or submodule mounted into a container to apply `.claude/settings.local.json` allow rules only once the folder is trusted", "中文内容": "更改了`-p`和 SDK 在安装到容器中的工作树或子模块中运行，以仅在文件夹受信任时应用`.claude/settings.local.json`允许规则"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed self-hosted runners to refuse a session whose session folder or repository path is a symbolic link, other than a `checkout` hook's checkout", "中文内容": "更改了自托管运行器以拒绝其会话文件夹或存储库路径是符号链接的会话，而不是`checkout`挂钩的结帐"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "移除", "内容": "Removed \"ask your admin to raise it\" from spend limit and shared budget errors in cloud sessions and under Remote Control", "中文内容": "删除了云会话和远程控制下的支出限制和共享预算错误中的“要求管理员提高”"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Added prompt suggestions wherever the terminal shows them: Tab accepts the suggested next prompt; `promptSuggestionEnabled: false` in Claude Code's settings.json turns them off", "中文内容": "[VSCode] 在终端显示的任何地方添加了提示建议：Tab 接受建议的下一个提示； Claude Code 的 settings.json 中的`promptSuggestionEnabled: false`将其关闭"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Added a Console sign-in that creates no API key", "中文内容": "[VSCode] 添加了不创建 API 密钥的控制台登录"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Added a field to paste the redirect URL when signing in to an MCP server from the panel in SSH, WSL and container windows", "中文内容": "[VSCode] 添加了一个字段，用于在 SSH、WSL 和容器窗口中从面板登录 MCP 服务器时粘贴重定向 URL"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the model picker's check mark staying on the old model after Claude Code restarted on another model or the model was switched over Remote Control", "中文内容": "[VSCode] 修复了 Claude Code 在另一个模型上重新启动或模型切换到远程控制后模型选择器的复选标记保留在旧模型上的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the effort selector offering levels above the effort cap set by your organization or the `maxEffortLevel` setting", "中文内容": "[VSCode] 修复了工作量选择器提供的级别高于组织设置的工作量上限或`maxEffortLevel`设置"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the sign-in screen offering sign-ins that the managed `allowedProviders` setting refuses", "中文内容": "[VSCode] 修复了托管`allowedProviders`设置拒绝提供登录的登录屏幕"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the permission prompt for MCP tools not saying why Claude Code asks when a safety check raises the question", "中文内容": "[VSCode] 修复了 MCP 工具的权限提示，但没有说明为什么 Claude Code 在安全检查提出问题时会询问"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the message for organization settings that couldn't load saying to run a command again; it now says to try again, matching the tab's Retry link", "中文内容": "[VSCode] 修复了组织设置无法加载并提示再次运行命令的消息；现在它说重试，匹配选项卡的重试链接"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Improved the note shown for an untrusted folder: it now says why the extension is off and how to turn it on", "中文内容": "[VSCode] 改进了不受信任文件夹显示的注释：它现在说明扩展程序关闭的原因以及如何打开它"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Improved the error shown when the system refuses to run Claude Code: it now says your IT team can allow a blocked program", "中文内容": "[VSCode] 改进了系统拒绝运行 Claude Code 时显示的错误：现在显示您的 IT 团队可以允许被阻止的程序"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Improved the sign-in card to say what to do when the browser shows a connection error for localhost", "中文内容": "[VSCode] 改进了登录卡，以说明当浏览器显示 localhost 连接错误时该怎么做"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Changed the install link's marketplace confirmation button to \"Trust marketplace and continue\"", "中文内容": "[VSCode] 将安装链接的市场确认按钮更改为“信任市场并继续”"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[Claude Code on the web] Fixed new cloud sessions cutting MCP tool descriptions loaded through tool search at 4,096 characters; the limit is now 16,384, as in other Claude Code sessions", "中文内容": "[网络上的克劳德代码] 修复了新的云会话将通过工具搜索加载的 MCP 工具描述剪切为 4,096 个字符；与其他 Claude Code 会话一样，现在的限制为 16,384"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[Claude Tag] Fixed artifact links pasted in Slack getting no card when the poster's Claude sign-in had expired in a workspace their organization doesn't manage; a plain card now appears", "中文内容": "[Claude Tag] 修复了当发布者的 Claude 登录在其组织不管理的工作区中过期时，粘贴在 Slack 中的工件链接不会出现卡的问题；现在出现一张普通卡片"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added Code Mode, an experimental opt-in in which Claude writes JavaScript to call its tools; see https://code.claude.com/docs/en/code-mode to turn it on, or to turn it off for an organization", "中文内容": "添加了代码模式，这是一种实验性选择，克劳德可以在其中编写 JavaScript 来调用其工具；请参阅 https://code.claude.com/docs/en/code-mode 打开它，或为组织关闭它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `engines[\"claude-code\"]` to `plugin.json`: plugins outside their stated Claude Code version range are not installed, updated or loaded, and install and update pick the newest version that fits", "中文内容": "将 `engines[\"claude-code\"]` 添加到 `plugin.json`：未安装、更新或加载其规定的 Claude Code 版本范围之外的插件，安装和更新时选择适合的最新版本"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added type checking of a plugin's TypeScript hooks module to `claude plugin validate`; each finding is a warning, and `--strict` fails on it", "中文内容": "在`claude plugin validate`中添加了插件 TypeScript hooks 模块的类型检查；每个发现都是一个警告，并且`--strict`失败"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added to `claude plugin validate` the `$` nouns a mod's `engine.create` hook adds, withholds or replaces", "中文内容": "添加到`claude plugin validate`中的`$`名词，mod 的`engine.create`钩子添加、保留或替换"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added support for `CLAUDE_CODE_AUTO_MODE_MODEL` in managed settings for Claude Desktop sessions on third-party providers (takes effect once Claude Desktop includes this version)", "中文内容": "在第三方提供商的 Claude Desktop 会话的托管设置中添加了对`CLAUDE_CODE_AUTO_MODE_MODEL`的支持（Claude Desktop 包含此版本后生效）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added an options menu (stop, switch to usage credits, upgrade) when a model needs usage credits that are turned off or used up", "中文内容": "当模型需要关闭或用完的使用积分时添加了选项菜单（停止、切换到使用积分、升级）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a progress heartbeat every 30 seconds while hooks run long in `claude -p` and SDK sessions, so a host such as Claude Desktop won't end the turn as hung (once it includes this version)", "中文内容": "当钩子在`claude -p`和 SDK 会话中长时间运行时，每 30 秒添加一次进度心跳，因此像 Claude Desktop 这样的主机不会以挂起的方式结束回合（一旦包含此版本）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `.docx` support to Artifact tool asset uploads", "中文内容": "添加了对 Artifact 工具资产上传的`.docx`支持"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a `/diff to close` hint to the diff panel, and the keys that focus and close a panel to the `?` shortcut guide", "中文内容": "在 diff 面板中添加了`/diff to close`提示，并将聚焦和关闭面板的键添加到了`?`快捷方式指南中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a start-up warning for Bash allow rules with a `*` in a variable's value, such as `Bash(PORT=* npm run dev)`", "中文内容": "添加了针对变量值中带有`*`的 Bash 允许规则的启动警告，例如`Bash(PORT=* npm run dev)`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a warning when a plugin's language server can't start, naming the server and what to check", "中文内容": "添加了当插件的语言服务器无法启动时的警告、命名服务器以及要检查的内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a one-time startup notice naming `CLAUDE_CODE_PERFORCE_MODE` when Perforce settings are found and the mode is off", "中文内容": "添加了一个一次性启动通知，当找到 Perforce 设置且模式关闭时，命名为`CLAUDE_CODE_PERFORCE_MODE`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `CLAUDE_CODE_DISABLE_AGENT_PROGRESS_SUMMARIES` (available since 2.1.318): set it to `1` to turn off subagent progress summaries and the requests that write them (anthropics/claude-code#86879)", "中文内容": "添加了`CLAUDE_CODE_DISABLE_AGENT_PROGRESS_SUMMARIES`（自 2.1.318 起可用）：将其设置为`1`以关闭子代理进度摘要以及写入它们的请求（anthropics/claude-code#86879）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `CLAUDE_CODE_RESUME_HINT_COMMAND`, which a program that starts Claude Code can set to have the exit hint name its own resume command", "中文内容": "添加了`CLAUDE_CODE_RESUME_HINT_COMMAND`，启动 Claude Code 的程序可以将其设置为具有自己的恢复命令的退出提示名称"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `unsetOptionCount` to the `claude plugin install --json` result: how many `userConfig` options are not yet set", "中文内容": "在 `claude plugin install --json` 结果中添加了 `unsetOptionCount`：尚未设置多少个 `userConfig` 选项"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `isPromptCovered` to the props a mod's pane is drawn with, telling it when a dialog or a field above the prompt covers the prompt", "中文内容": "将`isPromptCovered`添加到绘制 mod 窗格的道具中，告诉它提示上方的对话框或字段何时覆盖提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed running `/compact` again, or after a command such as `/context`, summarizing away a message that Claude had not answered yet", "中文内容": "修复了再次运行`/compact`，或在执行`/context`等命令后，总结克劳德尚未回复的消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a resumed session joining your next message to an old interrupted message that was not resumed", "中文内容": "修复了已恢复的会话将您的下一条消息连接到未恢复的旧中断消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a memory spike at the next prompt after Claude changed a very large file", "中文内容": "修复了克劳德更改一个非常大的文件后下一个提示时的内存峰值"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a setting saved in a running session undoing a hand edit made to `settings.json` moments earlier; a settings file you delete during a session now stays deleted", "中文内容": "修复了保存在运行会话中的设置，撤消了之前对`settings.json`所做的手动编辑；您在会话期间删除的设置文件现在仍保持删除状态"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude plugin` commands and `claude mcp list` signing you out of a Console profile when they ended while the token was being renewed", "中文内容": "修复了`claude plugin`命令和`claude mcp list`在令牌更新期间结束时将您从控制台配置文件中注销的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Edit and Bash running out of memory on certain `/proc` files, and Edit hanging or running out of memory on devices and named pipes", "中文内容": "修复了编辑和 Bash 在某些`/proc`文件上运行内存不足的问题，以及编辑在设备和命名管道上挂起或运行内存不足的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude Code failing to start, or to clear stored credentials at sign-out, when saving its configuration file failed with \"Out of memory\"", "中文内容": "修复了当保存配置文件因“内存不足”而失败时，Claude Code 无法启动或无法在注销时清除存储的凭据的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed requests sent without streaming failing on errors that streamed requests recover from, such as a rejected image, thinking block or beta header", "中文内容": "修复了在没有流式传输的情况下发送的请求因流式请求恢复的错误而失败的问题，例如被拒绝的图像、思考块或 beta 标头"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `ExitWorktree`, the worktree exit dialog and `/resume` leaving the session in the wrong folder when the folder the shell was in before entering the worktree had been deleted", "中文内容": "修复了当 shell 在进入工作树之前所在的文件夹已被删除时，`ExitWorktree`、工作树退出对话框和`/resume`将会话留在错误的文件夹中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed accents and other combining marks sometimes landing left of the text, leaving stale copies on screen, or silently disappearing when text wraps", "中文内容": "修复了重音符号和其他组合标记有时落在文本左侧的问题，在屏幕上留下过时的副本，或者在文本换行时悄然消失"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the last key of a key chord, such as Enter in ctrl+x enter, acting on a dialog's text field when the chord's own action isn't available there", "中文内容": "修复了关键和弦的最后一个键，例如 ctrl+x Enter 中的 Enter，当和弦自己的操作不可用时作用于对话框的文本字段"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `ps` processes piling up when the process listing Claude Code runs before stopping a command takes too long", "中文内容": "修复了在停止命令之前运行列出 Claude Code 的进程花费太长时间时`ps`进程堆积的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed subagent transcripts and large tool results being saved apart from the session's transcript after entering a worktree created by a `WorktreeCreate` hook or belonging to a nested repository", "中文内容": "修复了在进入由`WorktreeCreate`挂钩创建的或属于嵌套存储库的工作树后，子代理记录和大型工具结果与会话记录分开保存的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a session on a named Anthropic profile moving to another sign-in when `/fork`, the Left arrow or `--bg` continued it in the background; reopen any session that was open during the update", "中文内容": "修复了当`/fork`、向左箭头或`--bg`在后台继续运行时，指定 Anthropic 配置文件上的会话会移动到另一个登录；重新打开更新期间打开的任何会话"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a background session sending a conversation under another sign-in when its named Anthropic profile is missing, changed or overridden; it now stops and says so", "中文内容": "修复了后台会话在其指定的 Anthropic 配置文件丢失、更改或覆盖时在另一个登录下发送对话的问题；它现在停下来并这样说"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a session on an API key, auth token or workload identity from its shell (not a setup token) moving to another sign-in in the background; it now stops and says so", "中文内容": "修复了 API 密钥、身份验证令牌或工作负载身份上的会话从其 shell（不是设置令牌）移动到后台另一个登录的问题；它现在停下来并这样说"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed MCP tool calls ending in the sign-in server's error, such as `TOKEN_EXPIRED`, instead of asking you to sign in again", "中文内容": "修复了 MCP 工具调用以登录服务器错误结束的问题，例如`TOKEN_EXPIRED`，而不是要求您再次登录"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an expired claude.ai login showing \"Credit balance too low\" when a saved Console key or `ant auth login` profile without credit was used instead", "中文内容": "修复了当使用保存的控制台密钥或没有信用的`ant auth login`配置文件时，过期的 claude.ai 登录显示“信用余额太低”的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a session on a named Anthropic profile being handed to an older background service that could not keep its sign-in; it now says to restart the service", "中文内容": "修复了一个名为 Anthropic 配置文件的会话被移交给无法保持登录的旧后台服务的问题；现在它说要重新启动服务"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a background session's sign-in leaving the previous account's login or other credentials in place; it now clears them for every session on the computer, and a refused sign-in can leave no login", "中文内容": "修复了后台会话登录时保留先前帐户的登录名或其他凭据的问题；现在，它会清除计算机上的每个会话，并且拒绝登录不会留下任何登录信息"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed background sessions moving between a profile and the stored login when an update restarted them", "中文内容": "修复了更新重新启动后台会话时在配置文件和存储的登录名之间移动的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed sessions opened before a sign-in keeping signed-out feature flags after the sign-in", "中文内容": "修复了登录前打开的会话在登录后保留注销功能标志的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed sessions that kept failing after a Claude apps gateway sign-in expired: once you sign in again with `/login` in another terminal, they carry on at the next message", "中文内容": "修复了克劳德应用程序网关登录过期后持续失败的会话：一旦您在另一个终端中使用`/login`再次登录，它们就会在下一条消息处继续"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the billing notice naming your `ant auth login` organization when a custom `X-Api-Key` header is set", "中文内容": "修复了设置自定义`X-Api-Key`标头时命名`ant auth login`组织的账单通知"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "macOS: Fixed \"Not logged in · Please run /login\" coming back right after a successful `/login` or a token refresh when the keychain was slow to answer", "中文内容": "macOS：修复了“未登录·请运行 /login”在成功`/login`或钥匙串响应缓慢时令牌刷新后立即返回的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed turns failing in Claude Desktop when an organization's gateway answers an expired token with 403: Claude Code now asks Desktop for a fresh token and retries", "中文内容": "修复了当组织的网关使用 403 应答过期令牌时 Claude Desktop 中的转向失败问题：Claude Code 现在要求 Desktop 提供新令牌并重试"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the error shown when Amazon Bedrock refuses your account a model: it no longer says to refresh your AWS credentials, it says to enable the model", "中文内容": "修复了 Amazon Bedrock 拒绝您的账户模型时显示的错误：它不再提示刷新您的 AWS 凭证，而是提示启用该模型"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the `awsAuthRefresh` or `gcpAuthRefresh` command sometimes running twice for one request when three or more sessions needed a fresh sign-in at once", "中文内容": "修复了当三个或更多会话需要一次重新登录时，`awsAuthRefresh`或`gcpAuthRefresh`命令有时会针对一个请求运行两次"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the `claude -p` warning about an ended claude.ai login to say that `claude auth logout` also removes saved MCP server logins and plugin secrets", "中文内容": "修复了有关 claude.ai 登录结束的`claude -p`警告，表示`claude auth logout`还会删除保存的 MCP 服务器登录信息和插件机密"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash permission prompts offering \"don't ask again\" for commands that write to sensitive paths such as `.git` or `.claude`, where the saved rule did not stop the next prompt", "中文内容": "修复了 Bash 权限提示，对于写入敏感路径（例如`.git`或`.claude`）的命令提供“不再询问”，其中保存的规则不会停止下一个提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where some `lsof` commands ran without a permission prompt", "中文内容": "修复了某些`lsof`命令在没有权限提示的情况下运行的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash commands that write a file with `cat > file <<EOF` being shown as \"Read 1 file\"", "中文内容": "修复了使用 `cat > file <<EOF` 写入文件的 Bash 命令显示为“读取 1 个文件”"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where Bash permission checks judged an `rm` from the wrong folder and skipped the dangerous-removal prompt under bypass permissions or a Bash allow rule", "中文内容": "修复了 Bash 权限检查从错误的文件夹中判断出`rm`并在绕过权限或 Bash 允许规则下跳过危险删除提示的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `--permission-mode auto` or a settings `defaultMode: auto` starting in a mode that could allow more when auto mode was unavailable. It now starts in Manual mode, which asks first", "中文内容": "修复了`--permission-mode auto`或设置“defaultMode：auto”，该设置在自动模式不可用时允许更多的模式启动。现在以手动模式启动，该模式首先询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plan files sometimes being written outside the project when `plansDirectory` is set; a write that can't be shown to stay inside the project is now refused", "中文内容": "修复了设置`plansDirectory`时有时会在项目外部写入计划文件的问题；无法显示为留在项目内的写入现在被拒绝"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a permission prompt when Claude read the output of its own background command or agent after entering a worktree", "中文内容": "修复了克劳德进入工作树后读取自己后台命令或代理的输出时的权限提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where Bash permission checks missed part of a command", "中文内容": "修复了 Bash 权限检查遗漏部分命令的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where the Bash sandbox could switch off during a session", "中文内容": "修复了 Bash 沙箱可能在会话期间关闭的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash allow rules with an attached wildcard, such as `Bash(ls*)`, skipping the permission prompt in some cases; a rule that names a variable, such as `Bash(NODE_ENV*)`, now asks", "中文内容": "修复了带有附加通配符的 Bash 允许规则，例如`Bash(ls*)`，在某些情况下会跳过权限提示；命名变量的规则，例如`Bash(NODE_ENV*)`，现在会询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed auto mode running behind a gateway at `ANTHROPIC_BASE_URL` on a model whose gateway name contains \"haiku\"; such a model, other than `claude-haiku-5-5`, is now refused, as Haiku 4.5 is", "中文内容": "修复了在网关名称包含“haiku”的模型上在`ANTHROPIC_BASE_URL`处的网关后面运行的自动模式；除`claude-haiku-5-5`之外的此类模型现在已被拒绝，因为 Haiku 4.5 是"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash deny and ask rules missing some commands run through `sudo`, `env` and similar wrappers", "中文内容": "修复了 Bash 拒绝和询问规则缺少一些通过`sudo`、`env`和类似包装器运行的命令"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash allow rules written with combined `sudo` flags skipping the permission prompt in some cases", "中文内容": "修复了 Bash 允许使用组合`sudo`标志编写的规则在某些情况下跳过权限提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `sandbox.excludedCommands` letting a command that it does not name run outside the sandbox in some cases", "中文内容": "修复了`sandbox.excludedCommands`，在某些情况下允许未命名的命令在沙箱外部运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where the Write and Edit tools could write to a path covered by a `Read` deny rule", "中文内容": "修复了写入和编辑工具可以写入“读取”拒绝规则覆盖的路径的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where a Bash command ran without a permission prompt for zsh users with certain non-default shell options set", "中文内容": "修复了以下情况：对于设置了某些非默认 shell 选项的 zsh 用户，运行 Bash 命令时没有权限提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Bash sandbox not fully protecting Claude Code's own config on installs still using the legacy config file", "中文内容": "修复了 Bash 沙箱无法完全保护 Claude Code 在安装时仍使用旧配置文件的配置"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a permission prompt from a mod's `tool.check` hook naming every plugin hooked on the tool instead of the one that asked", "中文内容": "修复了 mod 的`tool.check`挂钩的权限提示，命名了该工具上挂钩的每个插件，而不是要求的插件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed sandboxed commands being able to read Claude Code's file checkpoint copies under the config directory", "中文内容": "修复了沙盒命令能够读取 config 目录下 Claude Code 的文件检查点副本的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a rewind sometimes changing your permission mode", "中文内容": "修复了有时会改变您的权限模式的倒带"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed project settings sometimes being read through a symbolic link that leads to a different folder than the one Claude Code checked", "中文内容": "修复了有时通过符号链接读取项目设置的问题，该链接会导致与检查的克劳德代码不同的文件夹"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed HTTP hooks failing with HTTP 500 on Linux when `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB` is set and `sandbox.enabled` is off", "中文内容": "修复了当设置`CLAUDE_CODE_SUBPROCESS_ENV_SCRUB`且`sandbox.enabled`关闭时 HTTP 挂钩在 Linux 上失败并出现 HTTP 500 的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude -p` and the Agent SDK running Bash unsandboxed when `--settings` or SDK settings that turn the sandbox on fail validation; Claude Code now stops at start-up and names the invalid setting", "中文内容": "修复了`claude -p`和当`--settings`或 SDK 设置打开沙箱时未沙箱运行 Bash 的代理 SDK 验证失败的问题；克劳德代码现在在启动时停止并命名无效设置"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/export` silently stopping early after a long run of calls to an MCP tool that is no longer loaded", "中文内容": "修复了`/export`在长时间调用不再加载的 MCP 工具后提前静默停止的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed earlier MCP tool calls missing from a resumed conversation, and lines repeating in scrollback, when the server connects late", "中文内容": "修复了当服务器连接较晚时，早期的 MCP 工具调用从恢复的对话中丢失以及回滚中重复的行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude mcp add --help` splitting long example commands across lines in narrow terminals and pipes, so a pasted example ran without its header", "中文内容": "修复了`claude mcp add --help`在狭窄的终端和管道中跨行分割长示例命令的问题，因此粘贴的示例在没有标题的情况下运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugins with `defaultEnabled: false` staying off in a claude.ai chat's cloud session after you turn them on in claude.ai", "中文内容": "修复了在 claude.ai 中打开`defaultEnabled: false`插件后，它们在 claude.ai 聊天的云会话中保持关闭状态的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/fast on` and `/fast off` on Vertex not asking a plugin's `config.set` hook, as the `/fast` menu does", "中文内容": "修复了 Vertex 上的`/fast on`和`/fast off`不询问插件的`config.set`挂钩的问题，就像`/fast`菜单那样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed documents created through the Claude Docs connector not opening in your browser when you work in a terminal", "中文内容": "修复了当您在终端中工作时通过 Claude Docs 连接器创建的文档无法在浏览器中打开的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the misleading \"not cached\" error for a plugin only a repository's settings enable: it now says it isn't installed, gives the install command, and shows in text and stream-json `-p` runs", "中文内容": "修复了插件的误导性“未缓存”错误，仅启用存储库的设置：它现在表示未安装，给出安装命令，并在文本和流 json `-p` 中显示运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed mods being able to reword Claude Code's own confirmation questions", "中文内容": "修复了模组能够改写克劳德·代码自己的确认问题的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a mod's hot reload sometimes ignoring a file created just after a failed reload", "中文内容": "修复了 mod 的热重载有时会忽略重新加载失败后创建的文件的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed marketplaces named `npm`, `pip`, `uv`, `cargo`, `github` or `gh` being refused as reserved names", "中文内容": "修复了名为`npm`、`pip`、`uv`、`cargo`、`github`或`gh`的市场被拒绝作为保留名称的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a stopped MCP call, or a stopped shell command in fullscreen, reading as \"Called\" or \"Ran\" in a collapsed tool group: it now says no result was recorded and shows its input", "中文内容": "修复了停止的 MCP 调用或全屏停止的 shell 命令，在折叠的工具组中读取为“Called”或“Ran”：现在显示未记录任何结果并显示其输入"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed load errors of plugins enabled by managed settings going only to the debug log in SDK and Desktop sessions: `init.plugin_errors` now lists them", "中文内容": "修复了托管设置启用的插件的加载错误，该错误仅进入 SDK 和桌面会话中的调试日志：`init.plugin_errors`现在列出了它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugin installs hiding what a plugin's install command wrote to stderr when that command succeeded, such as a note that the plugin has no skills yet", "中文内容": "修复了插件安装隐藏插件安装命令在命令成功时写入 stderr 的内容，例如插件尚无技能的注释"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed one malformed entry in a plugin marketplace's `renames` map making Claude Code ignore the marketplace's other renames", "中文内容": "修复了插件市场“重命名”地图中的一个格式错误的条目，导致克劳德代码忽略市场的其他重命名"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude --bg --safe-mode` sessions stopping at startup to ask about project MCP servers that safe mode never starts", "中文内容": "修复了`claude --bg --safe-mode`会话在启动时停止以询问安全模式永远不会启动的项目 MCP 服务器的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed MCP link prompts offering Accept for non-http links without saying the link wouldn't open", "中文内容": "修复了 MCP 链接提示，为非 http 链接提供“接受”，而不表示链接无法打开"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/mcp` and `/plugins` opening an MCP server's page with the cursor on \"Disable\" when the server needs authentication but still holds its sign-in; the page now offers \"Reconnect\" and opens on it", "中文内容": "修复了当服务器需要身份验证但仍保持登录状态时，`/mcp` 和 `/plugins` 打开 MCP 服务器页面时光标位于“禁用”上的问题；该页面现在提供“重新连接”并在其上打开"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugins with a version list in `enabledPlugins` staying off with no message: `/plugin` and `claude plugin list` now say why", "中文内容": "修复了`enabledPlugins`中版本列表不显示任何消息的插件：`/plugin`和“claude 插件列表”现在说明原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugins and marketplaces failing to install on Windows when the path of a cloned file reaches 260 characters", "中文内容": "修复了当克隆文件的路径达到 260 个字符时插件和市场无法在 Windows 上安装的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a Stop pressed right after sending a message showing as an error in remote and SDK sessions while a `UserPromptSubmit` or plugin prompt hook was still running", "中文内容": "修复了在`UserPromptSubmit`或插件提示挂钩仍在运行时发送消息后立即按下“停止”的问题，该消息在远程和 SDK 会话中显示为错误"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an MCP server staying disconnected with no tools after an Agent SDK app or `claude -p` caller removed and re-added it, when a tool call had tried to reach it in between", "中文内容": "修复了代理 SDK 应用程序或`claude -p`调用者删除并重新添加 MCP 服务器后，当工具调用试图在中间访问它时，MCP 服务器在没有任何工具的情况下保持断开连接的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed text-output `claude -p` runs printing nothing to stderr when a `--plugin-dir` mod's hook hangs or crashes the hooks worker", "中文内容": "修复了当 `--plugin-dir` mod 的钩子挂起或使钩子工作线程崩溃时，文本输出 `claude -p` 不会向 stderr 打印任何内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed SDK sessions giving an MCP server named by `--allowedTools` or an `mcp_tool` hook less than 2s before the first turn when settings lowered `CLAUDE_CODE_MCP_STARTUP_WAIT_MS` after start-up", "中文内容": "修复了当设置在启动后降低`CLAUDE_CODE_MCP_STARTUP_WAIT_MS`时，在第一回合前不到 2 秒提供由`--allowedTools`命名的 MCP 服务器或`mcp_tool`挂钩的 SDK 会话"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed headless sessions ending when an SDK host sent a null entry in an MCP server's tools list", "中文内容": "修复了当 SDK 主机在 MCP 服务器的工具列表中发送空条目时结束的无头会话"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed WebFetch dropping empty table cells and shifting later values a column left", "中文内容": "修复了 WebFetch 删除空表格单元格并将后面的值向左移动一列的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed temporary files of a session that had changed directory being left behind when the session expired under `cleanupPeriodDays`", "中文内容": "修复了当会话在`cleanupPeriodDays`下过期时留下的已更改目录的会话的临时文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed managed settings (`managed-settings.json`, `managed-settings.d`) sometimes being missed at start-up while another program was rewriting the file: start-up now reads such a file a second time", "中文内容": "修复了托管设置（“托管设置.json”、“托管设置.d”）有时会在启动时丢失，而另一个程序正在重写该文件：启动现在会第二次读取此类文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `.claude/settings.local.json` not being ignored globally when the folder became a git repository later, or on a new machine", "中文内容": "修复了当文件夹稍后成为 git 存储库或在新计算机上时，`.claude/settings.local.json` 不会被全局忽略的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/diff` waiting for Claude to finish before closing the diff panel in fullscreen", "中文内容": "修复了`/diff`在全屏关闭 diff 面板之前等待 Claude 完成的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/memory` showing wrong or roundabout paths for folders whose names start with the working directory's or home folder's name, and losing slashes in the file path on Windows", "中文内容": "修复了`/memory`显示名称以工作目录或主文件夹名称开头的文件夹的错误或迂回路径，以及在 Windows 上文件路径中丢失斜杠的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a broken emoji character in a tool call's parameter name being resent with later requests, which strict JSON parsers reject", "中文内容": "修复了工具调用的参数名称中损坏的表情符号字符会随后续请求重新发送，而严格的 JSON 解析器会拒绝该字符"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a collapsed tool call looking as if it ran after you rejected it with a reason: it now shows \"Not run · rejected\"", "中文内容": "修复了折叠的工具调用，看起来好像是在您因某种原因拒绝后运行的：它现在显示“未运行·被拒绝”"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where part of a saved session could be lost on NFS or FUSE file systems when Claude Code discarded a reply", "中文内容": "修复了当 Claude Code 丢弃回复时，部分已保存会话可能会在 NFS 或 FUSE 文件系统上丢失的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed WebFetch not rechecking organization policy and `CLAUDE_CODE_DISABLE_WEB_FETCH` at each call", "中文内容": "修复了 WebFetch 在每次调用时不重新检查组织策略和`CLAUDE_CODE_DISABLE_WEB_FETCH`的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed file titles, app names and session names in @-mentions from claude.ai and the desktop app sometimes being treated as text you typed", "中文内容": "修复了来自 claude.ai 和桌面应用程序的@提及中的文件标题、应用程序名称和会话名称有时被视为您键入的文本"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a multi-row status line being pushed off screen by a long prompt in the fullscreen renderer", "中文内容": "修复了全屏渲染器中的长提示将多行状态行推离屏幕的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where certificate errors behind a TLS-inspecting proxy persisted when the proxy itself is reached over `https://`", "中文内容": "修复了当通过`https://`访问代理本身时，TLS 检查代理后面的证书错误仍然存在的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Pro and Max accounts being offered feedback drafts that their organization would refuse", "中文内容": "修复了向 Pro 和 Max 帐户提供其组织拒绝的反馈草稿的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude in Chrome's policy message telling people to contact their admin when no admin setting can turn it on", "中文内容": "修复了 Chrome 政策消息中的克劳德 (Claude) 告诉人们在没有管理员设置可以打开它时联系管理员的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the artifact preview sometimes opening a different artifact than the one Claude just published", "中文内容": "修复了工件预览有时会打开与克劳德刚刚发布的工件不同的工件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed certificate name-constraint errors being retried for minutes; they now fail at once with a message that says what to fix", "中文内容": "修复了重试几分钟的证书名称约束错误；他们现在立即失败并显示一条消息，说明要修复什么"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude --teleport` opening an empty session when the server could not find the session's history, and `claude -p --teleport` exiting without an error when the resume failed", "中文内容": "修复了当服务器找不到会话历史记录时`claude --teleport`打开一个空会话，以及`claude -p --teleport`在恢复失败时退出且没有错误的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a misspelled keybinding modifier, such as `ctl+k`, binding the bare key; the binding is now ignored", "中文内容": "修复了拼写错误的键绑定修饰符，例如`ctl+k`，绑定裸键；现在绑定被忽略"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/btw` answers and recaps sometimes including earlier replies from the conversation", "中文内容": "修复了`/btw`答案和回顾，有时包括对话中的早期回复"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed start-up requests switching from an organization's managed proxy and CA settings to user-set ones when a read of the managed settings file failed", "中文内容": "修复了当读取托管设置文件失败时启动请求从组织的托管代理和 CA 设置切换到用户设置的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude giving a wrong reason when a new message interrupted a file it was sending you", "中文内容": "修复了当新消息中断发送给您的文件时克劳德给出错误原因的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` re-running a turn that a hook's `continue: false` had stopped", "中文内容": "修复了`CLAUDE_CODE_RESUME_INTERRUPTED_TURN`重新运行钩子`continue: false`已停止的回合"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude being told that automatic model switching is off when safeguards stopped a subagent whose model had no other model to switch to", "中文内容": "修复了克劳德被告知当防护措施停止其模型没有其他模型可切换的子代理时自动模型切换关闭的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the changed-files list of remote sessions leaving out files added with `git add -N` before the first commit", "中文内容": "修复了远程会话的更改文件列表，遗漏了在第一次提交之前使用`git add -N`添加的文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed some Claude in Chrome tool calls, such as `browser_batch`, not showing the tool's name in the fullscreen transcript (ctrl+o) or in a subagent's progress", "中文内容": "修复了 Chrome 中的一些 Claude 工具调用，例如`browser_batch`，在全屏记录 (ctrl+o) 或子代理进度中不显示工具名称"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed subagent progress summaries skipping an update when the reply took between 10 and 20 seconds", "中文内容": "修复了当回复时间在 10 到 20 秒之间时子代理进度摘要跳过更新的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude doctor` and `/status` saying a linked managed settings file is still read when it could not be read", "中文内容": "修复了`claude doctor`和`/status`表示无法读取链接的托管设置文件时仍可读取的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an interactive `--chrome` session giving no reason for starting without Claude in Chrome when your organization's policy turns it off: a line now says so", "中文内容": "修复了交互式`--chrome`会话，当您的组织的策略将其关闭时，没有理由在 Chrome 中没有 Claude 的情况下启动它：现在有一行这样说"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the `/rewind` list on network paths and hung folders: it named every tracked file as changed, was slow to show labels, and showed none at all when a file read never returned", "中文内容": "修复了网络路径和挂起文件夹上的`/rewind`列表：它将每个跟踪的文件命名为已更改的文件，显示标签的速度很慢，并且当读取的文件从未返回时根本不显示任何标签"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `--debug` and `--debug-file` replacing a file named `latest` in the debug log's folder", "中文内容": "修复了替换调试日志文件夹中名为`latest`的文件的`--debug`和`--debug-file`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a timed-out feedback send being reported as too large; it now says the request timed out", "中文内容": "修复了超时反馈发送被报告为太大的问题；现在说请求超时"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed screen reader mode cutting off an announcement when the system clock moved forward while it was being read", "中文内容": "修复了屏幕阅读器模式在读取系统时钟向前移动时切断通知的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed screen reader mode dropping dictated or pasted text, and emoji, typed into an answer to a question or permission prompt", "中文内容": "修复了屏幕阅读器模式丢弃听写或粘贴的文本以及表情符号、输入问题或权限提示的答案的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the name label under permission and plan dialogs hiding part of some agent names", "中文内容": "修复了权限和计划对话框下的名称标签隐藏部分代理名称的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where pressing Ctrl+C just as `claude update` finished removed the `claude` command", "中文内容": "修复了在`claude update`完成时按 Ctrl+C 删除`claude`命令的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the fullscreen header naming the session's effort level for a viewed subagent on a different model, which that subagent doesn't use", "中文内容": "修复了全屏标题，为不同模型上查看的子代理命名会话的工作级别，该子代理不使用该级别"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the model picker and `/model` showing a picked effort level that `CLAUDE_CODE_EFFORT_LEVEL` overrides", "中文内容": "修复了模型选择器和`/model`显示`CLAUDE_CODE_EFFORT_LEVEL`覆盖的所选工作级别的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the tip after a slow worktree creation suggesting a `sparsePaths` list without `.claude`, which left worktrees without your project settings and rules", "中文内容": "修复了工作树创建缓慢后的提示，建议使用不带`.claude`的`sparsePaths`列表，这会导致工作树没有项目设置和规则"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the newest model's highlight missing from the `/model` picker", "中文内容": "修复了`/model`选择器中缺少最新模型的突出显示的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/upgrade` and Ctrl+clicked links in fullscreen failing silently when no browser can open: the address is now shown", "中文内容": "修复了当没有浏览器可以打开时，全屏中的`/upgrade`和 Ctrl+单击链接会无提示地失败：现在显示地址"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Claude apps gateway's JSON logs escaping newlines and other control characters in a message twice", "中文内容": "修复了克劳德应用程序网关的 JSON 日志两次转义消息中的换行符和其他控制字符的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed terminal control sequences in a subagent's message taking effect instead of showing as plain text when the message is expanded", "中文内容": "修复了子代理消息中的终端控制序列在消息展开时生效而不是显示为纯文本的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude in Chrome setup saying `/chrome` finishes the connection; it now tells you to restart with `claude --chrome`", "中文内容": "修复了 Chrome 设置中 Claude 说`/chrome`完成连接的问题；它现在告诉你用`claude --chrome`重新启动"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Option-key hint appearing while typing ø or π inside words on Danish, Norwegian, Faroese and Greek keyboard layouts", "中文内容": "修复了在丹麦语、挪威语、法罗语和希腊语键盘布局上键入 ø 或 π 时出现的 Option 键提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a Claude Desktop session getting stuck as busy after another of your sessions sent it the same message twice or many messages at once", "中文内容": "修复了在另一个会话向其发送相同消息两次或同时发送多条消息后，克劳德桌面会话陷入忙碌状态的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed long tool results staying on disk after a session run with `--no-session-persistence`; they are now removed on normal exit, Ctrl+C or SIGTERM", "中文内容": "修复了使用`--no-session-persistence`运行会话后长期工具结果保留在磁盘上的问题；现在，它们会在正常退出、Ctrl+C 或 SIGTERM 时被删除"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `PreCompact`, `PostCompact` and post-compaction `SessionStart` hooks not receiving `agent_id` and `agent_type` when a subagent compacts", "中文内容": "修复了子代理压缩时`PreCompact`、`PostCompact`和压缩后`SessionStart`挂钩未接收`agent_id`和`agent_type`的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_TRANSCRIPT_LOCAL_GC` dropping messages from the saved transcript when another process rewrote the file while it was being trimmed", "中文内容": "修复了当另一个进程在修剪文件时重写文件时，`CLAUDE_CODE_TRANSCRIPT_LOCAL_GC`会从保存的记录中删除消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the \"Now using usage credits\" notice repeating or not showing past the weekly Fable limit when Claude Code made a quick side request on a smaller model, such as naming the session", "中文内容": "修复了当克劳德·代码对较小模型提出快速侧面请求（例如命名会话）时，“现在使用使用积分”通知重复或不显示超过每周寓言限制的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Fable's weekly limit showing no reset time and no options menu in the terminal", "中文内容": "修复了神鬼寓言的每周限制，显示终端中没有重置时间和选项菜单"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a wait chosen in the usage limit menu silently moving to a later reset when its request was refused; the menu now opens", "中文内容": "修复了在使用限制菜单中选择的等待，当其请求被拒绝时，默默地移动到稍后的重置；菜单现在打开"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the spend limit menu offering a lower limit when your current limit couldn't be loaded", "中文内容": "修复了当当前限额无法加载时支出限额菜单会提供下限的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/usage` hiding limit bars for setup tokens and `CLAUDE_CODE_OAUTH_TOKEN`: it keeps the session and weekly bars and says why the rest are missing", "中文内容": "修复了`/usage`隐藏设置令牌和`CLAUDE_CODE_OAUTH_TOKEN`的限制栏：它保留会话和每周栏，并说明为什么其余部分缺失"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/usage` showing a whole-session percentage beside a subagent type's name, and saying sessions ran 8 hours when it only counts hours with requests", "中文内容": "修复了`/usage`在子代理类型名称旁边显示整个会话百分比，并在仅计算请求小时数时显示会话运行了 8 小时的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed sessions showing as disconnected for a minute or more after a network change such as switching Wi-Fi or reconnecting a VPN", "中文内容": "远程控制：修复了网络更改（例如切换 Wi-Fi 或重新连接 VPN）后会话显示为断开连接一分钟或更长时间的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Remote Control showing nothing while Claude Code asks whether to use usage credits: the question now also shows in the Claude app", "中文内容": "修复了当克劳德代码询问是否使用使用积分时远程控制什么也不显示的问题：该问题现在也显示在克劳德应用程序中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Remote Control showing a session as running while it waited on a permission prompt that can only be answered in the terminal", "中文内容": "修复了远程控制在等待只能在终端中应答的权限提示时显示会话正在运行的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed `claude remote-control` reconnecting as a new computer when restarted in the same folder more than 4 hours after it stopped; it now keeps its identity for up to 30 days", "中文内容": "远程控制：修复了“克劳德远程控制”在停止超过 4 小时后在同一文件夹中重新启动时作为新计算机重新连接的问题；现在，它的身份最多可以保留 30 天"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed sessions left running at shutdown, and finished sessions holding their slot, when the disk stops responding", "中文内容": "远程控制：修复了关闭时仍运行的会话，以及当磁盘停止响应时已完成的会话保持其插槽的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed other devices and phone notifications not showing what Claude is asking permission for when `DISABLE_TELEMETRY` or `DO_NOT_TRACK` is set", "中文内容": "远程控制：修复了其他设备和电话通知在设置`DISABLE_TELEMETRY`或`DO_NOT_TRACK`时不显示克劳德请求许可的内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed the host exiting, or stopping reading a session's output, in verbose or debug mode when a tool call's `command` was a number, boolean or object", "中文内容": "远程控制：修复了当工具调用的“命令”是数字、布尔值或对象时，主机在详细或调试模式下退出或停止读取会话的输出"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed a host that could stall after sessions failed to start in folders on a filesystem that had stopped responding", "中文内容": "远程控制：修复了在已停止响应的文件系统上的文件夹中会话无法启动后主机可能停止运行的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed sessions from the desktop app showing as idle on your phone while background subagents were still running", "中文内容": "远程控制：修复了当后台子代理仍在运行时桌面应用程序中的会话在手机上显示为空闲的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Agent SDK's `managedSettings` ignoring the Remote Control, agent view, Workflows and Artifact off switches", "中文内容": "修复了代理 SDK 的“托管设置”忽略远程控制、代理视图、工作流程和工件关闭开关的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry export failing silently when an `otlp` exporter had an endpoint but no `OTEL_EXPORTER_OTLP_PROTOCOL`: it now defaults to `http/protobuf`", "中文内容": "修复了当`otlp`导出器有端点但没有`OTEL_EXPORTER_OTLP_PROTOCOL`时 OpenTelemetry 导出失败的问题：它现在默认为`http/protobuf`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry export to the default `localhost:4318` endpoint going through a configured proxy", "中文内容": "修复了通过配置的代理将 OpenTelemetry 导出到默认`localhost:4318`端点的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed one malformed `OTEL_RESOURCE_ATTRIBUTES` entry dropping all of that variable's attributes from the OpenTelemetry resource; the others are now kept, and `/status` names the one left off", "中文内容": "修复了一个格式错误的`OTEL_RESOURCE_ATTRIBUTES`条目，该条目从 OpenTelemetry 资源中删除该变量的所有属性；其他的现在被保留，`/status`命名了剩下的一个"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry `user_prompt` events and interaction spans recording a background agent's reply when `OTEL_LOG_ASSISTANT_RESPONSES=0`", "中文内容": "修复了当`OTEL_LOG_ASSISTANT_RESPONSES=0`时记录后台代理回复的 OpenTelemetry`user_prompt`事件和交互跨度"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry exports failing when a proxy took over 10 seconds to reach the collector; it now has 25 seconds, also the most that `OTEL_EXPORTER_OTLP_TIMEOUT` can allow (previously 30)", "中文内容": "修复了当代理花费 10 秒以上到达收集器时 OpenTelemetry 导出失败的问题；现在有 25 秒，也是 `OTEL_EXPORTER_OTLP_TIMEOUT` 可以允许的最长时间（之前是 30 秒）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry `agent.name` showing a user-defined subagent's name instead of `custom` when an official plugin's skill launched it", "中文内容": "修复了当官方插件的技能启动 OpenTelemetry `agent.name` 显示用户定义的子代理名称而不是 `custom` 的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude agents` showing a status from an earlier turn after a session resumes", "中文内容": "修复了“克劳德代理”在会话恢复后显示上一回合的状态的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed read-only git commands needing approval, or being refused under `claude -p`, when `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB` is set on Linux", "中文内容": "修复了在 Linux 上设置`CLAUDE_CODE_SUBPROCESS_ENV_SCRUB`时需要批准的只读 git 命令，或者在`claude -p`下被拒绝的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude agents` losing a typed prompt: Esc now needs a second press to clear it, and ctrl+y restores it", "中文内容": "修复了“claude Agents”丢失输入提示的问题：Esc 现在需要按第二次才能清除它，并且 ctrl+y 可以恢复它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the move-to-background key doing nothing in `claude attach` and `claude agents` sessions; to detach with Ctrl+B d, press d within 800 ms of Ctrl+B", "中文内容": "修复了移动到后台键在“claude Attach”和“claude Agents”会话中不执行任何操作的问题；要使用 Ctrl+B d 分离，请在 Ctrl+B 后 800 毫秒内按 d"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed background sessions ignoring a `DISABLE_ERROR_REPORTING` set only in your shell when the background service started without it", "中文内容": "修复了当后台服务在没有它的情况下启动时，后台会话忽略仅在 shell 中设置的`DISABLE_ERROR_REPORTING`的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed false \"needs input\" notifications in `claude agents` after replying to a blocked session, and repeated ones after a background turn ended with no text and only basic tools such as Bash or Read", "中文内容": "修复了回复被阻止的会话后“克劳德代理”中错误的“需要输入”通知，以及后台回合结束后重复的通知，没有文本，只有 Bash 或 Read 等基本工具"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude -p` silently using another model in text output when settings block the requested one; it now warns on stderr", "中文内容": "修复了当设置阻止请求的模型时，在文本输出中静默使用另一种模型的`claude -p`；现在它在 stderr 上发出警告"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude -p` printing notes about `deniedModels` and `availableModels` entries on every run; `/status` and `claude doctor` still list them", "中文内容": "修复了每次运行时`claude -p`打印有关`deniedModels`和`availableModels`条目的注释； `/status` 和 `claude doctor` 仍然列出它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Windows: Fixed some file-reading Bash commands running without a permission prompt when given a wildcard or a list of files", "中文内容": "Windows：修复了一些文件读取 Bash 命令在给定通配符或文件列表时没有权限提示的情况下运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Windows: Fixed Claude Code running a `.cmd` or `.bat` wrapper found beside a program's `.exe` in the same PATH folder (a `git.cmd` next to `git.exe`, say); it now runs the `.exe`, as `cmd.exe` would", "中文内容": "Windows：修正了克劳德代码运行在同一路径文件夹中程序的`.exe`旁边发现的`.cmd`或`.bat`包装器（例如`git.exe`旁边的`git.cmd`）；它现在运行`.exe`，就像`cmd.exe`一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Windows: Fixed shell commands failing with \"Working directory was deleted\" on drives where a folder's real path can't be resolved", "中文内容": "Windows：修复了在无法解析文件夹真实路径的驱动器上 shell 命令失败并显示“工作目录已删除”的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a cloud session's history becoming unreadable if its machine stopped just after the history was rewritten", "中文内容": "修复了如果云会话的机器在历史记录被重写后立即停止则其历史记录将变得不可读的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed scheduled tasks from an ended session sometimes not running after another session in the same folder used `/clear`, `/resume` or `/branch`", "中文内容": "修复了已结束会话中的计划任务有时在同一文件夹中使用`/clear`、`/resume`或`/branch`的另一个会话之后不运行的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an approved plan being answered with \"You are not in plan mode\" when the approval arrived after the session's process had restarted, in cloud, self-hosted runner and SDK sessions", "中文内容": "修复了在云、自托管运行器和 SDK 会话中，在会话进程重新启动后批准到达时，已批准的计划被回答为“您未处于计划模式”"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Cloud sessions: Fixed an answer to Claude's question being lost after a restart in a long conversation", "中文内容": "云会话：修复了在长时间对话中重新启动后克劳德问题的答案丢失的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a message dropping out of a cloud session's conversation when the session restarted before Claude replied", "中文内容": "修复了在克劳德回复之前会话重新启动时，一条消息从云会话的对话中丢失的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Cloud sessions: Fixed Claude saying an attached image is missing when the message names its file", "中文内容": "云会话：修正了克劳德在消息命名其文件时说附加图像丢失的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a resumed cloud session making a model call nobody asked for when files arrived right after a chat's first reply", "中文内容": "修复了当文件在聊天第一次回复后立即到达时，恢复的云会话会进行无人要求的模型调用"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed streamed replies in cloud sessions missing text from the middle when the session's container shut down partway through a reply", "中文内容": "修复了当会话的容器在回复中途关闭时，云会话中的流式回复丢失中间文本的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed skill files sent from Cowork cloud sessions sometimes failing to upload on the first try", "中文内容": "修复了从 Cowork 云会话发送的技能文件有时无法在第一次尝试上传的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Self-hosted runner: Reverted the exit code of an on-demand runner whose work order was superseded to 1; 2.1.321 and 2.1.322 had changed it to 0", "中文内容": "自托管运行器：将工作订单被取代的按需运行器的退出代码恢复为 1； 2.1.321和2.1.322已将其更改为0"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved sign-in errors in `/login` and `claude setup-token` for a rejected, unreachable or timed-out request: they now say what happened and what to check", "中文内容": "改进了`/login`和`claude setup-token`中拒绝、无法访问或超时请求的登录错误：它们现在会说明发生了什么以及要检查的内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved Bash permission checks so the same command more reliably gets the same answer on a slow or busy machine", "中文内容": "改进了 Bash 权限检查，因此相同的命令在缓慢或繁忙的计算机上更可靠地获得相同的答案"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved Bash permission checks: some commands that could run differently from how they were checked now ask for permission", "中文内容": "改进的 Bash 权限检查：一些可能与检查方式不同的命令现在请求权限"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved `/mcp` to show how many of a server's tools were
