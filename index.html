] Improved the error shown when the system refuses to run Claude Code: it now says your IT team can allow a blocked program", "中文内容": "[VSCode] 改进了系统拒绝运行 Claude Code 时显示的错误：现在显示您的 IT 团队可以允许被阻止的程序"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Improved the sign-in card to say what to do when the browser shows a connection error for localhost", "中文内容": "[VSCode] 改进了登录卡，以说明当浏览器显示 localhost 连接错误时该怎么做"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Changed the install link's marketplace confirmation button to \"Trust marketplace and continue\"", "中文内容": "[VSCode] 将安装链接的市场确认按钮更改为“信任市场并继续”"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[Claude Code on the web] Fixed new cloud sessions cutting MCP tool descriptions loaded through tool search at 4,096 characters; the limit is now 16,384, as in other Claude Code sessions", "中文内容": "[网络上的克劳德代码] 修复了新的云会话将通过工具搜索加载的 MCP 工具描述剪切为 4,096 个字符；与其他 Claude Code 会话一样，现在的限制为 16,384"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[Claude Tag] Fixed artifact links pasted in Slack getting no card when the poster's Claude sign-in had expired in a workspace their organization doesn't manage; a plain card now appears", "中文内容": "[Claude Tag] 修复了当发布者的 Claude 登录在其组织不管理的工作区中过期时，粘贴在 Slack 中的工件链接不会出现卡的问题；现在出现一张普通卡片"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added Code Mode, an experimental opt-in in which Claude writes JavaScript to call its tools; see https://code.claude.com/docs/en/code-mode to turn it on, or to turn it off for an organization", "中文内容": "添加了代码模式，这是一种实验性选择，克劳德可以在其中编写 JavaScript 来调用其工具；请参阅 https://code.claude.com/docs/en/code-mode 打开它，或为组织关闭它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `engines[\"claude-code\"]` to `plugin.json`: plugins outside their stated Claude Code version range are not installed, updated or loaded, and install and update pick the newest version that fits", "中文内容": "将 `engines[\"claude-code\"]` 添加到 `plugin.json`：未安装、更新或加载其规定的 Claude Code 版本范围之外的插件，安装和更新时选择适合的最新版本"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added type checking of a plugin's TypeScript hooks module to `claude plugin validate`; each finding is a warning, and `--strict` fails on it", "中文内容": "在`claude plugin validate`中添加了插件 TypeScript hooks 模块的类型检查；每个发现都是一个警告，并且`--strict`失败"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added to `claude plugin validate` the `$` nouns a mod's `engine.create` hook adds, withholds or replaces", "中文内容": "添加到`claude plugin validate`中的`$`名词，mod 的`engine.create`钩子添加、保留或替换"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added support for `CLAUDE_CODE_AUTO_MODE_MODEL` in managed settings for Claude Desktop sessions on third-party providers (takes effect once Claude Desktop includes this version)", "中文内容": "在第三方提供商的 Claude Desktop 会话的托管设置中添加了对`CLAUDE_CODE_AUTO_MODE_MODEL`的支持（Claude Desktop 包含此版本后生效）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added an options menu (stop, switch to usage credits, upgrade) when a model needs usage credits that are turned off or used up", "中文内容": "当模型需要关闭或用完的使用积分时添加了选项菜单（停止、切换到使用积分、升级）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a progress heartbeat every 30 seconds while hooks run long in `claude -p` and SDK sessions, so a host such as Claude Desktop won't end the turn as hung (once it includes this version)", "中文内容": "当钩子在`claude -p`和 SDK 会话中长时间运行时，每 30 秒添加一次进度心跳，因此像 Claude Desktop 这样的主机不会以挂起的方式结束回合（一旦包含此版本）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `.docx` support to Artifact tool asset uploads", "中文内容": "添加了对 Artifact 工具资产上传的`.docx`支持"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a `/diff to close` hint to the diff panel, and the keys that focus and close a panel to the `?` shortcut guide", "中文内容": "在 diff 面板中添加了`/diff to close`提示，并将聚焦和关闭面板的键添加到了`?`快捷方式指南中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a start-up warning for Bash allow rules with a `*` in a variable's value, such as `Bash(PORT=* npm run dev)`", "中文内容": "添加了针对变量值中带有`*`的 Bash 允许规则的启动警告，例如`Bash(PORT=* npm run dev)`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a warning when a plugin's language server can't start, naming the server and what to check", "中文内容": "添加了当插件的语言服务器无法启动时的警告、命名服务器以及要检查的内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added a one-time startup notice naming `CLAUDE_CODE_PERFORCE_MODE` when Perforce settings are found and the mode is off", "中文内容": "添加了一个一次性启动通知，当找到 Perforce 设置且模式关闭时，命名为`CLAUDE_CODE_PERFORCE_MODE`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `CLAUDE_CODE_DISABLE_AGENT_PROGRESS_SUMMARIES` (available since 2.1.318): set it to `1` to turn off subagent progress summaries and the requests that write them (anthropics/claude-code#86879)", "中文内容": "添加了`CLAUDE_CODE_DISABLE_AGENT_PROGRESS_SUMMARIES`（自 2.1.318 起可用）：将其设置为`1`以关闭子代理进度摘要以及写入它们的请求（anthropics/claude-code#86879）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `CLAUDE_CODE_RESUME_HINT_COMMAND`, which a program that starts Claude Code can set to have the exit hint name its own resume command", "中文内容": "添加了`CLAUDE_CODE_RESUME_HINT_COMMAND`，启动 Claude Code 的程序可以将其设置为具有自己的恢复命令的退出提示名称"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `unsetOptionCount` to the `claude plugin install --json` result: how many `userConfig` options are not yet set", "中文内容": "在 `claude plugin install --json` 结果中添加了 `unsetOptionCount`：尚未设置多少个 `userConfig` 选项"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "新增", "内容": "Added `isPromptCovered` to the props a mod's pane is drawn with, telling it when a dialog or a field above the prompt covers the prompt", "中文内容": "将`isPromptCovered`添加到绘制 mod 窗格的道具中，告诉它提示上方的对话框或字段何时覆盖提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed running `/compact` again, or after a command such as `/context`, summarizing away a message that Claude had not answered yet", "中文内容": "修复了再次运行`/compact`，或在执行`/context`等命令后，总结克劳德尚未回复的消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a resumed session joining your next message to an old interrupted message that was not resumed", "中文内容": "修复了已恢复的会话将您的下一条消息连接到未恢复的旧中断消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a memory spike at the next prompt after Claude changed a very large file", "中文内容": "修复了克劳德更改一个非常大的文件后下一个提示时的内存峰值"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a setting saved in a running session undoing a hand edit made to `settings.json` moments earlier; a settings file you delete during a session now stays deleted", "中文内容": "修复了保存在运行会话中的设置，撤消了之前对`settings.json`所做的手动编辑；您在会话期间删除的设置文件现在仍保持删除状态"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude plugin` commands and `claude mcp list` signing you out of a Console profile when they ended while the token was being renewed", "中文内容": "修复了`claude plugin`命令和`claude mcp list`在令牌更新期间结束时将您从控制台配置文件中注销的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Edit and Bash running out of memory on certain `/proc` files, and Edit hanging or running out of memory on devices and named pipes", "中文内容": "修复了编辑和 Bash 在某些`/proc`文件上运行内存不足的问题，以及编辑在设备和命名管道上挂起或运行内存不足的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude Code failing to start, or to clear stored credentials at sign-out, when saving its configuration file failed with \"Out of memory\"", "中文内容": "修复了当保存配置文件因“内存不足”而失败时，Claude Code 无法启动或无法在注销时清除存储的凭据的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed requests sent without streaming failing on errors that streamed requests recover from, such as a rejected image, thinking block or beta header", "中文内容": "修复了在没有流式传输的情况下发送的请求因流式请求恢复的错误而失败的问题，例如被拒绝的图像、思考块或 beta 标头"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `ExitWorktree`, the worktree exit dialog and `/resume` leaving the session in the wrong folder when the folder the shell was in before entering the worktree had been deleted", "中文内容": "修复了当 shell 在进入工作树之前所在的文件夹已被删除时，`ExitWorktree`、工作树退出对话框和`/resume`将会话留在错误的文件夹中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed accents and other combining marks sometimes landing left of the text, leaving stale copies on screen, or silently disappearing when text wraps", "中文内容": "修复了重音符号和其他组合标记有时落在文本左侧的问题，在屏幕上留下过时的副本，或者在文本换行时悄然消失"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the last key of a key chord, such as Enter in ctrl+x enter, acting on a dialog's text field when the chord's own action isn't available there", "中文内容": "修复了关键和弦的最后一个键，例如 ctrl+x Enter 中的 Enter，当和弦自己的操作不可用时作用于对话框的文本字段"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `ps` processes piling up when the process listing Claude Code runs before stopping a command takes too long", "中文内容": "修复了在停止命令之前运行列出 Claude Code 的进程花费太长时间时`ps`进程堆积的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed subagent transcripts and large tool results being saved apart from the session's transcript after entering a worktree created by a `WorktreeCreate` hook or belonging to a nested repository", "中文内容": "修复了在进入由`WorktreeCreate`挂钩创建的或属于嵌套存储库的工作树后，子代理记录和大型工具结果与会话记录分开保存的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a session on a named Anthropic profile moving to another sign-in when `/fork`, the Left arrow or `--bg` continued it in the background; reopen any session that was open during the update", "中文内容": "修复了当`/fork`、向左箭头或`--bg`在后台继续运行时，指定 Anthropic 配置文件上的会话会移动到另一个登录；重新打开更新期间打开的任何会话"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a background session sending a conversation under another sign-in when its named Anthropic profile is missing, changed or overridden; it now stops and says so", "中文内容": "修复了后台会话在其指定的 Anthropic 配置文件丢失、更改或覆盖时在另一个登录下发送对话的问题；它现在停下来并这样说"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a session on an API key, auth token or workload identity from its shell (not a setup token) moving to another sign-in in the background; it now stops and says so", "中文内容": "修复了 API 密钥、身份验证令牌或工作负载身份上的会话从其 shell（不是设置令牌）移动到后台另一个登录的问题；它现在停下来并这样说"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed MCP tool calls ending in the sign-in server's error, such as `TOKEN_EXPIRED`, instead of asking you to sign in again", "中文内容": "修复了 MCP 工具调用以登录服务器错误结束的问题，例如`TOKEN_EXPIRED`，而不是要求您再次登录"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an expired claude.ai login showing \"Credit balance too low\" when a saved Console key or `ant auth login` profile without credit was used instead", "中文内容": "修复了当使用保存的控制台密钥或没有信用的`ant auth login`配置文件时，过期的 claude.ai 登录显示“信用余额太低”的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a session on a named Anthropic profile being handed to an older background service that could not keep its sign-in; it now says to restart the service", "中文内容": "修复了一个名为 Anthropic 配置文件的会话被移交给无法保持登录的旧后台服务的问题；现在它说要重新启动服务"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a background session's sign-in leaving the previous account's login or other credentials in place; it now clears them for every session on the computer, and a refused sign-in can leave no login", "中文内容": "修复了后台会话登录时保留先前帐户的登录名或其他凭据的问题；现在，它会清除计算机上的每个会话，并且拒绝登录不会留下任何登录信息"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed background sessions moving between a profile and the stored login when an update restarted them", "中文内容": "修复了更新重新启动后台会话时在配置文件和存储的登录名之间移动的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed sessions opened before a sign-in keeping signed-out feature flags after the sign-in", "中文内容": "修复了登录前打开的会话在登录后保留注销功能标志的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed sessions that kept failing after a Claude apps gateway sign-in expired: once you sign in again with `/login` in another terminal, they carry on at the next message", "中文内容": "修复了克劳德应用程序网关登录过期后持续失败的会话：一旦您在另一个终端中使用`/login`再次登录，它们就会在下一条消息处继续"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the billing notice naming your `ant auth login` organization when a custom `X-Api-Key` header is set", "中文内容": "修复了设置自定义`X-Api-Key`标头时命名`ant auth login`组织的账单通知"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "macOS: Fixed \"Not logged in · Please run /login\" coming back right after a successful `/login` or a token refresh when the keychain was slow to answer", "中文内容": "macOS：修复了“未登录·请运行 /login”在成功`/login`或钥匙串响应缓慢时令牌刷新后立即返回的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed turns failing in Claude Desktop when an organization's gateway answers an expired token with 403: Claude Code now asks Desktop for a fresh token and retries", "中文内容": "修复了当组织的网关使用 403 应答过期令牌时 Claude Desktop 中的转向失败问题：Claude Code 现在要求 Desktop 提供新令牌并重试"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the error shown when Amazon Bedrock refuses your account a model: it no longer says to refresh your AWS credentials, it says to enable the model", "中文内容": "修复了 Amazon Bedrock 拒绝您的账户模型时显示的错误：它不再提示刷新您的 AWS 凭证，而是提示启用该模型"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the `awsAuthRefresh` or `gcpAuthRefresh` command sometimes running twice for one request when three or more sessions needed a fresh sign-in at once", "中文内容": "修复了当三个或更多会话需要一次重新登录时，`awsAuthRefresh`或`gcpAuthRefresh`命令有时会针对一个请求运行两次"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the `claude -p` warning about an ended claude.ai login to say that `claude auth logout` also removes saved MCP server logins and plugin secrets", "中文内容": "修复了有关 claude.ai 登录结束的`claude -p`警告，表示`claude auth logout`还会删除保存的 MCP 服务器登录信息和插件机密"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash permission prompts offering \"don't ask again\" for commands that write to sensitive paths such as `.git` or `.claude`, where the saved rule did not stop the next prompt", "中文内容": "修复了 Bash 权限提示，对于写入敏感路径（例如`.git`或`.claude`）的命令提供“不再询问”，其中保存的规则不会停止下一个提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where some `lsof` commands ran without a permission prompt", "中文内容": "修复了某些`lsof`命令在没有权限提示的情况下运行的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash commands that write a file with `cat > file <<EOF` being shown as \"Read 1 file\"", "中文内容": "修复了使用 `cat > file <<EOF` 写入文件的 Bash 命令显示为“读取 1 个文件”"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where Bash permission checks judged an `rm` from the wrong folder and skipped the dangerous-removal prompt under bypass permissions or a Bash allow rule", "中文内容": "修复了 Bash 权限检查从错误的文件夹中判断出`rm`并在绕过权限或 Bash 允许规则下跳过危险删除提示的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `--permission-mode auto` or a settings `defaultMode: auto` starting in a mode that could allow more when auto mode was unavailable. It now starts in Manual mode, which asks first", "中文内容": "修复了`--permission-mode auto`或设置“defaultMode：auto”，该设置在自动模式不可用时允许更多的模式启动。现在以手动模式启动，该模式首先询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plan files sometimes being written outside the project when `plansDirectory` is set; a write that can't be shown to stay inside the project is now refused", "中文内容": "修复了设置`plansDirectory`时有时会在项目外部写入计划文件的问题；无法显示为留在项目内的写入现在被拒绝"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a permission prompt when Claude read the output of its own background command or agent after entering a worktree", "中文内容": "修复了克劳德进入工作树后读取自己后台命令或代理的输出时的权限提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where Bash permission checks missed part of a command", "中文内容": "修复了 Bash 权限检查遗漏部分命令的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where the Bash sandbox could switch off during a session", "中文内容": "修复了 Bash 沙箱可能在会话期间关闭的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash allow rules with an attached wildcard, such as `Bash(ls*)`, skipping the permission prompt in some cases; a rule that names a variable, such as `Bash(NODE_ENV*)`, now asks", "中文内容": "修复了带有附加通配符的 Bash 允许规则，例如`Bash(ls*)`，在某些情况下会跳过权限提示；命名变量的规则，例如`Bash(NODE_ENV*)`，现在会询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed auto mode running behind a gateway at `ANTHROPIC_BASE_URL` on a model whose gateway name contains \"haiku\"; such a model, other than `claude-haiku-5-5`, is now refused, as Haiku 4.5 is", "中文内容": "修复了在网关名称包含“haiku”的模型上在`ANTHROPIC_BASE_URL`处的网关后面运行的自动模式；除`claude-haiku-5-5`之外的此类模型现在已被拒绝，因为 Haiku 4.5 是"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash deny and ask rules missing some commands run through `sudo`, `env` and similar wrappers", "中文内容": "修复了 Bash 拒绝和询问规则缺少一些通过`sudo`、`env`和类似包装器运行的命令"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Bash allow rules written with combined `sudo` flags skipping the permission prompt in some cases", "中文内容": "修复了 Bash 允许使用组合`sudo`标志编写的规则在某些情况下跳过权限提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `sandbox.excludedCommands` letting a command that it does not name run outside the sandbox in some cases", "中文内容": "修复了`sandbox.excludedCommands`，在某些情况下允许未命名的命令在沙箱外部运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where the Write and Edit tools could write to a path covered by a `Read` deny rule", "中文内容": "修复了写入和编辑工具可以写入“读取”拒绝规则覆盖的路径的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where a Bash command ran without a permission prompt for zsh users with certain non-default shell options set", "中文内容": "修复了以下情况：对于设置了某些非默认 shell 选项的 zsh 用户，运行 Bash 命令时没有权限提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Bash sandbox not fully protecting Claude Code's own config on installs still using the legacy config file", "中文内容": "修复了 Bash 沙箱无法完全保护 Claude Code 在安装时仍使用旧配置文件的配置"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a permission prompt from a mod's `tool.check` hook naming every plugin hooked on the tool instead of the one that asked", "中文内容": "修复了 mod 的`tool.check`挂钩的权限提示，命名了该工具上挂钩的每个插件，而不是要求的插件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed sandboxed commands being able to read Claude Code's file checkpoint copies under the config directory", "中文内容": "修复了沙盒命令能够读取 config 目录下 Claude Code 的文件检查点副本的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a rewind sometimes changing your permission mode", "中文内容": "修复了有时会改变您的权限模式的倒带"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed project settings sometimes being read through a symbolic link that leads to a different folder than the one Claude Code checked", "中文内容": "修复了有时通过符号链接读取项目设置的问题，该链接会导致与检查的克劳德代码不同的文件夹"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed HTTP hooks failing with HTTP 500 on Linux when `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB` is set and `sandbox.enabled` is off", "中文内容": "修复了当设置`CLAUDE_CODE_SUBPROCESS_ENV_SCRUB`且`sandbox.enabled`关闭时 HTTP 挂钩在 Linux 上失败并出现 HTTP 500 的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude -p` and the Agent SDK running Bash unsandboxed when `--settings` or SDK settings that turn the sandbox on fail validation; Claude Code now stops at start-up and names the invalid setting", "中文内容": "修复了`claude -p`和当`--settings`或 SDK 设置打开沙箱时未沙箱运行 Bash 的代理 SDK 验证失败的问题；克劳德代码现在在启动时停止并命名无效设置"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/export` silently stopping early after a long run of calls to an MCP tool that is no longer loaded", "中文内容": "修复了`/export`在长时间调用不再加载的 MCP 工具后提前静默停止的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed earlier MCP tool calls missing from a resumed conversation, and lines repeating in scrollback, when the server connects late", "中文内容": "修复了当服务器连接较晚时，早期的 MCP 工具调用从恢复的对话中丢失以及回滚中重复的行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude mcp add --help` splitting long example commands across lines in narrow terminals and pipes, so a pasted example ran without its header", "中文内容": "修复了`claude mcp add --help`在狭窄的终端和管道中跨行分割长示例命令的问题，因此粘贴的示例在没有标题的情况下运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugins with `defaultEnabled: false` staying off in a claude.ai chat's cloud session after you turn them on in claude.ai", "中文内容": "修复了在 claude.ai 中打开`defaultEnabled: false`插件后，它们在 claude.ai 聊天的云会话中保持关闭状态的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/fast on` and `/fast off` on Vertex not asking a plugin's `config.set` hook, as the `/fast` menu does", "中文内容": "修复了 Vertex 上的`/fast on`和`/fast off`不询问插件的`config.set`挂钩的问题，就像`/fast`菜单那样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed documents created through the Claude Docs connector not opening in your browser when you work in a terminal", "中文内容": "修复了当您在终端中工作时通过 Claude Docs 连接器创建的文档无法在浏览器中打开的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the misleading \"not cached\" error for a plugin only a repository's settings enable: it now says it isn't installed, gives the install command, and shows in text and stream-json `-p` runs", "中文内容": "修复了插件的误导性“未缓存”错误，仅启用存储库的设置：它现在表示未安装，给出安装命令，并在文本和流 json `-p` 中显示运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed mods being able to reword Claude Code's own confirmation questions", "中文内容": "修复了模组能够改写克劳德·代码自己的确认问题的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a mod's hot reload sometimes ignoring a file created just after a failed reload", "中文内容": "修复了 mod 的热重载有时会忽略重新加载失败后创建的文件的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed marketplaces named `npm`, `pip`, `uv`, `cargo`, `github` or `gh` being refused as reserved names", "中文内容": "修复了名为`npm`、`pip`、`uv`、`cargo`、`github`或`gh`的市场被拒绝作为保留名称的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a stopped MCP call, or a stopped shell command in fullscreen, reading as \"Called\" or \"Ran\" in a collapsed tool group: it now says no result was recorded and shows its input", "中文内容": "修复了停止的 MCP 调用或全屏停止的 shell 命令，在折叠的工具组中读取为“Called”或“Ran”：现在显示未记录任何结果并显示其输入"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed load errors of plugins enabled by managed settings going only to the debug log in SDK and Desktop sessions: `init.plugin_errors` now lists them", "中文内容": "修复了托管设置启用的插件的加载错误，该错误仅进入 SDK 和桌面会话中的调试日志：`init.plugin_errors`现在列出了它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugin installs hiding what a plugin's install command wrote to stderr when that command succeeded, such as a note that the plugin has no skills yet", "中文内容": "修复了插件安装隐藏插件安装命令在命令成功时写入 stderr 的内容，例如插件尚无技能的注释"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed one malformed entry in a plugin marketplace's `renames` map making Claude Code ignore the marketplace's other renames", "中文内容": "修复了插件市场“重命名”地图中的一个格式错误的条目，导致克劳德代码忽略市场的其他重命名"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude --bg --safe-mode` sessions stopping at startup to ask about project MCP servers that safe mode never starts", "中文内容": "修复了`claude --bg --safe-mode`会话在启动时停止以询问安全模式永远不会启动的项目 MCP 服务器的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed MCP link prompts offering Accept for non-http links without saying the link wouldn't open", "中文内容": "修复了 MCP 链接提示，为非 http 链接提供“接受”，而不表示链接无法打开"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/mcp` and `/plugins` opening an MCP server's page with the cursor on \"Disable\" when the server needs authentication but still holds its sign-in; the page now offers \"Reconnect\" and opens on it", "中文内容": "修复了当服务器需要身份验证但仍保持登录状态时，`/mcp` 和 `/plugins` 打开 MCP 服务器页面时光标位于“禁用”上的问题；该页面现在提供“重新连接”并在其上打开"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugins with a version list in `enabledPlugins` staying off with no message: `/plugin` and `claude plugin list` now say why", "中文内容": "修复了`enabledPlugins`中版本列表不显示任何消息的插件：`/plugin`和“claude 插件列表”现在说明原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed plugins and marketplaces failing to install on Windows when the path of a cloned file reaches 260 characters", "中文内容": "修复了当克隆文件的路径达到 260 个字符时插件和市场无法在 Windows 上安装的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a Stop pressed right after sending a message showing as an error in remote and SDK sessions while a `UserPromptSubmit` or plugin prompt hook was still running", "中文内容": "修复了在`UserPromptSubmit`或插件提示挂钩仍在运行时发送消息后立即按下“停止”的问题，该消息在远程和 SDK 会话中显示为错误"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an MCP server staying disconnected with no tools after an Agent SDK app or `claude -p` caller removed and re-added it, when a tool call had tried to reach it in between", "中文内容": "修复了代理 SDK 应用程序或`claude -p`调用者删除并重新添加 MCP 服务器后，当工具调用试图在中间访问它时，MCP 服务器在没有任何工具的情况下保持断开连接的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed text-output `claude -p` runs printing nothing to stderr when a `--plugin-dir` mod's hook hangs or crashes the hooks worker", "中文内容": "修复了当 `--plugin-dir` mod 的钩子挂起或使钩子工作线程崩溃时，文本输出 `claude -p` 不会向 stderr 打印任何内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed SDK sessions giving an MCP server named by `--allowedTools` or an `mcp_tool` hook less than 2s before the first turn when settings lowered `CLAUDE_CODE_MCP_STARTUP_WAIT_MS` after start-up", "中文内容": "修复了当设置在启动后降低`CLAUDE_CODE_MCP_STARTUP_WAIT_MS`时，在第一回合前不到 2 秒提供由`--allowedTools`命名的 MCP 服务器或`mcp_tool`挂钩的 SDK 会话"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed headless sessions ending when an SDK host sent a null entry in an MCP server's tools list", "中文内容": "修复了当 SDK 主机在 MCP 服务器的工具列表中发送空条目时结束的无头会话"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed WebFetch dropping empty table cells and shifting later values a column left", "中文内容": "修复了 WebFetch 删除空表格单元格并将后面的值向左移动一列的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed temporary files of a session that had changed directory being left behind when the session expired under `cleanupPeriodDays`", "中文内容": "修复了当会话在`cleanupPeriodDays`下过期时留下的已更改目录的会话的临时文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed managed settings (`managed-settings.json`, `managed-settings.d`) sometimes being missed at start-up while another program was rewriting the file: start-up now reads such a file a second time", "中文内容": "修复了托管设置（“托管设置.json”、“托管设置.d”）有时会在启动时丢失，而另一个程序正在重写该文件：启动现在会第二次读取此类文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `.claude/settings.local.json` not being ignored globally when the folder became a git repository later, or on a new machine", "中文内容": "修复了当文件夹稍后成为 git 存储库或在新计算机上时，`.claude/settings.local.json` 不会被全局忽略的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/diff` waiting for Claude to finish before closing the diff panel in fullscreen", "中文内容": "修复了`/diff`在全屏关闭 diff 面板之前等待 Claude 完成的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/memory` showing wrong or roundabout paths for folders whose names start with the working directory's or home folder's name, and losing slashes in the file path on Windows", "中文内容": "修复了`/memory`显示名称以工作目录或主文件夹名称开头的文件夹的错误或迂回路径，以及在 Windows 上文件路径中丢失斜杠的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a broken emoji character in a tool call's parameter name being resent with later requests, which strict JSON parsers reject", "中文内容": "修复了工具调用的参数名称中损坏的表情符号字符会随后续请求重新发送，而严格的 JSON 解析器会拒绝该字符"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a collapsed tool call looking as if it ran after you rejected it with a reason: it now shows \"Not run · rejected\"", "中文内容": "修复了折叠的工具调用，看起来好像是在您因某种原因拒绝后运行的：它现在显示“未运行·被拒绝”"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where part of a saved session could be lost on NFS or FUSE file systems when Claude Code discarded a reply", "中文内容": "修复了当 Claude Code 丢弃回复时，部分已保存会话可能会在 NFS 或 FUSE 文件系统上丢失的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed WebFetch not rechecking organization policy and `CLAUDE_CODE_DISABLE_WEB_FETCH` at each call", "中文内容": "修复了 WebFetch 在每次调用时不重新检查组织策略和`CLAUDE_CODE_DISABLE_WEB_FETCH`的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed file titles, app names and session names in @-mentions from claude.ai and the desktop app sometimes being treated as text you typed", "中文内容": "修复了来自 claude.ai 和桌面应用程序的@提及中的文件标题、应用程序名称和会话名称有时被视为您键入的文本"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a multi-row status line being pushed off screen by a long prompt in the fullscreen renderer", "中文内容": "修复了全屏渲染器中的长提示将多行状态行推离屏幕的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where certificate errors behind a TLS-inspecting proxy persisted when the proxy itself is reached over `https://`", "中文内容": "修复了当通过`https://`访问代理本身时，TLS 检查代理后面的证书错误仍然存在的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Pro and Max accounts being offered feedback drafts that their organization would refuse", "中文内容": "修复了向 Pro 和 Max 帐户提供其组织拒绝的反馈草稿的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude in Chrome's policy message telling people to contact their admin when no admin setting can turn it on", "中文内容": "修复了 Chrome 政策消息中的克劳德 (Claude) 告诉人们在没有管理员设置可以打开它时联系管理员的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the artifact preview sometimes opening a different artifact than the one Claude just published", "中文内容": "修复了工件预览有时会打开与克劳德刚刚发布的工件不同的工件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed certificate name-constraint errors being retried for minutes; they now fail at once with a message that says what to fix", "中文内容": "修复了重试几分钟的证书名称约束错误；他们现在立即失败并显示一条消息，说明要修复什么"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude --teleport` opening an empty session when the server could not find the session's history, and `claude -p --teleport` exiting without an error when the resume failed", "中文内容": "修复了当服务器找不到会话历史记录时`claude --teleport`打开一个空会话，以及`claude -p --teleport`在恢复失败时退出且没有错误的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a misspelled keybinding modifier, such as `ctl+k`, binding the bare key; the binding is now ignored", "中文内容": "修复了拼写错误的键绑定修饰符，例如`ctl+k`，绑定裸键；现在绑定被忽略"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/btw` answers and recaps sometimes including earlier replies from the conversation", "中文内容": "修复了`/btw`答案和回顾，有时包括对话中的早期回复"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed start-up requests switching from an organization's managed proxy and CA settings to user-set ones when a read of the managed settings file failed", "中文内容": "修复了当读取托管设置文件失败时启动请求从组织的托管代理和 CA 设置切换到用户设置的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude giving a wrong reason when a new message interrupted a file it was sending you", "中文内容": "修复了当新消息中断发送给您的文件时克劳德给出错误原因的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` re-running a turn that a hook's `continue: false` had stopped", "中文内容": "修复了`CLAUDE_CODE_RESUME_INTERRUPTED_TURN`重新运行钩子`continue: false`已停止的回合"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude being told that automatic model switching is off when safeguards stopped a subagent whose model had no other model to switch to", "中文内容": "修复了克劳德被告知当防护措施停止其模型没有其他模型可切换的子代理时自动模型切换关闭的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the changed-files list of remote sessions leaving out files added with `git add -N` before the first commit", "中文内容": "修复了远程会话的更改文件列表，遗漏了在第一次提交之前使用`git add -N`添加的文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed some Claude in Chrome tool calls, such as `browser_batch`, not showing the tool's name in the fullscreen transcript (ctrl+o) or in a subagent's progress", "中文内容": "修复了 Chrome 中的一些 Claude 工具调用，例如`browser_batch`，在全屏记录 (ctrl+o) 或子代理进度中不显示工具名称"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed subagent progress summaries skipping an update when the reply took between 10 and 20 seconds", "中文内容": "修复了当回复时间在 10 到 20 秒之间时子代理进度摘要跳过更新的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude doctor` and `/status` saying a linked managed settings file is still read when it could not be read", "中文内容": "修复了`claude doctor`和`/status`表示无法读取链接的托管设置文件时仍可读取的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an interactive `--chrome` session giving no reason for starting without Claude in Chrome when your organization's policy turns it off: a line now says so", "中文内容": "修复了交互式`--chrome`会话，当您的组织的策略将其关闭时，没有理由在 Chrome 中没有 Claude 的情况下启动它：现在有一行这样说"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the `/rewind` list on network paths and hung folders: it named every tracked file as changed, was slow to show labels, and showed none at all when a file read never returned", "中文内容": "修复了网络路径和挂起文件夹上的`/rewind`列表：它将每个跟踪的文件命名为已更改的文件，显示标签的速度很慢，并且当读取的文件从未返回时根本不显示任何标签"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `--debug` and `--debug-file` replacing a file named `latest` in the debug log's folder", "中文内容": "修复了替换调试日志文件夹中名为`latest`的文件的`--debug`和`--debug-file`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a timed-out feedback send being reported as too large; it now says the request timed out", "中文内容": "修复了超时反馈发送被报告为太大的问题；现在说请求超时"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed screen reader mode cutting off an announcement when the system clock moved forward while it was being read", "中文内容": "修复了屏幕阅读器模式在读取系统时钟向前移动时切断通知的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed screen reader mode dropping dictated or pasted text, and emoji, typed into an answer to a question or permission prompt", "中文内容": "修复了屏幕阅读器模式丢弃听写或粘贴的文本以及表情符号、输入问题或权限提示的答案的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the name label under permission and plan dialogs hiding part of some agent names", "中文内容": "修复了权限和计划对话框下的名称标签隐藏部分代理名称的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a case where pressing Ctrl+C just as `claude update` finished removed the `claude` command", "中文内容": "修复了在`claude update`完成时按 Ctrl+C 删除`claude`命令的情况"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the fullscreen header naming the session's effort level for a viewed subagent on a different model, which that subagent doesn't use", "中文内容": "修复了全屏标题，为不同模型上查看的子代理命名会话的工作级别，该子代理不使用该级别"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the model picker and `/model` showing a picked effort level that `CLAUDE_CODE_EFFORT_LEVEL` overrides", "中文内容": "修复了模型选择器和`/model`显示`CLAUDE_CODE_EFFORT_LEVEL`覆盖的所选工作级别的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the tip after a slow worktree creation suggesting a `sparsePaths` list without `.claude`, which left worktrees without your project settings and rules", "中文内容": "修复了工作树创建缓慢后的提示，建议使用不带`.claude`的`sparsePaths`列表，这会导致工作树没有项目设置和规则"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the newest model's highlight missing from the `/model` picker", "中文内容": "修复了`/model`选择器中缺少最新模型的突出显示的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/upgrade` and Ctrl+clicked links in fullscreen failing silently when no browser can open: the address is now shown", "中文内容": "修复了当没有浏览器可以打开时，全屏中的`/upgrade`和 Ctrl+单击链接会无提示地失败：现在显示地址"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Claude apps gateway's JSON logs escaping newlines and other control characters in a message twice", "中文内容": "修复了克劳德应用程序网关的 JSON 日志两次转义消息中的换行符和其他控制字符的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed terminal control sequences in a subagent's message taking effect instead of showing as plain text when the message is expanded", "中文内容": "修复了子代理消息中的终端控制序列在消息展开时生效而不是显示为纯文本的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Claude in Chrome setup saying `/chrome` finishes the connection; it now tells you to restart with `claude --chrome`", "中文内容": "修复了 Chrome 设置中 Claude 说`/chrome`完成连接的问题；它现在告诉你用`claude --chrome`重新启动"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Option-key hint appearing while typing ø or π inside words on Danish, Norwegian, Faroese and Greek keyboard layouts", "中文内容": "修复了在丹麦语、挪威语、法罗语和希腊语键盘布局上键入 ø 或 π 时出现的 Option 键提示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a Claude Desktop session getting stuck as busy after another of your sessions sent it the same message twice or many messages at once", "中文内容": "修复了在另一个会话向其发送相同消息两次或同时发送多条消息后，克劳德桌面会话陷入忙碌状态的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed long tool results staying on disk after a session run with `--no-session-persistence`; they are now removed on normal exit, Ctrl+C or SIGTERM", "中文内容": "修复了使用`--no-session-persistence`运行会话后长期工具结果保留在磁盘上的问题；现在，它们会在正常退出、Ctrl+C 或 SIGTERM 时被删除"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `PreCompact`, `PostCompact` and post-compaction `SessionStart` hooks not receiving `agent_id` and `agent_type` when a subagent compacts", "中文内容": "修复了子代理压缩时`PreCompact`、`PostCompact`和压缩后`SessionStart`挂钩未接收`agent_id`和`agent_type`的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_TRANSCRIPT_LOCAL_GC` dropping messages from the saved transcript when another process rewrote the file while it was being trimmed", "中文内容": "修复了当另一个进程在修剪文件时重写文件时，`CLAUDE_CODE_TRANSCRIPT_LOCAL_GC`会从保存的记录中删除消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the \"Now using usage credits\" notice repeating or not showing past the weekly Fable limit when Claude Code made a quick side request on a smaller model, such as naming the session", "中文内容": "修复了当克劳德·代码对较小模型提出快速侧面请求（例如命名会话）时，“现在使用使用积分”通知重复或不显示超过每周寓言限制的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Fable's weekly limit showing no reset time and no options menu in the terminal", "中文内容": "修复了神鬼寓言的每周限制，显示终端中没有重置时间和选项菜单"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a wait chosen in the usage limit menu silently moving to a later reset when its request was refused; the menu now opens", "中文内容": "修复了在使用限制菜单中选择的等待，当其请求被拒绝时，默默地移动到稍后的重置；菜单现在打开"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the spend limit menu offering a lower limit when your current limit couldn't be loaded", "中文内容": "修复了当当前限额无法加载时支出限额菜单会提供下限的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/usage` hiding limit bars for setup tokens and `CLAUDE_CODE_OAUTH_TOKEN`: it keeps the session and weekly bars and says why the rest are missing", "中文内容": "修复了`/usage`隐藏设置令牌和`CLAUDE_CODE_OAUTH_TOKEN`的限制栏：它保留会话和每周栏，并说明为什么其余部分缺失"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `/usage` showing a whole-session percentage beside a subagent type's name, and saying sessions ran 8 hours when it only counts hours with requests", "中文内容": "修复了`/usage`在子代理类型名称旁边显示整个会话百分比，并在仅计算请求小时数时显示会话运行了 8 小时的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed sessions showing as disconnected for a minute or more after a network change such as switching Wi-Fi or reconnecting a VPN", "中文内容": "远程控制：修复了网络更改（例如切换 Wi-Fi 或重新连接 VPN）后会话显示为断开连接一分钟或更长时间的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Remote Control showing nothing while Claude Code asks whether to use usage credits: the question now also shows in the Claude app", "中文内容": "修复了当克劳德代码询问是否使用使用积分时远程控制什么也不显示的问题：该问题现在也显示在克劳德应用程序中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed Remote Control showing a session as running while it waited on a permission prompt that can only be answered in the terminal", "中文内容": "修复了远程控制在等待只能在终端中应答的权限提示时显示会话正在运行的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed `claude remote-control` reconnecting as a new computer when restarted in the same folder more than 4 hours after it stopped; it now keeps its identity for up to 30 days", "中文内容": "远程控制：修复了“克劳德远程控制”在停止超过 4 小时后在同一文件夹中重新启动时作为新计算机重新连接的问题；现在，它的身份最多可以保留 30 天"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed sessions left running at shutdown, and finished sessions holding their slot, when the disk stops responding", "中文内容": "远程控制：修复了关闭时仍运行的会话，以及当磁盘停止响应时已完成的会话保持其插槽的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed other devices and phone notifications not showing what Claude is asking permission for when `DISABLE_TELEMETRY` or `DO_NOT_TRACK` is set", "中文内容": "远程控制：修复了其他设备和电话通知在设置`DISABLE_TELEMETRY`或`DO_NOT_TRACK`时不显示克劳德请求许可的内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed the host exiting, or stopping reading a session's output, in verbose or debug mode when a tool call's `command` was a number, boolean or object", "中文内容": "远程控制：修复了当工具调用的“命令”是数字、布尔值或对象时，主机在详细或调试模式下退出或停止读取会话的输出"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed a host that could stall after sessions failed to start in folders on a filesystem that had stopped responding", "中文内容": "远程控制：修复了在已停止响应的文件系统上的文件夹中会话无法启动后主机可能停止运行的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Remote Control: Fixed sessions from the desktop app showing as idle on your phone while background subagents were still running", "中文内容": "远程控制：修复了当后台子代理仍在运行时桌面应用程序中的会话在手机上显示为空闲的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the Agent SDK's `managedSettings` ignoring the Remote Control, agent view, Workflows and Artifact off switches", "中文内容": "修复了代理 SDK 的“托管设置”忽略远程控制、代理视图、工作流程和工件关闭开关的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry export failing silently when an `otlp` exporter had an endpoint but no `OTEL_EXPORTER_OTLP_PROTOCOL`: it now defaults to `http/protobuf`", "中文内容": "修复了当`otlp`导出器有端点但没有`OTEL_EXPORTER_OTLP_PROTOCOL`时 OpenTelemetry 导出失败的问题：它现在默认为`http/protobuf`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry export to the default `localhost:4318` endpoint going through a configured proxy", "中文内容": "修复了通过配置的代理将 OpenTelemetry 导出到默认`localhost:4318`端点的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed one malformed `OTEL_RESOURCE_ATTRIBUTES` entry dropping all of that variable's attributes from the OpenTelemetry resource; the others are now kept, and `/status` names the one left off", "中文内容": "修复了一个格式错误的`OTEL_RESOURCE_ATTRIBUTES`条目，该条目从 OpenTelemetry 资源中删除该变量的所有属性；其他的现在被保留，`/status`命名了剩下的一个"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry `user_prompt` events and interaction spans recording a background agent's reply when `OTEL_LOG_ASSISTANT_RESPONSES=0`", "中文内容": "修复了当`OTEL_LOG_ASSISTANT_RESPONSES=0`时记录后台代理回复的 OpenTelemetry`user_prompt`事件和交互跨度"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry exports failing when a proxy took over 10 seconds to reach the collector; it now has 25 seconds, also the most that `OTEL_EXPORTER_OTLP_TIMEOUT` can allow (previously 30)", "中文内容": "修复了当代理花费 10 秒以上到达收集器时 OpenTelemetry 导出失败的问题；现在有 25 秒，也是 `OTEL_EXPORTER_OTLP_TIMEOUT` 可以允许的最长时间（之前是 30 秒）"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed OpenTelemetry `agent.name` showing a user-defined subagent's name instead of `custom` when an official plugin's skill launched it", "中文内容": "修复了当官方插件的技能启动 OpenTelemetry `agent.name` 显示用户定义的子代理名称而不是 `custom` 的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude agents` showing a status from an earlier turn after a session resumes", "中文内容": "修复了“克劳德代理”在会话恢复后显示上一回合的状态的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed read-only git commands needing approval, or being refused under `claude -p`, when `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB` is set on Linux", "中文内容": "修复了在 Linux 上设置`CLAUDE_CODE_SUBPROCESS_ENV_SCRUB`时需要批准的只读 git 命令，或者在`claude -p`下被拒绝的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude agents` losing a typed prompt: Esc now needs a second press to clear it, and ctrl+y restores it", "中文内容": "修复了“claude Agents”丢失输入提示的问题：Esc 现在需要按第二次才能清除它，并且 ctrl+y 可以恢复它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed the move-to-background key doing nothing in `claude attach` and `claude agents` sessions; to detach with Ctrl+B d, press d within 800 ms of Ctrl+B", "中文内容": "修复了移动到后台键在“claude Attach”和“claude Agents”会话中不执行任何操作的问题；要使用 Ctrl+B d 分离，请在 Ctrl+B 后 800 毫秒内按 d"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed background sessions ignoring a `DISABLE_ERROR_REPORTING` set only in your shell when the background service started without it", "中文内容": "修复了当后台服务在没有它的情况下启动时，后台会话忽略仅在 shell 中设置的`DISABLE_ERROR_REPORTING`的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed false \"needs input\" notifications in `claude agents` after replying to a blocked session, and repeated ones after a background turn ended with no text and only basic tools such as Bash or Read", "中文内容": "修复了回复被阻止的会话后“克劳德代理”中错误的“需要输入”通知，以及后台回合结束后重复的通知，没有文本，只有 Bash 或 Read 等基本工具"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude -p` silently using another model in text output when settings block the requested one; it now warns on stderr", "中文内容": "修复了当设置阻止请求的模型时，在文本输出中静默使用另一种模型的`claude -p`；现在它在 stderr 上发出警告"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed `claude -p` printing notes about `deniedModels` and `availableModels` entries on every run; `/status` and `claude doctor` still list them", "中文内容": "修复了每次运行时`claude -p`打印有关`deniedModels`和`availableModels`条目的注释； `/status` 和 `claude doctor` 仍然列出它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Windows: Fixed some file-reading Bash commands running without a permission prompt when given a wildcard or a list of files", "中文内容": "Windows：修复了一些文件读取 Bash 命令在给定通配符或文件列表时没有权限提示的情况下运行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Windows: Fixed Claude Code running a `.cmd` or `.bat` wrapper found beside a program's `.exe` in the same PATH folder (a `git.cmd` next to `git.exe`, say); it now runs the `.exe`, as `cmd.exe` would", "中文内容": "Windows：修正了克劳德代码运行在同一路径文件夹中程序的`.exe`旁边发现的`.cmd`或`.bat`包装器（例如`git.exe`旁边的`git.cmd`）；它现在运行`.exe`，就像`cmd.exe`一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Windows: Fixed shell commands failing with \"Working directory was deleted\" on drives where a folder's real path can't be resolved", "中文内容": "Windows：修复了在无法解析文件夹真实路径的驱动器上 shell 命令失败并显示“工作目录已删除”的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a cloud session's history becoming unreadable if its machine stopped just after the history was rewritten", "中文内容": "修复了如果云会话的机器在历史记录被重写后立即停止则其历史记录将变得不可读的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed scheduled tasks from an ended session sometimes not running after another session in the same folder used `/clear`, `/resume` or `/branch`", "中文内容": "修复了已结束会话中的计划任务有时在同一文件夹中使用`/clear`、`/resume`或`/branch`的另一个会话之后不运行的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed an approved plan being answered with \"You are not in plan mode\" when the approval arrived after the session's process had restarted, in cloud, self-hosted runner and SDK sessions", "中文内容": "修复了在云、自托管运行器和 SDK 会话中，在会话进程重新启动后批准到达时，已批准的计划被回答为“您未处于计划模式”"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Cloud sessions: Fixed an answer to Claude's question being lost after a restart in a long conversation", "中文内容": "云会话：修复了在长时间对话中重新启动后克劳德问题的答案丢失的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a message dropping out of a cloud session's conversation when the session restarted before Claude replied", "中文内容": "修复了在克劳德回复之前会话重新启动时，一条消息从云会话的对话中丢失的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Cloud sessions: Fixed Claude saying an attached image is missing when the message names its file", "中文内容": "云会话：修正了克劳德在消息命名其文件时说附加图像丢失的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed a resumed cloud session making a model call nobody asked for when files arrived right after a chat's first reply", "中文内容": "修复了当文件在聊天第一次回复后立即到达时，恢复的云会话会进行无人要求的模型调用"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed streamed replies in cloud sessions missing text from the middle when the session's container shut down partway through a reply", "中文内容": "修复了当会话的容器在回复中途关闭时，云会话中的流式回复丢失中间文本的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "修复", "内容": "Fixed skill files sent from Cowork cloud sessions sometimes failing to upload on the first try", "中文内容": "修复了从 Cowork 云会话发送的技能文件有时无法在第一次尝试上传的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Self-hosted runner: Reverted the exit code of an on-demand runner whose work order was superseded to 1; 2.1.321 and 2.1.322 had changed it to 0", "中文内容": "自托管运行器：将工作订单被取代的按需运行器的退出代码恢复为 1； 2.1.321和2.1.322已将其更改为0"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved sign-in errors in `/login` and `claude setup-token` for a rejected, unreachable or timed-out request: they now say what happened and what to check", "中文内容": "改进了`/login`和`claude setup-token`中拒绝、无法访问或超时请求的登录错误：它们现在会说明发生了什么以及要检查的内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved Bash permission checks so the same command more reliably gets the same answer on a slow or busy machine", "中文内容": "改进了 Bash 权限检查，因此相同的命令在缓慢或繁忙的计算机上更可靠地获得相同的答案"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved Bash permission checks: some commands that could run differently from how they were checked now ask for permission", "中文内容": "改进的 Bash 权限检查：一些可能与检查方式不同的命令现在请求权限"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved `/mcp` to show how many of a server's tools were left out because the API would reject their input schema, and why", "中文内容": "改进了`/mcp`以显示有多少服务器工具因 API 会拒绝其输入模式而被遗漏，以及原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the \"Not now\" choice when Claude Code asks to turn on the mods it writes in a session: it now says when they load", "中文内容": "改进了当 Claude Code 要求打开它在会话中编写的 mod 时的“现在不”选择：它现在会显示它们何时加载"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the error for an MCP tool call whose connector ID is mistyped by a character or two: for a server that the host application registered, it now names the tool to call", "中文内容": "改进了连接器 ID 输错一两个字符的 MCP 工具调用的错误：对于主机应用程序注册的服务器，它现在命名要调用的工具"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved Claude Desktop and cloud sessions for claude.ai accounts with more than 2,000 plugins turned on: a shorter wait at startup, and Claude can now say why plugins are missing", "中文内容": "改进了 claude.ai 帐户的 Claude 桌面和云会话，打开了 2,000 多个插件：启动时的等待时间更短，Claude 现在可以说出插件缺失的原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved memory use with many subagents: a finished subagent's transcript is freed sooner instead of staying in memory while later subagents run", "中文内容": "改进了许多子代理的内存使用：完成的子代理的转录本会更快地释放，而不是在稍后的子代理运行时保留在内存中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved installing with the install script: the latest version is no longer downloaded twice", "中文内容": "改进了使用安装脚本的安装：最新版本不再下载两次"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved WebFetch speed and memory use on deeply nested pages", "中文内容": "改进了深层嵌套页面上的 WebFetch 速度和内存使用"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the `cleanupPeriodDays` cleanup to count folders it can't read as errors", "中文内容": "改进了`cleanupPeriodDays`清理以计算无法读取为错误的文件夹"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the Claude apps gateway's `/v1/models` to state `max_input_tokens` for models whose context window is certain on every upstream", "中文内容": "改进了克劳德应用程序网关的`/v1/models`，以针对每个上游上下文窗口都确定的模型声明`max_input_tokens`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved `ToolSearch` to say when a tool Claude searched for by its short name is already available, instead of only reporting no match", "中文内容": "改进了`ToolSearch`，当 Claude 通过短名称搜索的工具已经可用时，会显示该工具，而不是仅报告不匹配"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved start-up on Linux when `/home` is an autofs map: Claude Code no longer looks up files in `/home` itself. Set `CLAUDE_CODE_AUTOMOUNT_ROOTS` for a map root deeper than one folder below `/`", "中文内容": "当`/home`是 autofs 映射时，改进了 Linux 上的启动：Claude Code 不再在`/home`本身中查找文件。为比`/`下面的一个文件夹更深的地图根设置`CLAUDE_CODE_AUTOMOUNT_ROOTS`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Improved the Fable limit message in `-p`, SDK, IDE and cloud sessions: it now says when the limit resets, along with how to continue", "中文内容": "改进了`-p`、SDK、IDE 和云会话中的 Fable 限制消息：现在它会显示限制何时重置以及如何继续"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `/security-review` to ask before Claude runs it, and skills' inline git commands to stop in bare-repository worktrees and similar folders until you allow them, outside auto mode and bypass", "中文内容": "更改了`/security-review`，以在 Claude 运行之前进行询问，并且将技能的内联 git 命令更改为在裸存储库工作树和类似文件夹中停止，直到您允许它们，在自动模式之外并绕过"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed how many messages each of your sessions on the same machine can send the others without a prompt from you, from about 20 to 100,000", "中文内容": "更改了同一计算机上的每个会话可以在没有提示的情况下向其他会话发送的消息数量，从大约 20 到 100,000"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the number of messages a Claude Desktop Code tab session can send to your other sessions before it waits for you to type again from 20 to 100,000", "中文内容": "将 Claude Desktop Code 选项卡会话在等待您再次键入之前可以发送到其他会话的消息数从 20 更改为 100,000"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed organization settings and policy requests to no longer use a proxy set only by `ALL_PROXY`; set `HTTPS_PROXY` if your network needs a proxy for them", "中文内容": "更改了组织设置和策略请求，不再使用仅由`ALL_PROXY`设置的代理；如果您的网络需要代理，请设置`HTTPS_PROXY`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the context window assumed for a model ID that Claude Code doesn't recognize from 200K to 1M; use `/autocompact` to compact earlier, or `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` to keep 200K", "中文内容": "将 Claude Code 无法识别的模型 ID 假定的上下文窗口从 200K 更改为 1M；使用 `/autocompact` 提前压缩，或使用 `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` 保留 200K"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed sessions on other vendors' models with a smaller window: once full, they can fail every turn until `/clear`, so set `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` before they fill", "中文内容": "使用较小的窗口更改了其他供应商模型上的会话：一旦填满，它们每次都会失败，直到`/clear`，因此在填充之前设置`CLAUDE_CODE_DISABLE_1M_CONTEXT=1`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed Claude Code's own ripgrep and most internal git commands to run without most of its sign-in tokens and API keys, so a credential helper or hook under such a git command no longer finds them", "中文内容": "更改了 Claude Code 自己的 ripgrep 和大多数内部 git 命令，使其在没有大部分登录令牌和 API 密钥的情况下运行，因此此类 git 命令下的凭证帮助程序或挂钩不再找到它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `MCP_SDK_GENERATION=v1` to run the v2 MCP client in a compatibility mode (earlier handshake, relaxed OAuth sign-in checks), because the v1 MCP client is removed", "中文内容": "更改了`MCP_SDK_GENERATION=v1`以在兼容模式下运行 v2 MCP 客户端（较早的握手、宽松的 OAuth 登录检查），因为 v1 MCP 客户端已被删除"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the tool Claude uses to finish an MCP server sign-in so that it asks you to confirm, even in bypass and auto modes; where nobody can be asked, such as in `dontAsk` mode, use `/mcp`", "中文内容": "更改了 Claude 用于完成 MCP 服务器登录的工具，以便它要求您确认，即使在旁路和自动模式下也是如此；在无法询问任何人的情况下，例如在`dontAsk`模式下，请使用`/mcp`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "Self-hosted runner: Changed a session at a connector's approval prompt or sign-in inside a running tool to be released as paused at the idle or lifetime limit; a late answer resumes from a fresh clone", "中文内容": "自托管运行器：在连接器的批准提示或登录运行工具中更改会话，以在空闲或生命周期限制时以暂停状态释放；迟到的答案从新的克隆中恢复"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed artifact updates to ask first, even under an allow rule, when people outside your organization can see the artifact or Claude can't check who can", "中文内容": "更改了工件更新，即使在允许规则下，当组织外部的人员可以查看工件或 Claude 无法检查谁可以查看工件时，也会首先询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `glab config set` without `--global` or `--host`, and `glab config edit --local`, to fail read-only inside the Bash sandbox; run them outside it", "中文内容": "更改了不带`--global`或`--host`的`glab config set`，以及`glab config edit --local`，以在 Bash 沙箱内以只读方式失败；将它们运行到外面"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the Bash sandbox on macOS, Linux and WSL to ignore write access granted through a symlink in a writable folder that leads elsewhere or to a missing path; grant the real path instead", "中文内容": "更改了 macOS、Linux 和 WSL 上的 Bash 沙箱，以忽略通过可写文件夹中的符号链接授予的写入访问权限，该符号链接通向其他地方或丢失的路径；授予真实路径"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed \"don't ask again\" so an allow rule that looks like it holds a secret, or would be saved to a `settings.local.json` that git tracks, lasts for the session only and isn't saved", "中文内容": "更改了“不再询问”，因此看起来像是持有秘密的允许规则，或者将被保存到 git 跟踪的 `settings.local.json` 中，仅持续会话并且不保存"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the sandbox on macOS and Linux: `git worktree add`, `move` and `remove` now fail read-only, as do commits in a worktree the session wasn't started in or given, even one inside the project", "中文内容": "更改了 macOS 和 Linux 上的沙箱：`git worktree add`、`move`和`remove`现在以只读方式失败，就像工作树中的提交一样，会话未在其中启动或给出，即使是项目内部的会话也是如此"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed start-up to stop when a `--settings` file isn't valid JSON and has a `sandbox` key, even one that turns the sandbox off", "中文内容": "将启动更改为当`--settings`文件不是有效的 JSON 并且具有“沙箱”密钥（甚至是关闭沙箱的密钥）时停止"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed what happens when a tool's permission check fails with an error after a `PreToolUse` hook returned \"allow\": Claude Code now decides the call as if no hook had answered", "中文内容": "更改了在`PreToolUse`钩子返回“允许”后工具的权限检查失败并出现错误时发生的情况：Claude Code 现在决定调用，就好像没有钩子应答一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed what happens when a tool's permission check fails on input that a `PermissionRequest` hook rewrote: Claude Code now asks again, or refuses the call where nobody can answer", "中文内容": "更改了当工具的权限检查在`PermissionRequest`钩子重写的输入上失败时发生的情况：克劳德代码现在再次询问，或者拒绝无人可以应答的呼叫"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the GitLab merge request badge to show only for the repository a sandboxed session opened in", "中文内容": "更改了 GitLab 合并请求徽章，仅显示在以下位置打开的沙盒会话的存储库"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the `claude mcp add --help` example to a local command", "中文内容": "将 `claude mcp add --help` 示例更改为本地命令"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed mods: a `*`, namespace or negated hook on `engine.create` now only observes. To add or withhold a `$` noun, hook `engine.create` by name", "中文内容": "更改了 mods：`engine.create`上的`*`、名称空间或否定挂钩现在仅观察。要添加或保留`$`名词，请按名称挂钩`engine.create`"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `claude plugin validate` to fail a mod whose `engine.create` hook isn't written in the one accepted form; installed mods keep loading", "中文内容": "更改了`claude plugin validate`，使其`engine.create`挂钩未以一种可接受的形式编写的 mod 失败；已安装的模组继续加载"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed marketplace and plugin installs to fail when a git submodule isn't on the commit its repository records", "中文内容": "更改了当 git 子模块不在提交其存储库记录时市场和插件安装失败的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed project (`.mcp.json`) MCP server approvals to match the server's exact name; an approval entry written in another spelling now asks again", "中文内容": "更改了项目 (`.mcp.json`) MCP 服务器批准以匹配服务器的确切名称；用另一种拼写编写的批准条目现在再次询问"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed self-hosted runners under `--trust-workspace false` and VS Code sessions in an untrusted folder: the repository's settings can no longer disable your hooks or turn plugins on or off", "中文内容": "更改了不受信任文件夹中`--trust-workspace false`和 VS Code 会话下的自托管运行器：存储库的设置无法再禁用您的挂钩或打开或关闭插件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `tool.list` plugin hooks so the tools they add or remove apply to the model and every agent", "中文内容": "更改了`tool.list`插件挂钩，以便它们添加或删除的工具适用于模型和每个代理"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `claude plugin install` and `/plugin` to show a warning instead of success when a plugin's install command writes to stderr", "中文内容": "更改了 `claude plugin install` 和 `/plugin` 以在插件的安装命令写入 stderr 时显示警告而不是成功"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed claude.ai chats and Cowork tasks to check a plugin file for secret keys before sending it, and to ask first if it may hold one", "中文内容": "更改了 claude.ai 聊天和 Cowork 任务，以便在发送插件文件之前检查其密钥，并首先询问它是否可以保存密钥"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `claude rm` and the agents view to say a session is removed from the list, not deleted; `claude rm` help says the conversation is kept and `claude --resume` lists it", "中文内容": "更改了“claude rm”和代理视图，表示会话已从列表中删除，而不是删除； `claude rm` 帮助表示保留对话，并且 `claude --resume` 列出它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `/stickers` to say that the sticker pack is all claimed for now, instead of opening a page in the browser", "中文内容": "更改了`/stickers`以表示贴纸包目前已全部认领，而不是在浏览器中打开页面"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed a managed settings `policyHelper` to no longer take environment variables from user or `--settings` files; set what it needs in managed `env` or the launching shell", "中文内容": "更改了托管设置`policyHelper`，不再从用户或`--settings`文件中获取环境变量；在托管`env`或启动 shell 中设置所需内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed a `/skill` or `@file` typed between two files picked in claude.ai or the desktop app, or after a picked file and a link, to no longer take effect", "中文内容": "更改了在 claude.ai 或桌面应用程序中选取的两个文件之间或在选取的文件和链接之后键入的`/skill`或`@file`，使其不再生效"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed split-pane agent teammates to check that requests come from their team lead: one that outlives its lead has its asks refused, and plan approvals must be re-sent after `/clear` or `/resume`", "中文内容": "更改了分割窗格代理队友，以检查请求是否来自其团队负责人：比其负责人寿命更长的人的请求会被拒绝，并且必须在`/clear`或`/resume`之后重新发送计划批准"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed worktree creation to refuse checkouts whose `.git` folders are links or hold hard links, such as git-new-workdir layouts and `cp -al` copies; use a plain clone", "中文内容": "更改了工作树的创建，以拒绝`.git`文件夹是链接或包含硬链接的签出，例如 git-new-workdir 布局和`cp -al`副本；使用普通克隆"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed what Claude is told after safeguards stop a forked skill or a workflow agent: retry with a narrower prompt or tell you, instead of doing the work itself", "中文内容": "更改了防护措施停止分叉技能或工作流程代理后克劳德被告知的内容：使用更窄的提示重试或告诉您，而不是自行完成工作"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed browser tool calls (Claude in Chrome, the desktop browser pane) to refuse some escaped or JSON-text inputs and tell Claude how to respell them", "中文内容": "更改了浏览器工具调用（Chrome 中的 Claude，桌面浏览器窗格）以拒绝某些转义或 JSON 文本输入，并告诉 Claude 如何重新拼写它们"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed workflows so that a prompt an app marks as not typed no longer reaches their agents as your request", "中文内容": "更改了工作流程，以便应用程序标记为未键入的提示不再按照您的请求到达其代理"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed computer use on macOS to refuse key chords that hold Space with Control or Option, and more system shortcuts that need your grant", "中文内容": "更改了 macOS 上的计算机使用，以拒绝使用 Control 或 Option 按住 Space 的键和弦，以及更多需要您授权的系统快捷方式"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed first-run setup in Terminal.app to name the \"Use Option as Meta key\" setting, what Option stops typing, and how to undo it before you agree", "中文内容": "更改了 Terminal.app 中的首次运行设置，将“使用 Option 作为元键”设置命名为“使用 Option 作为元键”设置、什么 Option 会停止输入，以及如何在您同意之前撤消它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the maximum of `CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS` from 64000 to 300000", "中文内容": "将`CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS`的最大值从 64000 更改为 300000"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed workflows in the desktop app's Code tab to pause at a usage limit and continue after it resets", "中文内容": "更改了桌面应用程序“代码”选项卡中的工作流程，以在使用限制时暂停并在重置后继续"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed the spend limit and 1M context errors, and `/usage-credits`, in cloud sessions and under Remote Control: they no longer give a web address", "中文内容": "更改了云会话和远程控制下的支出限制和 1M 上下文错误以及`/usage-credits`：它们不再提供网址"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed which MCP servers are reported by name in OpenTelemetry exports to follow the current connector directory", "中文内容": "更改了 OpenTelemetry 导出中按名称报告的 MCP 服务器，以遵循当前连接器目录"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `/logout` in a background session, which had no effect: it now signs out every session on the computer, deletes stored MCP logins and plugin secrets, and ends the session, as in a terminal", "中文内容": "在后台会话中更改了`/logout`，这没有任何效果：它现在注销计算机上的每个会话，删除存储的 MCP 登录名和插件机密，并结束会话，就像在终端中一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "macOS: Changed the Bash sandbox so `lsof` and similar tools may show less about processes a command did not start", "中文内容": "macOS：更改了 Bash 沙箱，因此`lsof`和类似工具可能会显示较少的有关命令未启动的进程的信息"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed cloud scheduled tasks: a `PostToolUse` hook from your own settings can no longer replace the plan in `ExitPlanMode`'s result", "中文内容": "更改了云计划任务：您自己的设置中的`PostToolUse`挂钩无法再替换`ExitPlanMode`结果中的计划"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "改进", "内容": "Changed `CLAUDE_AUTOCOMPACT_PCT_OVERRIDE` in Anthropic-hosted cloud sessions to stop applying to auto-memory extraction and, in some sessions, to `/btw`; the main conversation still follows it", "中文内容": "更改了 Anthropic 托管的云会话中的`CLAUDE_AUTOCOMPACT_PCT_OVERRIDE`，以停止应用自动内存提取，并在某些会话中更改为`/btw`；主要对话仍然遵循它"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "移除", "内容": "Removed the `subagentStatusLine` setting: subagent rows always use the default look, and settings files that still hold the key load as before", "中文内容": "删除了`subagentStatusLine`设置：子代理行始终使用默认外观，并且仍然像以前一样保存键加载的设置文件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "移除", "内容": "Deprecated a plugin's `agent` setting: it still applies, and now warns at startup, in `claude plugin list` and in `claude plugin validate`", "中文内容": "已弃用插件的“代理”设置：它仍然适用，现在在启动时在“克劳德插件列表”和“克劳德插件验证”中发出警告"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Added a Claude Code trust prompt before the first session in a folder you haven't trusted; declining leaves the folder's settings and MCP servers unused", "中文内容": "[VSCode] 在您不信任的文件夹中的第一个会话之前添加了 Claude Code 信任提示；拒绝使文件夹的设置和 MCP 服务器未使用"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Added the live output of a running Bash or PowerShell command to the chat, under the command's card", "中文内容": "[VSCode] 将正在运行的 Bash 或 PowerShell 命令的实时输出添加到命令卡下的聊天中"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed a response that was discarded because its tool call could not be parsed still showing after Claude retried", "中文内容": "[VSCode] 修复了因工具调用无法解析而被丢弃的响应，在 Claude 重试后仍然显示"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed a queued message missing from a conversation or fork when it directly followed a compaction summary", "中文内容": "[VSCode] 修复了直接遵循压缩摘要时对话或分叉中缺少排队消息的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the \"Buy usage credits on claude.ai\" button counting as agreement to pay for Fable while usage credits were off", "中文内容": "[VSCode] 修复了“在 claude.ai 上购买使用积分”按钮在使用积分关闭时被视为同意支付《神鬼寓言》的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the \"extensions want to relaunch the terminal\" warning coming back on open terminals after every window reload or restart", "中文内容": "[VSCode] 修复了每次窗口重新加载或重新启动后打开的终端上出现的“扩展想要重新启动终端”警告"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed \"Couldn't load this conversation's saved history\" appearing in a new chat whose Claude process had restarted before the first prompt", "中文内容": "[VSCode] 修复了在第一次提示之前 Claude 进程已重新启动的新聊天中出现的“无法加载此对话的已保存历史记录”的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the sign-in screen showing the login choices again after a pasted code; it now shows \"Signing in…\" until the sign-in finishes", "中文内容": "[VSCode] 修复了粘贴代码后登录屏幕再次显示登录选项的问题；现在显示“正在登录...”，直到登录完成"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the \"You've hit your Fable limit\" line staying in the VS Code and JetBrains panels after you pick another model", "中文内容": "[VSCode] 修复了选择另一个模型后 VS Code 和 JetBrains 面板中保留的“您已达到寓言限制”行"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the Fable usage warning in the VS Code and JetBrains panels naming usage credits when they're off or used up", "中文内容": "[VSCode] 修复了 VS Code 和 JetBrains 面板中的 Fable 使用警告，在关闭或用完时命名使用积分"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed the diff tab not opening for multi-line edits on files with CRLF line endings", "中文内容": "[VSCode] 修复了在以 CRLF 行结尾的文件上进行多行编辑时无法打开 diff 选项卡的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Fixed dictation continuing to record after switching sessions", "中文内容": "[VSCode] 修复了切换会话后听写继续记录的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Improved sign-in errors behind TLS-inspecting proxies: a certificate failure now says what to do, as the terminal does", "中文内容": "[VSCode] 改进了 TLS 检查代理背后的登录错误：证书失败现在会告诉您要做什么，就像终端一样"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[VSCode] Changed opening a Claude Code on the web session in a folder where Claude Code's sandbox is on: the extension no longer switches to the session's branch for you, and the dialog says why", "中文内容": "[VSCode] 更改了在 Claude Code 沙箱所在文件夹中的 Web 会话上打开 Claude Code 的方式：扩展程序不再为您切换到会话的分支，并且对话框会说明原因"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Improved the message when a file fails to upload to a cloud or Remote Control session: it now gives the reason, such as too many pages, a password or a time-out", "中文内容": "[网络上的克劳德代码] 改进了文件无法上传到云或远程控制会话时的消息：它现在给出原因，例如页面太多、密码或超时"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Improved adding a repository Claude can't access to a cloud session: a short message and a Reconnect GitHub button replace the long error", "中文内容": "[网络上的 Claude 代码] 改进了添加存储库 Claude 无法访问云会话：一条短消息和一个重新连接 GitHub 按钮替换了长错误"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed self-hosted sessions staying on \"Starting Claude Code\" after it had started, when you reopened a paused session without sending a message", "中文内容": "[网络上的克劳德代码] 修复了当您重新打开暂停的会话而不发送消息时，自托管会话在启动后停留在“正在启动克劳德代码”上的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed a paused session in a self-hosted environment sometimes still showing \"Sending\" and a Stop button under the \"Session paused\" banner", "中文内容": "[网络上的克劳德代码] 修复了自托管环境中暂停的会话有时仍显示“正在发送”以及“会话已暂停”横幅下的“停止”按钮"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed pull request updates from GitHub Enterprise Server linking to github.com in cloud sessions; new updates link to your own server", "中文内容": "[网络上的克劳德代码] 修复了云会话中链接到 github.com 的 GitHub Enterprise Server 的拉取请求更新；新的更新链接到您自己的服务器"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Improved the message when some network secrets can't be added to a new cloud environment: it lists each host, says why where it can, and stays until you dismiss it", "中文内容": "[网络上的克劳德代码] 改进了当某些网络机密无法添加到新的云环境时的消息：它列出了每个主机，说明为什么可以，并一直保留到您将其关闭为止"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed very large GitHub Actions job logs and run log archives failing to download or being cut off in cloud sessions", "中文内容": "[网络上的克劳德代码] 修复了非常大的 GitHub Actions 作业日志和运行日志存档无法下载或在云会话中被切断的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Improved the new-session repository picker when GitHub single sign-on hides organizations: it now says so even with other repositories listed, and links to reconnect GitHub", "中文内容": "[网络上的克劳德代码] 改进了 GitHub 单点登录隐藏组织时的新会话存储库选择器：现在即使列出了其他存储库，也显示了重新连接 GitHub 的链接"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed new cloud sessions started from the iOS app with a repository not getting a branch of their own", "中文内容": "[网络上的克劳德代码] 修复了从 iOS 应用程序启动的新云会话，其中存储库未获得自己的分支"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed an open cloud or Remote Control session's page staying \"Disconnected\" after a few minutes of failed connections; it now tries to reconnect by itself", "中文内容": "[网络上的克劳德代码] 修复了开放云或远程控制会话的页面在连接失败几分钟后保持“断开连接”的问题；它现在尝试自行重新连接"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed Try again on an open cloud or Remote Control session's \"Connection lost\" card sending \"Try again\" as your message; it now tries to reconnect instead", "中文内容": "[网络上的克劳德代码] 修复了在开放云或远程控制会话上重试的“连接丢失”卡发送“重试”作为您的消息的问题；它现在尝试重新连接"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed the Stop button disappearing from a cloud session five minutes into a reply that had shown nothing yet while Claude was still working", "中文内容": "[网络上的克劳德代码] 修复了在克劳德仍在工作时回复尚未显示任何内容的情况下，停止按钮从云会话中消失五分钟的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed an approval prompt sometimes disappearing from a tab left open after a self-hosted runner released the session while it waited for your answer", "中文内容": "[网络上的克劳德代码] 修复了自托管运行程序在等待您的答案时释放会话后，批准提示有时会从打开的选项卡中消失的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Added a failure notification when a scheduled task's run can't start because its settings require a sandbox that isn't available where it runs", "中文内容": "[网络上的克劳德代码] 当计划任务的运行无法启动时添加了失败通知，因为它的设置需要一个在运行时不可用的沙箱"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Improved the Git providers page when your GitHub sign-in has expired: it now asks you to reconnect instead of silently hiding organizations you can link", "中文内容": "[网络上的克劳德代码] 改进了 GitHub 登录过期时的 Git 提供程序页面：它现在要求您重新连接，而不是默默地隐藏您可以链接的组织"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed removing a repository from a scheduled task silently moving its GitHub trigger to another repository; Save now waits until you pick one", "中文内容": "[网络上的克劳德代码] 修复了从计划任务中删除存储库时将其 GitHub 触发器静默移动到另一个存储库的问题；立即保存，直到您选择一个"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Fixed git clones and fetches that take longer than ten minutes in a cloud session sometimes being cut off at the very end", "中文内容": "[网络上的克劳德代码] 修复了在云会话中花费超过十分钟的 git 克隆和获取有时会在最后被切断的问题"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Added the No repository option to the repository picker for new sessions on a self-hosted environment", "中文内容": "[网络上的克劳德代码] 在自托管环境中的新会话的存储库选择器中添加了“无存储库”选项"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Code on the web] Added a warning to a cloud session's Delete dialog when deleting it will pause scheduled tasks that run in that session", "中文内容": "[网络上的克劳德代码] 在云会话的“删除”对话框中添加了一条警告，删除该对话框将暂停在该会话中运行的计划任务"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Remote Control] Fixed your own session saying its environment was deleted when you deleted nothing; it now says your computer is no longer connected", "中文内容": "[远程控制]修复了当你什么都不删除时，你自己的会话说它的环境被删除的问题；现在它说你的计算机不再连接"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Remote Control] Fixed some sessions still showing as running in the session list after the computer disconnected before Claude started; they now show an error mark or as idle", "中文内容": "[远程控制]修复了克劳德启动前电脑断开连接后，部分会话在会话列表中仍显示为正在运行的问题；它们现在显示错误标记或处于空闲状态"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Remote Control] Added a Try again button to the error shown when the computer running your session is signed out of Claude Code", "中文内容": "[远程控制] 在运行会话的计算机从 Claude Code 注销时显示的错误中添加了重试按钮"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Added Claude Tag sessions started in Slack to the Compliance API on Enterprise plans, in beta: list the sessions and read their transcripts", "中文内容": "[Claude Tag] 将在 Slack 中启动的 Claude Tag 会话添加到企业计划上的合规性 API（测试版）：列出会话并阅读其记录"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Added a confirmation step when an admin turns off Claude Tag for the organization, with a dialog that says what stops", "中文内容": "[Claude Tag] 添加了当管理员关闭组织的 Claude Tag 时的确认步骤，并显示一个对话框，说明停止的内容"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Fixed scheduled tasks in a Slack channel moved between Enterprise Grid workspaces failing to use Slack until someone posted there", "中文内容": "[Claude Tag] 修复了在 Enterprise Grid 工作区之间移动的 Slack 通道中的计划任务无法使用 Slack 的问题，直到有人在那里发布"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Fixed the Approve and post card in a DM with Claude appearing for private or Slack Connect channels, where Claude can't post; Claude now gets the reason and shows no card", "中文内容": "[Claude Tag] 修复了 DM 中的批准和明信片，其中 Claude 出现在私人或 Slack Connect 频道中，而 Claude 无法在这些频道中发帖；克劳德现在明白原因了，没有出示牌"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Added a Retry button to a Slack channel's Configure page for when its settings fail to load", "中文内容": "[Claude Tag] 在 Slack 通道的“配置”页面中添加了“重试”按钮，以便在其设置加载失败时使用"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Added a Scope filter to the Network events tab of Claude Tag's Activity page, so admins can download one scope's events instead of the whole organization's", "中文内容": "[Claude Tag] 在 Claude Tag 活动页面的网络事件选项卡中添加了范围过滤器，以便管理员可以下载一个范围的事件，而不是整个组织的事件"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型": "其他", "内容": "[Claude Tag] Fixed Remove connector in Claude Tag admin settings being refused when access bundles also held its credentials; it now removes those set on the connector and leaves the bundles' own", "中文内容": "[Claude Tag] 修复了当访问包也持有其凭据时，Claude Tag 管理设置中的删除连接器被拒绝的问题；现在它会删除连接器上的那些设置并保留捆绑包自己的"}, {"日期": "2026-11-12", "版本": "2.1.323", "类型"
