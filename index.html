 than the context window followed a long conversation", "中文内容": "修复了除计划任务之外的第三方提供商上的一些 Claude Desktop 会话，当长时间对话后出现大于上下文窗口的 PDF 时，以“提示太长”结束回合"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the choice between two user or project agent files declaring the same name depending on the order the file search listed them", "中文内容": "修复了声明相同名称的两个用户或项目代理文件之间的选择，具体取决于文件搜索列出它们的顺序"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `claude daemon logs` never exiting inside a git repository when there is no log file", "中文内容": "修复了当没有日志文件时“claude daemon messages”永远不会在 git 存储库中退出的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed markdown hiding a character or two after bold or italic text when a backslash came before an emoji later in the paragraph", "中文内容": "修复了当反斜杠出现在段落后面的表情符号之前时，Markdown 在粗体或斜体文本后隐藏一两个字符的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Edit refusing some valid hook commands in Claude settings files", "中文内容": "修复了编辑拒绝克劳德设置文件中的某些有效挂钩命令的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `Read` with a page range showing both halves of a scanned two-page spread on each of its pages", "中文内容": "修复了“阅读”的页面范围，在每个页面上显示扫描的两页跨页的两半"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed line breaks and class stereotypes missing from Mermaid diagrams in HTML artifacts", "中文内容": "修复了 HTML 工件中美人鱼图中缺少的换行符和类刻板印象"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the Project instructions picker in `/config` showing only one of its four choices in a 24-row fullscreen window", "中文内容": "修复了`/config`中的项目指令选择器在 24 行全屏窗口中仅显示四个选项之一"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed a subagent's own subagents and forks running on the plan-mode model in plan mode under `opusplan` or `haiku`", "中文内容": "修复了在`opusplan`或`haiku`下的计划模式下在计划模式模型上运行的子代理自己的子代理和分支"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed WebFetch page summaries ignoring the `/effort` level when a gateway refuses the small fast model", "中文内容": "修复了当网关拒绝小型快速模型时 WebFetch 页面摘要忽略`/effort`级别的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `claude -p` on Google Cloud's Agent Platform ignoring `--settings '{\"fastMode\":true}'` when the model comes from `ANTHROPIC_MODEL` or a settings file; such runs now bill at the fast mode price", "中文内容": "修复了当模型来自`ANTHROPIC_MODEL`或设置文件时，Google Cloud 代理平台上的`claude -p`忽略`--settings '{\"fastMode\":true}'`；此类运行现在按快速模式价格计费"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed startup under `forceLoginOrgUUID` being refused after one temporary server error or dropped connection", "中文内容": "修复了`forceLoginOrgUUID`下的启动在一次临时服务器错误或断开连接后被拒绝的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `claude mcp remove` giving no way forward for a claude.ai connector: it now says to turn it off in /mcp or remove it on claude.ai", "中文内容": "修复了`claude mcp remove`无法为 claude.ai 连接器提供前进方向的问题：它现在表示在 /mcp 中将其关闭或在 claude.ai 上将其删除"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the /mcp \"Connect on claude.ai\" check saying \"not connected\" when claude.ai has a connector at the server's URL without its query", "中文内容": "修复了当 claude.ai 在服务器 URL 上有连接器而没有查询时，/mcp“在 claude.ai 上连接”检查显示“未连接”"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `/install-github-app` and `/design-login` showing a generic failure for an account on hold instead of the on-hold notice and appeal link", "中文内容": "修复了`/install-github-app`和`/design-login`显示帐户暂停的一般失败，而不是暂停通知和申诉链接"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed a running MCP task being reported as stopped when you move a session to the background; the background session can now follow the task, but not if its server uses stdio or sets headers", "中文内容": "修复了当您将会话移至后台时，正在运行的 MCP 任务被报告为已停止的问题；后台会话现在可以跟踪任务，但如果其服务器使用 stdio 或设置标头则不能"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed self-hosted runners ignoring a session until they exited, after its failure report was lost or the session was given back to the same runner", "中文内容": "修复了自托管运行器在失败报告丢失或会话返回给同一运行器后忽略会话直至退出的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed self-hosted sessions losing the prompt cache and earlier thinking when the list of repositories a restart couldn't prepare changed", "中文内容": "修复了自托管会话在重新启动无法准备更改的存储库列表时丢失提示缓存和早期思考的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Fixed tool calls behind a permission prompt vanishing with no result when a new runner took over the prompt, in sessions with telemetry off", "中文内容": "自托管运行程序：修复了在遥测关闭的会话中，当新运行程序接管提示时，权限提示后面的工具调用消失而没有结果的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed resumed self-hosted runner sessions starting without their pushed work in large repositories when `--push-outcome-on-release` is set", "中文内容": "修复了设置`--push-outcome-on-release`时，在大型存储库中没有推送工作的情况下恢复的自托管运行器会话开始的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed self-hosted runner sessions being shown as working when Claude Code hangs at every start and `--startup-timeout-min` is from 2 to about 6", "中文内容": "修复了当 Claude Code 在每次启动时挂起并且`--startup-timeout-min`从 2 到大约 6 时，自托管运行器会话显示为正在运行的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `pkill -f` in self-hosted runner sessions on Linux ending its own shell with exit code 144, or the runner (needs a `pkill` with `--ignore-ancestors`)", "中文内容": "修复了 Linux 上自托管运行程序会话中的`pkill -f`，以退出代码 144 结束自己的 shell，或运行程序（需要带有`--ignore-ancestors`的`pkill`）"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed scheduled tasks on self-hosted runners having no tool to notify their owner when telemetry is off or a third-party provider is used", "中文内容": "修复了自托管运行器上的计划任务，在遥测关闭或使用第三方提供商时没有工具通知其所有者"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Fixed one slow `spawn-runner` hook keeping the orchestrator from claiming sessions for its free slots; it now polls every 4 to 6 seconds while a slot is free", "中文内容": "自托管运行器：修复了一个缓慢的`spawn-runner`钩子，使协调器无法为其空闲插槽声明会话；现在，当插槽空闲时，它每 4 到 6 秒轮询一次"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Fixed a 403, such as an IP allowlist's, logged as a bad secret or token: most such lines now lead with the server's reason, so update log alerts that match the old words", "中文内容": "自托管运行器：修复了 403，例如 IP 白名单，记录为错误的秘密或令牌：大多数此类行现在都以服务器原因开头，因此请更新与旧单词匹配的日志警报"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed self-hosted runners' warn mode for repository settings stopping at the first finding of most kinds: it now goes on, up to 50 for a session, and says if it stops early", "中文内容": "修复了自托管运行程序的存储库设置在大多数类型的第一个发现时停止的警告模式：现在它会继续，每次会话最多 50 个，并表示是否提前停止"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Fixed runners that start on a full disk taking sessions and failing them; they now wait for room and exit 1 after a minute with no session, unless started from a work order", "中文内容": "自托管运行程序：修复了在完整磁盘上启动并进行会话并失败的运行程序；他们现在等待房间并在一分钟后退出 1，没有会话，除非从工作订单开始"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Fixed a failed start suggesting a retry when the runner's machine had no git credentials; the error now says whom to ask and what to do if the repository is wrong", "中文内容": "自托管运行器：修复了当运行器的计算机没有 git 凭据时启动失败建议重试的问题；现在，错误表明如果存储库错误应该询问谁以及该怎么做"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the self-hosted runner's `last_poll_age_seconds` reading 0 while the runner had never polled successfully", "中文内容": "修复了自托管运行程序从未成功轮询时其`last_poll_age_seconds`读数为 0 的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the notice about a skipped scheduled task that names no organization: it now says to start Claude Code with `--resume`, because `/resume` inside a running session doesn't run the task", "中文内容": "修复了有关跳过未命名组织的计划任务的通知：它现在说用`--resume`启动 Claude Code，因为正在运行的会话中的`/resume`不会运行该任务"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `claude plugin validate` wrongly warning that a mod's `AbovePrompt` or `AbovePromptList` hook never runs in VS Code", "中文内容": "修复了`claude plugin validate`错误地警告 mod 的`AbovePrompt`或`AbovePromptList`挂钩永远不会在 VS Code 中运行"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `/design-sync` deleting a file it had just uploaded when Claude Design stored that file under a changed name", "中文内容": "修复了`/design-sync`在 Claude Design 以更改的名称存储该文件时删除刚刚上传的文件的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Reverted 2.1.329's removal of the automatic retry when `max_tokens` exceeds a model's or gateway's limit", "中文内容": "恢复了 2.1.329 删除了`max_tokens`超过模型或网关限制时的自动重试功能"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved the claude.ai sign-in link shown by /login, `claude auth login` and `claude setup-token`: it is now much shorter", "中文内容": "改进了 /login、`claude auth login` 和 `claude setup-token` 显示的 claude.ai 登录链接：现在更短了"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Windows: Improved Grep and Glob speed by no longer starting a console host for each built-in ripgrep search on a local path", "中文内容": "Windows：通过不再为本地路径上的每个内置 ripgrep 搜索启动控制台主机，提高了 Grep 和 Glob 的速度"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved the speed of file diffs", "中文内容": "提高了文件差异的速度"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved `/config` search: most settings whose name starts with what you type come first, \"effort\" finds Model, and \"dark\" or \"light\" finds Theme", "中文内容": "改进了`/config`搜索：名称以您键入的内容开头的大多数设置都排在前面，“effort”查找模型，“dark”或“light”查找主题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved `/resume`: sessions where you only opened a screen such as `/model` and left are no longer listed", "中文内容": "改进了`/resume`：仅打开`/model`等屏幕并离开的会话不再列出"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved Reconnect in `/mcp` and `/plugin`: a server's page now stays open, with the cause in view, when the server still fails or needs sign-in", "中文内容": "改进了`/mcp`和`/plugin`中的重新连接：当服务器仍然失败或需要登录时，服务器页面现在保持打开状态，并可查看原因"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved the error on macOS when sandbox deny lists are too long: it now names the long lists and how to shorten them", "中文内容": "改进了 macOS 上沙箱拒绝列表太长时出现的错误：现在命名长列表以及如何缩短它们"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved `/plugin` in fullscreen mode: the page of a plugin with errors now starts with those errors", "中文内容": "改进了全屏模式下的`/plugin`：有错误的插件页面现在以这些错误开头"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved `/ultrareview`'s cost confirmation on Team and Enterprise plans: it now says how much of your monthly spend limit is left when that is less than a review usually costs", "中文内容": "改进了`/ultrareview`对团队和企业计划的成本确认：现在，当低于审查通常的成本时，它会显示您的每月支出限额还剩多少"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved self-hosted runner sessions on Amazon Bedrock or Google Cloud's Agent Platform to say so when they start on another default model because your account refused the first", "中文内容": "改进了 Amazon Bedrock 或 Google Cloud 代理平台上的自托管运行器会话，当它们在另一个默认模型上启动时会这样说，因为您的帐户拒绝了第一个模型"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Windows: Improved the error when a session's folder is on a drive Claude Code can't verify: it says why, and whether retrying can help", "中文内容": "Windows：改进了会话文件夹位于驱动器上时的错误 Claude Code 无法验证：它说明了原因，以及重试是否有帮助"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved Code Mode: Claude is now told how to look at images and PDFs", "中文内容": "改进的代码模式：Claude 现在被告知如何查看图像和 PDF"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved Code Mode: after Esc, \"Interrupted\" now shows under the stopped command in place of a red error", "中文内容": "改进的代码模式：Esc 后，“已中断”现在显示在停止的命令下，而不是红色错误"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Improved Code Mode: the terminal freezes for far less time after a subagent's script makes thousands of tool calls", "中文内容": "改进的代码模式：在子代理的脚本进行数千次工具调用后，终端冻结的时间要少得多"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed recurring scheduled tasks and `/loop` to run up to 30 days instead of 7 while their session keeps running, and say when they end; tasks made before this release still end at 7 days", "中文内容": "将重复计划任务和`/loop`更改为运行长达 30 天而不是 7 天，同时会话继续运行，并说明何时结束；在此版本之前完成的任务仍将在 7 天后结束"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed more `rm` commands aimed at the root, home, a top-level folder or the working folder to ask for approval; where nobody can answer, they're refused", "中文内容": "更改了更多针对根目录、主目录、顶级文件夹或工作文件夹的 `rm` 命令以请求批准；没有人能回答的地方，他们就被拒绝了"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed `deniedMcpServers` name entries to hide only the named claude.ai connector, not others at its URL; to block them all, deny its exact URL", "中文内容": "更改了`deniedMcpServers`名称条目，以仅隐藏指定的 claude.ai 连接器，而不隐藏其 URL 上的其他连接器；要阻止所有这些内容，请拒绝其确切的 URL"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed `claude --teleport` in some setups to print the git commands for switching branch instead of running them; with `-p` it exits 1 until you switch", "中文内容": "在某些设置中更改了`claude --teleport`以打印用于切换分支的 git 命令而不是运行它们；使用 `-p` 它将退出 1 直到您切换"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed unrecognized model names containing \"sonnet\" or \"haiku\" to use the shorter system prompt, like other unrecognized names; `CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=0` gives every model the full one", "中文内容": "更改了包含“sonnet”或“haiku”的无法识别的模型名称，以使用更短的系统提示符，就像其他无法识别的名称一样； `CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=0` 为每个模型提供完整的模型"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed skills that Claude runs with a `model` setting, other than `context: fork` skills, to leave subagents, forks, compaction and `/recap` on the session's model", "中文内容": "更改了克劳德使用“模型”设置运行的技能，而不是“上下文：分叉”技能，以在会话模型上保留子代理、分叉、压缩和`/recap`"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed a subagent's model fallback to carry over: agents with no model and forks it then starts run on the fallback, and the agents they start use its Bedrock region", "中文内容": "更改了子代理的模型回退以保留：没有模型的代理并分叉它然后开始在回退上运行，并且它们开始使用其基岩区域的代理"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Changed `spawn-runner` hooks to start while earlier ones still run, up to `--hook-concurrency` per orchestrator (4 by default); set it to 1 if yours can't run beside another", "中文内容": "自托管运行器：将`spawn-runner`挂钩更改为在早期挂钩仍在运行时启动，每个编排器最多为`--hook-concurrency`（默认为 4）；如果你的无法与另一个一起运行，请将其设置为 1"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Changed Bash commands to skip the file diff when nothing needs it, so transcripts can lack it; set `bashEditDiffEnabled` to true in managed settings to get every diff", "中文内容": "自托管运行器：更改了 Bash 命令以在不需要时跳过文件差异，因此记录可能会缺少它；在托管设置中将 `bashEditDiffEnabled` 设置为 true 以获取每个差异"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed self-hosted runners to stop a session's start at once, without trying other runners, when a checkout hook exits with status 108", "中文内容": "更改了自托管运行程序，当签出挂钩以状态 108 退出时，立即停止会话的启动，而不尝试其他运行程序"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed prompt hooks to accept model aliases such as `haiku` or `sonnet` in their `model` field", "中文内容": "更改了提示挂钩以在`model`字段中接受模型别名，例如`haiku`或`sonnet`"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed `/design-sync`'s fallback build of the reference Storybook to use only a Storybook installed in the project", "中文内容": "更改了参考 Storybook 的`/design-sync`后备版本，以仅使用项目中安装的 Storybook"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "改进", "内容": "Changed subagent progress summaries in terminal sessions signed in to a Claude apps gateway to be written from short notes instead of the whole conversation, using far fewer tokens", "中文内容": "更改了登录到克劳德应用程序网关的终端会话中的子代理进度摘要，以使用更少的令牌从简短的注释而不是整个对话中编写"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Added `/fork` to fork a conversation after its last reply (anthropics/claude-code#69272)", "中文内容": "[VSCode] 添加了 `/fork` 以在最后回复后分叉对话 (anthropics/claude-code#69272)"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Added `/workflows`, which opens the agent map with running workflows", "中文内容": "[VSCode] 添加了`/workflows`，它打开正在运行的工作流程的代理地图"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Added the `claudeCode.escapeStopsClaude` setting; turn it off so Escape does not stop Claude (anthropics/claude-code#91536)", "中文内容": "[VSCode] 添加了 `claudeCode.escapeStopsClaude` 设置；将其关闭，这样 Escape 就不会阻止克劳德 (anthropics/claude-code#91536)"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Added the `claudeCode.pinPrompt` setting to let your message scroll away instead of staying pinned", "中文内容": "[VSCode] 添加了`claudeCode.pinPrompt`设置，让您的消息滚动离开而不是保持固定状态"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Added the `claudeCode.contextUsageThreshold` setting for when the context indicator shows (anthropics/claude-code#93036)", "中文内容": "[VSCode] 添加了上下文指示器显示时的 `claudeCode.contextUsageThreshold` 设置 (anthropics/claude-code#93036)"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Added a `prompt` argument to the \"Open in Side Bar\" command for keybindings and extensions", "中文内容": "[VSCode] 为键绑定和扩展的“在侧边栏中打开”命令添加了`prompt`参数"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Added Move up and Move down to a session group's menu (anthropics/claude-code#98654)", "中文内容": "[VSCode] 添加了上移和下移到会话组的菜单 (anthropics/claude-code#98654)"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed VS Code opening and focusing its terminal on every prompt of a connected terminal session", "中文内容": "[VSCode] 修复了 VS Code 打开并将其终端聚焦在已连接终端会话的每个提示上的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed copying a code block adding a trailing newline that ran the command on paste (anthropics/claude-code#96976)", "中文内容": "[VSCode] 修复了复制代码块时添加在粘贴时运行命令的尾随换行符的问题 (anthropics/claude-code#96976)"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed holding Enter on `/rewind` restoring files, and a double click on Remove or Delete removing a memory, MCP server or plugin marketplace, without confirmation", "中文内容": "[VSCode] 修复了在`/rewind`上按住 Enter 恢复文件，然后双击“删除”或“删除”删除内存、MCP 服务器或插件市场而无需确认的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed Enter on a question card sending your earlier answer instead of picking the focused one, and arrow keys not working after an \"Other\" answer; answered questions reopen on your pick", "中文内容": "[VSCode] 修复了问题卡上的 Enter 发送您之前的答案而不是选择焦点答案，以及箭头键在“其他”答案后不起作用的问题；已回答的问题可根据您的选择重新开放"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed a held-down Enter key sending a half-written message or running a typed slash command", "中文内容": "[VSCode] 修复了按住 Enter 键发送半写消息或运行键入的斜线命令的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed Cmd+A, C, V, X and Z not working in the rename box and dialogs on macOS", "中文内容": "[VSCode] 修复了 Cmd+A、C、V、X 和 Z 在 macOS 上的重命名框和对话框中不起作用的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed Ctrl+F and Ctrl+P not moving the caret in the message box on macOS", "中文内容": "[VSCode] 修复了 macOS 上 Ctrl+F 和 Ctrl+P 无法移动消息框中的插入符号的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed the Accept and Reject buttons doing nothing on a proposed diff moved to a new window", "中文内容": "[VSCode] 修复了接受和拒绝按钮在移至新窗口的建议差异上不执行任何操作的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed Accept and Reject Proposed Changes showing over the chat, the terminal tab and other files; they now show only on the proposed diff", "中文内容": "[VSCode] 修复了在聊天、终端选项卡和其他文件上显示的接受和拒绝建议的更改；它们现在仅显示在建议的差异上"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed a slow-starting Claude tab taking the keyboard away from the file you had gone on typing in", "中文内容": "[VSCode] 修复了启动缓慢的 Claude 选项卡，该选项卡使键盘远离您正在输入的文件"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed unsaved changes and new problems being missed on macOS and Linux for files whose path contains `#`, `?` or `%20`, such as a `C#` folder", "中文内容": "[VSCode] 修复了路径包含`#`、`?`或`%20`的文件（例如`C#`文件夹）在 macOS 和 Linux 上丢失未保存的更改和新问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed whole-line selections counting one line too many in the selection chip, in @-mentions and in what Claude is told, and file links leaving out the last line of a range", "中文内容": "[VSCode] 修复了在选择芯片、@-提及和 Claude 被告知的内容中整行选择计数过多的一行，以及文件链接遗漏了范围的最后一行的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed a conversation forked in the panel re-running an old, unanswered prompt by itself after a window reload", "中文内容": "[VSCode] 修复了面板中分叉的对话，在窗口重新加载后重新运行旧的、未应答的提示"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed a forked conversation running the original conversation's `/loop` schedules a second time", "中文内容": "[VSCode] 修复了第二次运行原始对话的`/loop`计划的分叉对话"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed /clear giving no sign that the session still runs without a newly trusted folder's CLAUDE.md and settings", "中文内容": "[VSCode] 修复了 /clear 没有迹象表明会话在没有新信任文件夹的 CLAUDE.md 和设置的情况下仍然运行的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed dialogs closing, and losing typed text, when a text selection was dragged past their edge", "中文内容": "[VSCode] 修复了当文本选择被拖过其边缘时对话框关闭并丢失键入的文本的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "[VSCode] Fixed advisor calls showing as \"Unsupported content type\" (anthropics/claude-code#73499,  "类型": "新增", "内容": "Added a \"Server message\" row to a server's page in `/mcp` that shows the JSON-RPC error message of a remote HTTP MCP server that refuses the connection", "中文内容": "在`/mcp`中的服务器页面添加了“服务器消息”行，显示拒绝连接的远程 HTTP MCP 服务器的 JSON-RPC 错误消息"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "新增", "内容": "Added a \"Marketplace auto-update\" row to `/status` that names managed marketplaces that get no automatic updates, and why", "中文内容": "在`/status`中添加了“市场自动更新”行，该行命名了没有自动更新的托管市场，以及原因"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "新增", "内容": "Added support for turning on Code Mode while OpenTelemetry events and metrics are enabled; each tool call the code makes sends its events; tracing still keeps it off", "中文内容": "添加了在启用 OpenTelemetry 事件和指标时打开代码模式的支持；代码进行的每个工具调用都会发送其事件；追踪仍然让它关闭"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `~/.claude.json` sometimes being reset to defaults when a network stall or file lock made it unreadable and cleared during a save", "中文内容": "修复了当网络停顿或文件锁定使其无法读取并在保存期间清除时，`~/.claude.json`有时会重置为默认值的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed repeated sign-outs on macOS when Claude Code could read the Keychain but not save to it. That session now stops at expiry and says why, and other sessions stay signed in", "中文内容": "修复了当 Claude Code 可以读取钥匙串但无法保存到其中时，在 macOS 上重复注销的问题。该会话现在在到期时停止并说明原因，而其他会话保持登录状态"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/terminal-setup` corrupting VS Code settings or keybindings files around block comments, and reporting success while losing the Shift+Enter binding where keybindings.json has an unclosed string", "中文内容": "修复了 `/terminal-setup` 损坏块注释周围的 VS Code 设置或键绑定文件，并报告成功，同时丢失 Shift+Enter 绑定（其中 keybindings.json 具有未闭合字符串）的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed files accepted through the IDE diff being saved without their last newline, and losing their byte order mark (BOM) when an edit was accepted by saving the diff in VS Code", "中文内容": "修复了通过 IDE diff 接受的文件在保存时没有最后一个换行符的情况下保存的问题，以及通过在 VS Code 中保存 diff 接受编辑时丢失字节顺序标记 (BOM) 的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed picking a cloud session in `/teleport` replacing your open conversation: the pick now starts a new session, as `/clear` does, and `/resume` brings the old one back", "中文内容": "修复了在`/teleport`中选择一个云会话来替换您打开的对话的问题：该选择现在会启动一个新会话，就像`/clear`所做的那样，而`/resume`则恢复旧会话"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/usage-credits` asking Pro and Max users to log in again after opening the browser, and the link disappearing after 8 seconds if the browser doesn't open and a task stops for usage credits", "中文内容": "修复了`/usage-credits`要求 Pro 和 Max 用户在打开浏览器后再次登录的问题，如果浏览器未打开并且任务停止获取使用积分，则链接会在 8 秒后消失"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/usage` saying usage credits are off when they had run out or reached the monthly limit, and `/model` not telling Pro and Max users when that limit blocks a model that runs on usage credits", "中文内容": "修复了`/usage`表示使用积分在用完或达到每月限制时关闭的问题，以及`/model`不会告诉 Pro 和 Max 用户该限制何时阻止使用使用积分运行的模型"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed the spend limit menu showing your spend as your monthly limit and wrapping its rows under the pointer in narrow windows", "中文内容": "修复了支出限制菜单，将您的支出显示为每月限额，并将其行包裹在狭窄窗口中的指针下方"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a status line script that prints without end freezing the prompt and using gigabytes of memory", "中文内容": "修复了一个状态行脚本，该脚本会打印而不会结束冻结提示并使用千兆字节的内存"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed an empty, frozen screen after approving managed settings while the --resume picker, the trust dialog or another set-up screen was waiting", "中文内容": "修复了在 --resume 选择器、信任对话框或其他设置屏幕等待时批准托管设置后出现的空白、冻结屏幕"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed choosing Default in `/model` replacing your saved model with your organization's default when the Default row already showed your saved model", "中文内容": "修复了当“默认”行已显示您保存的模型时，在`/model`中选择“默认”将您保存的模型替换为组织的默认模型的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed an MCP server being signed in again after you cleared its authentication while a token refresh was running", "中文内容": "修复了在运行令牌刷新时清除其身份验证后再次登录 MCP 服务器的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed background MCP tasks that stalled after a slow reconnect: Claude Code now reconnects most HTTP MCP servers by itself when one is left on an older protocol version", "中文内容": "修复了重新连接缓慢后停止的后台 MCP 任务：当使用较旧的协议版本时，Claude Code 现在会自行重新连接大多数 HTTP MCP 服务器"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed PDFs, images and `.docx`, `.xlsx` or `.pptx` files that MCP servers or websites send as `application/octet-stream` being saved as .bin, which kept Claude from reading the PDFs and images", "中文内容": "修复了 MCP 服务器或网站作为`application/octet-stream`发送的 PDF、图像以及`.docx`、`.xlsx`或`.pptx`文件被另存为 .bin，这导致 Claude 无法读取 PDF 和图像"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/code-review <pr number>` sometimes reviewing the checked-out branch instead of the pull request without saying so: it now reads the pull request with `gh pr diff`, or says when it can't", "中文内容": "修复了`/code-review <pr number>`有时会审查签出分支而不是拉取请求而无需说明的问题：它现在使用`gh pr diff`读取拉取请求，或者在无法读取时说"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/code-review` stopping at a permission prompt, on most models, to look for a `~/.claude/CLAUDE.md` that doesn't exist", "中文内容": "修复了大多数型号上的`/code-review`在权限提示处停止以查找不存在的`~/.claude/CLAUDE.md`"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Self-hosted runner: Fixed `--push-outcome-on-release` sometimes deleting a session's branch on the git host", "中文内容": "自托管运行器：修复了`--push-outcome-on-release`有时会删除 git 主机上会话分支的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Code Mode hiding a script's finished edits and the stopped command after Esc, and losing them on exit", "中文内容": "修复了代码模式隐藏脚本已完成的编辑和 Esc 后停止的命令，并在退出时丢失它们的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a runaway loop in Code Mode filling the machine's memory; it is now stopped at a limit", "中文内容": "修复了代码模式下的失控循环填充机器内存的问题；现在已经停在极限了"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a background agent running on when it was stopped while it was being resumed", "中文内容": "修复了后台代理在恢复时停止时运行的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed background shell commands using memory for the earlier conversation until they exit", "中文内容": "修复了后台 shell 命令使用早期对话的内存，直到它们退出"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Remote Control using memory for the earlier conversation after a compaction or `/clear` in sessions run by Claude Desktop, IDEs or the SDK", "中文内容": "修复了远程控制在 Claude Desktop、IDE 或 SDK 运行的会话中压缩或`/clear`后使用内存进行早期对话的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Stop not ending a request in Claude Desktop sessions on Bedrock while it waits on a hung AWS credential_process or sign-in call", "中文内容": "修复了 Stop 在等待挂起的 AWS credential_process 或登录调用时未结束 Bedrock 上的 Claude Desktop 会话中的请求的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Claude sometimes failing to send you a file on its first try on Opus 4.8 and Opus 5", "中文内容": "修复了 Claude 在 Opus 4.8 和 Opus 5 上首次尝试时有时无法向您发送文件的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Claude not being told that a connected MCP server's tools could not be loaded, and taking it for a server with no tools, in sessions with tool search", "中文内容": "修复了克劳德在工具搜索会话中没有被告知无法加载连接的 MCP 服务器的工具，并将其视为没有工具的服务器的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `claude mcp login` and `/mcp` saying a service doesn't accept sign-ins from Claude Code when the service's client registration had been retired (HTTP 410 Gone)", "中文内容": "修复了`claude mcp login`和`/mcp`，表示当服务的客户端注册已停用时，服务不接受来自 Claude Code 的登录（HTTP 410 消失）"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed another case of claude.ai-synced plugin hooks failing with \"Plugin directory does not exist\" while a session was still running on macOS", "中文内容": "修复了当会话仍在 macOS 上运行时 claude.ai 同步插件挂钩失败并显示“插件目录不存在”的另一种情况"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed auto mode asking for manual approval to `rm` a symlink that points outside the working directory or at itself", "中文内容": "修复了自动模式要求手动批准`rm`指向工作目录之外或自身的符号链接"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/sandbox` on Linux listing `allowUnixSockets` entries as allowed: they don't open those sockets there, and `/sandbox` now says so", "中文内容": "修复了 Linux 上的`/sandbox`，列出了允许的`allowUnixSockets`条目：它们不会在那里打开那些套接字，`/sandbox`现在是这样说的"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed pressing Esc twice to clear a mistyped code ending the sign-in in `/install-github-app`", "中文内容": "修复了按 Esc 两次以清除在`/install-github-app`中结束登录的错误输入代码的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Remote Control: Fixed sessions going back to their first effort level after a restart while the app still showed the level you picked (not yet for sessions that start in Ultracode)", "中文内容": "远程控制：固定会话在重新启动后返回到其第一个工作级别，而应用程序仍然显示您选择的级别（对于在 Ultracode 中启动的会话尚不适用）"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a removed plugin's MCP server staying connected in headless sessions after `reload_plugins` or when the account's plugin list drops it", "中文内容": "修复了已删除插件的 MCP 服务器在`reload_plugins`之后或当帐户的插件列表删除它时在无头会话中保持连接的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed the Claude Docs connector's tools going missing when a plugin or MCP server at the same address failed to connect, and its error wrongly suggesting `/login`", "中文内容": "修复了当同一地址的插件或 MCP 服务器连接失败时，Claude Docs 连接器的工具会丢失，并且错误地提示`/login`"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a new skills, commands or agents folder being missed when `--add-dir` names the working directory or Claude Code starts in the home folder", "中文内容": "修复了当`--add-dir`命名工作目录或 Claude Code 在主文件夹中启动时丢失新技能、命令或代理文件夹的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed sessions started from a pre-warmed process ignoring the `autoCompactWindow` setting in the project's `.claude/settings.json`", "中文内容": "修复了从预热进程启动的会话忽略项目`.claude/settings.json`中的`autoCompactWindow`设置的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `CLAUDE_AUTOCOMPACT_PCT_OVERRIDE` staying in effect in a running session after it is removed from settings.json", "中文内容": "修复了从 settings.json 中删除后`CLAUDE_AUTOCOMPACT_PCT_OVERRIDE`在正在运行的会话中仍然有效的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed the Agent tool's `effort` parameter being ignored for named teammates in agent teams", "中文内容": "修复了代理团队中指定队友忽略代理工具的`effort`参数的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/auto-mode-setup` ignoring recent auto mode denials when it scans a project for rules to suggest; it may now offer allow rules from them, and you review each before it's saved", "中文内容": "修复了`/auto-mode-setup`在扫描项目以获取建议规则时忽略最近的自动模式拒绝的问题；它现在可能会提供来自它们的允许规则，并且您在保存之前查看每个规则"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a false \"Couldn't save this change\" warning after adding a permission rule or directory in a subfolder or worktree whose own `.claude/settings.local.json` is unreadable or malformed", "中文内容": "修复了在自己的`.claude/settings.local.json`不可读或格式错误的子文件夹或工作树中添加权限规则或目录后出现的错误“无法保存此更改”警告"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed cloud sessions telling Claude to run a network proxy check after a failed request, which auto mode then blocked", "中文内容": "修复了云会话告诉克劳德在请求失败后运行网络代理检查，然后自动模式被阻止的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed headless rewind and fork going ahead while a message sent right after a model change still waited on it", "中文内容": "修复了模型更改后立即发送的消息仍在等待时无头倒带和分叉继续进行的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Claude not being told when a background task was stopped while a cloud session was restarting", "中文内容": "修复了云会话重新启动时后台任务停止时克劳德没有被告知的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/team-onboarding` reporting a guide as shared on Team and Enterprise plans when the server refused the upload", "中文内容": "修复了当服务器拒绝上传时`/team-onboarding`报告在团队和企业计划中共享的指南"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed panels and questions being cut off at the prompt in fullscreen, `/help`, history search and the background tasks list losing rows or titles in short windows, and tables wrapping in dialogs", "中文内容": "修复了全屏提示下的面板和问题、`/help`、历史搜索和后台任务列表在短窗口中丢失行或标题以及对话框中的表格的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed resumed sessions showing \"Rejected\" or \"Declined\" for edits, questions and plans that were cut off when the session ended", "中文内容": "修复了在会话结束时被切断的编辑、问题和计划显示“已拒绝”或“已拒绝”的恢复会话"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/passes` showing the wrong number of passes after a server error, and offering usage credits for sharing when no guest passes are left", "中文内容": "修复了`/passes`在服务器错误后显示错误的通行证数量，并在没有留下来宾通行证时提供用于共享的使用积分"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `claude --help` output being cut short when piped to another program", "中文内容": "修复了`claude --help`输出在通过管道传输到另一个程序时被缩短的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/terminal-setup` turning on \"Use Option as Meta key\" in Terminal.app on macOS 27, and tips there suggesting Option+Enter instead of Shift+Enter", "中文内容": "修复了在 macOS 27 上的 Terminal.app 中打开“使用 Option 作为元键”的`/terminal-setup`，并提示建议使用 Option+Enter 而不是 Shift+Enter"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Self-hosted runner: Fixed setup failing on Git LFS repositories cloned through Anthropic-managed git; sessions now start on pointer files, and `git lfs pull` fetches the content", "中文内容": "自托管运行器：修复了通过 Anthropic 管理的 git 克隆的 Git LFS 存储库上的安装失败问题；会话现在从指针文件开始，并且`git lfs pull`获取内容"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed sessions on self-hosted environments not starting from a git remote with an SSH host alias, GitHub SSH certificates or a GHE.com SSH user; an unresolved alias's error gives two git commands", "中文内容": "修复了自托管环境中的会话不是从具有 SSH 主机别名、GitHub SSH 证书或 GHE.com SSH 用户的 git 远程启动的问题；未解决的别名错误给出了两个 git 命令"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed remote MCP servers in self-hosted runner sessions staying without tools, or (over https) disconnected, after a timeout or network error", "中文内容": "修复了自托管运行器会话中的远程 MCP 服务器在超时或网络错误后不使用工具或（通过 https）断开连接的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed self-hosted runner sessions being shown as having stopped responding while Claude Code was still starting", "中文内容": "修复了当 Claude Code 仍在启动时，自托管运行器会话显示为已停止响应的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Code Mode keeping in memory every large text file that code read, and memory growing each time a background subagent was woken", "中文内容": "修复了代码模式，将代码读取的每个大文本文件保留在内存中，并且每次唤醒后台子代理时内存都会增长"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Code Mode stopping a script at its ten-minute limit while an MCP form, an MCP link prompt or a prompt that always asks was waiting for an answer", "中文内容": "固定代码模式在 MCP 表单、MCP 链接提示或始终询问的提示正在等待答案时停止脚本的十分钟限制"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Code Mode scripts receiving a \"moved to the background\" message as data from most MCP calls over two minutes: the script now waits up to ten minutes, then gets an error", "中文内容": "修复了代码模式脚本在两分钟内接收“已移至后台”消息作为来自大多数 MCP 调用的数据的问题：脚本现在等待长达十分钟，然后收到错误"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed mods that list only some tools silently turning Code Mode off; such a mod no longer keeps it off, so use managed settings for that", "中文内容": "修复了仅列出一些工具并默默关闭代码模式的 mods；这样的 mod 不再将其关闭，因此请使用托管设置"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Code Mode ignoring an MCP tool's request to end the turn when the tool was called from a script that Claude waits for", "中文内容": "修复了当 Claude 等待的脚本调用 MCP 工具时，代码模式会忽略该工具结束转弯的请求"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a Code Mode script's `let x;` keeping the value that an earlier script gave `x`", "中文内容": "修复了代码模式脚本的`let x;`保留早期脚本给出的值`x`"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a Code Mode script's call with no argument failing with a missing-parameter error on tools that need none", "中文内容": "修复了代码模式脚本的无参数调用失败，并在不需要参数的工具上出现缺少参数错误"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Code Mode scripts losing access to tools through `tools` in sessions with more than 4,096 tools", "中文内容": "修复了代码模式脚本在具有超过 4,096 个工具的会话中无法通过“工具”访问工具的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed the `/code-review` findings card often showing \"high\" for a review that ran at medium, on most models", "中文内容": "修复了在大多数型号上以中等速度运行的审查中`/code-review`结果卡经常显示“高”的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed key hints in permission prompts, questions, `/model` and `/rewind` ignoring `keybindings.json`", "中文内容": "修复了权限提示、问题、`/model`和`/rewind`中忽略`keybindings.json`的关键提示"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed auto-scroll, the PR status badge, the auto-compact warning and the ultracode tag not following the `/config` switches that control them in a running session", "中文内容": "修复了自动滚动、PR 状态徽章、自动压缩警告和超代码标签不遵循在运行会话中控制它们的`/config`开关的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a custom cancel key not working in `/add-dir`, `/tui` feedback and the save-workflow form", "中文内容": "修复了自定义取消键在`/add-dir`、`/tui`反馈和保存工作流程表单中不起作用的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed arrow keys in the save-workflow form moving the selection in the workflow view behind it", "中文内容": "修复了保存工作流程表单中的箭头键移动其后面的工作流程视图中的选择的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/config` saying nothing, or \"dismissed\", after changing many settings", "中文内容": "修复了在更改许多设置后`/config`什么也没说或“被解雇”的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed Read and @-mentions showing one line too many for files that end in a newline", "中文内容": "修复了读取和 @-提及对于以换行符结尾的文件显示过多一行的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/status` not naming the model that opusplan and haiku use in plan mode", "中文内容": "修复了`/status`未命名 opusplan 和 haiku 在计划模式下使用的模型的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `claude doctor` advising a Keychain unlock inside a macOS sandbox, where unlocking can't help", "中文内容": "修复了`claude doctor`建议在 macOS 沙箱内使用钥匙串解锁的问题，而解锁无济于事"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed the \"Jump to bottom\" pill staying hidden after copying text and scrolling away, the row under it going blank when its label changed, and quick PageUp presses scrolling too far in fullscreen", "中文内容": "修复了复制文本并滚动离开后“跳到底部”药丸保持隐藏状态、标签更改时其下方的行变为空白以及快速 PageUp 按键在全屏中滚动距离过远的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed a screen update sometimes being skipped when memory is low", "中文内容": "修复了内存不足时有时会跳过屏幕更新的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed long code blocks losing a blank line and repeating another in scrollback", "中文内容": "修复了长代码块丢失空行并在回滚中重复另一个空行的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed prompt suggestions sometimes showing placeholder text such as `_(no suggestion)_`", "中文内容": "修复了提示建议有时显示占位符文本，例如“_（无建议）_”"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed the line about earlier messages on resume blaming a damaged file when the file was intact", "中文内容": "修复了有关恢复中的早期消息在文件完好无损时指责损坏的文件的行"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed characters disappearing from the prompt when its text held a color code that sets several styles and a keyword or command was highlighted", "中文内容": "修复了当文本包含设置多种样式的颜色代码并且突出显示关键字或命令时，提示中的字符消失的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed `/rename` and `UserPromptSubmit` hook titles in `claude remote-control` sessions not showing on claude.ai and mobile", "中文内容": "修复了“claude Remote-control”会话中的`/rename`和`UserPromptSubmit`挂钩标题未显示在 claude.ai 和移动设备上的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "修复", "内容": "Fixed the Remote Control diff listing a file twice when the branch renamed it and it was then edited", "中文内容": "修复了当分支重命名文件然后对其进行编辑时，远程控制差异会列出该文件两次"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved the automatic clean-up of old sessions on computers with managed settings", "中文内容": "改进了具有托管设置的计算机上旧会话的自动清理"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved `/tui` and other in-place restarts to wait briefly for a login refresh, so they are less likely to sign you out", "中文内容": "改进了`/tui`和其他就地重新启动以短暂等待登录刷新，因此它们不太可能将您注销"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved memory use in long sessions that edit many files, and in long Claude Desktop sessions on macOS and Linux with many large MCP tool results", "中文内容": "改进了编辑多个文件的长时间会话以及 macOS 和 Linux 上具有许多大型 MCP 工具结果的长时间 Claude Desktop 会话中的内存使用情况"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Windows: Improved start-up and the first search on PCs where Claude Code's search program starts slowly", "中文内容": "Windows：改进了 PC 上的启动和首次搜索，导致 Claude Code 的搜索程序启动缓慢"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved auto mode's handling of a short reply such as \"yes\" to Claude's question when telemetry is off, behind a gateway to the Anthropic API, or on Microsoft Foundry", "中文内容": "改进了自动模式对简短回复的处理，例如当遥测关闭、在 Anthropic API 网关后面或在 Microsoft Foundry 上时，对 Claude 的问题回答“是”"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved memory use of idle Claude Desktop and SDK sessions after a long turn, and after `--resume` or `--continue` of a session that holds screenshots or large tool results", "中文内容": "改进了长时间运行后空闲 Claude Desktop 和 SDK 会话的内存使用情况，以及在保存屏幕截图或大型工具结果的会话的`--resume`或`--continue`之后的内存使用情况"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved how fast a Claude Desktop Code session with Remote Control on is ready for the next message after an answer", "中文内容": "改进了远程控制打开的 Claude Desktop Code 会话在应答后准备下一条消息的速度"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved cloud sessions to retry plugins that failed to download at startup", "中文内容": "改进了云会话以重试启动时下载失败的插件"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved Code Mode: the terminal freezes for far less time after a script makes thousands of tool calls", "中文内容": "改进的代码模式：脚本进行数千次工具调用后，终端冻结的时间要少得多"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Improved Code Mode: after starting a subagent, Claude now gets the same guidance on waiting as outside Code Mode", "中文内容": "改进的代码模式：启动子代理后，克劳德现在获得与外部代码模式相同的等待指导"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Updated computer use on macOS to newer safety rules, so some actions are refused and some apps have less access", "中文内容": "将 macOS 上的计算机使用更新为新的安全规则，因此某些操作会被拒绝，并且某些应用程序的访问权限会减少"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed saved scheduled tasks: in new signed-in sessions, most saved by earlier versions need scheduling again, though `--resume` of their own session still runs them", "中文内容": "更改了保存的计划任务：在新的登录会话中，大多数早期版本保存的任务需要再次计划，尽管它们自己会话的`--resume`仍然运行它们"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed `/code-review` with no target on most models to review the whole branch against the default branch, and fixed it losing the diff on multi-commit branches", "中文内容": "更改了大多数模型上没有目标的`/code-review`，以根据默认分支检查整个分支，并修复了它在多提交分支上丢失差异的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed auto mode to run `git status` less often so most requests wait less in large repositories; a git command that discards changes may be blocked until the working tree is checked", "中文内容": "更改了自动模式以减少运行`git status`的频率，因此大多数请求在大型存储库中等待的时间更少；放弃更改的 git 命令可能会被阻止，直到检查工作树为止"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed `/code-review <pr number> --fix`, and `/code-review` given a pull request URL, to stop without reviewing when `gh pr diff` is refused or fails", "中文内容": "更改了 `/code-review <pr number> --fix` 和给定拉取请求 URL 的 `/code-review`，以便在 `gh pr diff` 被拒绝或失败时停止而不进行审查"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed 'Exit and stop tasks' to end this session's scheduled tasks so they don't run again on resume, unless you exit while Claude is responding", "中文内容": "更改了“退出并停止任务”以结束此会话的计划任务，以便它们在恢复时不会再次运行，除非您在克劳德响应时退出"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed some teammate panes to start through /bin/sh, so they may not read shell start-up files", "中文内容": "更改了一些队友窗格以通过 /bin/sh 启动，因此他们可能无法读取 shell 启动文件"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed computer use on macOS to give up on an app launch that has not finished after 30 seconds", "中文内容": "更改了 macOS 上的计算机使用方式，以放弃 30 秒后尚未完成的应用程序启动"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Gateway: Changed the start-up warning shown while `access_control.allow_cidrs` is empty to a notice at every start, boxed in text logs: never expose the gateway to the public internet", "中文内容": "网关：将`access_control.allow_cidrs`为空时显示的启动警告更改为每次启动时显示的通知，并装在文本日志中：切勿将网关暴露于公共互联网"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Self-hosted runner: Changed a second host name's clone of the same owner/name to go under `_repos/clones/<host>/` in the base folder; no clone moves", "中文内容": "自托管运行器：将相同所有者/名称的第二个主机名的克隆更改为位于基本文件夹中的 `_repos/clones/<host>/` 下；没有克隆动作"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Self-hosted runner: Changed repositories with unusual characters in their address path to clone anew in a new folder; rules and volumes naming the old one stop applying, and the old clone stays put", "中文内容": "自托管运行器：更改了地址路径中具有异常字符的存储库，以在新文件夹中重新克隆；命名旧规则和卷的规则和卷停止应用，旧克隆保持不变"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "Self-hosted runner: Changed `--repository-folder` to take most folders in the base folder at `--capacity 1` (above 1, one there stops start-up); another repository's session overlapping one is refused", "中文内容": "自托管运行器：更改了`--repository-folder`，以在`--capacity 1`处获取基本文件夹中的大多数文件夹（高于 1，其中一个会停止启动）；另一个存储库的会话与一个重叠的会话被拒绝"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed Code Mode so a PreToolUse hook that errors no longer refuses a script's tool call, as outside Code Mode; set `\"onFailure\": \"block\"` on a command, HTTP or MCP tool hook that must refuse", "中文内容": "更改了代码模式，因此出现错误的 PreToolUse 挂钩不再像代码模式之外那样拒绝脚本的工具调用；在必须拒绝的命令、HTTP 或 MCP 工具挂钩上设置 `\"onFailure\": \"block\"`"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed Code Mode to refuse a script's read of a line range over 256 MiB, which could use gigabytes of memory, and fixed reads of very long lines timing out", "中文内容": "更改了代码模式以拒绝脚本读取超过 256 MiB 的行范围（这可能会使用 GB 的内存），并修复了读取非常长的行超时的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed Code Mode to also start when telemetry, nonessential traffic or feature flags are turned off; an administrator can keep it off in managed settings", "中文内容": "更改了代码模式，以便在遥测、非必要流量或功能标志关闭时也启动；管理员可以在托管设置中将其关闭"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed Code Mode to run a script that declares its own `log`, `preview` or `sleep`, which it used to refuse", "中文内容": "更改了代码模式以运行声明自己的`log`、`preview`或`sleep`的脚本，而它过去会拒绝这些脚本"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed macOS login renewal to test the Keychain with a `Claude Code-write-check` item", "中文内容": "更改了 macOS 登录续订以使用`Claude Code-write-check`项目测试钥匙串"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed the `/tasks` header and the footer's background count to one number covering shells, monitors, MCP calls, agents, workflows and scheduled tasks", "中文内容": "将`/tasks`页眉和页脚的后台计数更改为一个数字，涵盖 shell、监视器、MCP 调用、代理、工作流和计划任务"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "改进", "内容": "Changed Stop and SubagentStop hooks to list a Monitor's script as `monitor`, not `shell`, in `background_tasks`", "中文内容": "更改了 Stop 和 SubagentStop 挂钩，以在`background_tasks`中将监视器的脚本列为`monitor`，而不是`shell`"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "移除", "内容": "Removed 2.1.326's automatic retry at the limit named in a `max_tokens` error; behind a gateway whose model takes fewer output tokens, set `CLAUDE_CODE_MAX_OUTPUT_TOKENS` to that limit", "中文内容": "删除了 2.1.326 在`max_tokens`错误中指定的限制时的自动重试；在模型需要较少输出令牌的网关后面，将`CLAUDE_CODE_MAX_OUTPUT_TOKENS`设置为该限制"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Added a line above the message box after you decline the trust prompt, with Review trust to bring the prompt back without reloading the window", "中文内容": "[VSCode] 在拒绝信任提示后在消息框上方添加了一行，使用“查看信任”可在不重新加载窗口的情况下恢复提示"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed being signed out of Claude Code in every window and terminal when the sign-in server took 10 to 30 seconds to answer the extension's token refresh", "中文内容": "[VSCode] 修复了当登录服务器花费 10 到 30 秒来响应扩展的令牌刷新时，在每个窗口和终端中从 Claude Code 中注销的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed keys pressed while an input method (IME) is composing moving focus on or declining a permission prompt, running menu rows and closing dialogs (anthropics/claude-code#106358)", "中文内容": "[VSCode] 固定输入法 (IME) 编写时按下的按键，移动焦点或拒绝权限提示、运行菜单行和关闭对话框 (anthropics/claude-code#106358)"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed the permission prompt for Bash, Edit, Write and other built-in tools not showing why a safety check asks", "中文内容": "[VSCode] 修复了 Bash、Edit、Write 和其他内置工具的权限提示不显示安全检查询问的原因"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed a half-written plan comment being lost or moved to another passage, and an input method's Enter sending the comment, ending a session rename or picking an @-mentioned file", "中文内容": "[VSCode] 修复了写了一半的计划注释丢失或移动到另一段，以及输入法的 Enter 发送注释、结束会话重命名或选择@提到的文件"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed the limit banner not saying when usage credits are in use, and the session survey covering that banner and the usage credits card", "中文内容": "[VSCode] 修复了限制横幅未说明何时使用使用积分的问题，以及涵盖该横幅和使用积分卡的会话调查"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed screen readers not announcing a permission request that arrived while the Account & Usage dialog was open until that dialog was closed", "中文内容": "[VSCode] 修复了屏幕阅读器在“帐户和使用情况”对话框打开时不会宣布到达的权限请求的问题，直到该对话框关闭为止"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed a proposed-edit diff tab staying open, with an Accept button that did nothing, after its terminal Claude Code session disconnected", "中文内容": "[VSCode] 修复了在终端 Claude Code 会话断开连接后，建议编辑差异选项卡保持打开状态，且“接受”按钮不执行任何操作的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed short tool inputs and outputs cut off at the panel's edge with no way to read the rest (they now open in an editor tab), and dragging to select text also opening one", "中文内容": "[VSCode] 修复了短工具输入和输出在面板边缘被切断的问题，无法读取其余部分（它们现在在编辑器选项卡中打开），并且拖动以选择文本也会打开一个"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed the Up key putting an earlier message over text that an input method (IME) is composing in the message box (anthropics/claude-code#101294)", "中文内容": "[VSCode] 修复了向上键将较早的消息放置在输入法 (IME) 在消息框中编写的文本上的问题 (anthropics/claude-code#101294)"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed dropping an Explorer folder onto the chat inserting nothing on VS Code 1.103 to 1.139 or in a floating chat window, and the drop highlight vanishing with a false \"Hold Shift\" hint", "中文内容": "[VSCode] 修复了将 Explorer 文件夹拖放到聊天中，在 VS Code 1.103 到 1.139 或浮动聊天窗口中不插入任何内容，以及拖放突出显示消失并出现错误的“按住 Shift”提示的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed a permission prompt moving keyboard focus away from the details you were scrolling as its buttons switched on", "中文内容": "[VSCode] 修复了在按钮打开时将键盘焦点从您滚动的详细信息移开的权限提示"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed file links in a Claude tab opening in another editor group when `claudeCode.lockEditorGroups` is off (anthropics/claude-code#108884)", "中文内容": "[VSCode] 修复了当 `claudeCode.lockEditorGroups` 关闭时在另一个编辑器组中打开的 Claude 选项卡中的文件链接 (anthropics/claude-code#108884)"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed ranges written with a single tilde (`3~5 … 7~10`) losing their tildes and showing struck-through text between them; only `~~text~~` is struck through now", "中文内容": "[VSCode] 修复了用单个波浪号（`3~5 … 7~10`）编写的范围丢失波浪号并在它们之间显示删除线的文本；现在只有 `~~text~~` 被删除"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Fixed dictation errors wrapping into a narrow column, the spinner turning while a question card waits, and a NUL symbol after each letter in the output of a failed UTF-16 command", "中文内容": "[VSCode] 修复了听写错误包裹成狭窄的列、问题卡等待时旋转器转动以及失败的 UTF-16 命令输出中每个字母后出现 NUL 符号的问题"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Changed Down to stop at the last item of a permission prompt instead of wrapping to Yes", "中文内容": "[VSCode] 更改为“向下”以停止在权限提示的最后一项，而不是换行为“是”"}, {"日期": "2026-11-19", "版本": "2.1.329", "类型": "其他", "内容": "[VSCode] Changed command output to show hidden characters and control sequences other than plain colors as symbols, so Persian, Khmer, Lao, Sinhala and Malayalam text can look broken or out of order", "中文内容": "[VSCode] 更改了命令输出，以将除纯色之外的隐藏字符和控制序列显示为符号，因此波斯语、高棉语、老挝语、僧伽罗语和马拉雅拉姆语文本可能看起来损坏或无序"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "新增", "内容": "Added auto mode for Claude Opus 4.6 and Sonnet 4.6 on Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry and Claude apps gateway; interactive sessions with no permission mode start in it", "中文内容": "在 Amazon Bedrock、Google Cloud 代理平台、Microsoft Foundry 和 Claude 应用程序网关上为 Claude Opus 4.6 和 Sonnet 4.6 添加了自动模式；无权限模式的交互式会话在其中启动"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "新增", "内容": "Added `\"onFailure\": \"block\"` for `mcp_tool` hooks, as for command and HTTP hooks: a hook whose call fails blocks the action", "中文内容": "为 `mcp_tool` 钩子添加了 `\"onFailure\": \"block\"`，对于命令和 HTTP 钩子：调用失败的钩子会阻止操作"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "新增", "内容": "Added a warning when a message from a session that skips permission prompts may be held and dropped by a cloud session", "中文内容": "添加了当来自跳过权限提示的会话的消息可能被云会话保留和删除时的警告"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "新增", "内容": "Added a notice in `/status` and `claude doctor` when an OpenTelemetry exporter has no endpoint and its data would likely be lost", "中文内容": "当 OpenTelemetry 导出器没有端点并且其数据可能会丢失时，在`/status`和`claude doctor`中添加了通知"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "新增", "内容": "Added `CLAUDE_CODE_DISABLE_DEFERRED_TOOL_RESUME`, which lets a host stop `claude -p --resume` and `--continue` from running a tool call that a hook deferred", "中文内容": "添加了`CLAUDE_CODE_DISABLE_DEFERRED_TOOL_RESUME`，它允许主机停止`claude -p --resume`和`--continue`运行钩子延迟的工具调用"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "新增", "内容": "Added support for apps that embed Claude Code to switch on the policy plugin's `allowManagedModsOnly` option; an admin's managed settings still win", "中文内容": "添加了对嵌入 Claude Code 的应用程序的支持，以打开策略插件的`allowManagedModsOnly`选项；管理员的托管设置仍然获胜"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "新增", "内容": "Added a startup warning to the Claude apps gateway when a policy's `maxEffortLevel` is not a valid effort level", "中文内容": "当策略的`maxEffortLevel`不是有效的工作级别时，向 Claude 应用程序网关添加了启动警告"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Added `--repository-folder` to name the folder that sessions use for a repository at `--capacity 1`, in place of its path under the base folder, which can't be a symbolic link", "中文内容": "自托管运行器：添加了`--repository-folder`来命名会话用于存储库的文件夹`--capacity 1`，代替其在基本文件夹下的路径，该文件夹不能是符号链接"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Added a start-up warning when the host's settings.json sets a default permission mode that sessions ignore", "中文内容": "自托管运行器：当主机的settings.json设置会话忽略的默认权限模式时添加启动警告"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Added `--hook-label` to `claude self-hosted-runner orchestrator`, to hand chosen session labels to the `spawn-runner` hook", "中文内容": "自托管运行器：向“claude self-hosted-runner Orchestrator”添加了`--hook-label`，以将选定的会话标签传递给`spawn-runner`挂钩"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Added `--metadata key=value` to `claude --environment`, to label a session for the `spawn-runner` hook", "中文内容": "自托管运行器：将`--metadata key=value`添加到`claude --environment`，以标记`spawn-runner`挂钩的会话"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Added `claude_code_self_hosted_orchestrator_session_queue_wait_by_reason_seconds` to the orchestrator's `/metrics`, so a re-opened session's wait can be told from a new one's", "中文内容": "自托管运行器：将`claude_code_self_hosted_orchestrator_session_queue_wait_by_reason_seconds`添加到协调器的`/metrics`中，因此可以从新会话的等待中得知重新打开的会话的等待时间"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Added an orchestrator metric, `claude_code_self_hosted_orchestrator_sessions_given_up_total`, that counts by cause how often Anthropic gave up starting a runner for a session", "中文内容": "自托管运行器：添加了一个协调器指标`claude_code_self_hosted_orchestrator_sessions_given_up_total`，该指标根据 Anthropic 放弃启动会话运行器的频率进行计数"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Bash commands in zsh stopping with a \"not found\" error at a word that starts with `=`, such as `echo ====` or `[ a == b ]`; `=cmd` no longer expands to a command's path", "中文内容": "修复了 zsh 中的 Bash 命令在以 `=` 开头的单词处停止并出现“未找到”错误的问题，例如 `echo ====` 或 `[ a == b ]`； `=cmd` 不再扩展为命令的路径"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed automatic compaction reusing the session's earlier system prompt instead of rebuilding it the way `/compact` does", "中文内容": "修复了自动压缩，重用会话的早期系统提示符，而不是像`/compact`那样重建它"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed markdown rendering freezing on some very long or malformed input", "中文内容": "修复了某些很长或格式错误的输入上的 Markdown 渲染冻结问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed rare screen freezes", "中文内容": "修复了罕见的屏幕冻结问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Esc often being lost at a permission prompt or question when you typed straight after it; in terminals that send Alt as Esc and a key, an unused Alt or Option key now declines there", "中文内容": "修复了当您直接输入 Esc 时，在出现权限提示或问题时经常会丢失 Esc 的问题；在将 Alt 作为 Esc 和键发送的终端中，未使用的 Alt 或 Option 键现在会被拒绝"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a paste or a terminal's reply being typed into the prompt when a slow connection cut it in two", "中文内容": "修复了当连接速度较慢将其分成两部分时在提示中输入粘贴或终端回复的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed saving a scheduled task erasing the project's other saved tasks when the scheduled tasks file can't be read, on third-party providers or with telemetry or feature flags turned off", "中文内容": "修复了在第三方提供商上或在遥测或功能标志关闭的情况下无法读取计划任务文件时保存计划任务会删除项目的其他已保存任务的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a scheduled task with a typo in the project's scheduled tasks file being deleted the next time that file was saved", "中文内容": "修复了项目计划任务文件中存在拼写错误的计划任务，该文件在下次保存该文件时被删除"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a case where a resumed cloud session could lose its compaction summary or recent messages when a message was saved late", "中文内容": "修复了当消息保存较晚时恢复的云会话可能会丢失其压缩摘要或最近消息的情况"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed the token counts on the spinner and for subagents counting a retried reply twice, missing replies that were not streamed, and standing still while Claude thinks", "中文内容": "修复了旋转器上的令牌计数以及子代理对重试回复进行两次计数、丢失未流式传输的回复以及在克劳德思考时保持静止的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed the error shown when usage credits run out mid-response, which named a rate limit", "中文内容": "修复了使用积分在响应中耗尽时显示的错误，该错误称为速率限制"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed auto mode failing every turn outside Claude Desktop with `CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS` set behind a gateway rejecting betas, on Bedrock, Agent Platform, Foundry or Claude apps gateway", "中文内容": "修复了在基岩、代理平台、Foundry 或 Claude 应用程序网关上，在网关后面设置了`CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS`并拒绝 Beta 版的情况下，在 Claude Desktop 之外的自动模式每次都会失败的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `CLAUDE_STREAM_IDLE_TIMEOUT_MS` not lengthening the 5-minute connection limit on gateways, custom base URLs and cloud providers", "中文内容": "修复了`CLAUDE_STREAM_IDLE_TIMEOUT_MS`不延长网关、自定义基本 URL 和云提供商的 5 分钟连接限制的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed some Claude Desktop sessions on third-party providers, other than scheduled tasks, ending for good with \"Prompt is too long\" after large tool results; the largest are now left out", "中文内容": "修复了除计划任务之外的第三方提供商的一些克劳德桌面会话，在大型工具结果后以“提示太长”结束；最大的现在被排除在外"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed MCP tools whose input schema starts with `anyOf`, `oneOf` or `allOf` going missing on third-party providers or with telemetry or feature flags turned off", "中文内容": "修复了输入模式以`anyOf`、`oneOf`或`allOf`开头的 MCP 工具在第三方提供商中丢失或遥测或功能标志关闭的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed an MCP tool with an invalid input schema failing requests on third-party providers or with telemetry or feature flags turned off; the tool is now left out and Claude is told why", "中文内容": "修复了 MCP 工具的输入模式无效，导致第三方提供商请求失败或遥测或功能标志关闭；该工具现在被排除在外，并告诉克劳德原因"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed effort being turned off for a subagent's model for the session if Bedrock, Google Cloud's Agent Platform or Foundry refused its progress summary's effort setting (regression in 2.1.327)", "中文内容": "修复了如果 Bedrock、Google Cloud 的代理平台或 Foundry 拒绝其进度摘要的工作量设置，会话子代理模型的工作量将被关闭的问题（2.1.327 中的回归）"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode stopping a script when a permission prompt outside auto or bypass mode, a plan approval or a question stayed open for ten minutes", "中文内容": "固定代码模式在自动或旁路模式之外的权限提示、计划批准或问题保持开放十分钟时停止脚本"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode scripts in auto and bypass-permissions modes failing to call an MCP server that had connected while the previous script was running", "中文内容": "修复了自动和旁路权限模式下的代码模式脚本无法调用在上一个脚本运行时已连接的 MCP 服务器的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode scripts not running in the background in auto or bypass permissions mode in a session chosen in the `claude --resume` picker", "中文内容": "修复了在`claude --resume`选择器中选择的会话中，代码模式脚本不在后台以自动或绕过权限模式运行的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode losing a loaded skill, hook context or a note typed with a permission approval when resuming a session in which one reply ran several scripts", "中文内容": "修复了代码模式在恢复一个回复运行多个脚本的会话时丢失加载的技能、挂钩上下文或经权限批准键入的注释的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Claude not being told that a Code Mode script was cut off when the session was resumed from the picker or in a mode that asks for permission", "中文内容": "修复了当从选择器恢复会话或处于请求许可的模式时，克劳德没有被告知代码模式脚本被切断的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode silently using `undefined` for top-level variables that an earlier failed script never set", "中文内容": "修复了代码模式，静默使用“未定义”作为早期失败脚本从未设置的顶级变量"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode scripts not being told when a failing command's long output was cut", "中文内容": "修复了当失败命令的长输出被切断时不会告知代码模式脚本的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode refusing valid scripts that start with a `{` block", "中文内容": "修复了代码模式拒绝以`{`块开头的有效脚本"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode refusing scripts that use both a top-level `await` and a top-level `return`", "中文内容": "修复了代码模式拒绝同时使用顶级`await`和顶级`return`的脚本"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed an @-mentioned small file not being attached in Code Mode after a script had read or written it", "中文内容": "修复了脚本读取或写入后，@提到的小文件未在代码模式中附加的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Code Mode offering `write()` and `edit()` to read-only subagents that can't call them", "中文内容": "修复了代码模式，为无法调用它们的只读子代理提供`write()`和`edit()`"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Claude starting a turn by itself in Code Mode when Esc was followed by a command such as `/model`", "中文内容": "修复了当 Esc 后跟`/model`等命令时克劳德在代码模式下自行开始转弯的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Claude in Code Mode not being told to run workflows only when you ask, or the workflow size you set in `/config`", "中文内容": "修复了代码模式下的克劳德仅在您询问时才被告知运行工作流程，或者您在`/config`中设置的工作流程大小的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Remote Control repeating the same disconnect message, and telling you to retry a session that can't reconnect", "中文内容": "修复了远程控制重复相同的断开连接消息，并告诉您重试无法重新连接的会话的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a waiting permission prompt being lost, and its answer ignored, when a remote session restarted while the service was slow", "中文内容": "修复了当远程会话在服务缓慢时重新启动时，等待权限提示丢失且其答案被忽略的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed cloud sessions resuming a cleared conversation after a rewind followed by `/clear`", "中文内容": "修复了云会话在倒回后按`/clear`恢复已清除的对话的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a remote session losing a turn's tool calls and results when its runner or worker was lost after a dropped model stream had been retried", "中文内容": "修复了在重试删除的模型流后，当运行程序或工作人员丢失时，远程会话会丢失回合的工具调用和结果"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed cloud and Remote Control sessions that just started, or have an @ in their title, being unreachable in cross-session messaging from a session with Remote Control on", "中文内容": "修复了刚刚启动的云和远程控制会话，或者标题中带有 @ 的会话，在远程控制打开的会话中无法通过跨会话消息传递进行访问"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Claude being told that cloud sessions can never reply; it now learns when a reply can come and how else to get the result", "中文内容": "修复了克劳德被告知云会话永远无法回复的问题；现在它知道何时可以收到回复以及如何获得结果"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/diff`, the Changes pane of Remote Control sessions and the diff beside an edit leaving out committed work after a command moved into another repository", "中文内容": "修复了`/diff`、远程控制会话的“更改”窗格以及命令移动到另一个存储库后遗漏已提交工作的编辑旁边的差异"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Remote Control not showing a running workflow's agents when a session run by an IDE extension or other SDK app is opened over an hour after the workflow last made progress", "中文内容": "修复了当工作流上次取得进展后一个小时内打开由 IDE 扩展或其他 SDK 应用程序运行的会话时，远程控制不显示正在运行的工作流的代理"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Remote Control: Fixed an idle Desktop or VS Code session showing as running after Remote Control is turned on", "中文内容": "远程控制：修复了打开远程控制后显示为正在运行的空闲桌面或 VS Code 会话"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed the model saying background agents were still running after an SDK interrupt had stopped them", "中文内容": "修复了 SDK 中断停止后后台代理仍在运行的模型"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Send now in the desktop app and SDK hosts telling Claude that a stopped web search found no results", "中文内容": "修复了桌面应用程序和 SDK 主机中的“立即发送”告诉 Claude 已停止的网络搜索未找到任何结果"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Cmd+letter being typed into the prompt in terminals that report Cmd", "中文内容": "修复了在报告 Cmd 的终端中在提示中键入 Cmd+字母的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Ctrl+click opening a link twice in GNOME Terminal, side mouse buttons acting as clicks, and the first wheel notch in the other direction being ignored after a pause, in fullscreen mode", "中文内容": "修复了在全屏模式下，Ctrl+单击在 GNOME 终端中打开链接两次、鼠标侧键充当单击以及暂停后另一个方向的第一个滚轮凹口被忽略的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Shift+Enter in Konsole outside tmux and ssh, and Alt shortcuts on non-Latin keyboard layouts in terminals that speak the kitty keyboard protocol", "中文内容": "修复了 tmux 和 ssh 之外的 Konsole 中的 Shift+Enter，以及使用 kitty 键盘协议的终端中非拉丁键盘布局上的 Alt 快捷键"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Linux: Fixed pasting in other apps freezing while Claude Code is suspended with Ctrl+Z, when `xclip` or `wl-copy` is installed", "中文内容": "Linux：修复了安装`xclip`或`wl-copy`时，使用 Ctrl+Z 暂停 Claude Code 时其他应用程序中的粘贴冻结问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Linux: Fixed Ctrl+V missing the clipboard image, pasting an old one or hanging", "中文内容": "Linux：修复了 Ctrl+V 丢失剪贴板图像、粘贴旧图像或挂起的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed text copied in fullscreen mode including the quote bar, losing spaces at line wraps when a drag scrolled upward, or missing words under the \"Jump to bottom\" pill", "中文内容": "修复了在全屏模式下复制的文本，包括引号栏、向上滚动时在换行处丢失空格，或“跳到底部”药丸下缺少单词"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed an image path pasted into a `!` command becoming an attachment", "中文内容": "修复了粘贴到`!`命令中的图像路径成为附件的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Ctrl+C showing no exit warning while the `?` shortcuts list is open", "中文内容": "修复了`?`快捷方式列表打开时 Ctrl+C 不显示退出警告的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Ctrl+R search in fullscreen mode and the `/theme` color editor picking the wrong row when keys arrive together, and keys being dropped there and in the search of `/config` and `/plugin`", "中文内容": "修复了全屏模式下的 Ctrl+R 搜索和`/theme`颜色编辑器在按键一起到达时选择错误的行，以及在`/config`和`/plugin`搜索中将按键拖放到那里的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed wrong or missing colors inside GNU screen", "中文内容": "修复了 GNU 屏幕内错误或缺失的颜色"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed many background notifications cutting into the top border of open dialogs in fullscreen mode", "中文内容": "修复了全屏模式下许多后台通知切入打开对话框的顶部边框的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a message to a background agent showing a long file path in place of a pasted image", "中文内容": "修复了向后台代理显示一条长文件路径而不是粘贴图像的消息"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/goal` removing a skill's Stop hook, or ending early on another hook's result, when both had the same wording", "中文内容": "修复了`/goal`删除技能的“停止”钩子，或者当两者具有相同措辞时提前结束另一个钩子的结果"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/bug` saying cancelled after the report was sent", "中文内容": "修复了`/bug`在发送报告后说已取消的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Esc not dismissing the transcript share question for Pro and Max users", "中文内容": "修复了 Esc 不会忽略 Pro 和 Max 用户的成绩单共享问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/hooks` losing your place when going back", "中文内容": "修复了`/hooks`返回时丢失位置的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/export` writing a file named `.txt` when the name was left empty", "中文内容": "修复了当名称留空时`/export`写入名为`.txt`的文件"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/terminal-setup` in Zed replacing a symlinked `keymap.json` with a plain file", "中文内容": "修复了 Zed 中的`/terminal-setup`，用普通文件替换符号链接的`keymap.json`"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/install-github-app` adding a code review workflow when asked to update the existing workflow file", "中文内容": "修复了`/install-github-app`在要求更新现有工作流程文件时添加代码审查工作流程的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/plugin` reopening a skill, or closing the open page, when a slow save or removal finished after you went back", "中文内容": "修复了返回后缓慢保存或删除完成时`/plugin`重新打开技能或关闭打开的页面的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/plugin` asking to uninstall the wrong plugin, or ignoring Esc, after leaving a plugin while a change was still running", "中文内容": "修复了在更改仍在运行时离开插件后要求卸载错误插件或忽略 Esc 的`/plugin`问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed typing and arrow keys not working on the `/plugin` Installed tab after a search with no results or a click on the tab row", "中文内容": "修复了搜索无结果或单击选项卡行后，键入和箭头键在`/plugin`已安装选项卡上不起作用的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed holding Enter in `/plugin` turning off several installed plugins", "中文内容": "修复了在`/plugin`中按住 Enter 关闭多个已安装插件的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed the `/usage` plugin total stopping at 2,000 tokens on 1M context models, and low token estimates in `/usage` and `/plugin` when no model is picked", "中文内容": "修复了`/usage`插件在 1M 上下文模型上总共停止于 2,000 个令牌，以及在未选择模型时`/usage`和`/plugin`中的令牌估计值较低的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Esc on the Bedrock access keys step closing `/login` instead of going back", "中文内容": "修复了基岩访问键上的 Esc 步骤关闭`/login`而不是返回"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed `/exit` and Ctrl+D describing running work differently, and `/exit` warning about a workflow that had stopped", "中文内容": "修复了以不同方式描述运行工作的`/exit`和 Ctrl+D，以及有关已停止工作流程的`/exit`警告"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Claude calling an artifact private after reading one in a shared folder or publishing to another organization's, and saying only named people can open one when its folder's people can too", "中文内容": "修复了克劳德在阅读共享文件夹中的工件或发布到另一个组织的工件后将工件称为私有的问题，并表示只有指定的人才能打开该工件，而该文件夹的人员也可以打开该工件"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a plugin's toast sometimes showing another plugin's text", "中文内容": "修复了插件的 toast 有时显示另一个插件的文本的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a mod saved just after a turn began sometimes reloading mid-turn instead of at the turn's end", "中文内容": "修复了回合开始后保存的模组有时会在回合中而不是回合结束时重新加载的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed one malformed `OTEL_RESOURCE_ATTRIBUTES` entry dropping the variable's other labels from metric points, events, and spans. Now only that entry is left off", "中文内容": "修复了一个格式错误的`OTEL_RESOURCE_ATTRIBUTES`条目，该条目会从指标点、事件和跨度中删除变量的其他标签。现在只剩下该条目了"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed agent hooks running past their timeout while compacting after a request was refused as too large", "中文内容": "修复了请求因太大而被拒绝后压缩时代理挂钩运行超时的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a crash at startup when `FORCE_COLOR` is set to a negative number", "中文内容": "修复了`FORCE_COLOR`设置为负数时启动时的崩溃"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed a crash in secret masking when the machine is almost out of memory", "中文内容": "修复了机器内存几乎耗尽时秘密屏蔽的崩溃问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed the Bash sandbox on Linux renaming `.git/HEAD` after each command when the branch name is not valid UTF-8", "中文内容": "修复了当分支名称不是有效的 UTF-8 时，Linux 上的 Bash 沙箱在每个命令后重命名 `.git/HEAD`"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed all running sessions being stopped when a proxy or web filter answered a poll with HTTP 200 and a body such as `{}`; the runner now retries such a poll", "中文内容": "自托管运行器：修复了当代理或 Web 过滤器使用 HTTP 200 和`{}`等正文回答轮询时所有正在运行的会话停止的问题；跑步者现在重试这样的民意调查"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed deletion of a kept clone's objects or refs, and of commits that existed only there, after a temporary disk error; that start now fails instead", "中文内容": "自托管运行器：修复了在临时磁盘错误后删除保留克隆的对象或引用以及仅存在于其中的提交的问题；现在开始失败了"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed self-hosted runners stopping when their token ran out on a host whose clock is slow or was set back", "中文内容": "修复了当时钟速度慢或被延迟的主机上的令牌耗尽时，自托管运行程序会停止的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed sessions with Anthropic-managed git losing git access to GitHub after a script or hook in the session ran `claude` again", "中文内容": "自托管运行器：修复了与 Anthropic 管理的 git 的会话在会话中的脚本或挂钩再次运行`claude`后丢失 git 访问 GitHub 的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed self-hosted runners with Anthropic-managed git being unable to fetch or push where the machine's git config sets `http.proactiveAuth`", "中文内容": "修复了由 Anthropic 管理的 git 无法在机器的 git 配置设置`http.proactiveAuth`的位置获取或推送的自托管运行器"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed a runner that exited without telling the server when setup failed after it had registered; it now deregisters with a reason, and an on-demand runner reports the failed start", "中文内容": "自托管运行器：修复了注册后安装失败时退出而不通知服务器的运行器；现在它会因某种原因取消注册，并且按需运行程序会报告启动失败"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed archiving or requeueing a session not taking effect while it waited for another session to prepare the same repository (`--capacity` above 1)", "中文内容": "自托管运行器：修复了在等待另一个会话准备同一存储库时存档或重新排队会话不生效的问题（`--capacity` 高于 1）"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容":
