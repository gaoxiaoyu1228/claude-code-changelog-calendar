the custom status line disappearing and the screen jumping on Ctrl+C, in `!` shell mode and while pasting an image", "中文内容": "修复了在 `!` shell 模式下以及粘贴图像时自定义状态行消失和按 Ctrl+C 时屏幕跳转的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a custom status line keeping its old width, folder and session name after a terminal resize, `/cd` or `/rename` (anthropics/claude-code#107291)", "中文内容": "修复了自定义状态行在终端调整大小、`/cd`或`/rename`后保留其旧宽度、文件夹和会话名称的问题 (anthropics/claude-code#107291)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"esc to interrupt\" missing beside a custom status line and showing while Esc would go to a panel or footer item", "中文内容": "修复了自定义状态行旁边缺少“ESC 中断”并在 Esc 转到面板或页脚项目时显示的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed mouse escape codes being typed into the shell after exiting fullscreen mode", "中文内容": "修复了退出全屏模式后在 shell 中键入鼠标转义代码的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+Z message printing over the prompt box outside fullscreen", "中文内容": "修复了全屏之外的提示框上打印 Ctrl+Z 消息的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude logs` painting over and mixing with what was already in the terminal", "中文内容": "修复了“克劳德日志”的绘制并与终端中已有的内容混合"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the spinner tip flashing back and the screen bouncing as a reply finished", "中文内容": "修复了回复完成时旋转器尖端闪烁和屏幕弹跳的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"Reading 1 file…\" line blinking out and the prompt jumping when a tool call finished streaming", "中文内容": "修复了工具调用完成流式传输时“正在读取 1 个文件...”行闪烁和提示跳转的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `claude --resume` session preview being garbled and not scrolling in fullscreen mode", "中文内容": "修复了`claude --resume`会话预览出现乱码并且在全屏模式下不滚动的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc not leaving the \"Connect to your IDE automatically?\" question in `/ide`, where Ctrl+C twice quit Claude Code", "中文内容": "修复了 Esc 未离开“自动连接到您的 IDE？”的问题`/ide` 中的问题，其中 Ctrl+C 两次退出 Claude Code"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed first-run terminal setup saying nothing about what it changed or could not set up", "中文内容": "修复了首次运行终端设置未说明其更改或无法设置的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/status` showing installation warnings twice", "中文内容": "修复了`/status`显示安装警告两次的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the footer's PR badge showing the previous branch's pull request after switching branches", "中文内容": "修复了页脚的 PR 徽章在切换分支后显示上一个分支的拉取请求的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"Pushed to\" summary naming the fetched branch when a command fetched or pulled first, and \"Merged PR\" or \"Closed PR\" showing when `gh` refused the action and the exit code was hidden", "中文内容": "修复了当首先提取或拉取命令时命名提取分支的“推送到”摘要，以及当`gh`拒绝操作且隐藏退出代码时显示的“合并 PR”或“关闭 PR”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed URLs that wrap over several lines not being clickable in terminals with link support that Claude Code doesn't recognize, and labeled links in the Rex terminal", "中文内容": "修复了在具有 Claude Code 无法识别的链接支持的终端中无法单击的多行换行 URL，以及 Rex 终端中的标记链接"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+O transcript hinting Ctrl+B to background a command in fullscreen, where it pages up, and showing no sign that Claude is still working", "中文内容": "修复了 Ctrl+O 脚本提示 Ctrl+B 在全屏中将命令设置为背景的问题，该命令会向上翻页，并且没有显示克劳德仍在工作的迹象"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+R search, the model picker, plan approval, question previews, background shell output and `/plugin` install choices being cut off in short fullscreen windows", "中文内容": "修复了 Ctrl+R 搜索、模型选择器、计划批准、问题预览、后台 shell 输出和`/plugin`安装选项在短全屏窗口中被切断的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/context` grid, API errors such as \"Credit balance too low\", \"Waiting for API response\" and retry notices, \"esc to interrupt\" and \"Interrupted\" being cut off or jumbled in narrow terminals", "中文内容": "修复了 `/context` 网格、API 错误，例如“信用余额过低”、“等待 API 响应”和重试通知、“esc 中断”和“中断”在狭窄终端中被切断或混乱"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed wide tables breaking apart in plans and subagent prompts, cutting short words in half beside a long cell, and showing stray words and blank rows when drawn as label and value lists", "中文内容": "修复了宽表在计划和子代理提示中分开、将长单元格旁边的短单词切成两半以及在绘制为标签和值列表时显示杂散单词和空白行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed code keywords, added diff lines, the slow-reply spinner and \"thinking\" being hard to read in some themes and terminals", "中文内容": "修复了代码关键字、添加了差异行、缓慢回复的旋转器以及在某些主题和终端中难以阅读的“思考”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed code in diffs and file previews being invisible when the theme and the terminal background differ", "中文内容": "修复了主题和终端背景不同时差异和文件预览中的代码不可见的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the unused part of `/usage` bars looking full in the light and ANSI themes", "中文内容": "修复了`/usage`栏未使用的部分在灯光和 ANSI 主题中看起来很完整的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/effort` slider ignoring mouse clicks in fullscreen mode", "中文内容": "修复了`/effort`滑块在全屏模式下忽略鼠标点击的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed text being drawn out of place after skin-tone or joined emoji, symbols such as ✌ and ☝, and Hindi, Tamil and other Indic vowel signs in terminals that draw them wider", "中文内容": "修复了终端中的肤色或连接表情符号、✌和☝等符号以及印地语、泰米尔语和其他印度语元音符号后绘制不正确的文本，这些符号将它们拉得更宽"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed joined emoji pushing rows out of place in GNU screen", "中文内容": "修复了连接的表情符号在 GNU 屏幕中将行推错位的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the last item of JSON lists and right-aligned numbers losing their indent in command and tool output", "中文内容": "修复了 JSON 列表的最后一项和右对齐数字在命令和工具输出中丢失缩进的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed diffs numbering \"No newline at end of file\" as a line of code, which shifted the line numbers after it", "中文内容": "修复了将“文件末尾无换行符”编号为代码行的差异编号，这会移动其后的行号"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long single-line messages showing \"(0 lines hidden)\" instead of how much text is hidden", "中文内容": "修复了长单行消息显示“（隐藏 0 行）”而不是隐藏了多少文本的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed notebook edits showing no tool row when Claude left out the cell type or deleted a cell, and showing `@undefined` when inserting a cell at the top", "中文内容": "修复了当克劳德遗漏单元格类型或删除单元格时笔记本编辑不显示工具行，以及在顶部插入单元格时显示`@undefined`的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"Switch model?\" and \"Change effort level?\" questions showing no key hints", "中文内容": "修复了“切换型号？”和“改变努力水平？”没有显示关键提示的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `?` shortcuts list running its columns together in narrow terminals and being cut off at the bottom in short fullscreen windows", "中文内容": "修复了`?`快捷方式列表在狭窄的终端中一起运行其列并在短的全屏窗口中在底部被切断的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed leftover hint text in screen reader mode on macOS and Linux after closing the `/permissions` search when the rule list was taller than the terminal", "中文内容": "修复了当规则列表高于终端时关闭`/permissions`搜索后 macOS 和 Linux 上屏幕阅读器模式下的剩余提示文本"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Bash permission checks: some commands now ask first, or are refused where no one can answer", "中文内容": "改进了 Bash 权限检查：某些命令现在首先询问，或者在无人回答的情况下被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved permission checks in Code Mode; more sandboxed commands now ask or are refused", "中文内容": "改进了代码模式中的权限检查；更多沙盒命令现在询问或被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the messages shown when Code Mode can't be turned on, so they say what you can do", "中文内容": "改进了代码模式无法打开时显示的消息，以便它们告诉您可以做什么"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Bash sandbox protections on macOS, Linux and WSL", "中文内容": "改进了 macOS、Linux 和 WSL 上的 Bash 沙箱保护"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed edits in a session's mods folder to ask more often, and sandboxed commands to write to fewer folders; if every edit asks, remove any link there to an unreadable or network path", "中文内容": "更改了会话 mods 文件夹中的编辑以更频繁地询问，并沙盒命令以写入更少的文件夹；如果每次编辑都要求，请删除指向不可读或网络路径的任何链接"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Claude's sandbox instructions on Linux to explain that a server is reachable only from the command that started it", "中文内容": "改进了 Linux 上的克劳德沙箱指令，以解释服务器只能通过启动它的命令访问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved how secrets are masked in push notifications from Remote Control and cloud sessions", "中文内容": "改进了远程控制和云会话的推送通知中隐藏秘密的方式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/logout` and `claude auth logout` in the terminal to retry revoking the login, and to say where to revoke it if the server doesn't confirm", "中文内容": "改进了终端中的`/logout`和`claude auth logout`，以重试撤销登录，并说明如果服务器未确认，在哪里撤销登录"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Remote Control: replies from `claude remote-control`, Claude Desktop and VS Code sessions now stream to your phone or browser as they are written", "中文内容": "改进的远程控制：来自“claude 远程控制”、Claude 桌面和 VS Code 会话的回复现在会在写入时流式传输到您的手机或浏览器"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved typing, streaming and resize responsiveness, especially in long sessions", "中文内容": "改进了打字、流媒体和调整大小的响应能力，尤其是在长时间会话中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved response time after reading or editing files, most noticeably on Windows", "中文内容": "改进了读取或编辑文件后的响应时间，尤其是在 Windows 上"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved idle CPU use: an idle session now wakes the machine less often", "中文内容": "改进了空闲 CPU 使用情况：空闲会话现在唤醒机器的频率降低了"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved CPU use when more than 20 subagents are running: token counts of background agents whose transcript isn't open now update every 5 seconds", "中文内容": "当超过 20 个子代理运行时，改进了 CPU 使用率：未打开脚本的后台代理的令牌计数现在每 5 秒更新一次"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Windows: Improved the speed of a session's first Bash command by about a second", "中文内容": "Windows：将会话第一个 Bash 命令的速度提高了约一秒"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved response time of the first message after `/compact` in git repositories", "中文内容": "改进了 git 存储库中`/compact`之后第一条消息的响应时间"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved response time in Claude Desktop for messages queued while Claude finishes a reply", "中文内容": "改进了 Claude Desktop 中 Claude 完成回复时排队消息的响应时间"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved time to first response in Claude Desktop's new sessions: the first turn no longer waits up to 500 ms for local MCP servers whose tools load on demand", "中文内容": "改进了 Claude Desktop 新会话中的首次响应时间：对于按需加载工具的本地 MCP 服务器，首次响应不再等待长达 500 毫秒"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved how a PreToolUse hook's `updatedInput` is kept when more than one hook answers a tool call; the rewrite now runs in more cases", "中文内容": "改进了当多个钩子应答工具调用时 PreToolUse 钩子的`updatedInput`的保留方式；重写现在在更多情况下运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the error when a PreToolUse hook exits 127, saying its check may not have run", "中文内容": "改进了 PreToolUse 挂钩退出时的错误 127，表示其检查可能未运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved hook failures, blocks and timeouts in the transcript: failures are now red instead of grey, a hook that stops Claude is yellow, and the reason is shown under them", "中文内容": "改进了记录中的钩子失败、阻塞和超时：失败现在是红色而不是灰色，阻止克劳德的钩子是黄色的，原因显示在它们下面"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the folder trust prompt, at launch and in `/cd`, to name the project settings files Claude Code will load; at launch it also marks files that run commands", "中文内容": "改进了启动时和`/cd`中的文件夹信任提示，以命名 Claude Code 将加载的项目设置文件；在启动时它还标记运行命令的文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the folder trust prompt to say why Claude Code exited", "中文内容": "改进了文件夹信任提示，说明 Claude Code 退出的原因"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the message in non-interactive runs and background agents when a permission check fails with an error, so it names the cause", "中文内容": "改进了权限检查因错误而失败时非交互式运行和后台代理中的消息，因此它指出了原因"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Claude in Chrome permission requests from a terminal session over Remote Control: on claude.ai they now name the site Claude wants to act on, also when it is already allowed", "中文内容": "改进了 Chrome 中通过远程控制从终端会话发出的 Claude 权限请求：在 claude.ai 上，他们现在将 Claude 想要操作的网站命名为 Claude 想要操作的网站，即使该网站已被允许"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved MCP tool errors in cloud sessions: when a call through the session's proxy is cut off after it was sent, Claude is told that the outcome is unknown", "中文内容": "改进了云会话中的 MCP 工具错误：当通过会话代理的呼叫发送后被切断时，Claude 被告知结果未知"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/update-config` in the terminal to use about 13,000 tokens of context instead of 93,000, and a rejected settings edit to quote only the changed settings", "中文内容": "改进了终端中的`/update-config`，使用大约 13,000 个上下文标记而不是 93,000 个，并且拒绝设置编辑以仅引用更改的设置"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Program Status Protocol (OSC 7501) reports: background commands, monitors and MCP tasks are listed, and a session waiting on them shows as working instead of done", "中文内容": "改进的程序状态协议 (OSC 7501) 报告：列出后台命令、监视器和 MCP 任务，等待它们的会话显示为正在运行而不是已完成"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Monitor: when a watch expires with no events and its command wrote to stderr, Claude is now told so and told which file holds the output", "中文内容": "改进的监视器：当监视到期且没有事件且其命令写入 stderr 时，Claude 现在会被告知并被告知哪个文件保存输出"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved Claude in Chrome: a long `browser_batch` call now has 150 seconds to answer, up from 90, so fewer finished results are lost", "中文内容": "Chrome 中的 Claude 改进：长的`browser_batch`调用现在有 150 秒的时间来应答，从 90 秒增加到这样，因此丢失的最终结果更少"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/doctor` to share findings as it works instead of staying silent until the full report", "中文内容": "改进了`/doctor`，以便在工作时分享发现，而不是在完整报告发布之前保持沉默"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the error for a settings or `.mcp.json` file with broken JSON: it now gives the line and column", "中文内容": "改进了 JSON 损坏的设置或`.mcp.json`文件的错误：它现在提供行和列"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved commands that are off for your provider, sign-in or an environment variable such as `DISABLE_TELEMETRY` to say why instead of \"Unknown command\"", "中文内容": "改进了对您的提供商、登录或环境变量（例如`DISABLE_TELEMETRY`）关闭的命令，以说明原因而不是“未知命令”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the `CERT_SIGNATURE_FAILURE` connection error to name a possible cause after a CA renewal and what IT can change", "中文内容": "改进了`CERT_SIGNATURE_FAILURE`连接错误，以指出 CA 续订后可能的原因以及 IT 可以更改的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the message shown when a team's pooled group budget is used up: it now says when the budget resets", "中文内容": "改进了团队的集体预算用完时显示的消息：现在显示预算何时重置"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the error shown when the API refuses a Console sign-in: it now says to run `/login` instead of pointing to an admin setting", "中文内容": "改进了 API 拒绝控制台登录时显示的错误：现在显示运行`/login`，而不是指向管理设置"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved sign-in prompts: pasting a verification code or a web address now says what to do instead, and the prompt stays so you can paste the right code (anthropics/claude-code#97)", "中文内容": "改进的登录提示：粘贴验证码或网址现在会说明要做什么，并且提示会保留，以便您可以粘贴正确的代码 (anthropics/claude-code#97)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the `/login` screen: the code goes in a proper text field, a rejected code says why under it, and pasting in a short window scrolls the field into view", "中文内容": "改进了`/login`屏幕：代码进入正确的文本字段，被拒绝的代码在其下方说明原因，粘贴到短窗口中会将字段滚动到视图中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/design-login`, `/install-github-app` and MCP sign-in screens to match `/login`; the first two now mask the pasted code", "中文内容": "改进了 `/design-login`、`/install-github-app` 和 MCP 登录屏幕以匹配 `/login`；前两个现在掩盖了粘贴的代码"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the Claude apps gateway sign-in screens: the sign-in address is a link and `c` copies it", "中文内容": "改进了 Claude apps 网关登录屏幕：登录地址是一个链接，`c`复制它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Discover and marketplace lists: they fit short windows with the cursor and key hints on screen, and Home, End, PgUp, PgDn, the mouse wheel and clicks now work", "中文内容": "改进的`/plugin`发现和市场列表：它们适合短窗口，屏幕上有光标和按键提示，Home、End、PgUp、PgDn、鼠标滚轮和点击现在可以使用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Marketplaces and Add marketplace: a compact list, a clearer remove confirmation, a clear text field and shorter errors when adding fails", "中文内容": "改进了`/plugin`市场和添加市场：紧凑的列表、更清晰的删除确认、清晰的文本字段以及添加失败时更短的错误"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Installed tab: Home, End, PgUp, PgDn and clicks now work, and hidden rows are counted", "中文内容": "改进的`/plugin`已安装选项卡：Home、End、PgUp、PgDn 和点击现在可以使用，并且隐藏行会被计数"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/plugin` Errors and Stats tabs: long errors no longer fill the screen, uninstalling from an error asks first, and long skill names no longer break the table", "中文内容": "改进了`/plugin`错误和统计选项卡：长错误不再填满屏幕，首先从错误中卸载，长技能名称不再破坏表格"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `claude plugin`, `mcp`, `update`, `doctor` and `auth logout` output on a terminal to mark success, failure and warnings the same way (piped output keeps its old form)", "中文内容": "改进了终端上的`claude plugin`、`mcp`、`update`、`doctor`和`auth logout`输出，以相同的方式标记成功、失败和警告（管道输出保持其旧形式）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved wording across the terminal: `/plugin`, `/mcp`, sign-in, setup, settings, the agent view, `/teleport`, Remote Control, update messages, spinner tips, `/powerup` and `claude --help`", "中文内容": "改进了整个终端的措辞：`/plugin`、`/mcp`、登录、设置、设置、代理视图、`/teleport`、远程控制、更新消息、旋转提示、`/powerup`和`claude --help`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved key hints in many dialogs and the `?` lists: they show the keys that work, in one order and wording, and fit narrow windows; deeper screens in `/hooks` and `/permissions` say Esc goes back", "中文内容": "改进了许多对话框和“？”列表中的按键提示：它们以一种顺序和措辞显示可用的按键，并且适合狭窄的窗口； `/hooks`和`/permissions`中更深的屏幕显示 Esc 返回"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved text fields in `/add-dir`, `/export`, `/permissions`, `/feedback`, `/install-github-app` and Bedrock and Vertex setup: one look, long text wraps, and a refused value can be corrected in place", "中文内容": "改进了`/add-dir`、`/export`、`/permissions`、`/feedback`、`/install-github-app`以及 Bedrock 和 Vertex 设置中的文本字段：一看、长文本换行以及可以就地纠正拒绝值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved dialogs, panels and the transcript: errors, warnings and confirmations in many dialogs start with ✘, ⚠ or ✔, and loading lines, status rows, counts and durations look and read more alike", "中文内容": "改进的对话框、面板和文字记录：许多对话框中的错误、警告和确认以 ✘、⚠ 或 ✔ 开头，加载行、状态行、计数和持续时间看起来和读起来更加相似"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved long menus such as `/permissions`, `/resume` and `/model` to say how many rows are above and below, and the `/` and `@` menus to count hidden rows outside fullscreen and screen reader mode", "中文内容": "改进了长菜单，例如`/permissions`、`/resume`和`/model`，用于说明上方和下方有多少行，以及`/`和`@`菜单，用于计算全屏和屏幕阅读器模式之外的隐藏行数"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved list navigation: more lists wrap at both ends, checkbox lists in slash commands take Home and End, and `/permissions` says when a search finds nothing", "中文内容": "改进的列表导航：更多列表在两端换行，斜杠命令中的复选框列表采用 Home 和 End，当搜索找不到任何内容时，`/permissions`会显示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the pickers in agent view to take Home, End and paging", "中文内容": "改进了座席视图中的选择器以获取 Home、End 和寻呼"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved agent view and the agent rows under the prompt to mark the selected row with the same pointer and color as other lists", "中文内容": "改进了座席视图和提示下的座席行，以与其他列表相同的指针和颜色标记所选行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the footer after Ctrl+C stops background agents: it now offers `↓ to resume subagent` while a stopped subagent is listed", "中文内容": "改进了 Ctrl+C 停止后台代理后的页脚：现在在列出已停止的子代理时提供“↓ 恢复子代理”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved fullscreen mode: the prompt's borders now show how many lines of a long prompt are out of view", "中文内容": "改进的全屏模式：提示的边框现在显示长提示中有多少行在视图之外"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved `/autocompact` and `/scroll-speed` with a slider that shows every value, takes Home, End and (in fullscreen) clicks, and fits narrow terminals", "中文内容": "改进了`/autocompact`和`/scroll-speed`，带有滑块，可显示每个值，进行 Home、End 和（全屏）点击，并适合窄终端"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved on/off settings to read `on` / `off` in `/config`, `/memory` and auto mode setup", "中文内容": "改进了开/关设置，以读取`/config`、`/memory`和自动模式设置中的`on`/`off`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved the send-now hint under queued messages: it now says \"Queued\" and no longer looks like part of your message", "中文内容": "改进了排队消息下的立即发送提示：它现在显示“已排队”，并且不再看起来像消息的一部分"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved terminal setup to list every change before making it", "中文内容": "改进了终端设置，可在进行更改之前列出所有更改"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Improved alignment and spacing in `/btw`, `/help`, `/scroll-speed`, the settings error dialog and dialogs that suggest a plugin or setting", "中文内容": "改进了`/btw`、`/help`、`/scroll-speed`中的对齐和间距、设置错误对话框以及建议插件或设置的对话框"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed terminal and VS Code sessions in organizations with the Claude Code + Cowork HIPAA configuration to start in auto mode by default; `disableAutoMode` turns it off", "中文内容": "将具有 Claude Code + Cowork HIPAA 配置的组织中的终端和 VS Code 会话更改为默认以自动模式启动； `disableAutoMode` 将其关闭"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed terminal and VS Code sessions with no mode set to start in auto mode, not Manual mode, when your organization's policy hasn't loaded", "中文内容": "当组织的策略尚未加载时，将没有模式设置的终端和 VS Code 会话更改为以自动模式启动，而不是手动模式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed a `managed-mcp.json` added mid-session so it may apply at the next check; restart open sessions for it to apply in full", "中文内容": "更改了在会话中添加的“management-mcp.json”，以便它可以在下一次检查时应用；重新启动开放会话以使其完全应用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Code Mode's `$` shell helper to refuse some values with an error; nothing runs", "中文内容": "更改了代码模式的 `$` shell 帮助程序以拒绝某些带有错误的值；没有运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode to stop some shell commands that ran before", "中文内容": "更改了自动模式以停止之前运行的一些 shell 命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some Bash commands on macOS that ran before to ask or be refused", "中文内容": "更改了 macOS 上之前运行的一些 Bash 命令来询问或被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed a hook's `\"decision\": \"block\"` to hold in more cases, so a hook that always prints one may start blocking calls", "中文内容": "更改了挂钩的“决定”：“阻止”以在更多情况下保持不变，因此始终打印一个的挂钩可能会开始阻止调用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed sessions that start in auto by default to take a server-managed `defaultMode` once settings load, or Manual if settings fail with no stored copy and policy fails or requires it", "中文内容": "更改了默认情况下自动启动的会话，以在加载设置后采用服务器管理的`defaultMode`，或者如果设置失败且没有存储副本并且策略失败或需要它，则更改为手动"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode for organizations with the Claude Code + Cowork HIPAA configuration: on a direct Anthropic API connection, the server-side classifier now checks actions, as for other organizations", "中文内容": "更改了具有 Claude Code + Cowork HIPAA 配置的组织的自动模式：在直接 Anthropic API 连接上，服务器端分类器现在检查操作，与其他组织一样"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox to keep its state in some cases during a session, until you run `/sandbox` or `/cd`; Bash may ask first", "中文内容": "更改了 Bash 沙箱以在会话期间的某些情况下保持其状态，直到您运行`/sandbox`或`/cd`； Bash 可能会先询问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed sandboxed commands on macOS, Linux and WSL to no longer write to some sensitive home folders by default; some can be allowed with `sandbox.filesystem.allowWrite` in user or managed settings", "中文内容": "更改了 macOS、Linux 和 WSL 上的沙盒命令，默认情况下不再写入某些敏感的主文件夹；有些可以通过用户或托管设置中的`sandbox.filesystem.allowWrite`来允许"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox to set aside unexpected entries in a repository's `.git` folder after a command", "中文内容": "更改了 Bash 沙箱，以在执行命令后在存储库的`.git`文件夹中保留意外条目"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox on Linux and WSL to create some missing `--add-dir` folders before each sandboxed command, so commands that create them can fail, skip, or land inside them", "中文内容": "更改了 Linux 和 WSL 上的 Bash 沙箱，在每个沙箱命令之前创建一些缺失的`--add-dir`文件夹，因此创建它们的命令可能会失败、跳过或落在其中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed commands that a permission hook or SDK host rewrites while approving to stay in the sandbox if the original was checked as sandboxed; the approver can add `dangerouslyDisableSandbox: true`", "中文内容": "更改了权限挂钩或 SDK 主机重写的命令，同时批准保留在沙箱中（如果原始文件被检查为沙箱）；审批者可以添加 `dangerouslyDisableSandbox: true`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `claude mcp serve` to ignore `sandbox.excludedCommands`", "中文内容": "更改了“claude mcpserve”以忽略`sandbox.excludedCommands`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `/rewind` on macOS, Linux and WSL to leave some files untouched and report them as skipped when the sandbox is on", "中文内容": "更改了 macOS、Linux 和 WSL 上的`/rewind`，以保持某些文件不变，并在沙盒打开时将其报告为已跳过"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash sandbox to ask before some lines that set environment variables when auto-allow is off; unattended runs can refuse them", "中文内容": "更改了 Bash 沙箱，以在自动允许关闭时设置环境变量的某些行之前进行询问；无人值守运行可以拒绝它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Claude's file tools to refuse writes to Claude Code's sign-in files, such as `.credentials.json`", "中文内容": "更改了 Claude 的文件工具以拒绝写入 Claude Code 的登录文件，例如`.credentials.json`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash permission check to ask before more commands reach Claude Code's sign-in files", "中文内容": "更改了 Bash 权限检查，以在更多命令到达 Claude Code 的登录文件之前进行询问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some file tools to refuse some device and process files", "中文内容": "更改了一些文件工具以拒绝某些设备和进程文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some `cp` and `mv` commands to ask first", "中文内容": "更改了一些`cp`和`mv`命令以首先询问"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some tool calls in bypass permissions mode to ask for approval, or be denied where no one can be asked", "中文内容": "更改了绕过权限模式下的一些工具调用以请求批准，或者在无人可以请求的情况下被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the Bash permission check to ask about some commands with very long values it can't finish checking, or to refuse them where a deny rule may apply or no one can answer", "中文内容": "更改了 Bash 权限检查，以询问一些无法完成检查的具有很长值的命令，或者在可能适用拒绝规则或无人回答的情况下拒绝它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed subagents isolated in a worktree to refuse, in any repository, some git commands in Bash that can rewrite branches shared with your checkout; sessions are not affected", "中文内容": "更改了工作树中隔离的子代理，以拒绝任何存储库中的 Bash 中的某些 git 命令，这些命令可以重写与结帐共享的分支；会话不受影响"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `ExitWorktree` to refuse removing a worktree while a background subagent or shell command may still be running in it, unless Claude passes `discard_changes`", "中文内容": "更改了 `ExitWorktree` 以拒绝删除工作树，同时后台子代理或 shell 命令可能仍在其中运行，除非 Claude 通过 `discard_changes`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the computer use macOS permissions panel to ignore j and k; the arrow keys and Ctrl+P/Ctrl+N still move the selection", "中文内容": "更改了计算机使用 macOS 权限面板以忽略 j 和 k；箭头键和 Ctrl+P/Ctrl+N 仍会移动所选内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the PowerShell tool to ask before some more commands; unattended runs refuse them unless an allow rule, auto mode or bypass permissions mode allows them", "中文内容": "更改了 PowerShell 工具，以在更多命令之前询问；无人值守运行会拒绝它们，除非允许规则、自动模式或绕过权限模式允许它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the PowerShell tool to ask about some more commands, even in bypass permissions mode, and to refuse some of them", "中文内容": "更改了 PowerShell 工具，以询问更多命令（即使在绕过权限模式下），并拒绝其中一些命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some malformed PowerShell commands to be denied", "中文内容": "更改了拒绝某些格式错误的 PowerShell 命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some PowerShell tool commands that define a function named like a built-in command to be refused, so Claude can rename it", "中文内容": "更改了一些 PowerShell 工具命令，这些命令定义的函数名称类似于要拒绝的内置命令，以便 Claude 可以重命名它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode to ignore some wildcard shell allow rules, such as ones that name no program or that start with `$HOME`, so the safety check decides those commands", "中文内容": "更改了自动模式以忽略某些通配符 shell 允许规则，例如未命名任何程序或以`$HOME`开头的规则，因此安全检查会决定这些命令"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed auto mode to judge wildcard allow rules whose program is a Windows backslash path, so those calls can be blocked; exact rules keep their allow; we plan to restore rules that start with `.\\`", "中文内容": "更改了自动模式来判断程序是Windows反斜杠路径的通配符允许规则，因此可以阻止这些调用；确切的规则保持其允许；我们计划恢复以`.\\`开头的规则"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed a managed `autoMode.environment` list without `\"$defaults\"` to replace every built-in entry in Claude Desktop and Agent SDK apps too; add `\"$defaults\"` or copy the sensitive-target ones", "中文内容": "更改了不带“$defaults”的托管`autoMode.environment`列表，以替换 Claude Desktop 和 Agent SDK 应用程序中的每个内置条目；添加“$defaults”或复制敏感目标"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `--add-dir` and `/add-dir` in local terminal sessions to show the trust prompt for a folder you have not trusted yet; `claude --bg` refuses such a folder", "中文内容": "更改了本地终端会话中的 `--add-dir` 和 `/add-dir` 以显示您尚未信任的文件夹的信任提示； `claude --bg` 拒绝这样的文件夹"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed self-hosted runners under `--trust-workspace false` to ignore more repository settings; set such values in user or managed settings", "中文内容": "更改了`--trust-workspace false`下的自托管运行器以忽略更多存储库设置；在用户或托管设置中设置此类值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed how permission answers over Remote Control and on self-hosted runners save \"always allow\" choices", "中文内容": "更改了通过远程控制和自托管运行器保存“始终允许”选项的权限应答方式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed enabled plugins that were refused for a malformed `plugin.json` display field: they now load, with their hooks and MCP servers; administrators should check the plugins they deploy", "中文内容": "更改了因格式错误的`plugin.json`显示字段而被拒绝的已启用插件：它们现在使用其挂钩和 MCP 服务器加载；管理员应该检查他们部署的插件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed how `allowedHttpHookUrls` and `httpHookAllowedEnvVars` apply to hooks from managed settings", "中文内容": "更改了`allowedHttpHookUrls`和`httpHookAllowedEnvVars`如何应用于托管设置中的挂钩"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed HTTP hooks to ignore `Content-Length` and `Transfer-Encoding` in their `headers` setting; the request's length comes from its body", "中文内容": "更改了 HTTP 挂钩以忽略`headers`设置中的`Content-Length`和`Transfer-Encoding`；请求的长度来自其主体"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed plugin uninstall to also delete the files extracted from the plugin's MCP bundles (`.mcpb`, `.dxt`), unless another plugin uses the same bundle", "中文内容": "更改了插件卸载，同时删除从插件的 MCP 包（`.mcpb`、`.dxt`）中提取的文件，除非另一个插件使用相同的包"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed some worktree sessions to skip some plugin settings; a notice names what was skipped", "中文内容": "更改了一些工作树会话以跳过一些插件设置；通知指出了跳过的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `/plugin` uninstall, remove and switch questions to lists answered with the arrow keys and Enter, or Esc to cancel; `y`, `n` and `u` no longer answer them", "中文内容": "更改了`/plugin`卸载、删除和切换问题至使用箭头键和 Enter 或 Esc 取消回答的列表； `y`、`n` 和 `u` 不再回答它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed automatic compaction in plan mode to use the model answering you, such as Opus with `opusplan`, so it can cost more", "中文内容": "更改了计划模式下的自动压缩以使用回答您的模型，例如带有`opusplan`的 Opus，因此可能会花费更多"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Cowork cloud sessions to hold an organization's OpenTelemetry export until the first turn; a session that gets no message now sends nothing, so `claude_code.session.count` can fall", "中文内容": "更改了 Cowork 云会话以保留组织的 OpenTelemetry 导出直到第一轮；没有收到消息的会话现在不会发送任何内容，因此 `claude_code.session.count` 可能会下降"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed Claude's messages to a session on another machine to be refused when your session uses an API key, auth token, profile or workload identity beside a saved claude.ai login", "中文内容": "将 Claude 的消息更改为另一台计算机上的会话，当您的会话在保存的 claude.ai 登录旁边使用 API 密钥、身份验证令牌、配置文件或工作负载身份时，该消息将被拒绝"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `--bare` sessions on an unapproved API key: moving one to the background is now refused in most setups, and `claude --bare --bg` exits with an error if the background service lacks the key", "中文内容": "更改了未经批准的 API 密钥上的`--bare`会话：现在在大多数设置中都会拒绝将其移至后台，如果后台服务缺少密钥，则`claude --bare --bg`会退出并出现错误"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed \"Continue automatically at usage limit\" to stop with a notice, sending nothing, when your login changes or ends during the wait", "中文内容": "更改了“在使用限制下自动继续”，以在您的登录更改或在等待期间结束时停止并发出通知，不发送任何内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Changed how it connects through a proxy: requests now use a CONNECT tunnel, so a proxy that refuses CONNECT stops Remote Control with an error", "中文内容": "远程控制：更改了通过代理连接的方式：请求现在使用 CONNECT 隧道，因此拒绝 CONNECT 的代理会停止远程控制并出现错误"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Changed the session debug logs written under `--verbose` to go to `~/.claude/child-logs/`", "中文内容": "远程控制：将`--verbose`下写入的会话调试日志更改为`~/.claude/child-logs/`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Self-hosted runner: Changed Linux and macOS sessions with no `gh` to get a built-in `gh api` by default, via Anthropic, which adds their GitHub sign-in, if any; `--use-anthropic-gh false` turns it off", "中文内容": "自托管运行器：更改了没有`gh`的 Linux 和 macOS 会话，默认情况下通过 Anthropic 获取内置`gh api`，这会添加 GitHub 登录（如果有）； `--use-anthropic-gh false` 将其关闭"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed agent view so that quitting with Ctrl+C twice, Ctrl+D twice or `/exit` after pressing `←` in an empty conversation ends that session, instead of leaving it running for 5 minutes", "中文内容": "更改了代理视图，以便在空对话中按 Ctrl+C 两次、Ctrl+D 两次或按`←`后按`/exit`退出会结束该会话，而不是让它运行 5 分钟"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `--await-initialize` to be refused with `--bg` or `--worktree --tmux`, which never read the initialize request, instead of starting without the fields it carries", "中文内容": "将`--await-initialize`更改为用`--bg`或`--worktree --tmux`拒绝，它们从不读取初始化请求，而不是在没有其携带的字段的情况下启动"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed worktree creation, `/teleport` and IDE checkouts to run git with a stricter `PATH`; a git filter or helper may need its full path", "中文内容": "更改了工作树创建、`/teleport`和 IDE 签出，以使用更严格的`PATH`运行 git； git 过滤器或助手可能需要其完整路径"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the card for approving a subagent's plan to two choices, \"Yes, and switch to default (ask each time) for this session\" and \"No\", chosen with the arrow keys and Enter (typed text moves to No)", "中文内容": "将用于批准子代理计划的卡更改为两个选项，“是，并切换到此会话的默认值（每次询问）”和“否”，使用箭头键和 Enter 选择（键入的文本移至“否”）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the `/claude-api` skill to build agents on Managed Agents by default, unless you want to host the agent loop yourself", "中文内容": "更改了`/claude-api`技能以默认在托管代理上构建代理，除非您想自己托管代理循环"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed `/usage` in fullscreen mode to show plan limit bars before session cost for subscribers; `/cost` still starts with cost", "中文内容": "更改了全屏模式下的`/usage`，以在订阅者的会话费用之前显示计划限制栏； `/cost` 仍然以 cost 开头"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed the wording of some messages that `claude` subcommands print; JSON output is unchanged", "中文内容": "更改了`claude`子命令打印的一些消息的措辞； JSON 输出不变"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed first-run setup to preselect the \"Auto (match terminal)\" theme instead of Dark mode", "中文内容": "更改了首次运行设置以预先选择“自动（匹配终端）”主题而不是黑暗模式"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "改进", "内容": "Changed fullscreen `/cd` to refuse \"Yes\" while its trust prompt doesn't fit, with a line saying to make the window taller", "中文内容": "更改全屏`/cd`以拒绝“是”，而其信任提示不适合，其中一行表示使窗口更高"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "移除", "内容": "Removed the tmux notice that said the mouse wheel needs `set -g mouse on` in fullscreen; the wheel scrolls without it", "中文内容": "删除了 tmux 提示，全屏时鼠标滚轮需要 `set -g mouse on`；没有它滚轮就会滚动"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "移除", "内容": "Removed the spinner tip that suggested `/clear` 30 minutes into a running turn", "中文内容": "删除了在运行转弯 30 分钟后建议`/clear`的旋转提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Added a `claudeCode.promptSuggestions` setting that turns prompt suggestions off", "中文内容": "[VSCode] 添加了`claudeCode.promptSuggestions`设置，可关闭提示建议"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed \"Rewind code to here\" in a forked conversation sometimes undoing one turn too many and deleting files created in that turn", "中文内容": "[VSCode] 修复了分叉对话中的“将代码倒回此处”有时会撤消一轮过多并删除该轮中创建的文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the Sandbox dialog creating empty files and folders in the home directory and the project's `.git` folder while the sandbox is off", "中文内容": "[VSCode] 修复了沙箱关闭时沙箱对话框在主目录和项目的`.git`文件夹中创建空文件和文件夹的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the saved sign-in being lost on some networks", "中文内容": "[VSCode] 修复了保存的登录在某些网络上丢失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed sign-in ending when a verification code, a web address or a code from another sign-in attempt is pasted; the panel now says what to paste instead", "中文内容": "[VSCode] 修复了粘贴验证码、网址或其他登录尝试的代码时登录结束的问题；面板现在显示要粘贴的内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the sign-in screen showing briefly each time a panel or window opened while signed in to Console without an API key", "中文内容": "[VSCode] 修复了在没有 API 密钥的情况下登录控制台时每次打开面板或窗口时短暂显示的登录屏幕"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the usage-limit banner's \"Request more\" button for Team and Enterprise members coming back after each press without sending anything, after you signed in again during a session", "中文内容": "[VSCode] 修复了使用限制横幅的“请求更多”按钮，以便团队和企业成员在会话期间再次登录后每次按下后返回而不发送任何内容"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed `/ide` in a second Claude Code session silently losing the editor connection back to the first session; the newest connection now wins and the displaced session shows how to switch back", "中文内容": "[VSCode] 修复了第二个 Claude Code 会话中的 `/ide` 默默地失去了与第一个会话的编辑器连接；现在最新的连接获胜，替换的会话显示如何切换回来"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed saved memories not being listed in the Memory dialog, or RAM use growing without end, when the memory folder held symlink loops, and a hang when it held a named pipe", "中文内容": "[VSCode] 修复了当内存文件夹持有符号链接循环时，保存的内存未在“内存”对话框中列出，或者 RAM 使用量无休止地增长，以及当它持有命名管道时挂起的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed a running command's live output stopping after one failed read", "中文内容": "[VSCode] 修复了正在运行的命令的实时输出在一次读取失败后停止的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed \"Open in Terminal\" showing only the shell's error when `claude` could not be started: in bash, zsh, fish and Git Bash, a notice now explains why and links to the install guide", "中文内容": "[VSCode] 修复了“在终端中打开”在无法启动 `claude` 时仅显示 shell 的错误：在 bash、zsh、fish 和 Git Bash 中，现在有一条通知解释了原因并链接到安装指南"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the panel showing no \"Open artifact\" link after Claude publishes an artifact", "中文内容": "[VSCode] 修复了 Claude 发布工件后面板不显示“打开工件”链接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed the prompt suggestion hiding the \"attach selected text\" hint while the chat panel is unfocused", "中文内容": "[VSCode] 修复了聊天面板未聚焦时隐藏“附加所选文本”提示的提示建议"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Fixed buttons with no visible border in the high-contrast themes, and the dark welcome art on the sign-in screen in Light High Contrast", "中文内容": "[VSCode] 修复了高对比度主题中没有可见边框的按钮以及浅高对比度登录屏幕上的深色欢迎艺术"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Improved Edit and Write speed: no wait for new problems on files that are not open in a tab when the editor has been reporting none for such files", "中文内容": "[VSCode] 改进的编辑和写入速度：当编辑器未报告未在选项卡中打开的文件时，无需等待此类文件出现新问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Changed a running command's live output in the chat to look like the command card's OUT row", "中文内容": "[VSCode] 更改了聊天中正在运行的命令的实时输出，使其看起来像命令卡的 OUT 行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "[VSCode] Changed the text of extension errors in event listeners, views and activation to stay out of the editor's own error telemetry", "中文内容": "[VSCode] 更改了事件侦听器、视图和激活中的扩展错误文本，以远离编辑器自己的错误遥测"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a security issue in how zstd-compressed responses are decoded", "中文内容": "修复了 zstd 压缩响应解码方式的安全问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "新增", "内容": "Added a spinner tip in VS Code and similar integrated terminals about re-running a notebook cell, shown once Claude has read or edited a Jupyter notebook", "中文内容": "在 VS Code 和类似的集成终端中添加了有关重新运行笔记本单元的旋转提示，一旦 Claude 阅读或编辑了 Jupyter 笔记本就会显示"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "新增", "内容": "Added a line under the error shown when your organization's policy blocks a request, saying how to continue: run `/rewind` and change the message, or run `/clear`", "中文内容": "在您的组织的策略阻止请求时显示的错误下添加了一行，说明如何继续：运行`/rewind`并更改消息，或运行`/clear`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "新增", "内容": "Added a note for Claude when a sandboxed `git checkout`, `git stash` or autostash pull cannot update protected files such as those in `.claude`", "中文内容": "当沙盒`git checkout`、`git stash`或 autostash pull 无法更新受保护文件（例如`.claude`中的文件）时，为 Claude 添加了一条注释"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/security-review` and skills' inline git commands stopping with an error in worktrees of bare repositories, `--separate-git-dir` checkouts and Android `repo` checkouts", "中文内容": "修复了`/security-review`和技能内联 git 命令在裸存储库、`--separate-git-dir`签出和 Android`repo`签出的工作树中因错误而停止的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed subagents with their own model being moved to the plan-mode model when the model setting is `opusplan` or `haiku`", "中文内容": "当模型设置为`opusplan`或`haiku`时，修复了子代理将其自己的模型移至计划模式模型的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed subagents on a different model sizing file reads and MCP results with the main session's model", "中文内容": "修复了不同模型上的子代理，使用主会话的模型调整文件读取和 MCP 结果"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed sessions on many third-party gateways and Foundry stopping with a context length error on every turn instead of compacting", "中文内容": "修复了许多第三方网关和 Foundry 上的会话每次都会因上下文长度错误而停止而不是压缩的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed recent turns sometimes going missing from a resumed session after Claude Code stopped without a clean exit", "中文内容": "修复了克劳德代码在没有干净退出的情况下停止后有时会从恢复的会话中丢失最近的回合"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed shell commands running in the launch directory after the working directory was deleted; the command now fails with a message and can be re-issued", "中文内容": "修复了删除工作目录后在启动目录中运行的 shell 命令；该命令现在失败并显示一条消息，可以重新发出"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an approved plan edit being lost when the `plansDirectory` folder can't take it: the plan is now saved in the default plans folder, and a warning says where and why", "中文内容": "修复了当`plansDirectory`文件夹无法接受时已批准的计划编辑丢失的问题：该计划现在保存在默认计划文件夹中，并有一条警告说明位置和原因"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a saved `sonnet[1m]` model setting being rewritten on a new install to a model id the API rejects", "中文内容": "修复了保存的`sonnet[1m]`模型设置在新安装时被重写为 API 拒绝的模型 ID"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed focus view hiding the reply to your prompt when a scheduled task replied after it", "中文内容": "修复了当计划任务在提示后回复时，焦点视图会隐藏对提示的回复"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the prompt sometimes missing from a background subagent's view when fullscreen is off", "中文内容": "修复了全屏关闭时后台子代理视图中有时会丢失提示的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed long options in lists and permission prompts being partly overwritten when they wrap, and first-run screens losing lines on narrow terminals", "中文内容": "修复了列表中的长选项和权限提示在换行时被部分覆盖，以及首次运行的屏幕在狭窄终端上丢失行的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed startup warnings about permission rules and the \"N MCP servers need authentication\" notice being recorded as seen when they were scrolled out of view", "中文内容": "修复了有关权限规则的启动警告以及滚动到视图之外时记录的“N MCP 服务器需要身份验证”通知"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the welcome header showing control characters or splitting across lines when an agent's name or the working folder contains them or a line break", "中文内容": "修复了当代理的名称或工作文件夹包含控制字符或换行符时显示控制字符或跨行拆分的欢迎标题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the red error shown when Claude tries a command only you can run: a dim line now says it runs only when you type it at the prompt", "中文内容": "修复了克劳德尝试仅您可以运行的命令时显示的红色错误：一条暗线现在表示它仅在您在提示符下键入时运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/stats` showing an Active days total that was one day too high", "中文内容": "修复了`/stats`显示总活跃天数过高的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/insights` saying a report was ready when no session qualified for analysis, and writing two values into its HTML report without escaping them", "中文内容": "修复了`/insights`在没有符合分析资格的会话时表示报告已准备就绪的问题，并将两个值写入其 HTML 报告而不转义它们"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/voice` saying voice mode changed when managed settings, `--settings`, or the project's `.claude/settings.json` or `.claude/settings.local.json` kept it as it was; it now says what holds it", "中文内容": "修复了`/voice`表示当托管设置、`--settings`或项目的`.claude/settings.json`或`.claude/settings.local.json`保持原样时语音模式发生变化的问题；现在它说出了它的持有者是什么"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the IDE welcome dialog showing Cmd+Esc for Quick Launch on Windows and Linux", "中文内容": "修复了在 Windows 和 Linux 上显示用于快速启动的 Cmd+Esc 的 IDE 欢迎对话框"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Slack app tips showing when your organization's policy denies cloud sessions", "中文内容": "修复了 Slack 应用程序提示在组织的策略拒绝云会话时显示的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude purge` hanging silently when there is no terminal to read keys from, and its project picker and `-i` prompts ignoring the keyboard when stdin is piped", "中文内容": "修复了当没有终端可以读取密钥时`claude purge`静默挂起的问题，并且当标准输入通过管道传输时，其项目选择器和`-i`提示忽略键盘"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude plugin eval --output-dir ''` writing the report into the current folder; it now exits with an error", "中文内容": "修复了 `claude plugin eval --output-dir ''` 将报告写入当前文件夹的问题；现在退出并出现错误"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude -p` text output on a terminal passing control sequences other than text styling; pipes and files are unchanged", "中文内容": "修复了终端上传递除文本样式之外的控制序列的`claude -p`文本输出；管道和文件未更改"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed leftover `.oauth_refresh.lock.owner.tmp.*` files piling up in the config directory", "中文内容": "修复了配置目录中堆积的剩余`.oauth_refresh.lock.owner.tmp.*`文件"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/fast` saying \"Fast mode has been disabled by your organization\" under the keyless Console sign-in, where Claude Code had not asked the server", "中文内容": "修复了在无密钥控制台登录下`/fast`显示“您的组织已禁用快速模式”的问题，其中 Claude Code 未询问服务器"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/model` saying that your organization restricts a model when Claude Code could not check that, for example with no network", "中文内容": "修复了`/model`，表示当 Claude Code 无法检查该模型时，您的组织会限制该模型，例如没有网络"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed \"Sign in with your Console account\" in `/login` replacing your existing login when you pressed Esc right after the browser step", "中文内容": "修复了`/login`中的“使用您的控制台帐户登录”，当您在浏览器步骤之后按下 Esc 时，替换您现有的登录信息"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the browser showing the sign-in success page in some cases where sign-in failed or was canceled", "中文内容": "修复了浏览器在某些情况下登录失败或被取消时显示登录成功页面的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `claude auth status` and other short commands leaving a lock behind on a Console profile, which made the next session hang for about a minute", "中文内容": "修复了`claude auth status`和其他短命令在控制台配置文件上留下锁，导致下一个会话挂起大约一分钟的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed background sessions started on your claude.ai login using (and billing) an API key or token from the shell that started the background service", "中文内容": "修复了使用启动后台服务的 shell 中的 API 密钥或令牌（并计费）在 claude.ai 登录时启动的后台会话"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed more cases of a session moving to another sign-in in the background; these moves are now refused, with a message saying what works", "中文内容": "修复了更多会话在后台转移到另一个登录的情况；这些举措现在被拒绝，并有一条消息说明什么是有效的"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a second Enter in the exit dialog stopping background work after the move to the background was refused", "中文内容": "修复了拒绝移动到后台后退出对话框中的第二个 Enter 停止后台工作的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed token counting on Amazon Bedrock sending the conversation to Bedrock when the `allowedProviders` managed setting does not allow it", "中文内容": "修复了当`allowedProviders`托管设置不允许时，Amazon Bedrock 将对话发送到 Bedrock 时的令牌计数"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed AWS `credential_process` helpers and Google Cloud default credentials failing when Claude Code is started without a `HOME` environment variable", "中文内容": "修复了在没有`HOME`环境变量的情况下启动 Claude Code 时 AWS`credential_process`帮助程序和 Google Cloud 默认凭证失败的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a session sometimes going back to an earlier permission mode after a subagent's plan was approved", "中文内容": "修复了子代理的计划获得批准后，会话有时会返回到较早的权限模式的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed one invalid value in an Agent SDK `applyFlagSettings()` call silently discarding all settings from earlier calls; a call that would do this is now refused with an error", "中文内容": "修复了 Agent SDK`applyFlagSettings()`调用中的一个无效值，以静默方式丢弃先前调用中的所有设置；现在，执行此操作的调用会被拒绝并出现错误"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed sessions showing as waiting for input when a finished pull request only needed your own review or merge", "中文内容": "当完成的拉取请求仅需要您自己的审查或合并时，修复了会话显示为等待输入的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an unrecognized `teammateMode` settings value being ignored without a warning: `claude -p`, the startup warning and `claude doctor` now list it as a skipped entry (still not applied)", "中文内容": "修复了无法识别的`teammateMode`设置值在没有警告的情况下被忽略的问题：`claude -p`、启动警告和`claude doctor`现在将其列为跳过的条目（仍未应用）"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `--worktree` skipping a `WorktreeCreate` hook from a plugin in `CLAUDE_CODE_PLUGIN_SEED_DIR` on the first run in a new home directory", "中文内容": "修复了`--worktree`在新主目录中首次运行时从`CLAUDE_CODE_PLUGIN_SEED_DIR`中的插件跳过`WorktreeCreate`挂钩的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed brief-mode sessions, such as Dispatch, sending a reply again after the turn had already replied", "中文内容": "修复了简短模式会话，例如调度，在回合已经回复后再次发送回复"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude saying a working Atlassian, Asana or Sentry connector had failed in cloud sessions when a plugin listed it at a different URL", "中文内容": "修复了 Claude 说当插件在不同 URL 列出工作 Atlassian、Asana 或 Sentry 连接器时在云会话中失败的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude Desktop and SDK sessions listing a folder's own MCP servers (`.mcp.json`, local) as host-added or not at all, and not connecting WebSocket ones, after a folder move or pre-warmed start", "中文内容": "修复了 Claude Desktop 和 SDK 会话，在文件夹移动或预热启动后，将文件夹自己的 MCP 服务器（`.mcp.json`，本地）列为添加主机或根本不添加主机，并且不连接 WebSocket 服务器"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/mcp` still listing a plugin's MCP server after a plugin reload removed it while it was connecting", "中文内容": "修复了`/mcp`在插件重新加载并在连接时将其删除后仍列出插件的 MCP 服务器的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an MCP server staying \"needs authentication\", and its `mcp_tool` hooks being skipped, after a token refresh that was refused only for a moment", "中文内容": "修复了 MCP 服务器保持“需要身份验证”状态，并且在令牌刷新仅被拒绝片刻后，其`mcp_tool`挂钩被跳过"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed MCP elicitation requests being cancelled without asking in headless mode after a server's connection was replaced during a tool call", "中文内容": "修复了在工具调用期间替换服务器连接后，MCP 诱导请求被取消而无需在无头模式下询问的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed MCP tool calls from an SDK host answering \"Not connected\" after a tool call had reconnected the MCP server", "中文内容": "修复了工具调用重新连接 MCP 服务器后，来自 SDK 主机的 MCP 工具调用回答“未连接”的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an MCP task getting stuck after its question was closed with Esc or asked again: the footer now says it needs your input, and Enter in `/tasks` shows the question again", "中文内容": "修复了 MCP 任务在使用 Esc 关闭其问题或再次询问后卡住的问题：页脚现在表示它需要您的输入，并且在`/tasks`中输入再次显示该问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed background MCP tasks that stopped updating after another call to the same server lost the connection, when a later call reconnects", "中文内容": "修复了后台 MCP 任务在对同一服务器的另一次调用失去连接后停止更新（当稍后的调用重新连接时）"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a background MCP task's question opening over a message you were still typing; it now waits until you send or clear the draft, and the spinner and turn timer keep running", "中文内容": "修复了后台 MCP 任务在您仍在输入的消息上打开的问题；现在它会等待，直到您发送或清除草稿，并且旋转器和转动计时器继续运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `worktree.sparsePaths` and sparse plugin and marketplace clones leaving out the repository's root files on older git versions, such as 2.34", "中文内容": "修复了`worktree.sparsePaths`以及稀疏插件和市场克隆，在较旧的 git 版本（例如 2.34）上遗漏了存储库的根文件"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed self-hosted runner sessions with several repositories being unable to use a repository added mid-session", "中文内容": "修复了多个存储库无法使用在会话中添加的存储库的自托管运行器会话"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude asking for permission before reading your own artifact or its data", "中文内容": "修复了克劳德在读取您自己的工件或其数据之前请求许可的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed deny and ask permission rules and hooks for the Artifact tool not applying in some cloud sessions", "中文内容": "修复了 Artifact 工具的拒绝和询问权限规则和挂钩在某些云会话中不适用的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Code Mode scripts ignoring a worktree entered with `EnterWorktree`, writing `~` paths into the project, and leaving `/mcp` showing an MCP server as connected after its sign-in expired", "中文内容": "修复了代码模式脚本忽略使用`EnterWorktree`输入的工作树，将`~`路径写入项目，并在登录过期后留下`/mcp`显示 MCP 服务器已连接的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed words typed with a Yes at a permission dialog or plan approval not reaching Claude in Code Mode", "中文内容": "修复了在代码模式下克劳德无法在权限对话框或计划批准中输入“是”的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude starting work by itself when you resumed a session that ended during a Code Mode script; it now waits for your next prompt", "中文内容": "修复了当您恢复在代码模式脚本期间结束的会话时克劳德自行开始工作的问题；它现在等待您的下一个提示"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a missing OpenTelemetry `user_prompt` event for a message sent while tool calls run. The event has `delivery.mode: \"mid_turn\"` and the running turn's `prompt.id`", "中文内容": "修复了工具调用运行时发送的消息丢失的 OpenTelemetry`user_prompt`事件。该事件具有 `delivery.mode: \"mid_turn\"` 和正在运行的回合的 `prompt.id`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed the OpenTelemetry `user_prompt` event leaving out earlier messages' text when queued messages merged into one turn in VS Code, or when one message had an image", "中文内容": "修复了当排队消息在 VS Code 中合并到一轮中或当一条消息具有图像时，OpenTelemetry`user_prompt`事件会遗漏早期消息的文本"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a slash command's `allowed-tools` grants applying to background agents woken during or after its turn", "中文内容": "修复了斜线命令的“允许工具”授予应用于在其轮次期间或之后唤醒的后台代理的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/feedback` and `/bug` to upload other sessions only when they were recorded by the signed-in account or organization", "中文内容": "修复了`/feedback`和`/bug`，仅在登录帐户或组织记录其他会话时上传其他会话"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed relative deny and ask permission rules (e.g. `Read(./.env)`) no longer covering the project after a `cd`; they now also apply in added directories", "中文内容": "修复了相对拒绝和询问权限规则（例如`Read(./.env)`）在`cd`之后不再覆盖项目；它们现在也适用于添加的目录"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed deny and ask permission rules starting with `mcp__plugin_*_` missing a plugin's MCP server or tool spelled in another letter case", "中文内容": "修复了以`mcp__plugin_*_`开头的拒绝和询问权限规则，缺少以另一个字母大小写拼写的插件的 MCP 服务器或工具"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed deny rules not being applied to a permission approval that arrives after Claude Code restarts, in self-hosted runner and `claude remote-control` sessions", "中文内容": "修复了在自托管运行程序和“claude 远程控制”会话中，拒绝规则未应用于 Claude Code 重新启动后到达的权限批准的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where a committed `.claude/settings.local.json` could be treated as the user's own when Claude Code was started in certain subfolders of a repository", "中文内容": "修复了当 Claude Code 在存储库的某些子文件夹中启动时，提交的`.claude/settings.local.json`可能被视为用户自己的文件的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed some deny and ask rules not applying to certain Bash commands", "中文内容": "修复了一些不适用于某些 Bash 命令的拒绝和询问规则"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a gap in Bash permission checks where some compound commands could run without asking; these now ask for permission", "中文内容": "修复了 Bash 权限检查中的一个漏洞，其中某些复合命令可以在不询问的情况下运行；这些现在请求许可"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where a Bash allow rule could run a different program than the one it names", "中文内容": "修复了 Bash 允许规则可以运行与其命名的程序不同的程序的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a connector tool's approval prompt in cloud sessions being answered automatically while plugins were still loading", "中文内容": "修复了云会话中连接器工具的批准提示在插件仍在加载时自动应答的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed some subagents changing an artifact that people outside your organization can see, or uploading files to it, without asking first when an allow rule is set or uploads were approved earlier", "中文内容": "修复了一些子代理更改组织外部人员可以看到的工件或将文件上传到其中，而不先询问何时设置允许规则或先前批准上传的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed some artifact publishes skipping the confirmation for pages that people outside your organization can see when \"don't ask again\" had been chosen for Artifact", "中文内容": "修复了当为 Artifact 选择“不再询问”时，某些工件发布会跳过组织外部人员可以看到的页面的确认"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed auto mode judging only the first change to an artifact that people outside your organization can see; its yes now covers that change alone", "中文内容": "修复了自动模式仅判断组织外部人员可以看到的工件的第一次更改；现在它的“是”仅涵盖了这一变化"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a managed `strictPluginOnlyCustomization` lock on agents and skills not taking effect in sessions that were already running", "中文内容": "修复了代理和技能上的托管`strictPluginOnlyCustomization`锁定在已运行的会话中未生效的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed sandboxed commands being able to write to the native updater's download folder in some cases", "中文内容": "修复了沙盒命令在某些情况下能够写入本机更新程序的下载文件夹的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where the Bash sandbox did not fully protect a worktree's settings and hooks", "中文内容": "修复了 Bash 沙箱未完全保护工作树的设置和挂钩的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed a case where the Bash sandbox did not fully protect a linked worktree's shared git folder", "中文内容": "修复了 Bash 沙箱未完全保护链接工作树的共享 git 文件夹的情况"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/teleport`'s stash choice in some unusual git states: it now stops and says what to do", "中文内容": "修复了`/teleport`在一些不寻常的 git 状态下的存储选择：它现在停止并说明要做什么"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "Windows: Fixed a start-up stall that could last about a second when a PATH entry sits under a folder your account cannot open", "中文内容": "Windows：修复了当 PATH 条目位于您的帐户无法打开的文件夹下时，启动停滞可能持续约一秒钟的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed `/resume` on Windows refusing or hiding sessions whose folder was recorded with a different drive-letter case or slashes", "中文内容": "修复了 Windows 上的`/resume`拒绝或隐藏其文件夹使用不同驱动器盘符大小写或斜杠记录的会话的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed an in-session `/resume` on Windows dropping a project's saved trust when the session was recorded with a different drive-letter case", "中文内容": "修复了 Windows 上的会话中`/resume`，当使用不同的驱动器盘符大小写记录会话时，会删除项目已保存的信任"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "Linux: Fixed sandboxed Bash commands failing with `bwrap: Can't create file` when the working directory was below an `allowRead` folder inside a `denyRead`, such as under a symlinked home directory", "中文内容": "Linux：修复了当工作目录位于`denyRead`内的`allowRead`文件夹下方（例如在符号链接主目录下）时，沙盒 Bash 命令失败并显示“bwrap：无法创建文件”"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "修复", "内容": "Fixed Claude Desktop's third-party deployments staying on \"Stopping\" until a token renewal finished (once it includes this version)", "中文内容": "修复了 Claude Desktop 的第三方部署一直处于“停止”状态，直到令牌续订完成（一旦包含此版本）"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved subagents cut off at the output token limit: they are now asked for the whole answer again, more briefly, instead of returning only its end", "中文内容": "改进的子代理在输出令牌限制处被切断：现在，他们被要求再次更简短地提供整个答案，而不是仅返回其结尾"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved startup with a keyless Console sign-in or other Anthropic profile login: a token that is still valid is read without waiting for the credentials lock", "中文内容": "改进了无密钥控制台登录或其他人性配置文件登录的启动：无需等待凭据锁定即可读取仍然有效的令牌"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the account email check: it now also refuses your email as a client's identity in scripts a command runs, file writes, web fetches and MCP calls", "中文内容": "改进了帐户电子邮件检查：它现在还拒绝将您的电子邮件作为命令运行、文件写入、Web 获取和 MCP 调用脚本中的客户端身份"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the `HTTPS authentication failed` message for private plugin marketplaces: it now says git's terminal prompts and askpass programs are disabled, and it also appears with newer git versions", "中文内容": "改进了私有插件市场的“HTTPS 身份验证失败”消息：现在显示 git 的终端提示和 Askpass 程序已禁用，并且它也会出现在较新的 git 版本中"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the add-marketplace confirmations, plugin recommendation prompts and plugin install warning to say that plugins can run code on your computer, with access to your files and shell", "中文内容": "改进了添加市场确认、插件推荐提示和插件安装警告，表明插件可以在您的计算机上运行代码，并可以访问您的文件和 shell"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the `claude --desktop` sign-in error to name the API key, provider or setting that stops a Claude account sign-in from working", "中文内容": "改进了`claude --desktop`登录错误，以命名阻止 Claude 帐户登录工作的 API 密钥、提供程序或设置"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the `/voice` \"No audio detected\" message on macOS and Windows: it now says where to pick your microphone", "中文内容": "改进了 macOS 和 Windows 上的`/voice`“未检测到音频”消息：它现在显示在哪里选择麦克风"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved MCP tasks: Claude is now told when a task is waiting for your answer, and can point you to `/tasks`", "中文内容": "改进的 MCP 任务：当任务正在等待您的答复时，克劳德现在会被告知，并且可以将您指向`/tasks`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved `claude remote-control`: it now exits with status 4 when it stops by itself (single-session runs still exit 0) and 69 when it can't register, so a service manager can start it again", "中文内容": "改进了“claude远程控制”：现在，当它自行停止时，它会以状态4退出（单会话运行仍然退出0），当它无法注册时，它会以状态69退出，因此服务管理器可以再次启动它"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the messages shown when a background session can't use its session's API key or token: they no longer suggest adding the key to settings", "中文内容": "改进了后台会话无法使用其会话的 API 密钥或令牌时显示的消息：它们不再建议将密钥添加到设置中"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Improved the bundled dataviz skill's part-to-whole advice for static images and for parts with a natural order, such as age bands", "中文内容": "改进了捆绑数据可视化技能对静态图像和具有自然顺序的部分（例如年龄范围）的部分到整体建议"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed sandboxed Bash commands to follow the normal permission flow by default; set `sandbox.autoAllowBashIfSandboxed: true` to keep running them without prompts", "中文内容": "更改了沙盒 Bash 命令以默认遵循正常权限流程；设置 `sandbox.autoAllowBashIfSandboxed: true` 以在没有提示的情况下继续运行它们"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed managed settings that turn the sandbox on: to keep commands running without prompts, set `sandbox.autoAllowBashIfSandboxed: true` in your highest-ranking managed source", "中文内容": "更改了打开沙箱的托管设置：要保持命令在没有提示的情况下运行，请在排名最高的托管源中设置 `sandbox.autoAllowBashIfSandboxed: true`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed read-only git commands to ask first in a repository that isn't the project's or one you trusted; name it with `--add-dir`, not the `additionalDirectories` setting, to run them without prompts", "中文内容": "更改了只读 git 命令，以首先询问不是项目的或您信任的存储库；使用`--add-dir`命名它，而不是`additionalDirectories`设置，以便在没有提示的情况下运行它们"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed scheduled tasks and `/loop` to ask before running a skill that declares `allowed-tools` or hooks; add `Skill(name)` to `permissions.allow` to run it unattended", "中文内容": "更改了计划任务和`/loop`，以在运行声明`allowed-tools`或钩子的技能之前进行询问；将`Skill(name)`添加到`permissions.allow`以无人值守运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed \"Always allow\" in Desktop, IDE and SDK hosts: a rule alone is offered only when saving it would allow that command again, so a scheduled task that relied on one can now wait for you", "中文内容": "更改了桌面、IDE 和 SDK 主机中的“始终允许”：仅在保存时才提供一条规则，该规则将再次允许该命令，因此依赖于该命令的计划任务现在可以等待您"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed the sandbox to refuse sandboxed writes to `.claude` settings, skills, agents, commands and hooks in added directories, as it does in the launch folder", "中文内容": "更改了沙箱以拒绝对添加目录中的`.claude`设置、技能、代理、命令和挂钩进行沙箱写入，就像在启动文件夹中一样"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed worktree isolation: an isolated worktree session or agent is now refused `git bisect run`, `git maintenance register|start` and `scalar`'s set-up commands, and is told what still works", "中文内容": "更改了工作树隔离：隔离的工作树会话或代理现在被拒绝`git bisect run`、“git Maintenance register|start”和`scalar`的设置命令，并被告知哪些命令仍然有效"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugin MCP bundles (`.mcpb`, `.dxt`) to unpack under the plugins directory, not `.mcpb-cache` in the plugin's folder, so read-only plugin folders load; one fetched by URL downloads again once", "中文内容": "更改了插件 MCP 包（`.mcpb`、`.dxt`）以在插件目录下解压，而不是在插件文件夹中的`.mcpb-cache`，因此加载只读插件文件夹；通过 URL 获取的内容会再次下载一次"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugins of a remote marketplace that managed settings declare, enable and list in `prependPlugins` or `appendPlugins` to count as the organization's; `pluginDigests` is deprecated and ignored", "中文内容": "更改了远程市场的插件，管理设置在`prependPlugins`或`appendPlugins`中声明、启用和列出，以计为组织的插件； `pluginDigests` 已弃用并被忽略"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugin loading to skip, and `claude plugin validate` to report, some unsafe paths and links in a plugin's folder", "中文内容": "更改了插件加载以跳过，并更改了`claude plugin validate`以报告插件文件夹中的一些不安全路径和链接"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed nested skill loading: `.claude/skills` folders in `--plugin-dir` plugins no longer load from a session started above them; start Claude Code in the plugin folder instead", "中文内容": "更改了嵌套技能加载：`--plugin-dir`插件中的`.claude/skills`文件夹不再从在其上方启动的会话加载；在插件文件夹中启动 Claude Code"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed EnterWorktree to refuse a `WorktreeCreate` hook path that goes through a symlink inside the project; have the hook print the real path", "中文内容": "更改了 EnterWorktree 以拒绝通过项目内部符号链接的`WorktreeCreate`挂钩路径；让钩子打印真实路径"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed tmux and iTerm2 teammates, and new sessions from the agents view opened with ←, to start in the session's folder instead of where the shell last ran `cd`", "中文内容": "更改了 tmux 和 iTerm2 队友，以及使用 ← 打开的代理视图中的新会话，以在会话的文件夹中启动，而不是 shell 上次运行`cd`的位置"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed prompt suggestions in the terminal to refresh less often after 8 turns in a row started by background or scheduled tasks, saving usage until you press a key or return to the terminal", "中文内容": "更改了终端中的提示建议，以在由后台或计划任务启动的连续 8 轮后刷新频率降低，从而节省使用量，直到您按下某个键或返回终端"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed Esc on a background MCP task's question to \"answer later\": nothing is sent to the server, and the question stays in `/tasks`", "中文内容": "将后台 MCP 任务问题上的 Esc 更改为“稍后回答”：没有任何内容发送到服务器，问题保留在`/tasks`中"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `CLAUDE_CODE_MAX_CONTEXT_TOKENS` to also set the context window of unrecognized model IDs that start with `claude-`, such as a gateway's `claude-sonnet-latest`", "中文内容": "更改了`CLAUDE_CODE_MAX_CONTEXT_TOKENS`，以设置以`claude-`开头的无法识别的模型 ID 的上下文窗口，例如网关的`claude-sonnet-latest`"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `/login` to ask for permission to change your privacy settings", "中文内容": "更改了`/login`以请求更改您的隐私设置的权限"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `/cost`, `$.session.usage()`, `--max-budget-usd` and the cost and token metrics to count a mod's `$.model.complete` and `$.model.classify` calls", "中文内容": "更改了 `/cost`、`$.session.usage()`、`--max-budget-usd` 以及成本和令牌指标以计算 mod 的 `$.model.complete` 和 `$.model.classify` 调用"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed the programs that Claude Code's sandbox starts for its own use, such as its network bridge, to run without Claude Code's sign-in tokens and API keys in their environment", "中文内容": "更改了 Claude Code 沙箱为其自身使用而启动的程序（例如其网桥），使其在其环境中无需 Claude Code 的登录令牌和 API 密钥即可运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed ripgrep, local git commands and the sandbox runtime's own helper programs to run without the mTLS client key's passphrase in their environment", "中文内容": "更改了 ripgrep、本地 git 命令和沙箱运行时自己的帮助程序，使其在其环境中无需 mTLS 客户端密钥的密码短语即可运行"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "Remote Control: Changed `/resume` and `/teleport` to disconnect first when the connected session has a share link, or when that can't be checked; run `/remote-control` to connect again", "中文内容": "远程控制：将`/resume`和`/teleport`更改为当连接的会话有共享链接或无法检查时首先断开连接；运行 `/remote-control` 再次连接"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed Claude Code on the web, cloud scheduled tasks and Cowork cloud sessions to start despite `sandbox.failIfUnavailable`: the hosted container has no command sandbox", "中文内容": "更改了 Web 上的 Claude 代码、云计划任务和 Cowork 云会话，以尽管`sandbox.failIfUnavailable`启动：托管容器没有命令沙箱"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed requests for settings, permission rules, hooks or status over a cloud or self-hosted session's connection to return less or be refused; what applies in the session is unchanged", "中文内容": "更改了通过云或自托管会话连接对设置、权限规则、挂钩或状态的请求，以减少返回或被拒绝；会话中适用的内容没有改变"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `claude -p` with no cached account data to wait for that data before its first request, so a first run in a clean environment can start a few seconds later", "中文内容": "更改了没有缓存帐户数据的`claude -p`，以在第一个请求之前等待该数据，因此干净环境中的首次运行可以在几秒钟后开始"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed Claude's instructions to keep files you'll want out of its temporary scratchpad folder, which can be cleared", "中文内容": "更改了克劳德的说明，将您想要的文件保留在临时暂存文件夹中，该文件夹可以被清除"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed marketplace `ref` to accept the full ID of any commit on a branch or tag; clients before this version can't clone such a pin, so a marketplace pinned this way stops loading there", "中文内容": "更改了市场`ref`以接受分支或标签上任何提交的完整 ID；此版本之前的客户端无法克隆此类 pin，因此以这种方式固定的市场将停止加载"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed plugin marketplace and plugin downloads to use a CONNECT tunnel when `ALL_PROXY` is the only proxy set; a proxy that refuses CONNECT now fails them", "中文内容": "当`ALL_PROXY`是唯一的代理集时，更改了插件市场和插件下载以使用 CONNECT 隧道；拒绝 CONNECT 的代理现在让他们失败"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed `-p` and SDK runs in a worktree or submodule mounted into a container to apply `.claude/settings.local.json` allow rules only once the folder is trusted", "中文内容": "更改了`-p`和 SDK 在安装到容器中的工作树或子模块中运行，以仅在文件夹受信任时应用`.claude/settings.local.json`允许规则"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "改进", "内容": "Changed self-hosted runners to refuse a session whose session folder or repository path is a symbolic link, other than a `checkout` hook's checkout", "中文内容": "更改了自托管运行器以拒绝其会话文件夹或存储库路径是符号链接的会话，而不是`checkout`挂钩的结帐"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "移除", "内容": "Removed \"ask your admin to raise it\" from spend limit and shared budget errors in cloud sessions and under Remote Control", "中文内容": "删除了云会话和远程控制下的支出限制和共享预算错误中的“要求管理员提高”"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Added prompt suggestions wherever the terminal shows them: Tab accepts the suggested next prompt; `promptSuggestionEnabled: false` in Claude Code's settings.json turns them off", "中文内容": "[VSCode] 在终端显示的任何地方添加了提示建议：Tab 接受建议的下一个提示； Claude Code 的 settings.json 中的`promptSuggestionEnabled: false`将其关闭"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Added a Console sign-in that creates no API key", "中文内容": "[VSCode] 添加了不创建 API 密钥的控制台登录"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Added a field to paste the redirect URL when signing in to an MCP server from the panel in SSH, WSL and container windows", "中文内容": "[VSCode] 添加了一个字段，用于在 SSH、WSL 和容器窗口中从面板登录 MCP 服务器时粘贴重定向 URL"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the model picker's check mark staying on the old model after Claude Code restarted on another model or the model was switched over Remote Control", "中文内容": "[VSCode] 修复了 Claude Code 在另一个模型上重新启动或模型切换到远程控制后模型选择器的复选标记保留在旧模型上的问题"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the effort selector offering levels above the effort cap set by your organization or the `maxEffortLevel` setting", "中文内容": "[VSCode] 修复了工作量选择器提供的级别高于组织设置的工作量上限或`maxEffortLevel`设置"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the sign-in screen offering sign-ins that the managed `allowedProviders` setting refuses", "中文内容": "[VSCode] 修复了托管`allowedProviders`设置拒绝提供登录的登录屏幕"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the permission prompt for MCP tools not saying why Claude Code asks when a safety check raises the question", "中文内容": "[VSCode] 修复了 MCP 工具的权限提示，但没有说明为什么 Claude Code 在安全检查提出问题时会询问"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Fixed the message for organization settings that couldn't load saying to run a command again; it now says to try again, matching the tab's Retry link", "中文内容": "[VSCode] 修复了组织设置无法加载并提示再次运行命令的消息；现在它说重试，匹配选项卡的重试链接"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode] Improved the note shown for an untrusted folder: it now says why the extension is off and how to turn it on", "中文内容": "[VSCode] 改进了不受信任文件夹显示的注释：它现在说明扩展程序关闭的原因以及如何打开它"}, {"日期": "2026-11-13", "版本": "2.1.325", "类型": "其他", "内容": "[VSCode
