onment` while `CLAUDE_CODE_EFFORT_LEVEL` is set to the same level", "中文内容": "修复了在`CLAUDE_CODE_EFFORT_LEVEL`设置为相同级别时使用`--environment`启动交互式会话时忽略`--effort`的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed headless and cloud sessions reporting a foreground fork's Agent call as finished the moment the fork started", "中文内容": "修复了无头和云会话报告前台分叉的代理调用在分叉启动时已完成的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed local MCP servers seeing a new session ID after a Remote Control session's process restarts", "中文内容": "修复了远程控制会话进程重新启动后本地 MCP 服务器看到新会话 ID 的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed idle compaction being skipped for subscribers still well under their weekly limit", "中文内容": "修复了仍远低于每周限制的订户跳过的空闲压缩问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed an @-mentioned text file with an extension being silently dropped when even its first 2,000 lines exceed the read limit; Claude is now told its size and how to read it", "中文内容": "修复了 @ 提到的文本文件，当其前 2,000 行超出读取限制时，该文件的扩展名会被静默删除；克劳德现在被告知它的大小以及如何阅读它"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed the plugin \"not cached\" error pointing to `/plugin` instead of `/reload-plugins`, the command that reloads plugins", "中文内容": "修复了插件“未缓存”错误，指向`/plugin`而不是`/reload-plugins`，即重新加载插件的命令"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed self-hosted runner sessions failing their first clone under Anthropic-managed git when the machine's git config has an `includeIf \"gitdir:\"` or (git 2.44 to 2.46) `\"onbranch:\"` section", "中文内容": "修复了当机器的 git 配置具有 `includeIf \"gitdir:\"` 或（git 2.44 到 2.46）`\"onbranch:\"` 部分时，自托管运行器会话在人类管理的 git 下首次克隆失败的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed replies that start with phrases like \"You've used\" or \"You've hit your\" showing as a red usage limit error", "中文内容": "修复了以“您已使用”或“您已达到”等短语开头的回复显示为红色使用限制错误的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed a resumed conversation sometimes missing its last messages after a crash or kill on Bedrock, Google Cloud's Agent Platform, Foundry and other third-party providers", "中文内容": "修复了在 Bedrock、Google Cloud 代理平台、Foundry 和其他第三方提供商崩溃或终止后恢复的对话有时会丢失最后一条消息的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed NotebookEdit saving an invalid notebook when an edit changes a cell's type; turning a cell with attachments into code is now refused", "中文内容": "修复了当编辑更改单元格类型时 NotebookEdit 保存无效笔记本的问题；现在拒绝将带有附件的单元格转换为代码"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed a long README in a design system moved from standalone Claude Design losing its list of files to load when Claude starts a deck or design", "中文内容": "修复了从独立 Claude Design 迁移的设计系统中的长自述文件，当 Claude 启动套牌或设计时，该系统会丢失要加载的文件列表"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed MCP tool calls failing with \"malformed task handle\" when the server's task ID is longer than 128 characters; IDs of up to 1,024 characters now work", "中文内容": "修复了当服务器的任务 ID 超过 128 个字符时，MCP 工具调用失败并出现“格式错误的任务句柄”的问题；现在可以使用最多 1,024 个字符的 ID"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "Self-hosted runner: Fixed `--configure-git` sometimes reporting a hung `git --version` as a git that isn't on PATH", "中文内容": "自托管运行器：修复了 `--configure-git` 有时会将挂起的 `git --version` 报告为不在 PATH 上的 git"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed task ids being reused and deleted tasks coming back when several tasks were deleted or updated at once, and TaskGet listing completed tasks as blockers", "中文内容": "修复了重复使用任务 ID 和同时删除或更新多个任务时删除的任务返回的问题，以及 TaskGet 将已完成的任务列为阻止程序"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed stale and repeated rows in the fullscreen Ctrl+R history picker when prompts share a timestamp", "中文内容": "修复了当提示共享时间戳时全屏 Ctrl+R 历史选择器中过时和重复的行"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed Code Mode silently skipping a tool call whose input has a list of over 4,096 items, and freezing on a very large typed array in a tool's input, which is now refused", "中文内容": "修复了代码模式静默跳过输入包含超过 4,096 个项目的列表的工具调用，并冻结工具输入中非常大的类型数组的问题，现在该工具被拒绝"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed Code Mode leaving a message unanswered when it was typed during a command and Esc was pressed before Claude replied; the message now starts a new turn, which a second Esc stops", "中文内容": "修复了在命令期间键入消息并且在 Claude 回复之前按下 Esc 时，代码模式会留下一条未回复的消息；该消息现在开始一个新的回合，第二个 Esc 会停止"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed Code Mode not telling Claude when a slow command moved to the background and left its script with empty output, or of the time limit on background commands in `claude -p` and the Agent SDK", "中文内容": "修复了代码模式不告诉 Claude 一个缓慢的命令何时移动到后台并使其脚本留空输出，或者`claude -p`和 Agent SDK 中的后台命令的时间限制"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed Code Mode sometimes waiting for minutes on a command that had already been stopped", "中文内容": "修复了代码模式有时会在已停止的命令上等待几分钟的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed a typed slash command's inline shell commands not running in Code Mode after a background script's output arrived", "中文内容": "修复了后台脚本输出到达后，键入的斜杠命令的内联 shell 命令无法在代码模式下运行的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed Code Mode sessions in the Agent SDK and `claude -p` sometimes losing Claude's last reply on resume after being stopped while a script was running", "中文内容": "修复了 Agent SDK 中的代码模式会话和`claude -p`有时会在脚本运行时停止后丢失 Claude 在恢复时的最后回复"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "Remote Control: Fixed sessions hosted by the desktop app or VS Code showing as idle while /compact runs", "中文内容": "远程控制：修复了桌面应用程序或 VS Code 托管的会话在 /compact 运行时显示为空闲的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed a session sometimes losing its \"needs input\" status after a background task's report in Claude Desktop", "中文内容": "修复了 Claude Desktop 中后台任务报告后会话有时会丢失“需要输入”状态的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed Grep: -o missing an empty match at the end of a file with no last newline, -o with multiline adding an empty line or misnumbering lines in non-UTF-8 files, and -A and -B ignored beside a zero -C", "中文内容": "修复了 Grep：-o 在没有最后一个换行符的文件末尾缺少空匹配，-o 在非 UTF-8 文件中使用多行添加空行或错误编号行，以及在零 -C 旁边忽略 -A 和 -B"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed unbinding a chord in `keybindings.json` still leaving its first key waiting for a second when it was spelled `meta` and bound as `alt`, or the reverse", "中文内容": "修复了在`keybindings.json`中取消绑定和弦的问题，当其拼写为`meta`并绑定为`alt`时，其第一个键仍需等待一秒钟，反之亦然"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed moving an empty session to the background sometimes failing with \"Couldn't load transcript from file\"", "中文内容": "修复了将空会话移动到后台有时会失败并显示“无法从文件加载脚本”的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed OpenTelemetry reporting a failed `mcp_server_connection` event at each start for a built-in server that isn't turned on for the account", "中文内容": "修复了 OpenTelemetry 在每次启动时为帐户未打开的内置服务器报告失败的`mcp_server_connection`事件的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed Esc not stopping a Bash command while it waited for its file diff in large or slow git repositories, which held the next message", "中文内容": "修复了在大型或慢速 git 存储库中等待文件差异时 Esc 不会停止 Bash 命令的问题，该存储库保存了下一条消息"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed pasted links and relative paths ending in an image file name appearing late and swallowing an Enter pressed right after", "中文内容": "修复了粘贴的链接和以图像文件名结尾的相对路径出现较晚并吞掉紧随其后按下的 Enter 键的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed `/mcp reconnect all` and `/mcp disable all` counting a built-in server that isn't turned on for the account", "中文内容": "修复了`/mcp reconnect all`和`/mcp disable all`计算未为帐户打开的内置服务器的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed interrupting a turn while a mod's `turn.step` hook was waiting showing \"user-cancel\" as an error instead of \"Interrupted\"", "中文内容": "修复了在 mod 的 `turn.step` 挂钩等待时中断转弯的问题，显示“用户取消”错误而不是“已中断”"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed `~/.claude.json` being reported as corrupted when another session was in the middle of saving it", "中文内容": "修复了当另一个会话正在保存`~/.claude.json`时报告为已损坏的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed web searches failing with an API error when Claude's list of allowed or blocked domains was empty or had duplicates", "中文内容": "修复了当克劳德的允许或阻止域列表为空或有重复项时，网络搜索失败并出现 API 错误的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed resuming a paused workflow in Code Mode waiting for minutes while other background work was running", "中文内容": "修复了在代码模式下恢复暂停的工作流程，而其他后台工作正在运行时需要等待几分钟的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "修复", "内容": "Fixed subagents in Code Mode failing with \"Agent stalled\" and losing their command when a script ran for more than 10 minutes", "中文内容": "修复了代码模式下的子代理因“代理停止”而失败并在脚本运行超过 10 分钟时丢失命令的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved `claude plugin marketplace add` on Windows to wait and try again in some cases when another program, such as a virus scanner, briefly holds the downloaded files", "中文内容": "改进了Windows上的“claude插件市场添加”，以便在某些情况下当另一个程序（例如病毒扫描程序）短暂保存下载的文件时等待并重试"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "Windows: Improved stability on some company PCs, where Claude Code could exit with no output shortly after start", "中文内容": "Windows：提高了某些公司 PC 上的稳定性，Claude Code 可能在启动后不久退出且没有输出"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved computer use setup: the Screen Recording permission prompt can now restart Claude Code and resume the chat", "中文内容": "改进的计算机使用设置：屏幕录制权限提示现在可以重新启动克劳德代码并恢复聊天"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved computer use to take less context until Claude uses it", "中文内容": "改进计算机的使用，在克劳德使用它之前获取更少的上下文"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved the error when a proxy or gateway cuts or damages a compressed response: a turn now ends in plain words instead of raw \"ZlibError fetching\" text", "中文内容": "改进了代理或网关剪切或损坏压缩响应时的错误：回合现在以普通文字结束，而不是原始的“ZlibError fetching”文本"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved `/context`: shorter output in fullscreen, so the total is less likely to scroll off in a short window, and the legend names its unit once", "中文内容": "改进的`/context`：全屏输出较短，因此总数不太可能在短窗口中滚动，并且图例将其单位命名一次"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved peak memory use and speed of `/usage` on machines with many recent sessions", "中文内容": "改进了具有许多最近会话的计算机上的峰值内存使用和`/usage`速度"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved `/permissions` to refuse a rule that would be skipped at the next start, such as `rm -rf` with no tool name, and to show the reason", "中文内容": "改进了`/permissions`，以拒绝下次启动时跳过的规则，例如没有工具名称的`rm -rf`，并显示原因"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved resuming a session in Code Mode: Claude is now told up front that its earlier script variables are gone", "中文内容": "改进了代码模式下的会话恢复：克劳德现在被告知其早期的脚本变量已经消失"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved Claude in Code Mode to confirm before discarding worktree changes, to read artifact files before publishing them, and to update an existing artifact instead of creating a second one", "中文内容": "改进了代码模式中的 Claude，以便在放弃工作树更改之前进行确认、在发布工件文件之前读取它们以及更新现有工件而不是创建第二个工件"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved Code Mode's tool search to show long MCP tool descriptions whole where they fit, as a cut description could lead to wrong calls", "中文内容": "改进了代码模式的工具搜索，以在合适的位置完整地显示长 MCP 工具描述，因为剪切描述可能会导致错误的调用"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "Linux: Improved the Ctrl+V message to name the package to install (`wl-clipboard` or `xclip`) when images can't be read from the clipboard", "中文内容": "Linux：改进了无法从剪贴板读取图像时的 Ctrl+V 消息，以命名要安装的包（`wl-clipboard`或`xclip`）"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved recovery for long conversations behind a proxy or gateway with a request size limit, where every message and `/compact` failed with a 413", "中文内容": "改进了对具有请求大小限制的代理或网关后面的长时间对话的恢复，其中每条消息和`/compact`均失败并显示 413"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved Glob speed in large local folders on Windows machines with 6 or more CPUs: folders are walked in parallel, and a search stopped at its time limit now lists what it found", "中文内容": "改进了具有 6 个或更多 CPU 的 Windows 计算机上的大型本地文件夹的 Glob 速度：并行遍历文件夹，并且在时间限制时停止的搜索现在会列出它找到的内容"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved memory use when resuming a long conversation", "中文内容": "恢复长时间对话时改善内存使用"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved memory use at startup with MCP servers that list many tools", "中文内容": "使用列出了许多工具的 MCP 服务器改进了启动时的内存使用"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Improved memory use of `claude -p` and SDK-hosted sessions at the start of a conversation", "中文内容": "改进了对话开始时`claude -p`和 SDK 托管会话的内存使用"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Updated computer use on macOS to newer safety rules, so some actions are refused and typing can be slower", "中文内容": "将 macOS 上的计算机使用更新为新的安全规则，因此某些操作会被拒绝，并且打字速度可能会变慢"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed terminal and VS Code sessions moved to Sonnet 5 or 5.5 on Bedrock Mantle, Agent Platform and Foundry to start in auto mode if no mode is set; set `disableAutoMode` to `\"disable\"` to stop it", "中文内容": "更改了终端和 VS Code 会话，将基岩地幔、代理平台和 Foundry 上的 Sonnet 5 或 5.5 移动到在未设置模式的情况下以自动模式启动；将 `disableAutoMode` 设置为 `\"disable\"` 以停止它"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed the `sonnet` model alias on Google Cloud's Agent Platform and Microsoft Foundry to Sonnet 5.5, and Foundry's `opus` alias to Opus 5.5; `sonnet` on Amazon Bedrock stays at Sonnet 4.5", "中文内容": "将 Google Cloud 代理平台和 Microsoft Foundry 上的`sonnet`模型别名更改为 Sonnet 5.5，将 Foundry 的`opus`别名更改为 Opus 5.5； Amazon Bedrock 上的`sonnet`仍保持 Sonnet 4.5"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed the default model on Microsoft Foundry to Sonnet 5.5: deploy `claude-sonnet-5-5`, or set `ANTHROPIC_DEFAULT_SONNET_MODEL` to a model you have deployed", "中文内容": "将 Microsoft Foundry 上的默认模型更改为 Sonnet 5.5：部署 `claude-sonnet-5-5`，或将 `ANTHROPIC_DEFAULT_SONNET_MODEL` 设置为您已部署的模型"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed `sonnet` and background requests on Google Cloud's Agent Platform to read `VERTEX_REGION_CLAUDE_5_5_SONNET`; with only the `4_5` variable set they go to `CLOUD_ML_REGION` or `us-east5`", "中文内容": "将 Google Cloud 代理平台上的`sonnet`和后台请求更改为读取`VERTEX_REGION_CLAUDE_5_5_SONNET`；仅设置了`4_5`变量，它们就会转到`CLOUD_ML_REGION`或`us-east5`"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed `--model default` and a Default pick to move to an older model when that model isn't available, instead of stopping with an error; in auto mode, only to a model auto mode accepts", "中文内容": "更改了`--model default`和默认选择，以便在旧模型不可用时移动到该模型，而不是因错误而停止；在自动模式下，仅对自动模式接受的型号"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed Microsoft Foundry: Claude Sonnet 4, Opus 4 and Opus 4.1 now count as retired, so step-downs stop above them and a pin to one warns that it was retired", "中文内容": "更改了 Microsoft Foundry：Claude Sonnet 4、Opus 4 和 Opus 4.1 现在算作已退役，因此降级停止在它们之上，并且用大头针警告它已退役"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed the Claude apps gateway's built-in model list: Sonnet 5.5 replaces Sonnet 4.5 as its second model, and Claude Desktop starts on it where a policy allows no Opus 4.6", "中文内容": "更改了 Claude 应用程序网关的内置型号列表：Sonnet 5.5 取代 Sonnet 4.5 作为其第二个型号，Claude Desktop 在策略不允许 Opus 4.6 的情况下从其启动"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed SDK and `claude -p` mid-turn messages to count as the user's where feature flags aren't fetched, as on clouds or with telemetry off, from Opus 4.8 on; mark relayed text `isSynthetic: true`", "中文内容": "从 Opus 4.8 开始，更改了 SDK 和`claude -p`中转消息，以将其计为未获取功能标志的用户的位置，例如在云上或遥测关闭的情况下；标记转发的文本“isSynthetic：true”"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed `computer-use` to a reserved skill name on Macs with computer use on: your own skill or command of that name stops loading, and a start-up notice says to rename it", "中文内容": "将`computer-use`更改为 Mac 上保留的技能名称，并使用计算机：您自己的技能或该名称的命令停止加载，并且启动通知显示要重命名它"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed the default OpenTelemetry `service.name` of desktop Code tab sessions to `claude-code-desktop`; update filters keyed on `claude-code`, or set `OTEL_SERVICE_NAME` to keep the old name", "中文内容": "将桌面代码选项卡会话的默认 OpenTelemetry `service.name` 更改为 `claude-code-desktop`；更新以`claude-code`为键的过滤器，或设置`OTEL_SERVICE_NAME`以保留旧名称"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed OpenTelemetry `tool_input` to show only the length of text sent through SendUserMessage or Cowork's message tool, unless response logging is on (`OTEL_LOG_ASSISTANT_RESPONSES=1`)", "中文内容": "更改了 OpenTelemetry `tool_input` 以仅显示通过 SendUserMessage 或 Cowork 消息工具发送的文本长度，除非响应日志记录已打开 (`OTEL_LOG_ASSISTANT_RESPONSES=1`)"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "Self-hosted runner: Changed `CLAUDE_CODE_OAUTH_TOKEN`: its prefix can now end in `oat02-` as well as `oat01-`. Update proxy rules and log scrubbers that match `oat01-`, and mask the whole value", "中文内容": "自托管运行器：更改了`CLAUDE_CODE_OAUTH_TOKEN`：其前缀现在可以以`oat02-`和`oat01-`结尾。更新与`oat01-`匹配的代理规则和日志清理器，并屏蔽整个值"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed `claude self-hosted-runner setup` with no arguments on macOS and Linux to ask for the environment key in the terminal before Claude starts, and to hide it as you paste", "中文内容": "更改了 macOS 和 Linux 上不带任何参数的`claude self-hosted-runner setup`，以在 Claude 启动之前在终端中询问环境密钥，并在粘贴时将其隐藏"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed Claude Desktop's Code tab on Anthropic's API to ignore default, side-request, alias and subagent model ids not starting with `claude` in your own settings beside a gateway address", "中文内容": "更改了 Anthropic API 上 Claude Desktop 的“代码”选项卡，以忽略网关地址旁边您自己的设置中不以`claude`开头的默认、侧面请求、别名和子代理模型 ID"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed Claude Desktop's Code tab on Anthropic's API to ignore a `CLAUDE_CODE_AUTO_COMPACT_WINDOW` under 200K in your own settings beside a gateway address; use `/autocompact` instead", "中文内容": "更改了 Anthropic API 上 Claude Desktop 的“代码”选项卡，以忽略网关地址旁边您自己设置中 200K 以下的`CLAUDE_CODE_AUTO_COMPACT_WINDOW`；使用 `/autocompact` 代替"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed plan mode in the desktop app's Code tab and VS Code to ask for approval instead of refusing when no auto mode safety check can judge a command, for plans entered from Manual or Accept edits", "中文内容": "对于从手动或接受编辑输入的计划，更改了桌面应用程序的“代码”选项卡和 VS Code 中的计划模式，以在没有自动模式安全检查可以判断命令时请求批准而不是拒绝"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed PgUp and Home to go to No on destructive questions, such as `/clear` from an agent's view", "中文内容": "将 PgUp 和 Home 更改为“否”，以解决破坏性问题，例如从特工的角度来看`/clear`"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed `/feedback` drafts in the terminal to open on Not now, above separate rows to send the report alone or with the transcript", "中文内容": "将终端中的`/feedback`草稿更改为“现在不”，在单独的行上方打开，以单独发送报告或与文字记录一起发送"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed tap-mode voice dictation to keep the microphone on until 60 seconds without new words or 10 minutes, up from 15 seconds and 2 minutes, then keep the text unsent; the next tap adds to it", "中文内容": "更改了点击模式语音听写，将麦克风保持打开状态，直到 60 秒没有新单词或 10 分钟（从 15 秒和 2 分钟）增加，然后保持文本不发送；下一次点击会添加到其中"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed tap-mode voice dictation to stop when you send the prompt, and to stop and say why when you edit it, a panel covers it, or the connection or a separate recorder program is lost", "中文内容": "更改了点击模式语音听写，以在发送提示时停止，并在编辑时停止并说出原因，面板覆盖它，或者连接或单独的录音机程序丢失"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed `/schedule`, permission prompts and `/loop`'s cloud offer to say \"cloud scheduled task\" instead of \"routine\" or \"cloud schedule\"; `/routines` still works", "中文内容": "更改了`/schedule`、权限提示和`/loop`的云提议，将“云计划任务”改为“例程”或“云计划”； `/routines` 仍然有效"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed model switches from the Claude mobile app or claude.ai to keep the effort level you saved for the previous model when none is saved for the new one", "中文内容": "从 Claude 移动应用程序或 claude.ai 更改了模型切换，以在没有为新模型保存任何内容时保持为前一模型节省的工作量水平"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed the `hint` a mod's `PromptHint` hook receives to leave out the hint for selected text when the fullscreen footer has a label on its right", "中文内容": "更改了 mod 的`PromptHint`挂钩收到的“提示”，以在全屏页脚右侧有标签时忽略所选文本的提示"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "改进", "内容": "Changed `awsCredentialExport` to time out after 10 minutes instead of waiting forever", "中文内容": "将 `awsCredentialExport` 更改为 10 分钟后超时，而不是永远等待"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Added a notification in more cases when closing a proposed diff leaves the edit unapplied, and stopped the diff notifications on a split copy of an answered diff", "中文内容": "[VSCode] 在更多情况下添加了关闭建议的差异时的通知，使编辑未应用，并在已回答的差异的拆分副本上停止差异通知"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Added a warning when restoring a conversation with `/rewind` in the side bar stops a self-paced `/loop`", "中文内容": "[VSCode] 在侧栏中使用`/rewind`恢复对话时添加了一条警告，停止了自定进度的`/loop`"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Added the installed version to the rows of Manage plugins", "中文内容": "[VSCode] 将已安装的版本添加到管理插件行中"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed Rewind staying on \"Checking code changes…\" while Claude's process hung at its start", "中文内容": "[VSCode] 修复了克劳德进程在开始时挂起时倒带停留在“检查代码更改...”的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed the model picker's arrow keys starting from the wrong row right after it opens, and screen readers not announcing its highlighted model when opened with `/model` or the command menu", "中文内容": "[VSCode] 修复了模型选择器打开后从错误行开始的箭头键，以及使用`/model`或命令菜单打开时屏幕阅读器不宣布其突出显示的模型的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed the diff view's \"Copy deleted line\" and \"Copy changed line\" copying a different line than they name, and a double-click near the bottom copying unasked", "中文内容": "[VSCode] 修复了 diff 视图的“复制已删除行”和“复制更改行”复制与其名称不同的行，以及在底部附近双击未询问的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed the blocked microphone's tooltip being cut off, long addresses running out of Web Fetch rows, usage bars looking full in High Contrast, and a Thinking row jumping away when clicked", "中文内容": "[VSCode] 修复了被阻止的麦克风的工具提示被切断、长地址耗尽 Web Fetch 行、使用栏在高对比度中看起来很满以及点击时思考行跳开的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed a second Logout in the same window reporting success while the first was still running, and added a Show logs button to the error when logout fails", "中文内容": "[VSCode] 修复了在第一个窗口仍在运行时在同一窗口中报告成功的第二个注销，并在注销失败时向错误添加了“显示日志”按钮"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed the chat showing no notice when a background command, agent, workflow or monitor finished while Claude was idle", "中文内容": "[VSCode] 修复了当克劳德空闲时后台命令、代理、工作流或监视器完成时聊天不显示通知的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed forking a conversation, opening and saving memories, and creating project output styles failing on NTFS drives in VS Code 1.101 and 1.102 on Windows 11 24H2 and later", "中文内容": "[VSCode] 修复了在 Windows 11 24H2 及更高版本上的 VS Code 1.101 和 1.102 中的 NTFS 驱动器上分叉对话、打开和保存内存以及创建项目输出样式失败的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed Web Fetch showing \"Fetched from\" with a success dot when the site returned an error or a redirect that wasn't followed", "中文内容": "[VSCode] 修复了当网站返回错误或未遵循的重定向时，Web Fetch 显示“提取自”并带有成功点的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed the compaction summary showing as your own prompt, and in Rewind and prompt history, after reloading, resuming or forking a compacted conversation", "中文内容": "[VSCode] 修复了在重新加载、恢复或分叉压缩对话后，压缩摘要显示为您自己的提示以及在倒回和提示历史记录中的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed `spinnerVerbs` from Claude Code user and managed settings being ignored", "中文内容": "[VSCode] 修复了 Claude Code 用户的`spinnerVerbs`和托管设置被忽略的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed right-to-left text from mods showing its punctuation on the wrong side, and a mod's band or pane filling only part of its width when the panel font has no box-drawing characters", "中文内容": "[VSCode] 修复了 mods 中从右到左的文本显示标点符号在错误一侧的问题，以及当面板字体没有方框绘制字符时 mod 的带区或窗格仅填充其部分宽度的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed an empty, locked editor pane staying beside the next file or Claude tab after the last Claude tab was closed", "中文内容": "[VSCode] 修复了在关闭最后一个 Claude 选项卡后，下一个文件或 Claude 选项卡旁边出现一个空的、锁定的编辑器窗格"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed a session rename that cannot be saved reverting silently, and screen readers not hearing a session's status, which session is open or which groups are collapsed", "中文内容": "[VSCode] 修复了无法保存静默恢复的会话重命名，以及屏幕阅读器听不到会话状态、哪个会话已打开或哪些组已折叠的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed a hidden panel's notice not naming the waiting session, Hebrew and Arabic questions reading out of order, and a question cut off when Claude's process ended showing only a red dot", "中文内容": "[VSCode] 修复了隐藏面板的通知未命名等待会话、希伯来语和阿拉伯语问题读取顺序不正确以及克劳德进程结束时仅显示红点的问题被切断的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed a sign-in that failed with no error message returning to the sign-in screen with nothing shown, and an authentication error still looking current after you signed in again in that tab", "中文内容": "[VSCode] 修复了登录失败且没有错误消息返回登录屏幕且不显示任何内容的问题，并且在该选项卡中再次登录后身份验证错误仍然显示为当前错误"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed the chat moving when a menu opened over some banners, and an agent's tool call count shrinking in long sessions; it now shows how many of the calls are listed", "中文内容": "[VSCode] 修复了在某些横幅上打开菜单时聊天移动以及长时间会话中代理工具调用次数减少的问题；现在显示列出了多少个呼叫"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed most links to files without an extension, to folders, and with a line and column doing nothing", "中文内容": "[VSCode] 修复了大多数指向没有扩展名的文件、文件夹以及行和列不执行任何操作的链接"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed queued messages and attached files showing in reverse order after a conversation was reopened", "中文内容": "[VSCode] 修复了重新打开对话后以相反顺序显示的排队消息和附加文件"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed a question that ended in an error showing \"Something went wrong\" when its stored result had no text", "中文内容": "[VSCode] 修复了一个问题，当存储的结果没有文本时，该问题会显示“出现问题”"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed redacted thinking showing as \"Unsupported content type\"", "中文内容": "[VSCode] 修复了显示为“不支持的内容类型”的编辑思维"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed the message box not underlining the word that an input method (IME) is composing", "中文内容": "[VSCode] 修复了消息框未在输入法 (IME) 正在编写的单词下划线的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed a held Up key replacing an unsent message with an earlier prompt, and Down not bringing the message back after the recalled prompt got a new line or was cleared", "中文内容": "[VSCode] 修复了按住向上键用较早的提示替换未发送消息的问题，以及在调用的提示获得新行或清除后向下键不恢复消息的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Fixed `/model` completed with Tab sometimes switching the model, and closing the model picker right away when nothing is running", "中文内容": "[VSCode] 修复了使用 Tab 完成的`/model`有时会切换模型，并在没有任何运行时立即关闭模型选择器的问题"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Improved the time it takes to open the Claude panel and long sessions, performance while long replies stream, and the speed of reading diagnostics in very large workspaces", "中文内容": "[VSCode] 改进了打开 Claude 面板和长会话所需的时间、长回复流时的性能以及在非常大的工作空间中读取诊断信息的速度"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Improved commands and one-line output opened in a plain text tab: they now wrap", "中文内容": "[VSCode] 改进了在纯文本选项卡中打开的命令和单行输出：它们现在换行"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Changed voice dictation to stop by itself after 60 seconds without recognized speech or 10 minutes, up from 15 seconds and 2 minutes, so the microphone can stay on longer", "中文内容": "[VSCode] 将语音听写更改为在 60 秒没有识别的语音或 10 分钟后自行停止（从 15 秒和 2 分钟增加），以便麦克风可以保持更长时间"}, {"日期": "2026-11-24", "版本": "2.1.332", "类型": "其他", "内容": "[VSCode] Changed voice dictation to stop, and say why, when the microphone stops sending audio or the panel stays hidden", "中文内容": "[VSCode] 将语音听写更改为当麦克风停止发送音频或面板保持隐藏时停止并说出原因"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added Code Mode support in terminal sessions on Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry and Claude Platform on AWS", "中文内容": "在 AWS 上的 Amazon Bedrock、Google Cloud 代理平台、Microsoft Foundry 和 Claude Platform 上的终端会话中添加了代码模式支持"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added `oidc.groups_jsonpath` to the Claude apps gateway, to read groups from the matching entries of a list of objects with a small subset of JSONPath (RFC 9535)", "中文内容": "将`oidc.groups_jsonpath`添加到 Claude 应用程序网关，以从具有 JSONPath 小子集的对象列表的匹配条目中读取组（RFC 9535）"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added an API connectivity section to `claude doctor` that reports whether the API can be reached, with the HTTP status or the error, or says why it wasn't tested", "中文内容": "在`claude doctor`中添加了 API 连接部分，报告是否可以访问 API、HTTP 状态或错误，或者说明为什么未测试它"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added a notice when tap-mode voice dictation stops by itself, after 15 seconds without recognized speech or at its 2-minute limit", "中文内容": "添加了当点击模式语音听写在 15 秒内没有识别到语音或达到 2 分钟限制后自行停止时的通知"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added `CLAUDE_CODE_DISABLE_RESPONSE_COMPRESSION` to ask for uncompressed model responses behind a proxy that cuts compressed ones off; not advised yet for self-hosted runners or Remote Control", "中文内容": "添加了`CLAUDE_CODE_DISABLE_RESPONSE_COMPRESSION`以请求代理后面的未压缩模型响应，该代理会切断压缩响应；尚不建议用于自托管运行程序或远程控制"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added `CLAUDE_GATEWAY_IDP_CONNECT_BY_HOSTNAME=1` for Claude apps gateways: with `oidc.use_proxy: true`, sign-in requests hand the proxy an `https` IdP's hostname even with `NO_PROXY` set", "中文内容": "为 Claude 应用程序网关添加了`CLAUDE_GATEWAY_IDP_CONNECT_BY_HOSTNAME=1`：使用`oidc.use_proxy: true`，登录请求会将`https`IdP 的主机名传递给代理，即使设置了`NO_PROXY`"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added `gen_ai.usage.*`, `gen_ai.response.model` and `gen_ai.operation.name` to `claude_code.llm_request` trace spans; `gen_ai.usage.input_tokens` includes prompt cache tokens", "中文内容": "将`gen_ai.usage.*`、`gen_ai.response.model`和`gen_ai.operation.name`添加到`claude_code.llm_request`跟踪范围； `gen_ai.usage.input_tokens` 包含提示缓存令牌"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "新增", "内容": "Added `optionalDependencies` to plugin manifests: plugins that install with the plugin listing them and can be disabled or uninstalled on their own", "中文内容": "在插件清单中添加了“可选依赖项”：与列出它们的插件一起安装的插件，可以自行禁用或卸载"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed MCP tool calls hanging for up to 30 minutes on some malformed replies from a local or WebSocket server", "中文内容": "修复了来自本地或 WebSocket 服务器的某些格式错误的回复导致 MCP 工具调用挂起长达 30 分钟的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed PushNotification telling a headless run, such as a scheduled one, that the terminal was active in its first minute, instead of saying whether a mobile push was requested", "中文内容": "修复了 PushNotification，告诉无头运行（例如计划的运行）终端在第一分钟内处于活动状态，而不是说明是否请求移动推送"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed `/install-github-app` skipping the repository step after setup warnings when no repository was found, and Esc not going back from its workflow list and sign-in steps", "中文内容": "修复了`/install-github-app`在未找到存储库时在设置警告后跳过存储库步骤，并且 Esc 不会从其工作流程列表和登录步骤返回的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed one-line tool results cut with no ellipsis in narrow windows, Markdown stars in the Auto mode tab of /permissions, and a hook's reason to stop a forked skill showing twice", "中文内容": "修复了在狭窄窗口中没有省略号的单行工具结果剪切、/permissions 的自动模式选项卡中的 Markdown 星号以及钩子阻止分叉技能显示两次的原因"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed `/diff` hiding its key hints and not selecting files in windows of 24 to 26 rows, and leaving out files added with `git add -N` in a repository with no commits", "中文内容": "修复了`/diff`隐藏其关键提示，并且不在 24 到 26 行的窗口中选择文件，并在没有提交的存储库中遗漏使用`git add -N`添加的文件"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed the first-run theme list showing too few themes in short windows, and /usage and other tall screens coming out garbled there", "中文内容": "修复了首次运行的主题列表在短窗口中显示的主题太少，以及 /usage 和其他高屏幕出现乱码的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed `/bug` in fullscreen hiding its Yes and No answers behind a long report, and Yes staying out of view in very short windows", "中文内容": "修复了全屏中的`/bug`，将其“是”和“否”答案隐藏在长报告后面，并且“是”在非常短的窗口中保持在视图之外"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed /compact and auto-compact sometimes losing part of the conversation summary when the summary quoted certain XML tags", "中文内容": "修复了当摘要引用某些 XML 标签时，/compact 和自动压缩有时会丢失部分对话摘要的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Claude not being told when permission rules on the Agent tool dropped its queued message to a subagent that had already ended", "中文内容": "修复了当代理工具上的权限规则将其排队消息丢弃到已结束的子代理时，克劳德没有被告知的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed a Remote Control message sometimes showing above the reply that was finishing when it was sent", "中文内容": "修复了远程控制消息有时会显示在发送时正在完成的回复上方"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Stop hooks that read the transcript missing the last reply in Claude Desktop; SubagentStop hooks now wait for it too", "中文内容": "修复了读取 Claude Desktop 中缺少最后回复的记录的 Stop 挂钩； SubagentStop 挂钩现在也在等待它"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed turns and subagents failing in cloud sessions, or timing out on long replies elsewhere, when a reply went silent while Claude was still thinking; Claude Code now tries the request once more", "中文内容": "修复了云会话中的回合和子代理失败的问题，或者当克劳德仍在思考时回复沉默时在其他地方的长回复超时的问题；克劳德·科德现在再次尝试该请求"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Esc and Stop waiting about a minute or more when the contents of a cloud or network file that Claude is reading stall", "中文内容": "修复了当 Claude 正在读取的云或网络文件的内容停滞时，Esc 和 Stop 等待大约一分钟或更长时间"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Code Mode sessions resumed with `--resume` or `--continue` in another permission mode losing thinking and the prompt cache; one begun in a mode that asks keeps that mode's limits on scripts", "中文内容": "修复了在另一种权限模式下使用`--resume`或`--continue`恢复的代码模式会话丢失思考和提示缓存的问题；以一种模式开始，要求保留该模式对脚本的限制"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Code Mode sending a request about every second when a `!` or slash command was typed while a script was running", "中文内容": "修复了在脚本运行时键入`!`或斜杠命令时代码模式大约每秒发送一次请求的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed an interrupted or failed plugin update leaving a partial plugin folder that later loaded with skills or other components missing (anthropics/claude-code#102186)", "中文内容": "修复了插件更新中断或失败导致部分插件文件夹稍后加载技能或其他组件丢失的问题 (anthropics/claude-code#102186)"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "Windows: Fixed file writes on FAT32 and exFAT drives asking for permission every time in some plugin sessions", "中文内容": "Windows：修复了在某些插件会话中每次在 FAT32 和 exFAT 驱动器上写入文件时都会请求许可的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Claude failing to read a notebook that has a null output or an error output with no traceback", "中文内容": "修复了克劳德无法读取具有空输出或没有回溯的错误输出的笔记本的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed a rewind deleting files after a restore had failed", "中文内容": "修复了恢复失败后倒回删除文件的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed auto mode sometimes refusing Claude's call to stop a /loop, which left the next wake-up to fire", "中文内容": "修复了自动模式有时会拒绝 Claude 停止 /loop 的调用，从而导致下一次唤醒的情况"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed a Workflow agent's background shells and MCP servers sometimes being left running after it handed back its report", "中文内容": "修复了工作流代理的后台 shell 和 MCP 服务器有时在交回报告后仍然运行的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "Windows: Fixed `/desktop` downloading the older Claude Desktop installer, and asking for an update when an older install's folder was left behind", "中文内容": "Windows：修复了`/desktop`下载较旧的 Claude Desktop 安装程序，并在旧安装的文件夹被遗忘时要求更新的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed `claude plugin install`, `marketplace add` and similar commands hanging with no output when managed settings needed an approval that could not be asked for", "中文内容": "修复了当托管设置需要无法请求的批准时，`claude plugin install`、`marketplace add`和类似命令挂起且没有输出的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed a permission rule on a subagent's model, such as `Agent(model:*)`, blocking Claude's follow-up message to a subagent started on this version with no model named", "中文内容": "修复了子代理模型的权限规则，例如`Agent(model:*)`，阻止克劳德向在此版本上启动且没有命名模型的子代理发送后续消息"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed PermissionRequest hooks not saving `Skill(name:*)` allow rules outside local settings", "中文内容": "修复了 PermissionRequest 挂钩不保存 `Skill(name:*)` 允许本地设置之外的规则的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed \"Ask your admin\" asking to raise your own limit when your team's pooled group budget blocked you, and saying \"Request sent\" when an admin had approved your request in the last few minutes", "中文内容": "修复了当您的团队的集体预算阻止您时，“询问您的管理员”要求提高您自己的限制，并在管理员在过去几分钟内批准您的请求时说“请求已发送”的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Code Mode losing the middle of a long script output; Claude now gets a path to the uncut text (anthropics/claude-code#111373)", "中文内容": "修复了代码模式丢失长脚本输出的中间部分的问题；克劳德现在获得了未剪切文本的路径（anthropics/claude-code#111373）"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed hold-to-talk dictation stopping early and losing words when Claude Code was busy", "中文内容": "修复了当克劳德·代码忙碌时，保持通话听写提前停止并丢失单词的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Code Mode with `--bare` not telling Claude what its scripts can call", "中文内容": "修复了带有`--bare`的代码模式不告诉 Claude 它的脚本可以调用什么"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed a crash when a custom API endpoint returned a tool call with no tool name; the call now fails with an error and the session continues", "中文内容": "修复了自定义 API 端点返回没有工具名称的工具调用时崩溃的问题；现在调用因错误而失败，会话继续"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "Windows: Fixed a possible crash when the machine is almost out of memory", "中文内容": "Windows：修复了机器几乎内存不足时可能发生的崩溃"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed the CLI freezing on some replies, and quoted text sometimes going missing or showing twice", "中文内容": "修复了 CLI 冻结某些回复以及引用的文本有时会丢失或显示两次的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "Windows: Fixed Claude Code refusing to start when managed settings in the registry contain non-ASCII characters such as Japanese (anthropics/claude-code#93280)", "中文内容": "Windows：修复了当注册表中的托管设置包含日语等非 ASCII 字符时 Claude Code 拒绝启动的问题 (anthropics/claude-code#93280)"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "Windows: Fixed Remote Control clients showing no steps for a new subagent", "中文内容": "Windows：修复了远程控制客户端不显示新子代理的步骤"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed @-mentions written as `@file#10-12` attaching the whole file instead of those lines", "中文内容": "修复了写为`@file#10-12`的@提及，附加整个文件而不是那些行"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed Claude misreading a pasted artifact invitation link; it now asks you to accept the invitation and paste the artifact's own link", "中文内容": "修复了克劳德误读粘贴的神器邀请链接的问题；现在它会要求您接受邀请并粘贴工件自己的链接"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "修复", "内容": "Fixed sandboxed Bash commands sometimes failing to start on a full temp disk, for sandboxes whose file rules keep commands out of the temp directory", "中文内容": "修复了沙盒 Bash 命令有时无法在完整临时磁盘上启动的问题，因为沙盒的文件规则将命令保留在临时目录之外"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Improved typing speed in screen reader mode, most of all in long sessions", "中文内容": "提高了屏幕阅读器模式下的打字速度，尤其是在长时间会话中"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Improved start-up time: a session started soon after another no longer waits for the model list, and one outside a git repository without `.claude/settings.local.json` no longer waits on git", "中文内容": "改进的启动时间：一个接着一个启动的会话不再等待模型列表，并且 git 存储库外部没有 `.claude/settings.local.json` 的会话不再等待 git"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "Windows: Improved the speed of the first Bash command in a session on machines with no custom shell start-up files", "中文内容": "Windows：提高了没有自定义 shell 启动文件的计算机上会话中第一个 Bash 命令的速度"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Improved the plugin auto-update notice to name plugins it newly installs as dependencies, separately from updated plugins", "中文内容": "改进了插件自动更新通知，将新安装的插件命名为依赖项，与更新的插件分开"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Improved Code Mode tool search to show more of an MCP tool's description, with its limits, formats and defaults", "中文内容": "改进了代码模式工具搜索，以显示 MCP 工具的更多描述及其限制、格式和默认值"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Improved the Console sign-in link shown by /login and `claude auth login --console`: it is now much shorter", "中文内容": "改进了 /login 和 `claude auth login --console` 显示的控制台登录链接：现在更短了"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Improved Claude's list of your artifacts: it now marks web pages, so Claude is less likely to try opening one with the Claude Docs connector", "中文内容": "改进了克劳德的工件列表：它现在标记网页，因此克劳德不太可能尝试使用克劳德文档连接器打开网页"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Improved the folder trust prompts in short terminals: fullscreen `/cd` and `/add-dir` show their choices in fewer rows, and the prompt at launch keeps the folder path in view when it has many warnings", "中文内容": "改进了短终端中的文件夹信任提示：全屏`/cd`和`/add-dir`以更少的行显示它们的选择，并且启动时的提示在出现许多警告时会保留文件夹路径"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Changed the questions for stopping auto-connect in `/ide` and for `/clear`, `/compact` or `/rewind` in a subagent's view to list Yes first; they still start on No, so Down then Enter now answers No", "中文内容": "将`/ide`中停止自动连接的问题以及子代理视图中`/clear`、`/compact`或`/rewind`的问题更改为首先列出“是”；他们仍然从“否”开始，所以向下然后输入现在回答“否”"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Changed what a `PermissionDenied` hook's `retry: true` tells Claude: make the refused call again only if you asked for that call", "中文内容": "更改了`PermissionDenied`钩子的`retry: true`告诉 Claude 的内容：仅当您请求该调用时才再次进行被拒绝的调用"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "改进", "内容": "Changed in a future release, on or after November 30, 2026: plugin marketplaces in managed `extraKnownMarketplaces` will auto-update by default. To opt one out, set `\"autoUpdate\": false` on its entry", "中文内容": "在 2026 年 11 月 30 日或之后的未来版本中进行了更改：托管`extraKnownMarketplaces`中的插件市场将默认自动更新。要选择退出，请在其条目上设置 `\"autoUpdate\": false`"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "Windows: Changed start-up with managed settings in the registry: check them before upgrading, as an `HKLM` policy outranks `managed-settings.json` and a broken value can stop the start", "中文内容": "Windows：使用注册表中的托管设置更改了启动：在升级之前检查它们，因为`HKLM`策略优先于`managed-settings.json`，并且损坏的值可能会停止启动"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Added a warning and a link to the revoke page when you log out and the request to revoke your claude.ai login isn't confirmed", "中文内容": "[VSCode] 当您注销且撤销 claude.ai 登录请求未得到确认时，添加了警告和指向撤销页面的链接"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Added a notice before sending a very large selection or attached text file, and advice under \"Prompt is too long\" that names the large part and what to do next", "中文内容": "[VSCode] 在发送非常大的选择或附加文本文件之前添加了一条通知，并在“提示太长”下添加了建议，其中列出了大部分内容以及下一步要做什么"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Added \"Add Cell to Chat\" to the notebook cell menu, which attaches a cell with its outputs or error", "中文内容": "[VSCode] 在笔记本单元菜单中添加了“将单元添加到聊天”，该菜单附加单元及其输出或错误"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Added \"Fix with Claude Code\" as a quick fix for errors and warnings and to failed tests in the test peek and the Test Results view, which puts the problem into the chat box", "中文内容": "[VSCode] 添加了“使用 Claude Code 进行修复”作为错误和警告以及测试查看和测试结果视图中失败测试的快速修复，这会将问题放入聊天框中"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Added \"Add to Chat\" to the right-click menu of changed files in the Source Control view", "中文内容": "[VSCode] 在源代码管理视图中已更改文件的右键菜单中添加了“添加到聊天”"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Added \"Resolve Merge Conflicts\" to the editor title of a file with merge conflicts and to the Merge Changes group in Source Control", "中文内容": "[VSCode] 将“解决合并冲突”添加到具有合并冲突的文件的编辑器标题以及源代码管理中的“合并更改”组"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed raw tags for selected code under a reworded prompt, the mode button flashing Manual, the slash menu hiding its highlighted row, a broken sign-in image, and a blinking Accept/Reject bar", "中文内容": "[VSCode] 修复了在改写提示下所选代码的原始标签、模式按钮闪烁手动、斜杠菜单隐藏其突出显示的行、损坏的登录图像以及闪烁的接受/拒绝栏"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a forked conversation overwriting the original conversation's plan file; a fork or rewind that can't copy the plan now shows a warning", "中文内容": "[VSCode] 修复了分叉对话覆盖原始对话计划文件的问题；无法复制计划的分叉或倒带现在会显示警告"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed voice dictation saying no speech was recognized when its connection closed or never opened; it now says the connection was lost or couldn't connect", "中文内容": "[VSCode] 修复了当连接关闭或从未打开时语音听写无法识别语音的问题；现在显示连接已丢失或无法连接"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed an unsent side question being lost when its panel closes", "中文内容": "[VSCode] 修复了面板关闭时未发送的附带问题丢失的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Escape stopping Claude after renaming a session, and typing going nowhere after closing the session history with Escape", "中文内容": "[VSCode] 修复了 Escape 在重命名会话后停止 Claude，以及在使用 Escape 关闭会话历史记录后输入无处可去的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Rename, Mark as Unread and Add to Group saying \"still connecting\" on a tab that resumed a session from its history", "中文内容": "[VSCode] 修复了从历史记录中恢复会话的选项卡上的重命名、标记为未读和添加到组中显示“仍在连接”的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed wide tables and long paths cut off, long errors hiding their close button, errors out of view in the Add MCP server form and Chrome dialog, and plugin pictures ignoring the editor theme", "中文内容": "[VSCode] 修复了宽表和长路径被切断、隐藏关闭按钮的长错误、添加 MCP 服务器表单和 Chrome 对话框中视图之外的错误以及忽略编辑器主题的插件图片"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed later prompts and the message box covering the Rewind code dialog, and focus jumping from \"Never mind\" to \"Rewind\" when it finishes checking files", "中文内容": "[VSCode] 修复了稍后的提示和覆盖“倒带”代码对话框的消息框，以及完成检查文件时焦点从“没关系”跳到“倒带”的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the command menu keeping an earlier match highlighted while you type more in its filter, so Enter could run the wrong row", "中文内容": "[VSCode] 修复了当您在过滤器中输入更多内容时，命令菜单会突出显示较早的匹配项，因此 Enter 可能会运行错误的行"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the @ menu showing \"No files found\" before its first search results arrived, or when it couldn't search all files of a very large workspace, which it now says", "中文内容": "[VSCode] 修复了 @ 菜单在第一个搜索结果到达之前或无法搜索非常大的工作区的所有文件时显示“未找到文件”的问题（现在显示为“未找到文件”）"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Escape stopping Claude at a Remove or Delete confirmation in MCP, Hooks and Memory dialogs, on a side question panel's button or link, and on the Bookmarks button with its panel open", "中文内容": "[VSCode] 修复了 Escape 在 MCP、Hooks 和 Memory 对话框、侧面问题面板的按钮或链接以及面板打开的书签按钮上的“删除”或“删除”确认时停止 Claude 的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed empty boxes showing instead of the + and − signs in diffs (anthropics/claude-code#73069)", "中文内容": "[VSCode] 修复了差异中显示而不是 + 和 − 符号的空框 (anthropics/claude-code#73069)"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the chat no longer following Claude's reply after the panel was resized, or hidden and shown again", "中文内容": "[VSCode] 修复了调整面板大小或隐藏并再次显示后聊天不再关注 Claude 的回复的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a chat left in bypass permissions mode reopening in Auto mode instead of your initial permission mode when settings disable bypass", "中文内容": "[VSCode] 修复了当设置禁用旁路时，处于旁路权限模式的聊天会以自动模式而不是初始权限模式重新打开"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the chat panel freezing on some CSS code blocks and diffs", "中文内容": "[VSCode] 修复了聊天面板在某些 CSS 代码块和差异上冻结的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the context usage indicator disappearing after an API error, \"Prompt is too long\", or a slash command", "中文内容": "[VSCode] 修复了 API 错误、“提示太长”或斜杠命令后上下文使用指示器消失的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a message queued behind a queued /clear being lost", "中文内容": "[VSCode] 修复了在排队/清除后面排队的消息丢失的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Manage Plugins losing its search box or showing no message when a search has no match, and not saying that the list of available plugins failed to load", "中文内容": "[VSCode] 修复了管理插件丢失搜索框或在搜索不匹配时不显示任何消息，并且未提示可用插件列表加载失败的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed proposed changes to notebooks and files with a custom editor opening in a tab with no Accept or Reject that stayed open after the answer", "中文内容": "[VSCode] 修复了对笔记本和文件的建议更改，其中自定义编辑器在选项卡中打开，没有“接受”或“拒绝”，在答案后保持打开状态"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the spend limit message telling Team and Enterprise members to run `/usage-credits`, which can't send a request to their admin from the panel", "中文内容": "[VSCode] 修复了告诉团队和企业成员运行`/usage-credits`的支出限制消息，该消息无法从面板向管理员发送请求"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a written message being wiped by Tab on a command in the \"/\" button's menu or by a click on an onboarding suggestion", "中文内容": "[VSCode] 修复了通过“/”按钮菜单中的命令上的 Tab 或单击入门建议来擦除书面消息的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Claude continuing to edit files after you rewind code while it is working", "中文内容": "[VSCode] 修复了在代码运行时回退后克劳德继续编辑文件的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed typed text being lost after /tasks, /copy, /export, a skipped /feedback, or /plan while already in plan mode", "中文内容": "[VSCode] 修复了在已处于计划模式时在 /tasks、/copy、/export、跳过的 /feedback 或 /plan 后丢失的键入文本"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the question card dropping a typed \"Other\" answer on Ctrl/Cmd+Enter, and sending the word \"Other\" when nothing was typed", "中文内容": "[VSCode] 修复了问题卡在 Ctrl/Cmd+Enter 上输入“其他”答案时会丢失问题，并在未输入任何内容时发送“其他”一词的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the panel showing \"Something went wrong\" for a conversation in which a gateway sent a tool call with no name", "中文内容": "[VSCode] 修复了网关发送无名称工具调用的对话中显示“出现问题”的面板"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed unsaved changes being missed, and Claude's edit being overwritten by the next save, in a folder opened through a symlink", "中文内容": "[VSCode] 修复了通过符号链接打开的文件夹中未保存的更改被遗漏，以及 Claude 的编辑被下一次保存覆盖的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed @-mentions attaching nothing, or another file of the same name, after Claude changed folders with `cd`", "中文内容": "[VSCode] 修复了 Claude 使用`cd`更改文件夹后，@-mentions 不附加任何内容或附加同名文件的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the arrow keys replacing typed text with an old prompt while selecting, and dropping edits to a recalled prompt", "中文内容": "[VSCode] 修复了选择时箭头键用旧提示替换键入的文本以及对调用的提示进行编辑的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed an @-mention added while a permission prompt was open being lost", "中文内容": "[VSCode] 修复了在权限提示打开时添加的 @-mention 丢失的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed shortcuts such as Ctrl+1, Alt+1 or Ctrl+Space answering an open dialog, which could restore files in the rewind confirmation or switch the git branch", "中文内容": "[VSCode] 修复了 Ctrl+1、Alt+1 或 Ctrl+Space 等快捷键应答打开对话框的问题，可在回退确认中恢复文件或切换 git 分支"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed prompts that start with a file path or code comment being sent without the selected code and having no fork or rewind menu", "中文内容": "[VSCode] 修复了以文件路径或代码注释开头的提示，在没有选定代码的情况下发送，并且没有分叉或倒带菜单"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed file links in the chat ignoring your editor associations for files in the workspace, except notebooks (anthropics/claude-code#81482)", "中文内容": "[VSCode] 修复了聊天中的文件链接，忽略工作区中文件的编辑器关联，笔记本除外 (anthropics/claude-code#81482)"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed selected lines staying attached to your next message after their file's tab was closed", "中文内容": "[VSCode] 修复了选定的行在文件选项卡关闭后仍附加到下一条消息的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed new sessions starting in Edit automatically after pressing Shift+Tab through it to reach Plan mode", "中文内容": "[VSCode] 修复了按 Shift+Tab 进入计划模式后自动在编辑中启动的新会话"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed an edited command on the permission prompt running without the line breaks that were typed or pasted into it", "中文内容": "[VSCode] 修复了在运行权限提示时编辑的命令没有键入或粘贴到其中的换行符"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a newly opened Claude tab not focusing its message box, or taking the keyboard late from the terminal or command palette and sending the typed text as a prompt", "中文内容": "[VSCode] 修复了新打开的 Claude 选项卡未聚焦其消息框，或者较晚从终端或命令面板使用键盘并发送键入的文本作为提示的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Alt+K line ranges such as `@app.ts#5-10` sending the whole file, or its first 2,000 lines, instead of the selected lines", "中文内容": "[VSCode] 修复了 Alt+K 行范围，例如 `@app.ts#5-10` 发送整个文件或其前 2,000 行，而不是选定的行"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed diff tabs opening out of order when several subagents wait for approval, and a later edit to the same file cancelling an earlier one", "中文内容": "[VSCode] 修复了当多个子代理等待批准时差异选项卡打开顺序不正确的问题，以及稍后对同一文件的编辑会取消之前的编辑"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Enter rewriting a message or running a menu action when a `/word` such as the path `/api` stands beside other text, and running a typed slash command without its arguments", "中文内容": "[VSCode] 修复了当`/word`（例如路径`/api`）位于其他文本旁边并运行不带参数的键入斜杠命令时，Enter 重写消息或运行菜单操作的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Electron apps and extension tests failing to start from Claude, a hook or an MCP server; a wrapper, hook or server that runs VS Code as Node must now set `ELECTRON_RUN_AS_NODE=1`", "中文内容": "[VSCode] 修复了 Electron 应用程序和扩展测试无法从 Claude、钩子或 MCP 服务器启动的问题；作为节点运行 VS Code 的包装器、挂钩或服务器现在必须设置`ELECTRON_RUN_AS_NODE=1`"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Claude not being told when you reject part of a proposed edit or change it in the diff view before accepting", "中文内容": "[VSCode] 修复了当您拒绝部分建议编辑或在接受之前在 diff 视图中更改它时 Claude 不会被告知的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Escape on a permission prompt sending a half-typed instruction to Claude instead of cancelling", "中文内容": "[VSCode] 修复了权限提示中的 Escape 向 Claude 发送半输入指令而不是取消的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Ctrl+J and Ctrl+O in the chat also opening VS Code's terminal or Open File dialog on Windows and Linux", "中文内容": "[VSCode] 修复了聊天中的 Ctrl+J 和 Ctrl+O 在 Windows 和 Linux 上也会打开 VS Code 的终端或“打开文件”对话框的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the @ menu inserting the wrong file on a quick Tab or Enter, and Enter not sending a prompt that ends in an @word with no matching file", "中文内容": "[VSCode] 修复了 @ 菜单在快速 Tab 或 Enter 上插入错误文件，并且 Enter 不发送以 @word 结尾且没有匹配文件的提示"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed new Claude tabs staying blank and the side bar failing to load after closing a tab while Claude was still starting", "中文内容": "[VSCode] 修复了新的 Claude 选项卡保持空白以及在 Claude 仍在启动时关闭选项卡后侧边栏无法加载的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a quick double click in the panel pressing a button or row that appeared after the first click, or starting a second compaction from the context usage circle", "中文内容": "[VSCode] 修复了在面板中快速双击按下第一次单击后出现的按钮或行，或从上下文使用圈开始第二次压缩的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed switching models failing with \"Settings file is not valid JSON\" when settings.json is empty or starts with a byte order mark", "中文内容": "[VSCode] 修复了当 settings.json 为空或以字节顺序标记开头时，切换模型失败并显示“设置文件不是有效的 JSON”的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed memory growing with each fork or rewind of a long conversation until the window was reloaded", "中文内容": "[VSCode] 修复了内存随着每次分叉或回退长对话而增长的问题，直到重新加载窗口"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed plan comments not showing on the plan approval card in Focus view", "中文内容": "[VSCode] 修复了焦点视图中计划审批卡上未显示计划注释的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed file links without a line number moving the cursor of an open file to line 1", "中文内容": "[VSCode] 修复了没有行号的文件链接将打开文件的光标移动到第 1 行的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a missing notification when a conversation running behind another one in the same panel needs a permission or an answer", "中文内容": "[VSCode] 修复了当同一面板中另一个对话后面运行的对话需要权限或答案时丢失通知的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Manage Plugins not loading when Claude Code is slow to start or fails to start, so a plugin that blocks startup can be turned off", "中文内容": "[VSCode] 修复了 Claude Code 启动缓慢或启动失败时 Manage Plugins 无法加载的问题，因此可以关闭阻止启动的插件"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed proposed diffs showing and saving garbled non-ASCII text when `files.encoding` is not UTF-8", "中文内容": "[VSCode] 修复了当`files.encoding`不是 UTF-8 时显示和保存乱码非 ASCII 文本的建议差异"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed approved edits and writes saving right-to-left marks as literal `\\u200F` escapes on lines with Hebrew, Arabic or Persian text", "中文内容": "[VSCode] 修复了批准的编辑和写入，将从右到左的标记保存为希伯来语、阿拉伯语或波斯语文本行上的文字`\\u200F`转义符"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed a model pick being ignored for the next message when Claude's process had ended or was still starting", "中文内容": "[VSCode] 修复了当 Claude 的进程结束或仍在启动时，下一条消息的模型选择被忽略的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed Rewind showing \"No active session\" after Claude's process had ended", "中文内容": "[VSCode] 修复了 Claude 进程结束后倒带显示“没有活动会话”的问题"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed typing @ leaving a helper process running per tab when no browser is connected, except when Claude in Chrome's service can't be reached", "中文内容": "[VSCode] 修复了在未连接浏览器时键入 @ 让每个选项卡运行的帮助程序进程的问题，除非无法访问 Chrome 服务中的 Claude"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Fixed the session list opening every transcript at once, which stalled the editor's extensions and could leave sessions out in projects with many sessions", "中文内容": "[VSCode] 修复了会话列表一次打开每个记录的问题，这会阻止编辑器的扩展，并且可能会在具有多个会话的项目中遗漏会话"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved the time to the first reply in a new folder when the Python extension is installed and the folder has no Python", "中文内容": "[VSCode] 改进了安装了 Python 扩展且文件夹中没有 Python 时在新文件夹中第一次回复的时间"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved the sign-in screen to say when it opened because a request was refused", "中文内容": "[VSCode] 改进了登录屏幕，以显示由于请求被拒绝而打开的时间"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved the speed of opening, restoring and switching back to long conversations, most of all with many file edits or where git is slow", "中文内容": "[VSCode] 提高了打开、恢复和切换回长对话的速度，尤其是在编辑大量文件或 git 速度较慢的情况下"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved responsiveness in long chats: smooth typing and large file writes while a reply streams, faster permission prompts, and far less freezing on send with accessibility support on", "中文内容": "[VSCode] 改进了长时间聊天中的响应能力：在回复流时流畅打字和大文件写入、更快的权限提示以及通过辅助功能支持减少发送时的冻结情况"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved startup and memory use: the panel and new chat tabs open faster, a first message in a new tab is answered sooner, and on Pro and Max plans the folder trust dialog comes up sooner", "中文内容": "[VSCode] 改进了启动和内存使用：面板和新聊天选项卡打开速度更快，新选项卡中的第一条消息得到更快回复，在 Pro 和 Max 计划中，文件夹信任对话框更快出现"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved speed in remote windows (SSH, WSL, containers): the panel starts, replies appear and sessions reopen faster", "中文内容": "[VSCode] 提高了远程窗口（SSH、WSL、容器）的速度：面板启动、回复显示以及会话重新打开速度更快"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved the time to a response for the first message after a chat has been idle for a few minutes on a machine that is low on memory", "中文内容": "[VSCode] 改进了在内存不足的计算机上聊天闲置几分钟后响应第一条消息的时间"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved how fast chats start, open from history and come back after a restart on slow or antivirus-scanned disks", "中文内容": "[VSCode] 改进了在慢速磁盘或经过防病毒扫描的磁盘上聊天启动、从历史记录中打开以及重新启动后返回的速度"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved how fast diffs appear in reopened conversations, and removed diff menu entries that did not work", "中文内容": "[VSCode] 改进了重新打开的对话中差异显示的速度，并删除了不起作用的差异菜单条目"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Improved the @ file menu to list the files of open editor tabs first, the most recently used on top", "中文内容": "[VSCode] 改进了@文件菜单，首先列出打开的编辑器选项卡的文件，最近使用的位于顶部"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Changed saving a proposed diff to accept it only after you click or type in its proposed (right) side; a notification says when a save is refused or a close with Save applies nothing", "中文内容": "[VSCode] 更改了保存建议的差异，仅在您单击或输入其建议的（右侧）侧后才接受它；一条通知显示，当保存被拒绝或使用“保存”关闭时，不会执行任何操作"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Changed diffs from a terminal session to open without moving keyboard focus, and beside a file with unsaved changes; to answer, click Accept or use the terminal", "中文内容": "[VSCode] 将终端会话中的差异更改为在不移动键盘焦点的情况下打开，并位于未保存更改的文件旁边；要回答，请单击“接受”或使用终端"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Changed permission cards to show only Yes and No when `allowManagedPermissionRulesOnly` is set and the card would offer an allow rule; key 2 on those cards now answers No", "中文内容": "[VSCode] 更改了权限卡，使其在设置了`allowManagedPermissionRulesOnly`并且卡将提供允许规则时仅显示“是”和“否”；这些卡上的键 2 现在回答“否”"}, {"日期": "2026-11-23", "版本": "2.1.331", "类型": "其他", "内容": "[VSCode] Changed a Claude tab to ignore Enter and show a notice when its Find box has lost the keyboard", "中文内容": "[VSCode] 更改了 Claude 选项卡以忽略 Enter 并在其查找框丢失键盘时显示通知"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "新增", "内容": "Added sign-in to organizations managed in Anthropic's Enterprise Admin Console: after `claude auth login`, Claude Code applies the organization's settings and uses its cloud provider or gateway", "中文内容": "添加了对在 Anthropic 企业管理控制台中管理的组织的登录：在`claude auth login`之后，Claude Code 应用组织的设置并使用其云提供商或网关"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "新增", "内容": "Added easel, a built-in mod that draws charts when asked and under MCP metrics results, on Pro, Max and, where available, Team and Enterprise on macOS and Linux; turn automatic charts off in `/config`", "中文内容": "添加了画架，这是一个内置模块，可在询问时在 MCP 指标结果下绘制图表，适用于 macOS 和 Linux 上的 Pro、Max 以及可用的 Team 和 Enterprise；在`/config`中关闭自动图表"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "新增", "内容": "Added `CLAUDE_CODE_FULL_SIGN_IN_LINK=1` to print the full sign-in link, if the short one shows an error or a script reads values from it", "中文内容": "添加了`CLAUDE_CODE_FULL_SIGN_IN_LINK=1`以打印完整的登录链接（如果短链接显示错误或脚本从中读取值）"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Added `--start-dir` / `SELF_HOSTED_RUNNER_START_DIR` to have Claude start its work in a folder of a repository, while settings and hooks load as without it", "中文内容": "自托管运行器：添加了 `--start-dir` / `SELF_HOSTED_RUNNER_START_DIR` 以使 Claude 在存储库的文件夹中开始其工作，而设置和挂钩加载就像没有它一样"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "新增", "内容": "Added a notice in cloud and self-hosted runner sessions when a plugin marketplace can't be fetched because its repository isn't one of the session's", "中文内容": "当无法获取插件市场时，在云和自托管运行器会话中添加了一条通知，因为它的存储库不是会话的存储库之一"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Self-hosted runner: Added a notice when Anthropic-managed git refuses a plugin's own repository, naming the plugin and what to do", "中文内容": "自托管运行器：添加了当 Anthropic 管理的 git 拒绝插件自己的存储库时的通知、命名插件以及执行操作"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "新增", "内容": "Added `commandPrinted` to `claude plugin install --json` results, true when the plugin's install command wrote to stderr, and `commandFailed` when it exited with an error, was killed or timed out", "中文内容": "在`claude plugin install --json`结果中添加了`commandPrinted`，当插件的安装命令写入 stderr 时为 true，当插件因错误退出、被终止或超时时添加`commandFailed`"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "新增", "内容": "Added `claude_code_self_hosted_runner_order_to_registered_seconds` to the self-hosted runner's `/metrics`: seconds from work order issued to registration accepted, on orchestrator-spawned runners", "中文内容": "将`claude_code_self_hosted_runner_order_to_registered_seconds`添加到自托管运行器的`/metrics`：在协调器生成的运行器上，从发出工作订单到接受注册的秒数"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "新增", "内容": "Added `claude_code_self_hosted_runner_order_to_first_session_seconds` to the self-hosted runner's `/metrics`: seconds from work order to first session handed over, on runners started for a session", "中文内容": "将`claude_code_self_hosted_runner_order_to_first_session_seconds`添加到自托管运行器的`/metrics`：在开始会话的运行器上，从工作订单到移交的第一个会话的秒数"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Claude Code freezing for up to several minutes right after compacting a very long conversation", "中文内容": "修复了克劳德代码在压缩很长的对话后冻结长达几分钟的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed WebFetch freezing the session for minutes on some pages, and returning an empty result for some others", "中文内容": "修复了 WebFetch 在某些页面上冻结会话几分钟，并为其他一些页面返回空结果的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `ExitWorktree` and the worktree exit dialog deleting a worktree that another running Claude Code session was working in", "中文内容": "修复了`ExitWorktree`和工作树退出对话框删除另一个正在运行的克劳德代码会话正在其中工作的工作树"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed changes to user settings being lost when several Claude Code processes saved them at the same time", "中文内容": "修复了当多个 Claude Code 进程同时保存用户设置更改时丢失的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `--continue` and `--resume` opening an empty session or failing when the last saved message had a missing or invalid timestamp", "中文内容": "修复了`--continue`和`--resume`打开空会话或在上次保存的消息丢失或无效时间戳时失败的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the first prompt after a sleep of two minutes or more waiting three minutes on a connection that had died, on Linux and WSL", "中文内容": "修复了 Linux 和 WSL 上在已断开的连接上休眠两分钟或更长时间等待三分钟后的第一个提示"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed turns failing with \"JSON schema is invalid\", and session files growing by many megabytes, when many MCP tools have an input schema that the API refuses", "中文内容": "修复了当许多 MCP 工具具有 API 拒绝的输入模式时，由于“JSON 模式无效”而失败以及会话文件增长许多兆字节的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Linux: Fixed Bash commands waiting seconds and showing no file diff for the rest of a session in slow repositories with large ignored folders such as `node_modules`", "中文内容": "Linux：修复了 Bash 命令等待几秒钟并在具有大型被忽略文件夹（例如`node_modules`）的慢速存储库中在会话的其余部分中不显示文件差异的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Windows: Fixed Bash commands running slower for the rest of a session after Git Bash took 10 to 60 seconds to start, on machines with no custom start-up files", "中文内容": "Windows：修复了在没有自定义启动文件的计算机上 Git Bash 需要 10 到 60 秒启动后，Bash 命令在会话的剩余时间内运行速度变慢的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `/rewind` sometimes restoring an older version of a file when two queued prompts, or stacked skills, ran together right after a turn that changed it", "中文内容": "修复了当两个排队提示或堆叠技能在更改文件的回合后立即运行在一起时，`/rewind`有时会恢复文件的旧版本"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed text and images added when approving a permission prompt being dropped when the approved command or tool then failed", "中文内容": "修复了批准权限提示时添加的文本和图像在批准的命令或工具失败时被删除的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed MCP resources from claude.ai connectors and plugin servers not being attached when @-mentioned in the terminal's prompt box", "中文内容": "修复了在终端提示框中@提及时未附加来自 claude.ai 连接器和插件服务器的 MCP 资源的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed an MCP server that subagents declare being shut down when one of them finished, while other subagents or the session were still using it", "中文内容": "修复了一个 MCP 服务器，当其中一个子代理完成时，子代理会声明关闭，而其他子代理或会话仍在使用它"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Claude in Chrome staying \"not connected\" after a brief connection problem, even though Chrome was open and signed in", "中文内容": "修复了 Chrome 中的 Claude 在短暂连接问题后保持“未连接”状态，即使 Chrome 已打开并登录"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed terminal sessions on Amazon Bedrock (Mantle) started with no model selected ignoring a pinned Opus model, and still calling an unavailable default model after announcing a fallback", "中文内容": "修复了 Amazon Bedrock (Mantle) 上的终端会话在启动时未选择任何模型的情况，忽略固定的 Opus 模型，并且在宣布回退后仍然调用不可用的默认模型"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the rest of what you were typing being lost when a plan arrived in fullscreen mode", "中文内容": "修复了当计划进入全屏模式时您输入的其余内容丢失的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed claude.ai connectors with different names being dropped when they share a server URL (anthropics/claude-code#101856)", "中文内容": "修复了共享服务器 URL 时删除具有不同名称的 claude.ai 连接器的问题 (anthropics/claude-code#101856)"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed plugins going missing from the installed list when several `claude plugin` commands ran at the same time", "中文内容": "修复了当多个`claude plugin`命令同时运行时插件从已安装列表中丢失的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed task dependencies and metadata being lost when several task updates ran at the same time", "中文内容": "修复了同时运行多个任务更新时任务依赖性和元数据丢失的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed incomplete backups of `~/.claude.json` being kept, and displacing good ones, when the disk was full", "中文内容": "修复了当磁盘已满时保留的`~/.claude.json`的不完整备份，并替换了好的备份"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed a long pause in Code Mode after code that read hundreds of files in projects with path-scoped rules or Read deny rules", "中文内容": "修复了使用路径范围规则或读取拒绝规则读取项目中数百个文件的代码后代码模式中的长时间暂停"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the built-in chart tool failing when Claude called it in Code Mode", "中文内容": "修复了克劳德在代码模式下调用内置图表工具时失败的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Code Mode ignoring an MCP tool's request to end the turn from a script in auto and bypass permissions modes", "中文内容": "修复了代码模式忽略 MCP 工具在自动和绕过权限模式下结束脚本轮次的请求"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Code Mode in auto mode dropping earlier thinking and rewriting the prompt cache when a mod added a note after a script loaded a skill", "中文内容": "修复了自动模式下的代码模式，当模组在脚本加载技能后添加注释时，会放弃早期思考并重写提示缓存"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Code Mode not restoring a file that a script had read after Esc and `/compact`", "中文内容": "修复了代码模式不恢复脚本在 Esc 和 `/compact` 之后读取的文件的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `/context` undercounting system tools in Code Mode before Claude's first reply", "中文内容": "修复了克劳德第一次回复之前在代码模式下`/context`低估系统工具的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed a stopped background subagent sometimes not staying stopped", "中文内容": "修复了停止的后台子代理有时不会保持停止状态的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Claude still waiting for a background agent that was stopped just as it finished, in sessions run by an app or the SDK", "中文内容": "修复了 Claude 仍在等待后台代理，该代理在应用程序或 SDK 运行的会话中刚完成就停止的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed background sessions sometimes waking in their previous permission mode after approving a plan", "中文内容": "修复了后台会话有时会在批准计划后以之前的权限模式唤醒的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Remote Control: Fixed the note about background agents ended by a Stop from a phone or the web showing in the terminal as if you had typed it", "中文内容": "远程控制：修复了有关后台代理的注释，该注释以手机或网络中的“停止”结尾，显示在终端中，就好像您已键入该注释一样"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "其他", "内容": "Remote Control: Fixed the mobile apps hiding the Diff and pull request buttons, or showing a stopped session as working, after turning it on mid-conversation", "中文内容": "远程控制：修复了移动应用程序在对话中打开后隐藏 Diff 和拉取请求按钮，或将已停止的会话显示为正在运行的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed environment variables written by a SessionStart hook being lost with `claude -p --continue`", "中文内容": "修复了 SessionStart 挂钩写入的环境变量因`claude -p --continue`而丢失的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `claude -p` exiting 0 with no message when its output went to a file on a full disk: it now prints an error and exits 1, though a full NFS export may go unnoticed", "中文内容": "修复了`claude -p`在输出到完整磁盘上的文件时退出 0 且没有任何消息的问题：它现在打印错误并退出 1，尽管完整的 NFS 导出可能会被忽视"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed the system prompt keeping the earlier model's instructions when the model was changed after `/context` but before the first message", "中文内容": "修复了在`/context`之后但在第一条消息之前更改模型时系统提示保留早期模型的说明的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Claude sometimes replying to its commit attribution reminder and ending the turn early after the model changed mid-turn; it can still happen where managed settings set the PR attribution line", "中文内容": "修复了克劳德有时会回复其提交归因提醒并在模型中途更改后提前结束回合的问题；在托管设置设置 PR 归因线的情况下，这种情况仍然可能发生"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Esc not ending an LSP tool call that was waiting for a slow or stuck language server", "中文内容": "修复了 Esc 未结束等待缓慢或卡住的语言服务器的 LSP 工具调用的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed LSP tool calls and diagnostics failing when several calls or edits arrived while a language server was still starting", "中文内容": "修复了语言服务器仍在启动时多次调用或编辑到达时 LSP 工具调用和诊断失败的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `/mcp` listing plugin servers as built-in: they now stand under \"Plugin MCPs\", `--mcp-config` and built-in servers under \"Other MCPs\", and a server's page names its plugin", "中文内容": "修复了`/mcp`将插件服务器列为内置的问题：它们现在位于“插件 MCP”下，`--mcp-config`和内置服务器位于“其他 MCP”下，并且服务器的页面为其插件命名"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed an \"MCP server blocked by enterprise policy: easel\" warning showing at every start when an MCP allowlist or denylist excludes the built-in chart tool, which stays blocked", "中文内容": "修复了当 MCP 允许列表或拒绝列表排除内置图表工具（该工具始终被阻止）时，每次启动时都会显示“MCP 服务器被企业策略阻止：画架”警告"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `/stats` counting new activity in UTC days instead of your local time zone", "中文内容": "修复了`/stats`以 UTC 日而不是本地时区计算新活动的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed `/ultrareview` failing or reviewing the wrong code after the shell moved into another repository: it now stops and names both folders", "中文内容": "修复了 shell 移入另一个存储库后`/ultrareview`失败或检查错误代码的问题：它现在停止并命名两个文件夹"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Grep reporting no matches when the pattern held a line break without multiline mode; it now reports the rejected pattern", "中文内容": "修复了当模式在没有多行模式的情况下存在换行符时 Grep 报告没有匹配项的问题；它现在报告被拒绝的模式"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed Jupyter notebooks saved with a byte order mark being reported as invalid JSON by the Read and NotebookEdit tools", "中文内容": "修复了使用字节顺序标记保存的 Jupyter 笔记本被 Read 和 NotebookEdit 工具报告为无效 JSON 的问题"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed link reference definitions being dropped from CLAUDE.md and memory files that contain an HTML comment", "中文内容": "修复了从 CLAUDE.md 和包含 HTML 注释的内存文件中删除的链接引用定义"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed running Monitors keeping the earlier conversation in memory until they end", "中文内容": "修复了正在运行的监视器将先前的对话保留在内存中直到结束"}, {"日期": "2026-11-20", "版本": "2.1.330", "类型": "修复", "内容": "Fixed some Claude Desktop sessions on third-party providers, other than scheduled tasks, ending a turn with \"Prompt is too long\" when a PDF larger
