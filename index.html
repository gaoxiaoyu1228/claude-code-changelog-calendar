 "内容": "Fixed the Bash sandbox on Linux renaming `.git/HEAD` after each command when the branch name is not valid UTF-8", "中文内容": "修复了当分支名称不是有效的 UTF-8 时，Linux 上的 Bash 沙箱在每个命令后重命名 `.git/HEAD`"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed all running sessions being stopped when a proxy or web filter answered a poll with HTTP 200 and a body such as `{}`; the runner now retries such a poll", "中文内容": "自托管运行器：修复了当代理或 Web 过滤器使用 HTTP 200 和`{}`等正文回答轮询时所有正在运行的会话停止的问题；跑步者现在重试这样的民意调查"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed deletion of a kept clone's objects or refs, and of commits that existed only there, after a temporary disk error; that start now fails instead", "中文内容": "自托管运行器：修复了在临时磁盘错误后删除保留克隆的对象或引用以及仅存在于其中的提交的问题；现在开始失败了"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed self-hosted runners stopping when their token ran out on a host whose clock is slow or was set back", "中文内容": "修复了当时钟速度慢或被延迟的主机上的令牌耗尽时，自托管运行程序会停止的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed sessions with Anthropic-managed git losing git access to GitHub after a script or hook in the session ran `claude` again", "中文内容": "自托管运行器：修复了与 Anthropic 管理的 git 的会话在会话中的脚本或挂钩再次运行`claude`后丢失 git 访问 GitHub 的问题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed self-hosted runners with Anthropic-managed git being unable to fetch or push where the machine's git config sets `http.proactiveAuth`", "中文内容": "修复了由 Anthropic 管理的 git 无法在机器的 git 配置设置`http.proactiveAuth`的位置获取或推送的自托管运行器"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed a runner that exited without telling the server when setup failed after it had registered; it now deregisters with a reason, and an on-demand runner reports the failed start", "中文内容": "自托管运行器：修复了注册后安装失败时退出而不通知服务器的运行器；现在它会因某种原因取消注册，并且按需运行程序会报告启动失败"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed archiving or requeueing a session not taking effect while it waited for another session to prepare the same repository (`--capacity` above 1)", "中文内容": "自托管运行器：修复了在等待另一个会话准备同一存储库时存档或重新排队会话不生效的问题（`--capacity` 高于 1）"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed a session with a damaged `.claude.json` failing every later start under `--trust-workspace false`; it now starts on defaults, with MCP servers turned off there on again", "中文内容": "自托管运行器：修复了`.claude.json`损坏的会话在`--trust-workspace false`下每次启动失败的问题；现在默认启动，MCP 服务器关闭并再次打开"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed a failed start's message losing the words that say what failed when a checkout hook or git printed a lot", "中文内容": "自托管运行器：修复了失败的启动消息，当结帐钩子或 git 打印大量内容时，该消息会丢失说明失败的内容"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed the self-hosted runner skipping its post-session hook when a disk stalled for a few seconds; on a dead disk a session's end can take 25 seconds longer by default", "中文内容": "修复了当磁盘停止几秒钟时自托管运行器跳过其会话后挂钩的问题；在死磁盘上，默认情况下会话结束可能需要多花 25 秒"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed self-hosted runners: a session that resumes in a new Claude config directory no longer loses its task list", "中文内容": "修复了自托管运行程序：在新的 Claude 配置目录中恢复的会话不再丢失其任务列表"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed Claude not being told when a self-hosted session starts without one of its repositories, and why", "中文内容": "修复了当自托管会话在没有其存储库的情况下启动时克劳德没有被告知的问题，以及原因"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Fixed `--correlation-id` of `claude --environment` not reaching the `spawn-runner` hook", "中文内容": "自托管运行器：修复了`claude --environment`的`--correlation-id`未到达`spawn-runner`挂钩"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "修复", "内容": "Fixed the self-hosted runner setup wizard's key rotation advice, which now warns that revoking a key stops the sessions running under it", "中文内容": "修复了自托管运行器设置向导的密钥轮换建议，该建议现在警告撤销密钥会停止在其下运行的会话"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved `claude -p` and SDK sessions to fetch managed-settings plugins that have their own git repository, in the background, for a later session", "中文内容": "改进了`claude -p`和 SDK 会话，以在后台获取拥有自己的 git 存储库的托管设置插件，以供以后的会话使用"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved how soon managed-settings plugins from a git marketplace load on a fresh machine in `claude -p`, SDK and Claude Desktop sessions; a short run may exit up to 30 seconds later", "中文内容": "改进了在`claude -p`、SDK 和 Claude 桌面会话中将 git 市场中的托管设置插件加载到新计算机上的速度；短期运行最多可能会在 30 秒后退出"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved the time to resume large sessions", "中文内容": "缩短了恢复大型会话的时间"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved memory use when resuming a session with many images", "中文内容": "恢复包含许多图像的会话时改进了内存使用"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved memory use and response time in long SDK and desktop sessions that run slow commands or tools", "中文内容": "改进了运行缓慢命令或工具的长 SDK 和桌面会话中的内存使用和响应时间"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved Code Mode's speed in auto and bypass-permissions modes by removing a 0.75 second pause after most scripts", "中文内容": "通过消除大多数脚本后的 0.75 秒暂停，提高了自动和旁路权限模式下代码模式的速度"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved prompt caching for new Code Mode sessions that have MCP servers, and Claude is now told when a server is still connecting and when the list of servers changes", "中文内容": "改进了具有 MCP 服务器的新代码模式会话的提示缓存，现在可以告诉 Claude 服务器何时仍在连接以及服务器列表何时更改"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved Code Mode's token use with shorter tool descriptions", "中文内容": "通过更短的工具描述改进了代码模式的令牌使用"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved Code Mode to show the command a script is running, and its output, while it runs", "中文内容": "改进的代码模式可在运行时显示脚本正在运行的命令及其输出"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved Code Mode edits: an edit that changes nothing no longer stops a script, and Claude is told where a failed edit matches or comes closest", "中文内容": "改进的代码模式编辑：不进行任何更改的编辑不再停止脚本，并且克劳德被告知失败的编辑匹配或最接近的位置"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved Code Mode: Claude is now told which tool calls were still running when a script failed", "中文内容": "改进的代码模式：现在，当脚本失败时，克劳德会被告知哪些工具调用仍在运行"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved how Claude starts dev servers in Code Mode's auto and bypass modes: Claude is told to run them as background tasks that show in `/tasks`", "中文内容": "改进了 Claude 在代码模式的自动和旁路模式下启动开发服务器的方式：Claude 被告知将它们作为后台任务运行，显示在`/tasks`中"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Windows: Improved Code Mode by telling Claude that scripts' shell commands run in Git Bash and that PowerShell aliases run instead of functions with the same name", "中文内容": "Windows：改进了代码模式，告诉 Claude 脚本的 shell 命令在 Git Bash 中运行，并且运行 PowerShell 别名而不是同名的函数"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved starting several in-process teammates at once: far fewer now fail with \"Lock file is already being held\"", "中文内容": "改进了同时启动多个正在进行的队友的功能：现在因“锁定文件已被保留”而失败的情况要少得多"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved the computer use approval dialog: it now shows each app's level of access and plainer warnings", "中文内容": "改进了计算机使用批准对话框：它现在显示每个应用程序的访问级别和更简单的警告"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved cross-session messaging: Claude now explains that Remote Control is off when a cloud session or another computer is not listed", "中文内容": "改进的跨会话消息传递：克劳德现在解释说，当未列出云会话或另一台计算机时，远程控制将关闭"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved `claude -p` text output to say on stderr when a message from another session is held or dropped, and how to allow it", "中文内容": "改进了`claude -p`文本输出，以在来自另一个会话的消息被保留或删除时在 stderr 上显示，以及如何允许它"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved Claude's answers on who can open an artifact it published: Claude is now told to check the artifact again instead of repeating the last publish's answer", "中文内容": "改进了克劳德关于谁可以打开其发布的工件的答案：现在告诉克劳德再次检查工件，而不是重复上次发布的答案"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Improved resumed self-hosted runner sessions: Claude now checks whether its earlier work is still there, and says what is missing", "中文内容": "改进了恢复的自托管运行器会话：克劳德现在检查其早期的工作是否仍然存在，并指出缺少的内容"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed plan mode and Bash prompts for Opus 4.6 and Sonnet 4.6 on third-party providers to use and offer auto mode, as on newer models; `disableAutoMode` turns both off", "中文内容": "更改了第三方提供商上 Opus 4.6 和 Sonnet 4.6 的计划模式和 Bash 提示，以使用和提供自动模式，与较新的型号一样； `disableAutoMode` 关闭两者"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed Code Mode to no longer run UserPromptSubmit hooks, managed ones included, on scripts' output; to redact that output, use a PostToolUse hook with `updatedToolOutput`", "中文内容": "更改了代码模式，不再在脚本输出上运行 UserPromptSubmit 挂钩（包括托管挂钩）；要编辑该输出，请使用带有`updatedToolOutput`的 PostToolUse 挂钩"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed `/code-review` on most models to report only bugs and CLAUDE.md violations; run `/simplify` for reuse, simplification and efficiency cleanups", "中文内容": "更改了大多数模型上的`/code-review`，仅报告错误和 CLAUDE.md 违规；运行`/simplify`以进行重用、简化和效率清理"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed `/code-review` to mark each finding Important, Pre-existing or Nit on most models, and to end each summary with a suggested fix; a clean review's list now reads \"Code review found no issues.\"", "中文内容": "更改了`/code-review`，以在大多数型号上将每个发现标记为“重要”、“预先存在”或“Nit”，并以建议的修复结束每个摘要；干净的审查列表现在显示为“代码审查未发现问题”。"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed `deniedMcpServers` entries of the form `claude.ai <name>` to apply to that connector in cloud and self-hosted runner sessions too", "中文内容": "更改了`claude.ai <name>`形式的`deniedMcpServers`条目，以应用于云中的连接器和自托管运行器会话"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed managed `PostToolUse` hooks to no longer fire for calls refused before they ran: no log entry, rewrite, block or stop there; `PostToolBatch` gets most, not marked as refused", "中文内容": "更改了托管的`PostToolUse`挂钩，使其不再因运行前拒绝的调用而触发：没有日志条目、重写、阻止或停止； `PostToolBatch` 获得最多，未标记为拒绝"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed `/bug` to ask Yes or No before sending, so repeated Enters no longer send a report or open GitHub", "中文内容": "将 `/bug` 改为在发送前询问 Yes 或 No，因此重复 Enter 不再发送报告或打开 GitHub"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed subagents in `claude -p`, the Agent SDK, desktop and VS Code to wait for their own subagents by default when `CLAUDE_CODE_FORK_SUBAGENT=0` is set", "中文内容": "更改了`claude -p`、Agent SDK、桌面和 VS Code 中的子代理，以在设置`CLAUDE_CODE_FORK_SUBAGENT=0`时默认等待自己的子代理"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed `claude -p` with `CLAUDE_CODE_FORK_SUBAGENT=0` to count a background subagent and those it waits for against one 10-minute wait; raise `CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS` for longer chains", "中文内容": "将`claude -p`更改为`CLAUDE_CODE_FORK_SUBAGENT=0`，以计算后台子代理及其等待的 10 分钟等待时间；提高`CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS`以获得更长的链"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed a shell command rewritten by a PermissionRequest hook to a sandbox-excluded command to run outside the sandbox", "中文内容": "将 PermissionRequest 挂钩重写的 shell 命令更改为沙箱排除命令，以便在沙箱外运行"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed the Claude in Chrome welcome screen and `/chrome` to say that Claude Code asks before Claude acts on a site, unless your permission mode or a rule in `/permissions` answers", "中文内容": "更改了 Chrome 欢迎屏幕和`/chrome`中的 Claude，表示 Claude 代码在 Claude 对网站进行操作之前会询问，除非您的权限模式或`/permissions`中的规则回答"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed Claude Desktop and Agent SDK sessions on third-party providers or with telemetry or feature flags off to end the turn when closed with a question open, instead of continuing without an answer", "中文内容": "更改了第三方提供商的 Claude Desktop 和 Agent SDK 会话，或者使用遥测或功能标记关闭，以在有问题关闭时结束回合，而不是在没有答案的情况下继续"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed pasted text to be marked for Claude as pasted, on third-party providers or with telemetry or feature flags turned off", "中文内容": "更改了粘贴的文本，以在第三方提供商上或关闭遥测或功能标志的情况下将克劳德标记为粘贴"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed subagent progress summaries in terminal sessions on the Anthropic API to be written by the default small fast model from short notes, also with telemetry off, using far fewer tokens", "中文内容": "将 Anthropic API 上的终端会话中的子代理进度摘要更改为由默认的小型快速模型从简短的注释编写，也关闭了遥测，使用更少的令牌"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed how a sandbox that can't start is reported, unless `sandbox.failIfUnavailable` is set: the next sandboxed Bash command is refused and says that the sandbox is off for the session", "中文内容": "更改了报告无法启动的沙箱的方式，除非设置了`sandbox.failIfUnavailable`：下一个沙箱 Bash 命令被拒绝，并表示会话的沙箱已关闭"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed `/list-agents` to show its list to you alone; Claude lists sessions itself when needed", "中文内容": "更改了`/list-agents`以仅向您显示其列表；克劳德在需要时自行列出会话"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Changed the built-in `gh api` to be off by default where settings guard Claude's GitHub tools by name; `--use-anthropic-gh true` turns it on", "中文内容": "自托管运行器：将内置`gh api`更改为默认关闭，其中设置按名称保护 Claude 的 GitHub 工具； `--use-anthropic-gh true` 打开它"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Changed a `claude` that a wrapper script runs before the session's own `claude` is up, or after it has ended, to have no Anthropic-managed git", "中文内容": "自托管运行器：更改了包装器脚本在会话自己的`claude`启动之前或结束后运行的`claude`，以没有 Anthropic 管理的 git"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "Self-hosted runner: Changed `CLAUDE_RUNNER_SESSION_UUID` and `CLAUDE_CODE_REMOTE_SESSION_UUID` to both be set for the session and its `checkout`, `post-session` and `spawn-runner` hooks", "中文内容": "自托管运行器：将`CLAUDE_RUNNER_SESSION_UUID`和`CLAUDE_CODE_REMOTE_SESSION_UUID`更改为会话及其`checkout`、`post-session`和`spawn-runner`挂钩"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "改进", "内容": "Changed self-hosted runners at `--capacity 1` to refuse a session earlier when the path of a repository it pushes to is a symbolic link", "中文内容": "更改了`--capacity 1`处的自托管运行程序，以便在推送到的存储库的路径是符号链接时更早地拒绝会话"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "[VSCode] Added a notice when a message from another session is held, with a link to the settings file that can allow it", "中文内容": "[VSCode] 添加了当来自另一个会话的消息被保留时的通知，以及可以允许它的设置文件的链接"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "[VSCode] Fixed the permission prompt cutting off its No button, reply field or title when the panel is low or a command, URL or description is long", "中文内容": "[VSCode] 修复了当面板较低或命令、URL 或描述较长时，权限提示会切断其“否”按钮、回复字段或标题"}, {"日期": "2026-11-18", "版本": "2.1.328", "类型": "其他", "内容": "[VSCode] Fixed failed or blocked tool calls showing no reason or a reason cut short, and Glob and Grep counting an error as results", "中文内容": "[VSCode] 修复了失败或阻止的工具调用，显示无原因或原因缩短，并且 Glob 和 Grep 将错误计为结果"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added a confirmation before `/install-github-app` changes a repository", "中文内容": "在 `/install-github-app` 更改存储库之前添加了确认"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added `claude mcp add-json <name> -` to read the server's JSON from stdin, so tokens can stay off the command line; not available inside a Claude Code session", "中文内容": "添加了`claude mcp add-json <name> -`以从标准输入读取服务器的 JSON，因此令牌可以远离命令行；在 Claude Code 会话中不可用"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added a line when a resumed session's earlier messages can't be loaded", "中文内容": "当无法加载已恢复会话的早期消息时添加了一行"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added a list in `/status` of broken agent, skill, command and output style files, keybinding errors, an unavailable sandbox, ignored permission settings and hook matchers that never match", "中文内容": "在`/status`中添加了损坏的代理、技能、命令和输出样式文件、键绑定错误、不可用的沙箱、忽略的权限设置和从不匹配的挂钩匹配器的列表"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added a note in `/config` when other settings override a row", "中文内容": "当其他设置覆盖一行时在`/config`中添加了注释"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added `x-claude-code-managed-settings-checksum` to the gateway hint headers; sent where managed settings set `CLAUDE_CODE_GATEWAY_HINT_HEADERS=1`, including where they already do", "中文内容": "在网关提示标头中添加了“x-claude-code-management-settings-checksum”；在托管设置设置`CLAUDE_CODE_GATEWAY_HINT_HEADERS=1`的位置发送，包括它们已经设置的位置"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added support for naming a session's billing group with the `attributionProject` setting, for Claude apps gateways that set `admin.billing_group_tag`", "中文内容": "添加了对使用`attributionProject`设置命名会话的计费组的支持，适用于设置`admin.billing_group_tag`的 Claude 应用程序网关"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "新增", "内容": "Added `/tui classic` as the name for the non-fullscreen renderer; `/tui default` still works", "中文内容": "添加`/tui classic`作为非全屏渲染器的名称； `/tui default` 仍然有效"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "Remote Control: Fixed stopping the server in worktree mode deleting a running session's git-ignored files, such as `.env`", "中文内容": "远程控制：修复了在工作树模式下停止服务器删除正在运行的会话的 git-ignored 文件的问题，例如`.env`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed self-hosted runners with `--use-anthropic-git-proxy` deleting a non-empty directory named by `GIT_CONFIG_GLOBAL` at startup: the runner now keeps it, ignores the variable and warns", "中文内容": "修复了使用`--use-anthropic-git-proxy`在启动时删除由`GIT_CONFIG_GLOBAL`命名的非空目录的自托管运行程序：运行程序现在保留它，忽略变量并发出警告"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `claude mcp add` and `claude mcp remove` with project scope deleting other top-level keys from `.mcp.json`, such as `$schema` or another tool's `servers`", "中文内容": "修复了`claude mcp add`和`claude mcp remove`，项目范围从`.mcp.json`中删除其他顶级键，例如`$schema`或其他工具的`servers`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/export` overwriting an existing file without asking: the dialog now asks, and `/export <name>` keeps the file and says to run `/export`", "中文内容": "修复了`/export`在不询问的情况下覆盖现有文件的问题：对话框现在会询问，并且`/export <name>`保留文件并表示运行`/export`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a command you had allowed still running after you pressed Stop, when the approval arrived after a restart, in cloud and self-hosted runner sessions with no feature flags loaded", "中文内容": "修复了在云和自托管运行器会话中，在未加载功能标志的云和自托管运行器会话中，您在按下“停止”后仍允许运行的命令，当重新启动后获得批准时"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Enter closing `/teleport`'s load error screen", "中文内容": "修复了 Enter 关闭 `/teleport` 的加载错误屏幕"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a click followed by Enter in `/plugin` installing or disabling a plugin", "中文内容": "修复了在`/plugin`中单击后按 Enter 安装或禁用插件的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a half-typed `!` command running on an extra Enter after the usage limit menu", "中文内容": "修复了在使用限制菜单后额外输入一个 Enter 时运行的半输入`!`命令"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed some `--disallowedTools` rules with parentheses in their content", "中文内容": "修复了一些内容中带有括号的`--disallowedTools`规则"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed auto mode ignoring some wildcard PowerShell allow rules that name a script with `.\\`, such as `PowerShell(.\\scripts\\build.ps1 *)`", "中文内容": "修复了自动模式忽略某些通配符 PowerShell 允许使用`.\\`命名脚本的规则，例如`PowerShell(.\\scripts\\build.ps1 *)`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a running Code Mode script in auto mode getting permission prompts and denials once Claude started a second script that auto mode also allowed", "中文内容": "修复了在自动模式下运行的代码模式脚本在克劳德启动自动模式也允许的第二个脚本时获取权限提示和拒绝的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed some pre-started background sessions to be discarded after an account change", "中文内容": "更改了一些预先启动的后台会话，以便在帐户更改后丢弃"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed a workflow paused at a usage limit in the terminal to stay paused after a login, until the earlier login returns or you type a prompt", "中文内容": "将终端中在使用限制处暂停的工作流程更改为在登录后保持暂停状态，直到先前的登录返回或您键入提示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a nested `claude` with its own token being refused by `forceLoginOrgUUID`: commands that don't get the session's token no longer get its `CLAUDE_CODE_OAUTH_SCOPES`; set it on any that need it", "中文内容": "修复了嵌套的`claude`，其自己的令牌被`forceLoginOrgUUID`拒绝：未获取会话令牌的命令不再获取其`CLAUDE_CODE_OAUTH_SCOPES`；将其设置在任何需要它的地方"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed headless sessions losing stored messages on resume when a message was sent again with the same UUID after the process was killed", "中文内容": "修复了进程被终止后，使用相同 UUID 再次发送消息时无头会话在恢复时丢失存储的消息的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed cases where a session resumed after an empty reply or a killed command lost an answer, or brought back a rewound prompt, after another crash or a move to the background", "中文内容": "修复了会话在空回复或被杀死的命令丢失答案后恢复，或在另一次崩溃或移动到后台后带回倒带提示的情况"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a remote session forgetting messages sent after Stop was pressed during a restart, if Claude Code then crashed", "中文内容": "修复了远程会话忘记在重新启动期间按下“停止”后发送的消息（如果克劳德代码崩溃）的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed tasks created after `/clear` being lost, and cleared tasks coming back, when a cloud or self-hosted runner session with no feature flags loaded resumed later", "中文内容": "修复了`/clear`丢失后创建的任务，以及当稍后恢复未加载功能标志的云或自托管运行器会话时清除的任务返回的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a compaction right after a reply cut at the output token limit losing that reply's tool call and its result", "中文内容": "修复了在输出令牌限制处回复剪切后立即进行的压缩，丢失了该回复的工具调用及其结果"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a settings change from `/config` and similar commands failing to save with no warning; a line under the prompt now says so", "中文内容": "修复了`/config`的设置更改和类似命令无法保存且没有警告的问题；现在提示符下有一行这样说"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/rewind` closing without a word when some files could not be restored", "中文内容": "修复了某些文件无法恢复时`/rewind`无声关闭的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed pasted images being dropped when the prompt starts with a file path such as `/tmp/a.txt`", "中文内容": "修复了当提示以`/tmp/a.txt`等文件路径开头时粘贴的图像被删除的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed agents passed with `--agents` being lost once plugins loaded or reloaded", "中文内容": "修复了加载或重新加载插件后通过`--agents`传递的代理丢失的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a plugin's agent being dropped when resuming a session from the `--resume` picker", "中文内容": "修复了从`--resume`选择器恢复会话时插件代理被删除的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude Code refusing to start when `https_proxy` or `HTTPS_PROXY` is a bare `host:port` and neither its input nor its output is a terminal (the desktop app, an SDK, cron)", "中文内容": "修复了当`https_proxy`或`HTTPS_PROXY`是裸露的`host:port`且其输入和输出都不是终端（桌面应用程序、SDK、cron）时克劳德代码拒绝启动的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude Code on Linux sometimes returning to the shell while restarting itself at startup, such as after the first sign-in to a Claude apps gateway or when turning on Code Mode", "中文内容": "修复了 Linux 上的 Claude Code 有时在启动时重新启动时返回 shell 的问题，例如首次登录 Claude 应用程序网关后或打开代码模式时"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `claude -p` hanging before its first request when the fetch of a model's settings stalled, such as at a proxy; it now goes on without them after 10 seconds", "中文内容": "修复了当模型设置的获取停滞时（例如在代理处），`claude -p`在第一个请求之前挂起的问题；现在 10 秒后，如果没有它们，它也会继续"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the screen staying blank or frozen after a brief out-of-memory error", "中文内容": "修复了短暂的内存不足错误后屏幕保持空白或冻结的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a rare display fault that could freeze the screen or end the session", "中文内容": "修复了一个罕见的显示故障，该故障可能会冻结屏幕或结束会话"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed cloud sessions breaking when a program left thousands of connections open to the session's network proxy", "中文内容": "修复了当程序向会话的网络代理打开数千个连接时云会话中断的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a turn hanging when a mod's `$.model.complete` or `$.model.classify` call met a usage limit: the call now gets the API's error at once; mods should handle that error", "中文内容": "修复了当 mod 的 `$.model.complete` 或 `$.model.classify` 调用达到使用限制时挂起的问题：调用现在立即获取 API 的错误； mods 应该处理该错误"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed stalls on a compaction reply with thousands of unclosed tags and on some very long WebFetch URLs; WebFetch now refuses a URL over 2,000 characters before any permission prompt", "中文内容": "修复了具有数千个未封闭标签的压缩回复和一些非常长的 WebFetch URL 上的停顿； WebFetch 现在在任何权限提示之前拒绝超过 2,000 个字符的 URL"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a message with thousands of `@` mentions stalling before Claude replies; only the first 100 mentions are now looked up as files", "中文内容": "修复了一条包含数千个`@`提及的消息在克劳德回复之前停滞的问题；现在仅将前 100 个提及作为文件进行查找"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the prompt freezing after rejecting a write to a very large file; a rejected write now shows a short preview", "中文内容": "修复了拒绝写入超大文件后提示冻结的问题；被拒绝的写入现在会显示简短的预览"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a crash when a burst of keys reached the search box in `/plugin`", "中文内容": "修复了当一系列按键到达`/plugin`中的搜索框时发生的崩溃"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a false crash report and exit code when a suspended session resumes, or at exit, where a Linux security policy blocks a process from signalling itself", "中文内容": "修复了挂起的会话恢复时或退出时的错误崩溃报告和退出代码，其中 Linux 安全策略阻止进程向自身发送信号"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed remote MCP servers staying disconnected after a longer outage such as a VPN drop: most servers on other machines reached by hostname over https are now retried in the background for about a day", "中文内容": "修复了远程 MCP 服务器在长时间中断（例如 VPN 断开）后保持断开连接的问题：通过 https 主机名访问的其他计算机上的大多数服务器现在会在后台重试大约一天"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Edit refusing with \"File has not been read yet\" after a compaction on unchanged files outside the project that Claude had already read in full", "中文内容": "修复了在压缩克劳德已完整阅读的项目外未更改的文件后编辑拒绝“文件尚未读取”的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Grep repeating or skipping results when paging with `head_limit` and `offset`; content and count results are now sorted by file path", "中文内容": "修复了 Grep 在使用`head_limit`和`offset`分页时重复或跳过结果的问题；内容和计数结果现在按文件路径排序"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Read failing on Jupyter notebooks that contain an output of an unknown type", "中文内容": "修复了包含未知类型输出的 Jupyter 笔记本上的读取失败问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed NotebookEdit removing the notebook file's final newline", "中文内容": "修复了 NotebookEdit 删除笔记本文件最后换行符的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the Read tool reporting 512KB instead of the real size when a file of 10 MB or more is too large to read at once", "中文内容": "修复了当 10 MB 或更大的文件太大而无法一次读取时，读取工具报告 512KB 而不是实际大小"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the Bash tool's diff of changed files not naming files that are binary, too large or too many to show", "中文内容": "修复了 Bash 工具的已更改文件的差异，未命名二进制文件、太大或太多而无法显示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed artifact publishes failing with \"the source file changed between approval and publish\" when a synced or remote-backed folder had only changed the file's timestamp", "中文内容": "修复了当同步或远程支持的文件夹仅更改了文件的时间戳时，工件发布失败并显示“源文件在批准和发布之间发生更改”的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a new artifact that you approved being refused in a cloud scheduled task's session, in organizations that require approval of each new artifact", "中文内容": "修复了您批准的新工件在需要批准每个新工件的组织中在云计划任务会话中被拒绝的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a new artifact being refused after an app built on the Agent SDK approved it, in organizations that require approval of each new artifact", "中文内容": "修复了在需要批准每个新工件的组织中，在基于 Agent SDK 构建的应用程序批准后新工件被拒绝的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/artifacts` showing part of your list, or \"No artifacts yet\", when a request for more of the list failed: it now tries again, then warns if it can't load the whole list", "中文内容": "修复了`/artifacts`在请求更多列表失败时显示列表的一部分或“尚无工件”的问题：现在它会再次尝试，然后在无法加载整个列表时发出警告"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed in-process agent teammates on a different model from the lead compacting at the lead's context limit and on the wrong model; they now use their own limit and model, at that model's rate", "中文内容": "修复了进程内代理队友在与线索上下文限制不同的模型上以及错误的模型上进行压缩的问题；他们现在使用自己的极限和模型，以该模型的速率"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a finished subagent resuming on the model and effort of a sibling subagent that messaged it", "中文内容": "修复了已完成的子代理在模型上的恢复以及向其发送消息的同级子代理的工作量"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the main conversation not being told a background agent had finished when the subagent that started it ended by itself without reading the result, outside auto mode", "中文内容": "修复了当启动主对话的子代理在没有读取结果的情况下自行结束（在自动模式之外）时，主对话不会被告知后台代理已完成的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude reporting a background agent as still running when it had waited 30 seconds or more on a permission prompt in the desktop app, on the web and in the SDK", "中文内容": "修复了 Claude 在桌面应用程序、Web 和 SDK 中出现权限提示后等待 30 秒或更长时间后报告后台代理仍在运行的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude not being told in auto mode when a background agent's reply to a follow-up message was dropped, and reduced repeat wake-ups there from agents waiting on background commands", "中文内容": "修复了当后台代理对后续消息的回复被删除时，克劳德在自动模式下不会被告知的问题，并减少了等待后台命令的代理的重复唤醒"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the desktop app, Claude Code on the web and VS Code showing a raw task notification as a subagent's prompt after its background task woke it", "中文内容": "修复了桌面应用程序、Web 上的 Claude Code 和 VS Code 在后台任务唤醒子代理后将原始任务通知显示为子代理的提示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed messages sent from another session with \"later\" priority joining the running turn, instead of waiting for it to end, in Remote Control and Claude Desktop sessions", "中文内容": "修复了在远程控制和 Claude 桌面会话中从另一个具有“稍后”优先级的会话发送的消息，加入正在运行的回合，而不是等待其结束"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed messages to cloud and Remote Control sessions being reported as failed with a stale address after a timeout or rate limit; Claude now says when a message may have arrived", "中文内容": "修复了在超时或速率限制后发送到云和远程控制会话的消息被报告为失败且地址过时的问题；克劳德现在说消息何时可能到达"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed cloud sessions giving no error when a `UserPromptSubmit` hook blocks a message sent while Claude works", "中文内容": "修复了当`UserPromptSubmit`挂钩阻止克劳德工作时发送的消息时，云会话不会出现错误的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed failing hooks showing nothing: SubagentStop in background agents, SessionEnd at `/clear` and `/resume`, and CwdChanged and FileChanged in fullscreen", "中文内容": "修复了不显示任何内容的失败挂钩：后台代理中的 SubagentStop、`/clear`和`/resume`处的 SessionEnd，以及全屏中的 CwdChanged 和 FileChanged"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a Stop hook that failed to run being shown as having reported a problem", "中文内容": "修复了无法运行的 Stop 挂钩显示为已报告问题的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed focus view keeping a finished reply hidden while a Stop hook was running", "中文内容": "固定焦点视图在 Stop 挂钩运行时隐藏已完成的回复"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude getting a long managed PostToolUse hook output twice when a mod added context to the tool call", "中文内容": "修复了当 mod 将上下文添加到工具调用时，Claude 两次获得长期托管的 PostToolUse 挂钩输出"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/model` listing the wrong models in some terminal sessions when a project's `.claude/settings.json` sets `ANTHROPIC_BASE_URL` to an LLM gateway", "中文内容": "修复了当项目的`.claude/settings.json`将`ANTHROPIC_BASE_URL`设置为 LLM 网关时，`/model`在某些终端会话中列出错误的模型"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/statusline` writing to `~/.claude/settings.json` when `CLAUDE_CONFIG_DIR` points to another folder", "中文内容": "修复了当`CLAUDE_CONFIG_DIR`指向另一个文件夹时`/statusline`写入`~/.claude/settings.json`的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `claudeMdExcludes` patterns on Windows not matching a path whose drive letter is written in the other case", "中文内容": "修复了 Windows 上的`claudeMdExcludes`模式与在其他情况下写入的驱动器号的路径不匹配的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `claude agents` and `claude rm` refusing to remove a fully pushed session (\"The worktree has unpushed commits\") when its worktree has a file or folder named `HEAD` at the top level", "中文内容": "修复了当工作树顶层有一个名为`HEAD`的文件或文件夹时，“claude Agents”和`claude rm`拒绝删除完全推送的会话（“工作树有未推送的提交”）"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed long ListAgents results hiding most sessions on accounts with many cloud or Remote Control sessions: long lists now come in pages", "中文内容": "修复了长 ListAgents 结果隐藏具有许多云或远程控制会话的帐户上的大多数会话的问题：长列表现在出现在页面中"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed slow turns in resumed sessions for organizations with tens of thousands of connector tool permissions", "中文内容": "修复了具有数万个连接器工具权限的组织恢复会话缓慢的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "Self-hosted runner: Fixed `claude -p` started by a session's script or hook waiting out rate limits, because it inherited the session's own retry setting", "中文内容": "自托管运行器：修复了由会话脚本或挂钩等待速率限制启动的`claude -p`，因为它继承了会话自己的重试设置"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the spend limit menu reporting a changed limit when the server refused it", "中文内容": "修复了支出限制菜单在服务器拒绝时报告更改的限制"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a second `x` on a task's details in `/tasks` stopping the next task too", "中文内容": "修复了`/tasks`中任务详细信息上的第二个`x`，也会停止下一个任务"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Esc being ignored on a permission prompt that had just appeared", "中文内容": "修复了刚刚出现的权限提示时 Esc 被忽略的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed lists that load their rows late sometimes ignoring Enter and the arrow keys", "中文内容": "修复了延迟加载行的列表有时会忽略 Enter 和箭头键的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/autofix-pr` holding the keyboard after Esc while it stopped the cloud session; the dialog now closes at once, and a stop that fails is reported afterwards with a link", "中文内容": "修复了`/autofix-pr`在停止云会话时在 Esc 后按住键盘的问题；该对话框现在立即关闭，随后会通过链接报告失败的停止"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a blank screen and stray mouse codes in the shell after quitting with ctrl+c just after ← opens the agents view", "中文内容": "修复了在 ← 打开代理视图后使用 ctrl+c 退出后 shell 中的空白屏幕和流浪鼠标代码"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Ctrl+C right after the trust question leaving the terminal in fullscreen", "中文内容": "修复了信任问题后 Ctrl+C 使终端全屏显示的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the shell flashing on screen when ← opens the agents view in fullscreen mode", "中文内容": "修复了当 ← 在全屏模式下打开代理视图时 shell 在屏幕上闪烁的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed terminal display faults: most scrambled scrollback in Ghostty on resize, link addresses hidden in Windows Terminal under old tmux and in VTE 0.50.0, and no selection highlight with 16 colors", "中文内容": "修复了终端显示故障：调整大小时 Ghostty 中最混乱的回滚、旧 tmux 和 VTE 0.50.0 下的 Windows 终端中隐藏的链接地址，以及没有 16 种颜色的选择突出显示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed some garbled rows in tmux with `allow-passthrough` on inside kitty, Ghostty or iTerm2", "中文内容": "修复了 tmux 中的一些乱码行，其中包含 kitty、Ghostty 或 iTerm2 上的`allow-passthrough`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/mcp` saying no servers were configured after one was added during a session or declined; it now says what to do", "中文内容": "修复了`/mcp`表示在会话期间添加或拒绝服务器后未配置服务器的问题；它现在说要做什么"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/hooks` leaving out hooks given by `--settings`", "中文内容": "修复了`/hooks`遗漏了`--settings`给出的钩子的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the `/` menu listing a row for each skill of the same name, though every row ran the first", "中文内容": "修复了`/`菜单，为同名的每个技能列出一行，尽管每行都运行第一个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/teleport` showing no message when the chosen session failed to resume", "中文内容": "修复了当所选会话无法恢复时`/teleport`不显示消息的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed n and N in transcript search skipping matches", "中文内容": "修复了成绩单搜索中的 n 和 N 跳过匹配的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed cancelling a transcript search (ctrl+o, then /) in a long session landing far from where the search started", "中文内容": "修复了在远离搜索开始位置的长会话中取消转录搜索（ctrl+o，然后 /）的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed up and down losing the cursor's column over a short or blank line", "中文内容": "修复了在短行或空行上上下丢失光标的列的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Tab in shell mode filling in a file name after `&&`, `;` or `|`, where a command goes", "中文内容": "修复了 shell 模式下的 Tab 在命令所在位置`&&`、`;`或`|`后填写文件名的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the selected session leaving the screen in `claude --resume` and `/resume` when branch names or folder paths are long", "中文内容": "修复了当分支名称或文件夹路径很长时，所选会话在`claude --resume`和`/resume`中留下屏幕的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the MCP tool list in `/mcp` and `/plugin` losing your place when going back from a tool", "中文内容": "修复了`/mcp`和`/plugin`中的 MCP 工具列表在从工具返回时丢失位置的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/resume` listing one session fewer than the window has room for, and a 'Resend your message' hint after most spend caps, where resending can't help", "中文内容": "修复了`/resume`列出的会话数少于窗口空间的问题，以及在大多数支出上限后出现“重新发送消息”提示（在这种情况下重新发送无济于事）"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed an MCP server's long question being cut off after one row, text fields hiding long pastes with no sign, and a doubled divider line in `/plugin`'s options and `/login`'s Bedrock and Vertex steps", "中文内容": "修复了 MCP 服务器的长问题在一行后被切断、文本字段隐藏没有符号的长粘贴以及`/plugin`选项和`/login`的基岩和顶点步骤中的双分隔线"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the \"+N lines\" count being too high for command output with links or colors, and the transcript's `?` help hiding how to exit in a short window", "中文内容": "修复了“+N 行”计数对于带有链接或颜色的命令输出来说过高的问题，并且记录的“？”有助于隐藏如何在短窗口中退出"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Ctrl+C twice not closing `/chrome` from its browser list", "中文内容": "修复了 Ctrl+C 两次未从浏览器列表中关闭`/chrome`的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a number and Enter typed too early at an agent's plan approval in screen reader mode causing the next number to be dropped too", "中文内容": "修复了在屏幕阅读器模式下在代理计划批准时过早输入数字和 Enter 导致下一个数字也被删除的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude trying to read design system token files that do not exist when starting a deck or design", "中文内容": "修复了克劳德在启动套牌或设计时尝试读取不存在的设计系统令牌文件的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed exit not saying that a worktree was kept", "中文内容": "修复了退出时没有说保留工作树的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/hooks` help naming input fields that do not exist", "中文内容": "修复了`/hooks`帮助命名不存在的输入字段"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed question dialogs naming ctrl+g after the external editor key was rebound", "中文内容": "修复了外部编辑器按键反弹后命名 ctrl+g 的问题对话框"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed two sign-in error messages that pointed to the Claude subscription option on computers where `forceLoginMethod` is set to `console`", "中文内容": "修复了两条登录错误消息，这些消息指向`forceLoginMethod`设置为`console`的计算机上的 Claude 订阅选项"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/config` saying the dialog was dismissed instead of \"Set theme to …\" after changing the theme", "中文内容": "修复了`/config`在更改主题后说对话框被关闭而不是“将主题设置为...”的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Bug fixes and reliability improvements", "中文内容": "错误修复和可靠性改进"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the speed of a session's first Bash command: shell start-up files may now run before it's approved, even if it's refused; set `CLAUDE_CODE_DISABLE_SHELL_HEAD_START=1` to turn this off", "中文内容": "提高了会话第一个 Bash 命令的速度：shell 启动文件现在可以在批准之前运行，即使它被拒绝；设置 `CLAUDE_CODE_DISABLE_SHELL_HEAD_START=1` 将其关闭"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved commits on newer models and in PowerShell: Claude is now told not to commit files that likely contain secrets", "中文内容": "改进了新模型和 PowerShell 中的提交：Claude 现在被告知不要提交可能包含机密的文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved sandboxed shell commands: Claude now sees when a command exempt from the sandbox stayed in it because its permission check relied on the sandbox", "中文内容": "改进的沙盒 shell 命令：克劳德现在可以看到不受沙盒约束的命令何时保留在其中，因为其权限检查依赖于沙盒"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the refusal for shell commands with no `rm` that the dangerous `rm` check can't parse, so Claude can resend harmless ones in plain syntax instead of giving up", "中文内容": "改进了对没有`rm`的 shell 命令的拒绝，危险的`rm`检查无法解析，因此克劳德可以用简单的语法重新发送无害的命令，而不是放弃"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved resuming very long sessions: a transcript read that ends early is now retried once, so messages are lost less often", "中文内容": "改进了恢复非常长的会话：提前结束的转录读取现在会重试一次，因此消息丢失的频率会降低"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved subagent answers that hit the output token limit twice: they now more often come back whole or say up front that they are partial", "中文内容": "改进的子代理答案两次达到输出令牌限制：它们现在更经常完整地返回或预先声明它们是部分的"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved long replies on unrecognized models: a reply cut at 32,000 output tokens now continues with a limit of 128,000", "中文内容": "改进了对无法识别模型的长回复：回复削减为 32,000 个输出令牌，现在继续限制为 128,000 个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the reminder about a completed subagent after compaction: if Claude can't read the agent's output file, it is now told to ask the agent with `SendMessage`", "中文内容": "改进了压缩后有关已完成子代理的提醒：如果 Claude 无法读取代理的输出文件，现在会被告知使用`SendMessage`询问代理"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the warning shown when an API key and an Anthropic profile are both set: it now says which one is in use and how to switch to the profile", "中文内容": "改进了同时设置 API 密钥和 Anthropic 配置文件时显示的警告：它现在显示正在使用哪一个以及如何切换到配置文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved `/plugin`: the question before removing a marketplace now says that its plugins' settings and saved data are deleted, and a marketplace's page no longer shows another marketplace's error", "中文内容": "改进了`/plugin`：删除市场之前的问题现在表明其插件的设置和保存的数据已被删除，并且市场的页面不再显示另一个市场的错误"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "Windows: Improved start-up time with no Git Bash and no `pwsh` on PATH by checking PowerShell's standard install locations at once; System32's `powershell.exe` now wins over one earlier on PATH", "中文内容": "Windows：通过立即检查 PowerShell 的标准安装位置，改进了在 PATH 上没有 Git Bash 和`pwsh`的情况下的启动时间； System32 的`powershell.exe`现在在 PATH 上胜过早期的一个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved startup time on Windows when PATH points to Git for Windows' bin folder, by starting git.exe directly instead of through its launcher", "中文内容": "当 PATH 指向 Git for Windows 的 bin 文件夹时，通过直接启动 git.exe 而不是通过其启动器，改进了 Windows 上的启动时间"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "Windows: Improved PowerShell tool speed by up to about half a second per command", "中文内容": "Windows：将每个命令的 PowerShell 工具速度提高约半秒"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved how soon the Bash tool's diff of changed files is ready in auto and bypass permissions modes", "中文内容": "改进了 Bash 工具的更改文件差异在自动和绕过权限模式下准备就绪的速度"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved speed of the Bash permission check on very deeply nested missing paths on macOS and Linux, and of secret masking on very long text with a URL", "中文内容": "提高了对 macOS 和 Linux 上非常深层嵌套的缺失路径进行 Bash 权限检查的速度，以及对带有 URL 的超长文本进行秘密屏蔽的速度"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved transcript search to find text in edits and written files", "中文内容": "改进了转录搜索以查找编辑和书面文件中的文本"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved speed of reading large PNG images, and the quality of the JPEG sent in their place", "中文内容": "提高了读取大型 PNG 图像的速度以及代替其发送的 JPEG 的质量"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the Artifact tool to read an uploaded file by the address the artifact's page shows; other forms still fail, most with a message that says to read uploads one per call, by id", "中文内容": "改进了 Artifact 工具，可以通过 Artifact 页面显示的地址读取上传的文件；其他表单仍然失败，大多数都会显示一条消息，提示每次调用时按 ID 读取上传一个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the Artifact tool to ignore `prompt`, `limit` and `label` on some calls that do not use them instead of failing the call", "中文内容": "改进了 Artifact 工具，以忽略某些不使用`prompt`、`limit`和`label`的调用，而不是使调用失败"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved MCP server pages in `/mcp`: local, remote and agent servers share one layout, menus end in Back, and actions are no longer numbered outside screen reader mode; use the arrow keys and Enter", "中文内容": "改进了`/mcp`中的 MCP 服务器页面：本地、远程和代理服务器共享一个布局，菜单以“后退”结尾，操作在屏幕阅读器模式之外不再编号；使用箭头键和 Enter"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved narrow terminals: `/status`, forms and detail screens lay out better, `/model` and `/effort` fit at about 40 columns, and key hints such as `←/→ to adjust` stay", "中文内容": "改进的窄终端：`/status`、表单和详细信息屏幕布局更好，`/model`和`/effort`适合大约 40 列，并且保留“←/→ 调整”等关键提示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved `/install-github-app`: the repository, secret and API key steps use the standard list and keys, with shorter messages, a spinner and clearer errors", "中文内容": "改进了`/install-github-app`：存储库、秘密和 API 密钥步骤使用标准列表和密钥，消息更短，旋转器和更清晰的错误"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved `/desktop`: the download question is a standard list instead of y/n", "中文内容": "改进了`/desktop`：下载问题是标准列表，而不是 y/n"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `ExitWorktree` to ask before removing a worktree that may hold unsaved work; refused in don't-ask mode or with nobody to answer, unless an allow rule, auto or bypass permissions mode allows it", "中文内容": "将`ExitWorktree`更改为在删除可能保存未保存工作的工作树之前进行询问；在“不询问”模式或无人应答的情况下被拒绝，除非允许规则、自动或绕过权限模式允许"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `claude mcp add --scope project` to stop, instead of overwriting the file, when `.mcp.json` lists its servers at the top level with no `mcpServers` key", "中文内容": "当`.mcp.json`在顶层列出其服务器而没有`mcpServers`键时，将`claude mcp add --scope project`更改为停止，而不是覆盖文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the arrow keys on most permission prompts to stop at No instead of wrapping around; a number past the last answer moves to No", "中文内容": "将大多数权限提示上的箭头键更改为在“否”处停止而不是环绕；最后一个答案后面的数字移至“否”"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed path checks to refuse some symbolic links", "中文内容": "更改了路径检查以拒绝某些符号链接"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed what counts as inside a working directory, so some paths now ask for permission", "中文内容": "更改了工作目录内的内容，因此某些路径现在需要许可"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `permissions.blockReadsOutsideWorkingDirectories` to ask about more Bash commands in bypass and auto modes, and to deny some in auto mode", "中文内容": "更改了`permissions.blockReadsOutsideWorkingDirectories`以在旁路和自动模式下询问更多 Bash 命令，并在自动模式下拒绝一些命令"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `permissions.blockReadsOutsideWorkingDirectories` to refuse more Bash commands that name a path under a Read or Edit deny rule, where it used to ask", "中文内容": "更改了`permissions.blockReadsOutsideWorkingDirectories`以拒绝更多在读取或编辑拒绝规则下命名路径的 Bash 命令，它过去会询问"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed auto mode's notice about falling back to billed classifier requests to say that an upcoming release removes the fallback; each action it would have checked will be asked about or denied", "中文内容": "更改了自动模式关于回退到计费分类器请求的通知，表示即将发布的版本将删除回退；它要检查的每个操作都会被询问或拒绝"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed auto mode to ignore more allow rules that run any package, like `Bash(pnpm dlx *)`, and path or version forms of ones it already ignored (`/usr/bin/npm run:*`); the safety check decides those", "中文内容": "更改了自动模式以忽略运行任何包的更多允许规则，例如`Bash(pnpm dlx *)`，以及已忽略的路径或版本形式(`/usr/bin/npm run:*`)；安全检查决定那些"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `/sandbox` and most `/config` value lists to be unnumbered outside screen reader mode; use the arrow keys and Enter", "中文内容": "将`/sandbox`和大多数`/config`值列表更改为在屏幕阅读器模式之外无编号；使用箭头键和 Enter"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Bash commands whose variables expand to very long text to be denied, with a message that says to use shorter values or a file", "中文内容": "更改了变量扩展为很长文本的 Bash 命令被拒绝，并显示一条消息，提示使用较短的值或文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the PowerShell tool to ask before one more command, even under a rule naming it; if nothing answers, it's refused unless a whole-tool rule, auto mode or bypass permissions mode allows it", "中文内容": "更改了 PowerShell 工具，使其在另一个命令之前询问，即使是在命名它的规则下；如果没有任何答案，则会被拒绝，除非整体工具规则、自动模式或绕过权限模式允许"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed a subagent resumed by a sibling's message to follow the session's permission settings; it may now ask, or be refused where nobody can answer", "中文内容": "更改了由兄弟消息恢复的子代理以遵循会话的权限设置；它现在可能会询问，或者在无人能回答的情况下被拒绝"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `--worktree` with a relative `--add-dir` beside the launch folder to give the Bash sandbox that folder, not one beside the worktree", "中文内容": "将启动文件夹旁边的`--worktree`更改为相对的`--add-dir`，为 Bash 沙箱提供该文件夹，而不是工作树旁边的文件夹"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed some `--worktree` starts with a relative `--add-dir` above the launch folder, such as `..`, to give the Bash sandbox, and a `--bg` session, only the worktree", "中文内容": "更改了一些在启动文件夹上方以相对的`--add-dir`开头的`--worktree`，例如`..`，以提供 Bash 沙箱和`--bg`会话，仅提供工作树"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Claude in Chrome to refuse uploading some credential files; attach those to the page yourself", "中文内容": "更改Chrome中的Claude拒绝上传某些凭证文件；自己将它们附加到页面上"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed artifact approval in organizations that require it for each new artifact: an artifact that only a plugin created or allowed can be refused", "中文内容": "更改了组织中需要每个新工件的工件批准：只有插件创建或允许的工件才能被拒绝"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed sessions with nobody to ask to refuse a new artifact at once, with no permission prompt, in organizations that require approval of each one", "中文内容": "在需要批准每个工件的组织中，更改了没有人要求立即拒绝新工件的会话，没有权限提示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the Artifact tool to refuse calls once settings turn Artifacts off, in sessions already running too", "中文内容": "更改了 Artifact 工具，一旦设置关闭 Artifacts，即在已经运行的会话中拒绝呼叫"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the Artifact publish prompt to stop offering \"don't ask again\" in subagents and after a background task result, someone else's message or a compaction", "中文内容": "更改了 Artifact 发布提示，以停止在子代理中以及在后台任务结果、其他人的消息或压缩之后提供“不再询问”"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `claude plugin eval` to keep its deny rules over a plugin's permission hook, and to flag calls the hook let through", "中文内容": "更改了`claude plugin eval`以保留其对插件权限挂钩的拒绝规则，并标记挂钩允许通过的调用"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed MCP server logs to record the mode, action, and field names of elicitation requests and hook answers, not their full contents", "中文内容": "更改了 MCP 服务器日志以记录诱导请求和挂钩答案的模式、操作和字段名称，而不是其完整内容"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed most prompts to ignore answers other than Esc for a moment after resuming with `fg`", "中文内容": "更改了大多数提示，以在使用`fg`恢复后暂时忽略除 Esc 之外的答案"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Code Mode to no longer refuse to start when an installed mod hooks tool calls; an administrator can still keep Code Mode off in managed settings", "中文内容": "更改了代码模式，当已安装的 mod hooks 工具调用时不再拒绝启动；管理员仍然可以在托管设置中关闭代码模式"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed subagents launched without a model to stay on the model they started on when resumed, including after `/model`", "中文内容": "更改了在没有模型的情况下启动的子代理，使其保持在恢复时启动的模型上，包括在`/model`之后"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the first subagent on a model to wait up to 1.5 seconds (10 in `claude -p`) for that model's settings from Anthropic, instead of starting without them", "中文内容": "将模型上的第一个子代理更改为等待 1.5 秒（在`claude -p`中为 10 秒）以获取来自 Anthropic 的模型设置，而不是在没有它们的情况下启动"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed restarted background subagents, and turns that start by themselves, to wait for plugins to load", "中文内容": "更改了重新启动的后台子代理，并自行启动以等待插件加载"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed prompt history to leave out most launch prompts of sessions that another Claude Code session started, such as `claude --bg` run by Claude", "中文内容": "更改了提示历史记录，以忽略另一个 Claude Code 会话启动的会话的大多数启动提示，例如 Claude 运行的`claude --bg`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed subagent progress summaries in terminal sessions on Amazon Bedrock, Google Vertex AI and Microsoft Foundry to be written from short notes, not the whole conversation, using far fewer tokens", "中文内容": "将 Amazon Bedrock、Google Vertex AI 和 Microsoft Foundry 上的终端会话中的子代理进度摘要更改为从简短笔记编写，而不是整个对话，使用更少的令牌"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed non-interactive (`-p`) mode to run fewer git commands before the first request", "中文内容": "更改了非交互式（`-p`）模式以在第一个请求之前运行更少的 git 命令"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed first-run setup to skip terminal setup in remote VS Code, Cursor and Devin Desktop sessions, where it cannot change settings", "中文内容": "更改了首次运行设置以跳过远程 VS Code、Cursor 和 Devin Desktop 会话中的终端设置，在这些会话中无法更改设置"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed fullscreen text selection to leave out the glyph of system, thinking and inbound message lines", "中文内容": "更改了全屏文本选择以省略系统、思考和入站消息行的字形"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Anthropic-hosted cloud sessions to ignore more of a repository's flag and plugin delivery settings; its `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` now acts at most as `DISABLE_TELEMETRY`", "中文内容": "更改了 Anthropic 托管的云会话，以忽略更多存储库的标志和插件交付设置；它的`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC`现在最多充当`DISABLE_TELEMETRY`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Added \"Claude Code: Add to Chat\" to the Explorer's right-click menu, which @-mentions the selected files and folders in the chat", "中文内容": "[VSCode] 在资源管理器的右键菜单中添加了“Claude Code：添加到聊天”，该菜单@-提及聊天中选定的文件和文件夹"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed the permission prompt not showing the reason that a PreToolUse hook gives when it asks for confirmation (anthropics/claude-code#85950)", "中文内容": "[VSCode] 修复了权限提示未显示 PreToolUse 挂钩在要求确认时给出的原因的问题 (anthropics/claude-code#85950)"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed long tool and file names being cut off in a permission prompt's title", "中文内容": "[VSCode] 修复了权限提示标题中长工具和文件名被截断的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed a terminal session's diff showing the previous proposed edit after you typed in it and Claude edited the same file again", "中文内容": "[VSCode] 修复了终端会话的差异，在您输入内容后显示先前建议的编辑，并且 Claude 再次编辑了同一文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed Escape also stopping Claude's response when it closes the feedback or \"Build a custom style\" dialog, the @-mention menu, the model, mode or \"+\" menu, or another popup", "中文内容": "[VSCode] 修复了 Escape 在关闭反馈或“构建自定义样式”对话框、@-提及菜单、模型、模式或“+”菜单或其他弹出窗口时也会停止 Claude 的响应"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Improved speed when Claude makes several edits in a row: queued edits share one wait for new problems; a problem may be reported with a later edit", "中文内容": "[VSCode] 改进了 Claude 连续进行多次编辑时的速度：排队的编辑共享一个等待新问题；稍后编辑可能会报告问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Improved @-mention file search speed in large workspaces when `rg` is on your `PATH`; results now rank much as in the terminal, with less tolerance for typos", "中文内容": "[VSCode] 当`rg`位于`PATH`上时，提高了大型工作区中 @-mention 文件的搜索速度；结果现在的排名与终端中的排名相同，对拼写错误的容忍度较低"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Improved startup: the model picker is ready at once in folders opened for the first time, empty windows and worktrees, except on third-party providers", "中文内容": "[VSCode] 改进了启动：模型选择器在首次打开的文件夹、空窗口和工作树中立即准备就绪，第三方提供商除外"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Changed a chat edit's diff to stay open and keep asking for approval when a terminal session in the same window sends a prompt", "中文内容": "[VSCode] 更改了聊天编辑的差异以保持打开状态，并在同一窗口中的终端会话发送提示时继续请求批准"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Removed unused tools from the IDE connection (openFile, saveDocument, getOpenEditors and related)", "中文内容": "[VSCode] 从 IDE 连接中删除了未使用的工具（openFile、saveDocument、getOpenEditors 及相关）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added support for turning on Code Mode while agent teams are enabled; if you already turned it on, sessions with teams on now start in Code Mode", "中文内容": "添加了在启用代理团队时打开代码模式的支持；如果您已经打开它，则与团队的会话现在以代码模式开始"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a startup warning when an `--allowedTools`, `--disallowedTools` or `--tools` value has an entry that doesn't look like a complete rule", "中文内容": "添加了当`--allowedTools`、`--disallowedTools`或`--tools`值具有看起来不像完整规则的条目时的启动警告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a message explaining why MCP servers stop loading when an administrator adds `managed-mcp.json` during a session", "中文内容": "添加了一条消息，解释了当管理员在会话期间添加“management-mcp.json”时，为什么 MCP 服务器停止加载"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a row to `/status` that says when your provider or an environment variable such as `DISABLE_TELEMETRY` turns features off", "中文内容": "在`/status`中添加了一行，指示您的提供程序或环境变量（例如`DISABLE_TELEMETRY`）何时关闭功能"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a note in `/plugin` and `claude plugin list` when a malformed `plugin.json` field such as `author` or `homepage` is ignored", "中文内容": "当忽略格式错误的`plugin.json`字段（例如`author`或`homepage`）时，在`/plugin`和“claude插件列表”中添加了注释"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added Ctrl+O to show hidden startup notices", "中文内容": "添加 Ctrl+O 显示隐藏的启动通知"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a hint in the empty prompt that says what to do after a request fails", "中文内容": "在空提示中添加了提示，说明请求失败后该怎么做"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added an `esc to stop` footer hint in a subagent's view where Esc would stop it", "中文内容": "在子代理的视图中添加了`esc to stop`页脚提示，Esc 将在其中停止它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added `OTEL_RESOURCE_INCLUDE_HOST` to include `host.name` and `host.id` in OpenTelemetry resource attributes (off by default)", "中文内容": "添加了`OTEL_RESOURCE_INCLUDE_HOST`以在 OpenTelemetry 资源属性中包含`host.name`和`host.id`（默认情况下关闭）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added `overflowX=\"scroll\"` on a mod's `Box`, and `maxLines` and `wrap=\"clip\"` on its `Text`", "中文内容": "在 mod 的 `Box` 上添加了 `overflowX=\"scroll\"`，在其 `Text` 上添加了 `maxLines` 和 `wrap=\"clip\"`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `cp` of a file being refused when only its source was covered by an `Edit` deny rule", "中文内容": "修复了当“编辑”拒绝规则仅覆盖文件源时文件的`cp`被拒绝的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Bash commands that delete or overwrite files (`find -delete`, `cat a > b`, `sort -o`) being summed up in the transcript as a search or a read", "中文内容": "修复了删除或覆盖文件的 Bash 命令（`find -delete`、`cat a > b`、`sort -o`）在记录中总结为搜索或读取"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a misleading \"Dangerous rm operation\" warning in the Bash permission prompt on some commands with no rm that Claude Code can't read reliably", "中文内容": "修复了某些没有 rm 的命令的 Bash 权限提示中出现误导性的“危险 rm 操作”警告，导致 Claude Code 无法可靠地读取"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed background sessions losing the LLM gateway your shell exported after a crash, after a reopen from another folder, or when the background service lacks it: they now stop before any model request", "中文内容": "修复了后台会话在崩溃后、从另一个文件夹重新打开后或后台服务缺少时丢失 shell 导出的 LLM 网关的问题：它们现在在任何模型请求之前停止"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the background service ending your own processes, such as an SSH login, when a process number on its list had been reused by another user's process", "中文内容": "修复了当列表中的进程号已被其他用户的进程重用时后台服务会结束您自己的进程（例如 SSH 登录）的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed rules added in `/permissions` or at a main-conversation tool prompt, and `/add-dir` folders, looking saved when the settings file couldn't be written; the terminal now warns and names it", "中文内容": "修复了在`/permissions`或主对话工具提示以及`/add-dir`文件夹中添加的规则，在无法写入设置文件时看起来已保存；终端现在发出警告并为其命名"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a failed MCP `headersHelper`, or one not run in an untrusted folder, making other sessions start without that server, for most servers with no stored OAuth refresh token", "中文内容": "修复了失败的 MCP`headersHelper`，或者未在不受信任的文件夹中运行，导致其他会话在没有该服务器的情况下启动（对于大多数没有存储 OAuth 刷新令牌的服务器）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed managed settings with certain key names stopping Claude Code from starting or affecting other managed files", "中文内容": "修复了某些键名称的托管设置，阻止克劳德代码启动或影响其他托管文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed settings files with values nested thousands of levels deep crashing Claude Code or applying only some of the time; values past 64 levels are now dropped with a warning", "中文内容": "修复了设置文件，其值嵌套了数千层，导致克劳德代码崩溃或仅在某些时候应用；现在，超过 64 个级别的值将被丢弃并发出警告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a settings file saved with an error mid-session being skipped silently; a warning now names the file", "中文内容": "修复了保存的设置文件在会话中出现错误而被静默跳过的问题；现在会出现警告命名文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the subagent model set in managed settings not applying in Claude Desktop's Code tab; it now overrides your own, as in a terminal, unless those settings also pick a provider or gateway", "中文内容": "修复了托管设置中设置的子代理模型不适用于 Claude Desktop 的“代码”选项卡；它现在会覆盖您自己的设置，就像在终端中一样，除非这些设置也选择了提供商或网关"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed sandboxed commands failing to start on Linux when the home or config directory is reached through a symlink into `/net` and sandbox settings deny reads of it", "中文内容": "修复了当通过`/net`符号链接到达主目录或配置目录且沙箱设置拒绝读取它时，沙箱命令无法在 Linux 上启动的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed empty placeholder files, including `.git/config.lock`, sometimes being left in the project on Linux when Claude Code was stopped during a sandboxed command", "中文内容": "修复了空占位符文件，包括`.git/config.lock`，当 Claude Code 在沙盒命令期间停止时，有时会留在 Linux 上的项目中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Up then Enter answering Yes at the folder trust prompt shown under an already trusted parent folder", "中文内容": "已修复，然后在已信任的父文件夹下显示的文件夹信任提示中输入回答“是”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an extra Enter at the end of setup accepting the offer to make auto mode the default", "中文内容": "修复了安装结束时额外的 Enter 接受将自动模式设置为默认模式的提议"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a message typed over the startup auto mode offer being lost, and its Enter accepting the offer", "中文内容": "修复了在启动自动模式优惠中输入的消息丢失，并且其 Enter 接受该优惠"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a note typed on a permission prompt being sent to Claude after Tab had hidden it", "中文内容": "修复了在 Tab 隐藏权限提示后将其发送给 Claude 时输入的注释"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed PreToolUse hooks in managed settings leaving no OpenTelemetry `tool_decision` event or `permission_denials` entry when they refused a direct tool call", "中文内容": "修复了托管设置中的 PreToolUse 挂钩，当它们拒绝直接工具调用时，不会留下 OpenTelemetry `tool_decision` 事件或 `permission_denials` 条目"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed letters typed over `/sandbox` or a delete question in `/permissions` moving the selection", "中文内容": "修复了在`/sandbox`上输入的字母或`/permissions`中移动选择的删除问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed resumed sessions losing recent turns after a crash when the previous turn ended with an empty reply", "中文内容": "修复了当上一回合以空回复结束时，恢复的会话在崩溃后丢失最近回合的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed resumed sessions losing earlier conversation history when Claude Code ran low on memory", "中文内容": "修复了当 Claude Code 内存不足时恢复的会话丢失早期对话历史记录的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a re-sent file overwriting Claude's changed copy in Remote Control and cloud sessions on Linux with no feature flags loaded: the copy moves to a `.kept-` folder, or the new file isn't saved", "中文内容": "修复了重新发送的文件会覆盖 Linux 上的远程控制和云会话中克劳德更改的副本，且未加载任何功能标志：副本移动到`.kept-`文件夹，或者未保存新文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a background session being killed and its request lost when you opened, stopped or removed the older session whose conversation it had resumed", "中文内容": "修复了当您打开、停止或删除已恢复对话的旧会话时后台会话被终止及其请求丢失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude purge` hiding its prompts when stdout is redirected, where one unseen Enter could delete a project's data; they now show on the terminal", "中文内容": "修复了`claude purge`在标准输出重定向时隐藏其提示的问题，其中一个看不见的 Enter 可能会删除项目的数据；他们现在显示在终端上"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the spend limit menu removing the monthly limit without asking when Backspace and Enter were pressed as it opened", "中文内容": "修复了支出限制菜单，删除了每月限制，而不询问何时在打开时按下 Backspace 和 Enter"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/rewind` restoring only some files after running `/branch` twice while a slow backup copy was still running", "中文内容": "修复了运行`/branch`两次而慢速备份副本仍在运行时`/rewind`仅恢复某些文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/rewind` saying \"No code changes\" when a shell command changed files it can't restore; a turn whose changes weren't tracked now reads \"Code changes unknown\"", "中文内容": "修复了当 shell 命令更改了无法恢复的文件时`/rewind`显示“无代码更改”的问题；未跟踪更改的回合现在显示为“代码更改未知”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/rewind`: Esc now cancels its summary, its list shows more than one past prompt in fullscreen, and a long prompt no longer hides its warning about losing later file changes", "中文内容": "修复了`/rewind`：Esc 现在取消其摘要，其列表在全屏中显示多个过去的提示，并且长提示不再隐藏有关丢失后续文件更改的警告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Ctrl+C or Ctrl+D twice in `/skills` quitting Claude Code and dropping changes; it now saves and closes the panel", "中文内容": "修复了在`/skills`中按 Ctrl+C 或 Ctrl+D 两次退出 Claude Code 并删除更改的问题；现在保存并关闭面板"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the usage limit menu erasing your draft and opening while you were typing", "中文内容": "修复了使用限制菜单在您打字时擦除草稿并打开的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed pasted text and images being dropped when ↑ recalls a draft cleared with Esc Esc", "中文内容": "修复了当 ↑ 调用 Esc Esc 清除的草稿时粘贴的文本和图像被丢弃的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an edited typed answer to Claude's question sending the old text when you moved on without pressing Enter", "中文内容": "修复了克劳德问题的编辑键入答案，当您继续前进而不按 Enter 键时发送旧文本"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed going back to a question you answered from its list putting the cursor on the first option, where Enter replaced your answer", "中文内容": "修复了返回到您从列表中回答的问题时将光标放在第一个选项上，其中 Enter 替换了您的答案"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/feedback` and `/bug` sending the report when you typed a space on the confirmation screen, and losing the typed report after Ctrl+O or Ctrl+Z", "中文内容": "修复了当您在确认屏幕上键入空格时发送报告的`/feedback`和`/bug`，以及在 Ctrl+O 或 Ctrl+Z 后丢失键入的报告的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a prompt typed after `--add-dir`, `--allowedTools` or another list option being dropped without a message", "中文内容": "修复了在`--add-dir`、`--allowedTools`或其他列表选项被删除后没有消息的情况下键入的提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/plan <description>` ignoring the description when plan mode was already on", "中文内容": "修复了`/plan <description>`在计划模式已开启时忽略描述的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed valid PDFs being dropped from the conversation after the API rejected a different PDF read in the same batch", "中文内容": "修复了 API 拒绝同一批次中的不同 PDF 读取后有效 PDF 从对话中删除的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a session ending after a single failed memory allocation while drawing the screen", "中文内容": "修复了绘制屏幕时一次内存分配失败后会话结束的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed compaction on Bedrock, Vertex and Foundry, and with telemetry turned off, sometimes replying to one of your messages instead of summarizing, or leaving Claude's last reply out of the summary", "中文内容": "修复了基岩、顶点和铸造厂上的压缩，并且在遥测关闭的情况下，有时会回复您的一条消息而不是总结，或者将克劳德的最后回复排除在摘要之外"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed image-heavy sessions on Vertex AI getting stuck on a 400 error about the request size exceeding a 30 MB limit, instead of compacting and retrying", "中文内容": "修复了 Vertex AI 上的大量图像会话陷入有关请求大小超过 30 MB 限制的 400 错误的问题，而不是压缩并重试"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an error when `max_tokens` exceeded the model's limit: Claude Code now retries the request with the maximum the Anthropic API reports", "中文内容": "修复了`max_tokens`超出模型限制时的错误：Claude Code 现在使用 Anthropic API 报告的最大值重试请求"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `grep` in the Bash tool silently skipping some text files", "中文内容": "修复了 Bash 工具中的`grep`默默地跳过一些文本文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a crashed Node or Python hook showing only the first line of its stack trace; the error is now shown, and Ctrl+O shows up to 10,000 characters of the output", "中文内容": "修复了崩溃的 Node 或 Python 挂钩，仅显示其堆栈跟踪的第一行；现在会显示错误，并且 Ctrl+O 显示最多 10,000 个字符的输出"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/goal clear` or a new `/goal` not sticking when typed while Stop hooks were running and background work was still in progress", "中文内容": "修复了“/goalclear”或新的`/goal`在停止钩子正在运行且后台工作仍在进行中时键入时不粘住的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the automatic session recap being sent after a reply billed to usage credits; `/recap` still works", "中文内容": "修复了在按使用积分计费的回复后发送的自动会话回顾； `/recap` 仍然有效"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed auto mode staying on its local classifier, which counts toward usage, because of a stale saved value, such as one from an older Claude Code", "中文内容": "修复了自动模式停留在其本地分类器上的问题，该分类器会计入使用量，因为保存的值已过时，例如来自较旧的克劳德代码的值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"Sign in with your Console account\" in `/login` replacing your Claude subscription login when the browser sign-in used your Claude plan instead of a Console organization", "中文内容": "修复了当浏览器登录使用您的 Claude 计划而不是控制台组织时，`/login`中的“使用您的控制台帐户登录”替换您的 Claude 订阅登录信息"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/login` ending on \"Login successful\" while an approved `ANTHROPIC_API_KEY` was still used; it now says requests still use the key", "中文内容": "修复了`/login`以“登录成功”结尾，但仍使用经批准的`ANTHROPIC_API_KEY`；现在它说请求仍然使用密钥"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"Not logged in\" staying after turning on the API key in `/config`; \"Not logged in\", `/login` and `/status` now name an unused `ANTHROPIC_API_KEY`", "中文内容": "修复了在`/config`中打开API密钥后“未登录”的问题； “未登录”、`/login`和`/status`现在命名未使用的`ANTHROPIC_API_KEY`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude auth logout` leaving credentials behind, and token refresh failing, when only a Console profile's credentials are on a drive that rejects folder timestamps", "中文内容": "修复了当只有控制台配置文件的凭据位于拒绝文件夹时间戳的驱动器上时，`claude auth logout`留下凭据以及令牌刷新失败的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a past conversation resumed from agent view being sent on the background service's sign-in when the service doesn't have the terminal's API key or token", "中文内容": "修复了当服务没有终端的 API 密钥或令牌时，在后台服务登录时发送的从代理视图恢复的过去对话"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed model requests failing on a one-off authentication error (401) in Claude Desktop's Code tab: they are now sent once more first", "中文内容": "修复了 Claude Desktop 的“代码”选项卡中的一次性身份验证错误 (401) 导致模型请求失败的问题：现在首先再次发送它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `forceLoginOrgUUID` and `forceRemoteSettingsRefresh` startup errors telling you to sign in again when a network block page (HTTP 403) was the cause", "中文内容": "修复了`forceLoginOrgUUID`和`forceRemoteSettingsRefresh`启动错误，当网络阻止页面 (HTTP 403) 导致时告诉您重新登录"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude auth login` not showing a pasted sign-in code, so a wrong paste couldn't be seen or corrected before Enter", "中文内容": "修复了`claude auth login`不显示粘贴的登录代码，因此在 Enter 之前无法看到或更正错误的粘贴"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/login` and `claude setup-token` showing nothing after you submit a pasted code; they now show \"Finishing sign-in…\"", "中文内容": "修复了提交粘贴代码后`/login`和`claude setup-token`不显示任何内容的问题；他们现在显示“正在完成登录...”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc doing nothing while the first-run sign-in waits for the browser or a pasted code; it now goes back one screen", "中文内容": "修复了首次运行登录等待浏览器或粘贴代码时 Esc 不执行任何操作的问题；现在返回一个屏幕"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/logout` in fullscreen mode exiting without leaving the logged-out message on screen", "中文内容": "修复了全屏模式下`/logout`退出时不会在屏幕上留下注销消息的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the shell prompt being drawn over the last screen after quitting with Ctrl+C or Ctrl+D at a sign-in or first-run step", "中文内容": "修复了在登录或首次运行步骤中使用 Ctrl+C 或 Ctrl+D 退出后在最后一个屏幕上绘制的 shell 提示符"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Ctrl+C twice doing nothing on the first-run theme choice, and freezing the terminal on setup screens or a background session at its startup question", "中文内容": "修复了 Ctrl+C 两次在首次运行主题选择时不执行任何操作，并在启动问题时冻结设置屏幕或后台会话上的终端"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed your OFF answer to the updated terms being replaced when keys were typed while it was saving, at startup and in `/privacy-settings`", "中文内容": "修复了您在保存时、启动时和“/隐私设置”中键入密钥时对更新条款被替换的关闭答案的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/privacy-settings` toggle sometimes saving the opposite of what the screen showed on a quick double press, changing your setting on keys pressed after Esc, and not saying when a save failed", "中文内容": "修复了`/privacy-settings`切换有时会保存与快速双击时屏幕显示的内容相反的内容，更改 Esc 后按下的按键的设置，并且不会说明保存失败的情况"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/privacy-settings` saving your choice on the wrong account after signing in to a different account in another terminal", "中文内容": "修复了在另一个终端登录不同帐户后`/privacy-settings`将您的选择保存在错误的帐户上的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/privacy-settings` saying \"set to true\" when you picked OFF right after ON", "中文内容": "修复了当您在打开后立即选择关闭时`/privacy-settings`显示“设置为 true”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed skills and slash commands failing to load in Code Mode under auto mode when an inline `!` command needs approval; Claude is now asked to run it", "中文内容": "修复了当内联`!`命令需要批准时，技能和斜线命令在自动模式下无法在代码模式下加载的问题；克劳德现在被要求运行它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed background subagents started in Code Mode failing when they preload a skill with an inline `!` command", "中文内容": "修复了在代码模式下启动的后台子代理在使用内联`!`命令预加载技能时失败的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed mods being unable to use Bash, Read and other tools through `$.tool.call` and `$.tool.check` in Code Mode", "中文内容": "修复了 mods 无法在代码模式下通过 `$.tool.call` 和 `$.tool.check` 使用 Bash、Read 和其他工具的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed parallel MCP tool calls reading another call's saved result when two long results arrived in the same millisecond (anthropics/claude-code#105138)", "中文内容": "修复了当两个长结果在同一毫秒内到达时并行 MCP 工具调用读取另一个调用保存的结果的问题 (anthropics/claude-code#105138)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed tool search sometimes loading another MCP server's tool when asked for a tool by its exact name; you may be asked again for that tool", "中文内容": "修复了工具搜索有时会在按确切名称询问工具时加载另一个 MCP 服务器的工具；系统可能会再次要求您提供该工具"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "F
