": "修复", "内容": "Fixed in-process agent teammates on a different model from the lead compacting at the lead's context limit and on the wrong model; they now use their own limit and model, at that model's rate", "中文内容": "修复了进程内代理队友在与线索上下文限制不同的模型上以及错误的模型上进行压缩的问题；他们现在使用自己的极限和模型，以该模型的速率"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a finished subagent resuming on the model and effort of a sibling subagent that messaged it", "中文内容": "修复了已完成的子代理在模型上的恢复以及向其发送消息的同级子代理的工作量"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the main conversation not being told a background agent had finished when the subagent that started it ended by itself without reading the result, outside auto mode", "中文内容": "修复了当启动主对话的子代理在没有读取结果的情况下自行结束（在自动模式之外）时，主对话不会被告知后台代理已完成的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude reporting a background agent as still running when it had waited 30 seconds or more on a permission prompt in the desktop app, on the web and in the SDK", "中文内容": "修复了 Claude 在桌面应用程序、Web 和 SDK 中出现权限提示后等待 30 秒或更长时间后报告后台代理仍在运行的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude not being told in auto mode when a background agent's reply to a follow-up message was dropped, and reduced repeat wake-ups there from agents waiting on background commands", "中文内容": "修复了当后台代理对后续消息的回复被删除时，克劳德在自动模式下不会被告知的问题，并减少了等待后台命令的代理的重复唤醒"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the desktop app, Claude Code on the web and VS Code showing a raw task notification as a subagent's prompt after its background task woke it", "中文内容": "修复了桌面应用程序、Web 上的 Claude Code 和 VS Code 在后台任务唤醒子代理后将原始任务通知显示为子代理的提示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed messages sent from another session with \"later\" priority joining the running turn, instead of waiting for it to end, in Remote Control and Claude Desktop sessions", "中文内容": "修复了在远程控制和 Claude 桌面会话中从另一个具有“稍后”优先级的会话发送的消息，加入正在运行的回合，而不是等待其结束"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed messages to cloud and Remote Control sessions being reported as failed with a stale address after a timeout or rate limit; Claude now says when a message may have arrived", "中文内容": "修复了在超时或速率限制后发送到云和远程控制会话的消息被报告为失败且地址过时的问题；克劳德现在说消息何时可能到达"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed cloud sessions giving no error when a `UserPromptSubmit` hook blocks a message sent while Claude works", "中文内容": "修复了当`UserPromptSubmit`挂钩阻止克劳德工作时发送的消息时，云会话不会出现错误的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed failing hooks showing nothing: SubagentStop in background agents, SessionEnd at `/clear` and `/resume`, and CwdChanged and FileChanged in fullscreen", "中文内容": "修复了不显示任何内容的失败挂钩：后台代理中的 SubagentStop、`/clear`和`/resume`处的 SessionEnd，以及全屏中的 CwdChanged 和 FileChanged"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a Stop hook that failed to run being shown as having reported a problem", "中文内容": "修复了无法运行的 Stop 挂钩显示为已报告问题的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed focus view keeping a finished reply hidden while a Stop hook was running", "中文内容": "固定焦点视图在 Stop 挂钩运行时隐藏已完成的回复"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude getting a long managed PostToolUse hook output twice when a mod added context to the tool call", "中文内容": "修复了当 mod 将上下文添加到工具调用时，Claude 两次获得长期托管的 PostToolUse 挂钩输出"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/model` listing the wrong models in some terminal sessions when a project's `.claude/settings.json` sets `ANTHROPIC_BASE_URL` to an LLM gateway", "中文内容": "修复了当项目的`.claude/settings.json`将`ANTHROPIC_BASE_URL`设置为 LLM 网关时，`/model`在某些终端会话中列出错误的模型"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/statusline` writing to `~/.claude/settings.json` when `CLAUDE_CONFIG_DIR` points to another folder", "中文内容": "修复了当`CLAUDE_CONFIG_DIR`指向另一个文件夹时`/statusline`写入`~/.claude/settings.json`的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `claudeMdExcludes` patterns on Windows not matching a path whose drive letter is written in the other case", "中文内容": "修复了 Windows 上的`claudeMdExcludes`模式与在其他情况下写入的驱动器号的路径不匹配的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `claude agents` and `claude rm` refusing to remove a fully pushed session (\"The worktree has unpushed commits\") when its worktree has a file or folder named `HEAD` at the top level", "中文内容": "修复了当工作树顶层有一个名为`HEAD`的文件或文件夹时，“claude Agents”和`claude rm`拒绝删除完全推送的会话（“工作树有未推送的提交”）"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed long ListAgents results hiding most sessions on accounts with many cloud or Remote Control sessions: long lists now come in pages", "中文内容": "修复了长 ListAgents 结果隐藏具有许多云或远程控制会话的帐户上的大多数会话的问题：长列表现在出现在页面中"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed slow turns in resumed sessions for organizations with tens of thousands of connector tool permissions", "中文内容": "修复了具有数万个连接器工具权限的组织恢复会话缓慢的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "Self-hosted runner: Fixed `claude -p` started by a session's script or hook waiting out rate limits, because it inherited the session's own retry setting", "中文内容": "自托管运行器：修复了由会话脚本或挂钩等待速率限制启动的`claude -p`，因为它继承了会话自己的重试设置"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the spend limit menu reporting a changed limit when the server refused it", "中文内容": "修复了支出限制菜单在服务器拒绝时报告更改的限制"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a second `x` on a task's details in `/tasks` stopping the next task too", "中文内容": "修复了`/tasks`中任务详细信息上的第二个`x`，也会停止下一个任务"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Esc being ignored on a permission prompt that had just appeared", "中文内容": "修复了刚刚出现的权限提示时 Esc 被忽略的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed lists that load their rows late sometimes ignoring Enter and the arrow keys", "中文内容": "修复了延迟加载行的列表有时会忽略 Enter 和箭头键的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/autofix-pr` holding the keyboard after Esc while it stopped the cloud session; the dialog now closes at once, and a stop that fails is reported afterwards with a link", "中文内容": "修复了`/autofix-pr`在停止云会话时在 Esc 后按住键盘的问题；该对话框现在立即关闭，随后会通过链接报告失败的停止"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a blank screen and stray mouse codes in the shell after quitting with ctrl+c just after ← opens the agents view", "中文内容": "修复了在 ← 打开代理视图后使用 ctrl+c 退出后 shell 中的空白屏幕和流浪鼠标代码"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Ctrl+C right after the trust question leaving the terminal in fullscreen", "中文内容": "修复了信任问题后 Ctrl+C 使终端全屏显示的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the shell flashing on screen when ← opens the agents view in fullscreen mode", "中文内容": "修复了当 ← 在全屏模式下打开代理视图时 shell 在屏幕上闪烁的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed terminal display faults: most scrambled scrollback in Ghostty on resize, link addresses hidden in Windows Terminal under old tmux and in VTE 0.50.0, and no selection highlight with 16 colors", "中文内容": "修复了终端显示故障：调整大小时 Ghostty 中最混乱的回滚、旧 tmux 和 VTE 0.50.0 下的 Windows 终端中隐藏的链接地址，以及没有 16 种颜色的选择突出显示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed some garbled rows in tmux with `allow-passthrough` on inside kitty, Ghostty or iTerm2", "中文内容": "修复了 tmux 中的一些乱码行，其中包含 kitty、Ghostty 或 iTerm2 上的`allow-passthrough`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/mcp` saying no servers were configured after one was added during a session or declined; it now says what to do", "中文内容": "修复了`/mcp`表示在会话期间添加或拒绝服务器后未配置服务器的问题；它现在说要做什么"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/hooks` leaving out hooks given by `--settings`", "中文内容": "修复了`/hooks`遗漏了`--settings`给出的钩子的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the `/` menu listing a row for each skill of the same name, though every row ran the first", "中文内容": "修复了`/`菜单，为同名的每个技能列出一行，尽管每行都运行第一个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/teleport` showing no message when the chosen session failed to resume", "中文内容": "修复了当所选会话无法恢复时`/teleport`不显示消息的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed n and N in transcript search skipping matches", "中文内容": "修复了成绩单搜索中的 n 和 N 跳过匹配的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed cancelling a transcript search (ctrl+o, then /) in a long session landing far from where the search started", "中文内容": "修复了在远离搜索开始位置的长会话中取消转录搜索（ctrl+o，然后 /）的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed up and down losing the cursor's column over a short or blank line", "中文内容": "修复了在短行或空行上上下丢失光标的列的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Tab in shell mode filling in a file name after `&&`, `;` or `|`, where a command goes", "中文内容": "修复了 shell 模式下的 Tab 在命令所在位置`&&`、`;`或`|`后填写文件名的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the selected session leaving the screen in `claude --resume` and `/resume` when branch names or folder paths are long", "中文内容": "修复了当分支名称或文件夹路径很长时，所选会话在`claude --resume`和`/resume`中留下屏幕的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the MCP tool list in `/mcp` and `/plugin` losing your place when going back from a tool", "中文内容": "修复了`/mcp`和`/plugin`中的 MCP 工具列表在从工具返回时丢失位置的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/resume` listing one session fewer than the window has room for, and a 'Resend your message' hint after most spend caps, where resending can't help", "中文内容": "修复了`/resume`列出的会话数少于窗口空间的问题，以及在大多数支出上限后出现“重新发送消息”提示（在这种情况下重新发送无济于事）"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed an MCP server's long question being cut off after one row, text fields hiding long pastes with no sign, and a doubled divider line in `/plugin`'s options and `/login`'s Bedrock and Vertex steps", "中文内容": "修复了 MCP 服务器的长问题在一行后被切断、文本字段隐藏没有符号的长粘贴以及`/plugin`选项和`/login`的基岩和顶点步骤中的双分隔线"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed the \"+N lines\" count being too high for command output with links or colors, and the transcript's `?` help hiding how to exit in a short window", "中文内容": "修复了“+N 行”计数对于带有链接或颜色的命令输出来说过高的问题，并且记录的“？”有助于隐藏如何在短窗口中退出"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Ctrl+C twice not closing `/chrome` from its browser list", "中文内容": "修复了 Ctrl+C 两次未从浏览器列表中关闭`/chrome`的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed a number and Enter typed too early at an agent's plan approval in screen reader mode causing the next number to be dropped too", "中文内容": "修复了在屏幕阅读器模式下在代理计划批准时过早输入数字和 Enter 导致下一个数字也被删除的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed Claude trying to read design system token files that do not exist when starting a deck or design", "中文内容": "修复了克劳德在启动套牌或设计时尝试读取不存在的设计系统令牌文件的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed exit not saying that a worktree was kept", "中文内容": "修复了退出时没有说保留工作树的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/hooks` help naming input fields that do not exist", "中文内容": "修复了`/hooks`帮助命名不存在的输入字段"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed question dialogs naming ctrl+g after the external editor key was rebound", "中文内容": "修复了外部编辑器按键反弹后命名 ctrl+g 的问题对话框"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed two sign-in error messages that pointed to the Claude subscription option on computers where `forceLoginMethod` is set to `console`", "中文内容": "修复了两条登录错误消息，这些消息指向`forceLoginMethod`设置为`console`的计算机上的 Claude 订阅选项"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Fixed `/config` saying the dialog was dismissed instead of \"Set theme to …\" after changing the theme", "中文内容": "修复了`/config`在更改主题后说对话框被关闭而不是“将主题设置为...”的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "修复", "内容": "Bug fixes and reliability improvements", "中文内容": "错误修复和可靠性改进"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the speed of a session's first Bash command: shell start-up files may now run before it's approved, even if it's refused; set `CLAUDE_CODE_DISABLE_SHELL_HEAD_START=1` to turn this off", "中文内容": "提高了会话第一个 Bash 命令的速度：shell 启动文件现在可以在批准之前运行，即使它被拒绝；设置 `CLAUDE_CODE_DISABLE_SHELL_HEAD_START=1` 将其关闭"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved commits on newer models and in PowerShell: Claude is now told not to commit files that likely contain secrets", "中文内容": "改进了新模型和 PowerShell 中的提交：Claude 现在被告知不要提交可能包含机密的文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved sandboxed shell commands: Claude now sees when a command exempt from the sandbox stayed in it because its permission check relied on the sandbox", "中文内容": "改进的沙盒 shell 命令：克劳德现在可以看到不受沙盒约束的命令何时保留在其中，因为其权限检查依赖于沙盒"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the refusal for shell commands with no `rm` that the dangerous `rm` check can't parse, so Claude can resend harmless ones in plain syntax instead of giving up", "中文内容": "改进了对没有`rm`的 shell 命令的拒绝，危险的`rm`检查无法解析，因此克劳德可以用简单的语法重新发送无害的命令，而不是放弃"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved resuming very long sessions: a transcript read that ends early is now retried once, so messages are lost less often", "中文内容": "改进了恢复非常长的会话：提前结束的转录读取现在会重试一次，因此消息丢失的频率会降低"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved subagent answers that hit the output token limit twice: they now more often come back whole or say up front that they are partial", "中文内容": "改进的子代理答案两次达到输出令牌限制：它们现在更经常完整地返回或预先声明它们是部分的"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved long replies on unrecognized models: a reply cut at 32,000 output tokens now continues with a limit of 128,000", "中文内容": "改进了对无法识别模型的长回复：回复削减为 32,000 个输出令牌，现在继续限制为 128,000 个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the reminder about a completed subagent after compaction: if Claude can't read the agent's output file, it is now told to ask the agent with `SendMessage`", "中文内容": "改进了压缩后有关已完成子代理的提醒：如果 Claude 无法读取代理的输出文件，现在会被告知使用`SendMessage`询问代理"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the warning shown when an API key and an Anthropic profile are both set: it now says which one is in use and how to switch to the profile", "中文内容": "改进了同时设置 API 密钥和 Anthropic 配置文件时显示的警告：它现在显示正在使用哪一个以及如何切换到配置文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved `/plugin`: the question before removing a marketplace now says that its plugins' settings and saved data are deleted, and a marketplace's page no longer shows another marketplace's error", "中文内容": "改进了`/plugin`：删除市场之前的问题现在表明其插件的设置和保存的数据已被删除，并且市场的页面不再显示另一个市场的错误"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "Windows: Improved start-up time with no Git Bash and no `pwsh` on PATH by checking PowerShell's standard install locations at once; System32's `powershell.exe` now wins over one earlier on PATH", "中文内容": "Windows：通过立即检查 PowerShell 的标准安装位置，改进了在 PATH 上没有 Git Bash 和`pwsh`的情况下的启动时间； System32 的`powershell.exe`现在在 PATH 上胜过早期的一个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved startup time on Windows when PATH points to Git for Windows' bin folder, by starting git.exe directly instead of through its launcher", "中文内容": "当 PATH 指向 Git for Windows 的 bin 文件夹时，通过直接启动 git.exe 而不是通过其启动器，改进了 Windows 上的启动时间"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "Windows: Improved PowerShell tool speed by up to about half a second per command", "中文内容": "Windows：将每个命令的 PowerShell 工具速度提高约半秒"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved how soon the Bash tool's diff of changed files is ready in auto and bypass permissions modes", "中文内容": "改进了 Bash 工具的更改文件差异在自动和绕过权限模式下准备就绪的速度"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved speed of the Bash permission check on very deeply nested missing paths on macOS and Linux, and of secret masking on very long text with a URL", "中文内容": "提高了对 macOS 和 Linux 上非常深层嵌套的缺失路径进行 Bash 权限检查的速度，以及对带有 URL 的超长文本进行秘密屏蔽的速度"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved transcript search to find text in edits and written files", "中文内容": "改进了转录搜索以查找编辑和书面文件中的文本"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved speed of reading large PNG images, and the quality of the JPEG sent in their place", "中文内容": "提高了读取大型 PNG 图像的速度以及代替其发送的 JPEG 的质量"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the Artifact tool to read an uploaded file by the address the artifact's page shows; other forms still fail, most with a message that says to read uploads one per call, by id", "中文内容": "改进了 Artifact 工具，可以通过 Artifact 页面显示的地址读取上传的文件；其他表单仍然失败，大多数都会显示一条消息，提示每次调用时按 ID 读取上传一个"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved the Artifact tool to ignore `prompt`, `limit` and `label` on some calls that do not use them instead of failing the call", "中文内容": "改进了 Artifact 工具，以忽略某些不使用`prompt`、`limit`和`label`的调用，而不是使调用失败"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved MCP server pages in `/mcp`: local, remote and agent servers share one layout, menus end in Back, and actions are no longer numbered outside screen reader mode; use the arrow keys and Enter", "中文内容": "改进了`/mcp`中的 MCP 服务器页面：本地、远程和代理服务器共享一个布局，菜单以“后退”结尾，操作在屏幕阅读器模式之外不再编号；使用箭头键和 Enter"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved narrow terminals: `/status`, forms and detail screens lay out better, `/model` and `/effort` fit at about 40 columns, and key hints such as `←/→ to adjust` stay", "中文内容": "改进的窄终端：`/status`、表单和详细信息屏幕布局更好，`/model`和`/effort`适合大约 40 列，并且保留“←/→ 调整”等关键提示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved `/install-github-app`: the repository, secret and API key steps use the standard list and keys, with shorter messages, a spinner and clearer errors", "中文内容": "改进了`/install-github-app`：存储库、秘密和 API 密钥步骤使用标准列表和密钥，消息更短，旋转器和更清晰的错误"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Improved `/desktop`: the download question is a standard list instead of y/n", "中文内容": "改进了`/desktop`：下载问题是标准列表，而不是 y/n"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `ExitWorktree` to ask before removing a worktree that may hold unsaved work; refused in don't-ask mode or with nobody to answer, unless an allow rule, auto or bypass permissions mode allows it", "中文内容": "将`ExitWorktree`更改为在删除可能保存未保存工作的工作树之前进行询问；在“不询问”模式或无人应答的情况下被拒绝，除非允许规则、自动或绕过权限模式允许"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `claude mcp add --scope project` to stop, instead of overwriting the file, when `.mcp.json` lists its servers at the top level with no `mcpServers` key", "中文内容": "当`.mcp.json`在顶层列出其服务器而没有`mcpServers`键时，将`claude mcp add --scope project`更改为停止，而不是覆盖文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the arrow keys on most permission prompts to stop at No instead of wrapping around; a number past the last answer moves to No", "中文内容": "将大多数权限提示上的箭头键更改为在“否”处停止而不是环绕；最后一个答案后面的数字移至“否”"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed path checks to refuse some symbolic links", "中文内容": "更改了路径检查以拒绝某些符号链接"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed what counts as inside a working directory, so some paths now ask for permission", "中文内容": "更改了工作目录内的内容，因此某些路径现在需要许可"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `permissions.blockReadsOutsideWorkingDirectories` to ask about more Bash commands in bypass and auto modes, and to deny some in auto mode", "中文内容": "更改了`permissions.blockReadsOutsideWorkingDirectories`以在旁路和自动模式下询问更多 Bash 命令，并在自动模式下拒绝一些命令"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `permissions.blockReadsOutsideWorkingDirectories` to refuse more Bash commands that name a path under a Read or Edit deny rule, where it used to ask", "中文内容": "更改了`permissions.blockReadsOutsideWorkingDirectories`以拒绝更多在读取或编辑拒绝规则下命名路径的 Bash 命令，它过去会询问"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed auto mode's notice about falling back to billed classifier requests to say that an upcoming release removes the fallback; each action it would have checked will be asked about or denied", "中文内容": "更改了自动模式关于回退到计费分类器请求的通知，表示即将发布的版本将删除回退；它要检查的每个操作都会被询问或拒绝"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed auto mode to ignore more allow rules that run any package, like `Bash(pnpm dlx *)`, and path or version forms of ones it already ignored (`/usr/bin/npm run:*`); the safety check decides those", "中文内容": "更改了自动模式以忽略运行任何包的更多允许规则，例如`Bash(pnpm dlx *)`，以及已忽略的路径或版本形式(`/usr/bin/npm run:*`)；安全检查决定那些"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `/sandbox` and most `/config` value lists to be unnumbered outside screen reader mode; use the arrow keys and Enter", "中文内容": "将`/sandbox`和大多数`/config`值列表更改为在屏幕阅读器模式之外无编号；使用箭头键和 Enter"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Bash commands whose variables expand to very long text to be denied, with a message that says to use shorter values or a file", "中文内容": "更改了变量扩展为很长文本的 Bash 命令被拒绝，并显示一条消息，提示使用较短的值或文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the PowerShell tool to ask before one more command, even under a rule naming it; if nothing answers, it's refused unless a whole-tool rule, auto mode or bypass permissions mode allows it", "中文内容": "更改了 PowerShell 工具，使其在另一个命令之前询问，即使是在命名它的规则下；如果没有任何答案，则会被拒绝，除非整体工具规则、自动模式或绕过权限模式允许"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed a subagent resumed by a sibling's message to follow the session's permission settings; it may now ask, or be refused where nobody can answer", "中文内容": "更改了由兄弟消息恢复的子代理以遵循会话的权限设置；它现在可能会询问，或者在无人能回答的情况下被拒绝"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `--worktree` with a relative `--add-dir` beside the launch folder to give the Bash sandbox that folder, not one beside the worktree", "中文内容": "将启动文件夹旁边的`--worktree`更改为相对的`--add-dir`，为 Bash 沙箱提供该文件夹，而不是工作树旁边的文件夹"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed some `--worktree` starts with a relative `--add-dir` above the launch folder, such as `..`, to give the Bash sandbox, and a `--bg` session, only the worktree", "中文内容": "更改了一些在启动文件夹上方以相对的`--add-dir`开头的`--worktree`，例如`..`，以提供 Bash 沙箱和`--bg`会话，仅提供工作树"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Claude in Chrome to refuse uploading some credential files; attach those to the page yourself", "中文内容": "更改Chrome中的Claude拒绝上传某些凭证文件；自己将它们附加到页面上"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed artifact approval in organizations that require it for each new artifact: an artifact that only a plugin created or allowed can be refused", "中文内容": "更改了组织中需要每个新工件的工件批准：只有插件创建或允许的工件才能被拒绝"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed sessions with nobody to ask to refuse a new artifact at once, with no permission prompt, in organizations that require approval of each one", "中文内容": "在需要批准每个工件的组织中，更改了没有人要求立即拒绝新工件的会话，没有权限提示"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the Artifact tool to refuse calls once settings turn Artifacts off, in sessions already running too", "中文内容": "更改了 Artifact 工具，一旦设置关闭 Artifacts，即在已经运行的会话中拒绝呼叫"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the Artifact publish prompt to stop offering \"don't ask again\" in subagents and after a background task result, someone else's message or a compaction", "中文内容": "更改了 Artifact 发布提示，以停止在子代理中以及在后台任务结果、其他人的消息或压缩之后提供“不再询问”"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed `claude plugin eval` to keep its deny rules over a plugin's permission hook, and to flag calls the hook let through", "中文内容": "更改了`claude plugin eval`以保留其对插件权限挂钩的拒绝规则，并标记挂钩允许通过的调用"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed MCP server logs to record the mode, action, and field names of elicitation requests and hook answers, not their full contents", "中文内容": "更改了 MCP 服务器日志以记录诱导请求和挂钩答案的模式、操作和字段名称，而不是其完整内容"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed most prompts to ignore answers other than Esc for a moment after resuming with `fg`", "中文内容": "更改了大多数提示，以在使用`fg`恢复后暂时忽略除 Esc 之外的答案"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Code Mode to no longer refuse to start when an installed mod hooks tool calls; an administrator can still keep Code Mode off in managed settings", "中文内容": "更改了代码模式，当已安装的 mod hooks 工具调用时不再拒绝启动；管理员仍然可以在托管设置中关闭代码模式"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed subagents launched without a model to stay on the model they started on when resumed, including after `/model`", "中文内容": "更改了在没有模型的情况下启动的子代理，使其保持在恢复时启动的模型上，包括在`/model`之后"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed the first subagent on a model to wait up to 1.5 seconds (10 in `claude -p`) for that model's settings from Anthropic, instead of starting without them", "中文内容": "将模型上的第一个子代理更改为等待 1.5 秒（在`claude -p`中为 10 秒）以获取来自 Anthropic 的模型设置，而不是在没有它们的情况下启动"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed restarted background subagents, and turns that start by themselves, to wait for plugins to load", "中文内容": "更改了重新启动的后台子代理，并自行启动以等待插件加载"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed prompt history to leave out most launch prompts of sessions that another Claude Code session started, such as `claude --bg` run by Claude", "中文内容": "更改了提示历史记录，以忽略另一个 Claude Code 会话启动的会话的大多数启动提示，例如 Claude 运行的`claude --bg`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed subagent progress summaries in terminal sessions on Amazon Bedrock, Google Vertex AI and Microsoft Foundry to be written from short notes, not the whole conversation, using far fewer tokens", "中文内容": "将 Amazon Bedrock、Google Vertex AI 和 Microsoft Foundry 上的终端会话中的子代理进度摘要更改为从简短笔记编写，而不是整个对话，使用更少的令牌"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed non-interactive (`-p`) mode to run fewer git commands before the first request", "中文内容": "更改了非交互式（`-p`）模式以在第一个请求之前运行更少的 git 命令"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed first-run setup to skip terminal setup in remote VS Code, Cursor and Devin Desktop sessions, where it cannot change settings", "中文内容": "更改了首次运行设置以跳过远程 VS Code、Cursor 和 Devin Desktop 会话中的终端设置，在这些会话中无法更改设置"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed fullscreen text selection to leave out the glyph of system, thinking and inbound message lines", "中文内容": "更改了全屏文本选择以省略系统、思考和入站消息行的字形"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "改进", "内容": "Changed Anthropic-hosted cloud sessions to ignore more of a repository's flag and plugin delivery settings; its `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` now acts at most as `DISABLE_TELEMETRY`", "中文内容": "更改了 Anthropic 托管的云会话，以忽略更多存储库的标志和插件交付设置；它的`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC`现在最多充当`DISABLE_TELEMETRY`"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Added \"Claude Code: Add to Chat\" to the Explorer's right-click menu, which @-mentions the selected files and folders in the chat", "中文内容": "[VSCode] 在资源管理器的右键菜单中添加了“Claude Code：添加到聊天”，该菜单@-提及聊天中选定的文件和文件夹"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed the permission prompt not showing the reason that a PreToolUse hook gives when it asks for confirmation (anthropics/claude-code#85950)", "中文内容": "[VSCode] 修复了权限提示未显示 PreToolUse 挂钩在要求确认时给出的原因的问题 (anthropics/claude-code#85950)"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed long tool and file names being cut off in a permission prompt's title", "中文内容": "[VSCode] 修复了权限提示标题中长工具和文件名被截断的问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed a terminal session's diff showing the previous proposed edit after you typed in it and Claude edited the same file again", "中文内容": "[VSCode] 修复了终端会话的差异，在您输入内容后显示先前建议的编辑，并且 Claude 再次编辑了同一文件"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Fixed Escape also stopping Claude's response when it closes the feedback or \"Build a custom style\" dialog, the @-mention menu, the model, mode or \"+\" menu, or another popup", "中文内容": "[VSCode] 修复了 Escape 在关闭反馈或“构建自定义样式”对话框、@-提及菜单、模型、模式或“+”菜单或其他弹出窗口时也会停止 Claude 的响应"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Improved speed when Claude makes several edits in a row: queued edits share one wait for new problems; a problem may be reported with a later edit", "中文内容": "[VSCode] 改进了 Claude 连续进行多次编辑时的速度：排队的编辑共享一个等待新问题；稍后编辑可能会报告问题"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Improved @-mention file search speed in large workspaces when `rg` is on your `PATH`; results now rank much as in the terminal, with less tolerance for typos", "中文内容": "[VSCode] 当`rg`位于`PATH`上时，提高了大型工作区中 @-mention 文件的搜索速度；结果现在的排名与终端中的排名相同，对拼写错误的容忍度较低"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Improved startup: the model picker is ready at once in folders opened for the first time, empty windows and worktrees, except on third-party providers", "中文内容": "[VSCode] 改进了启动：模型选择器在首次打开的文件夹、空窗口和工作树中立即准备就绪，第三方提供商除外"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Changed a chat edit's diff to stay open and keep asking for approval when a terminal session in the same window sends a prompt", "中文内容": "[VSCode] 更改了聊天编辑的差异以保持打开状态，并在同一窗口中的终端会话发送提示时继续请求批准"}, {"日期": "2026-11-17", "版本": "2.1.327", "类型": "其他", "内容": "[VSCode] Removed unused tools from the IDE connection (openFile, saveDocument, getOpenEditors and related)", "中文内容": "[VSCode] 从 IDE 连接中删除了未使用的工具（openFile、saveDocument、getOpenEditors 及相关）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added support for turning on Code Mode while agent teams are enabled; if you already turned it on, sessions with teams on now start in Code Mode", "中文内容": "添加了在启用代理团队时打开代码模式的支持；如果您已经打开它，则与团队的会话现在以代码模式开始"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a startup warning when an `--allowedTools`, `--disallowedTools` or `--tools` value has an entry that doesn't look like a complete rule", "中文内容": "添加了当`--allowedTools`、`--disallowedTools`或`--tools`值具有看起来不像完整规则的条目时的启动警告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a message explaining why MCP servers stop loading when an administrator adds `managed-mcp.json` during a session", "中文内容": "添加了一条消息，解释了当管理员在会话期间添加“management-mcp.json”时，为什么 MCP 服务器停止加载"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a row to `/status` that says when your provider or an environment variable such as `DISABLE_TELEMETRY` turns features off", "中文内容": "在`/status`中添加了一行，指示您的提供程序或环境变量（例如`DISABLE_TELEMETRY`）何时关闭功能"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a note in `/plugin` and `claude plugin list` when a malformed `plugin.json` field such as `author` or `homepage` is ignored", "中文内容": "当忽略格式错误的`plugin.json`字段（例如`author`或`homepage`）时，在`/plugin`和“claude插件列表”中添加了注释"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added Ctrl+O to show hidden startup notices", "中文内容": "添加 Ctrl+O 显示隐藏的启动通知"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added a hint in the empty prompt that says what to do after a request fails", "中文内容": "在空提示中添加了提示，说明请求失败后该怎么做"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added an `esc to stop` footer hint in a subagent's view where Esc would stop it", "中文内容": "在子代理的视图中添加了`esc to stop`页脚提示，Esc 将在其中停止它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added `OTEL_RESOURCE_INCLUDE_HOST` to include `host.name` and `host.id` in OpenTelemetry resource attributes (off by default)", "中文内容": "添加了`OTEL_RESOURCE_INCLUDE_HOST`以在 OpenTelemetry 资源属性中包含`host.name`和`host.id`（默认情况下关闭）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "新增", "内容": "Added `overflowX=\"scroll\"` on a mod's `Box`, and `maxLines` and `wrap=\"clip\"` on its `Text`", "中文内容": "在 mod 的 `Box` 上添加了 `overflowX=\"scroll\"`，在其 `Text` 上添加了 `maxLines` 和 `wrap=\"clip\"`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `cp` of a file being refused when only its source was covered by an `Edit` deny rule", "中文内容": "修复了当“编辑”拒绝规则仅覆盖文件源时文件的`cp`被拒绝的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Bash commands that delete or overwrite files (`find -delete`, `cat a > b`, `sort -o`) being summed up in the transcript as a search or a read", "中文内容": "修复了删除或覆盖文件的 Bash 命令（`find -delete`、`cat a > b`、`sort -o`）在记录中总结为搜索或读取"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a misleading \"Dangerous rm operation\" warning in the Bash permission prompt on some commands with no rm that Claude Code can't read reliably", "中文内容": "修复了某些没有 rm 的命令的 Bash 权限提示中出现误导性的“危险 rm 操作”警告，导致 Claude Code 无法可靠地读取"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed background sessions losing the LLM gateway your shell exported after a crash, after a reopen from another folder, or when the background service lacks it: they now stop before any model request", "中文内容": "修复了后台会话在崩溃后、从另一个文件夹重新打开后或后台服务缺少时丢失 shell 导出的 LLM 网关的问题：它们现在在任何模型请求之前停止"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the background service ending your own processes, such as an SSH login, when a process number on its list had been reused by another user's process", "中文内容": "修复了当列表中的进程号已被其他用户的进程重用时后台服务会结束您自己的进程（例如 SSH 登录）的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed rules added in `/permissions` or at a main-conversation tool prompt, and `/add-dir` folders, looking saved when the settings file couldn't be written; the terminal now warns and names it", "中文内容": "修复了在`/permissions`或主对话工具提示以及`/add-dir`文件夹中添加的规则，在无法写入设置文件时看起来已保存；终端现在发出警告并为其命名"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a failed MCP `headersHelper`, or one not run in an untrusted folder, making other sessions start without that server, for most servers with no stored OAuth refresh token", "中文内容": "修复了失败的 MCP`headersHelper`，或者未在不受信任的文件夹中运行，导致其他会话在没有该服务器的情况下启动（对于大多数没有存储 OAuth 刷新令牌的服务器）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed managed settings with certain key names stopping Claude Code from starting or affecting other managed files", "中文内容": "修复了某些键名称的托管设置，阻止克劳德代码启动或影响其他托管文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed settings files with values nested thousands of levels deep crashing Claude Code or applying only some of the time; values past 64 levels are now dropped with a warning", "中文内容": "修复了设置文件，其值嵌套了数千层，导致克劳德代码崩溃或仅在某些时候应用；现在，超过 64 个级别的值将被丢弃并发出警告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a settings file saved with an error mid-session being skipped silently; a warning now names the file", "中文内容": "修复了保存的设置文件在会话中出现错误而被静默跳过的问题；现在会出现警告命名文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the subagent model set in managed settings not applying in Claude Desktop's Code tab; it now overrides your own, as in a terminal, unless those settings also pick a provider or gateway", "中文内容": "修复了托管设置中设置的子代理模型不适用于 Claude Desktop 的“代码”选项卡；它现在会覆盖您自己的设置，就像在终端中一样，除非这些设置也选择了提供商或网关"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed sandboxed commands failing to start on Linux when the home or config directory is reached through a symlink into `/net` and sandbox settings deny reads of it", "中文内容": "修复了当通过`/net`符号链接到达主目录或配置目录且沙箱设置拒绝读取它时，沙箱命令无法在 Linux 上启动的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed empty placeholder files, including `.git/config.lock`, sometimes being left in the project on Linux when Claude Code was stopped during a sandboxed command", "中文内容": "修复了空占位符文件，包括`.git/config.lock`，当 Claude Code 在沙盒命令期间停止时，有时会留在 Linux 上的项目中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Up then Enter answering Yes at the folder trust prompt shown under an already trusted parent folder", "中文内容": "已修复，然后在已信任的父文件夹下显示的文件夹信任提示中输入回答“是”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an extra Enter at the end of setup accepting the offer to make auto mode the default", "中文内容": "修复了安装结束时额外的 Enter 接受将自动模式设置为默认模式的提议"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a message typed over the startup auto mode offer being lost, and its Enter accepting the offer", "中文内容": "修复了在启动自动模式优惠中输入的消息丢失，并且其 Enter 接受该优惠"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a note typed on a permission prompt being sent to Claude after Tab had hidden it", "中文内容": "修复了在 Tab 隐藏权限提示后将其发送给 Claude 时输入的注释"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed PreToolUse hooks in managed settings leaving no OpenTelemetry `tool_decision` event or `permission_denials` entry when they refused a direct tool call", "中文内容": "修复了托管设置中的 PreToolUse 挂钩，当它们拒绝直接工具调用时，不会留下 OpenTelemetry `tool_decision` 事件或 `permission_denials` 条目"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed letters typed over `/sandbox` or a delete question in `/permissions` moving the selection", "中文内容": "修复了在`/sandbox`上输入的字母或`/permissions`中移动选择的删除问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed resumed sessions losing recent turns after a crash when the previous turn ended with an empty reply", "中文内容": "修复了当上一回合以空回复结束时，恢复的会话在崩溃后丢失最近回合的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed resumed sessions losing earlier conversation history when Claude Code ran low on memory", "中文内容": "修复了当 Claude Code 内存不足时恢复的会话丢失早期对话历史记录的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a re-sent file overwriting Claude's changed copy in Remote Control and cloud sessions on Linux with no feature flags loaded: the copy moves to a `.kept-` folder, or the new file isn't saved", "中文内容": "修复了重新发送的文件会覆盖 Linux 上的远程控制和云会话中克劳德更改的副本，且未加载任何功能标志：副本移动到`.kept-`文件夹，或者未保存新文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a background session being killed and its request lost when you opened, stopped or removed the older session whose conversation it had resumed", "中文内容": "修复了当您打开、停止或删除已恢复对话的旧会话时后台会话被终止及其请求丢失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude purge` hiding its prompts when stdout is redirected, where one unseen Enter could delete a project's data; they now show on the terminal", "中文内容": "修复了`claude purge`在标准输出重定向时隐藏其提示的问题，其中一个看不见的 Enter 可能会删除项目的数据；他们现在显示在终端上"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the spend limit menu removing the monthly limit without asking when Backspace and Enter were pressed as it opened", "中文内容": "修复了支出限制菜单，删除了每月限制，而不询问何时在打开时按下 Backspace 和 Enter"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/rewind` restoring only some files after running `/branch` twice while a slow backup copy was still running", "中文内容": "修复了运行`/branch`两次而慢速备份副本仍在运行时`/rewind`仅恢复某些文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/rewind` saying \"No code changes\" when a shell command changed files it can't restore; a turn whose changes weren't tracked now reads \"Code changes unknown\"", "中文内容": "修复了当 shell 命令更改了无法恢复的文件时`/rewind`显示“无代码更改”的问题；未跟踪更改的回合现在显示为“代码更改未知”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/rewind`: Esc now cancels its summary, its list shows more than one past prompt in fullscreen, and a long prompt no longer hides its warning about losing later file changes", "中文内容": "修复了`/rewind`：Esc 现在取消其摘要，其列表在全屏中显示多个过去的提示，并且长提示不再隐藏有关丢失后续文件更改的警告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Ctrl+C or Ctrl+D twice in `/skills` quitting Claude Code and dropping changes; it now saves and closes the panel", "中文内容": "修复了在`/skills`中按 Ctrl+C 或 Ctrl+D 两次退出 Claude Code 并删除更改的问题；现在保存并关闭面板"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the usage limit menu erasing your draft and opening while you were typing", "中文内容": "修复了使用限制菜单在您打字时擦除草稿并打开的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed pasted text and images being dropped when ↑ recalls a draft cleared with Esc Esc", "中文内容": "修复了当 ↑ 调用 Esc Esc 清除的草稿时粘贴的文本和图像被丢弃的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an edited typed answer to Claude's question sending the old text when you moved on without pressing Enter", "中文内容": "修复了克劳德问题的编辑键入答案，当您继续前进而不按 Enter 键时发送旧文本"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed going back to a question you answered from its list putting the cursor on the first option, where Enter replaced your answer", "中文内容": "修复了返回到您从列表中回答的问题时将光标放在第一个选项上，其中 Enter 替换了您的答案"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/feedback` and `/bug` sending the report when you typed a space on the confirmation screen, and losing the typed report after Ctrl+O or Ctrl+Z", "中文内容": "修复了当您在确认屏幕上键入空格时发送报告的`/feedback`和`/bug`，以及在 Ctrl+O 或 Ctrl+Z 后丢失键入的报告的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a prompt typed after `--add-dir`, `--allowedTools` or another list option being dropped without a message", "中文内容": "修复了在`--add-dir`、`--allowedTools`或其他列表选项被删除后没有消息的情况下键入的提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/plan <description>` ignoring the description when plan mode was already on", "中文内容": "修复了`/plan <description>`在计划模式已开启时忽略描述的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed valid PDFs being dropped from the conversation after the API rejected a different PDF read in the same batch", "中文内容": "修复了 API 拒绝同一批次中的不同 PDF 读取后有效 PDF 从对话中删除的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a session ending after a single failed memory allocation while drawing the screen", "中文内容": "修复了绘制屏幕时一次内存分配失败后会话结束的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed compaction on Bedrock, Vertex and Foundry, and with telemetry turned off, sometimes replying to one of your messages instead of summarizing, or leaving Claude's last reply out of the summary", "中文内容": "修复了基岩、顶点和铸造厂上的压缩，并且在遥测关闭的情况下，有时会回复您的一条消息而不是总结，或者将克劳德的最后回复排除在摘要之外"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed image-heavy sessions on Vertex AI getting stuck on a 400 error about the request size exceeding a 30 MB limit, instead of compacting and retrying", "中文内容": "修复了 Vertex AI 上的大量图像会话陷入有关请求大小超过 30 MB 限制的 400 错误的问题，而不是压缩并重试"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an error when `max_tokens` exceeded the model's limit: Claude Code now retries the request with the maximum the Anthropic API reports", "中文内容": "修复了`max_tokens`超出模型限制时的错误：Claude Code 现在使用 Anthropic API 报告的最大值重试请求"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `grep` in the Bash tool silently skipping some text files", "中文内容": "修复了 Bash 工具中的`grep`默默地跳过一些文本文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a crashed Node or Python hook showing only the first line of its stack trace; the error is now shown, and Ctrl+O shows up to 10,000 characters of the output", "中文内容": "修复了崩溃的 Node 或 Python 挂钩，仅显示其堆栈跟踪的第一行；现在会显示错误，并且 Ctrl+O 显示最多 10,000 个字符的输出"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/goal clear` or a new `/goal` not sticking when typed while Stop hooks were running and background work was still in progress", "中文内容": "修复了“/goalclear”或新的`/goal`在停止钩子正在运行且后台工作仍在进行中时键入时不粘住的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the automatic session recap being sent after a reply billed to usage credits; `/recap` still works", "中文内容": "修复了在按使用积分计费的回复后发送的自动会话回顾； `/recap` 仍然有效"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed auto mode staying on its local classifier, which counts toward usage, because of a stale saved value, such as one from an older Claude Code", "中文内容": "修复了自动模式停留在其本地分类器上的问题，该分类器会计入使用量，因为保存的值已过时，例如来自较旧的克劳德代码的值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"Sign in with your Console account\" in `/login` replacing your Claude subscription login when the browser sign-in used your Claude plan instead of a Console organization", "中文内容": "修复了当浏览器登录使用您的 Claude 计划而不是控制台组织时，`/login`中的“使用您的控制台帐户登录”替换您的 Claude 订阅登录信息"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/login` ending on \"Login successful\" while an approved `ANTHROPIC_API_KEY` was still used; it now says requests still use the key", "中文内容": "修复了`/login`以“登录成功”结尾，但仍使用经批准的`ANTHROPIC_API_KEY`；现在它说请求仍然使用密钥"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"Not logged in\" staying after turning on the API key in `/config`; \"Not logged in\", `/login` and `/status` now name an unused `ANTHROPIC_API_KEY`", "中文内容": "修复了在`/config`中打开API密钥后“未登录”的问题； “未登录”、`/login`和`/status`现在命名未使用的`ANTHROPIC_API_KEY`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude auth logout` leaving credentials behind, and token refresh failing, when only a Console profile's credentials are on a drive that rejects folder timestamps", "中文内容": "修复了当只有控制台配置文件的凭据位于拒绝文件夹时间戳的驱动器上时，`claude auth logout`留下凭据以及令牌刷新失败的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a past conversation resumed from agent view being sent on the background service's sign-in when the service doesn't have the terminal's API key or token", "中文内容": "修复了当服务没有终端的 API 密钥或令牌时，在后台服务登录时发送的从代理视图恢复的过去对话"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed model requests failing on a one-off authentication error (401) in Claude Desktop's Code tab: they are now sent once more first", "中文内容": "修复了 Claude Desktop 的“代码”选项卡中的一次性身份验证错误 (401) 导致模型请求失败的问题：现在首先再次发送它们"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `forceLoginOrgUUID` and `forceRemoteSettingsRefresh` startup errors telling you to sign in again when a network block page (HTTP 403) was the cause", "中文内容": "修复了`forceLoginOrgUUID`和`forceRemoteSettingsRefresh`启动错误，当网络阻止页面 (HTTP 403) 导致时告诉您重新登录"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude auth login` not showing a pasted sign-in code, so a wrong paste couldn't be seen or corrected before Enter", "中文内容": "修复了`claude auth login`不显示粘贴的登录代码，因此在 Enter 之前无法看到或更正错误的粘贴"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/login` and `claude setup-token` showing nothing after you submit a pasted code; they now show \"Finishing sign-in…\"", "中文内容": "修复了提交粘贴代码后`/login`和`claude setup-token`不显示任何内容的问题；他们现在显示“正在完成登录...”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc doing nothing while the first-run sign-in waits for the browser or a pasted code; it now goes back one screen", "中文内容": "修复了首次运行登录等待浏览器或粘贴代码时 Esc 不执行任何操作的问题；现在返回一个屏幕"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/logout` in fullscreen mode exiting without leaving the logged-out message on screen", "中文内容": "修复了全屏模式下`/logout`退出时不会在屏幕上留下注销消息的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the shell prompt being drawn over the last screen after quitting with Ctrl+C or Ctrl+D at a sign-in or first-run step", "中文内容": "修复了在登录或首次运行步骤中使用 Ctrl+C 或 Ctrl+D 退出后在最后一个屏幕上绘制的 shell 提示符"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Ctrl+C twice doing nothing on the first-run theme choice, and freezing the terminal on setup screens or a background session at its startup question", "中文内容": "修复了 Ctrl+C 两次在首次运行主题选择时不执行任何操作，并在启动问题时冻结设置屏幕或后台会话上的终端"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed your OFF answer to the updated terms being replaced when keys were typed while it was saving, at startup and in `/privacy-settings`", "中文内容": "修复了您在保存时、启动时和“/隐私设置”中键入密钥时对更新条款被替换的关闭答案的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/privacy-settings` toggle sometimes saving the opposite of what the screen showed on a quick double press, changing your setting on keys pressed after Esc, and not saying when a save failed", "中文内容": "修复了`/privacy-settings`切换有时会保存与快速双击时屏幕显示的内容相反的内容，更改 Esc 后按下的按键的设置，并且不会说明保存失败的情况"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/privacy-settings` saving your choice on the wrong account after signing in to a different account in another terminal", "中文内容": "修复了在另一个终端登录不同帐户后`/privacy-settings`将您的选择保存在错误的帐户上的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/privacy-settings` saying \"set to true\" when you picked OFF right after ON", "中文内容": "修复了当您在打开后立即选择关闭时`/privacy-settings`显示“设置为 true”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed skills and slash commands failing to load in Code Mode under auto mode when an inline `!` command needs approval; Claude is now asked to run it", "中文内容": "修复了当内联`!`命令需要批准时，技能和斜线命令在自动模式下无法在代码模式下加载的问题；克劳德现在被要求运行它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed background subagents started in Code Mode failing when they preload a skill with an inline `!` command", "中文内容": "修复了在代码模式下启动的后台子代理在使用内联`!`命令预加载技能时失败的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed mods being unable to use Bash, Read and other tools through `$.tool.call` and `$.tool.check` in Code Mode", "中文内容": "修复了 mods 无法在代码模式下通过 `$.tool.call` 和 `$.tool.check` 使用 Bash、Read 和其他工具的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed parallel MCP tool calls reading another call's saved result when two long results arrived in the same millisecond (anthropics/claude-code#105138)", "中文内容": "修复了当两个长结果在同一毫秒内到达时并行 MCP 工具调用读取另一个调用保存的结果的问题 (anthropics/claude-code#105138)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed tool search sometimes loading another MCP server's tool when asked for a tool by its exact name; you may be asked again for that tool", "中文内容": "修复了工具搜索有时会在按确切名称询问工具时加载另一个 MCP 服务器的工具；系统可能会再次要求您提供该工具"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed MCP prompts disappearing when two servers have nearly identical names", "中文内容": "修复了当两个服务器名称几乎相同时 MCP 提示消失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a tool call to an MCP server that an SDK host had just removed reconnecting to it, or reporting that it needs authentication", "中文内容": "修复了对 SDK 主机刚刚删除的 MCP 服务器的工具调用，重新连接到它，或报告它需要身份验证"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude not being told that a remote MCP server's question was declined when the server then failed the tool call", "中文内容": "修复了当服务器工具调用失败时克劳德没有被告知远程 MCP 服务器的问题被拒绝的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed MCP tools with a root `anyOf` or `oneOf` showing Claude only the first branch's form of an argument; text such as `42` can now arrive as a number where another branch takes one", "中文内容": "修复了根`anyOf`或`oneOf`的 MCP 工具，仅显示 Claude 参数的第一个分支形式；诸如`42`之类的文本现在可以作为数字到达，而另一个分支则采用数字"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude not being told when an approved MCP resource tool was unavailable after a cloud session's worker was replaced", "中文内容": "修复了在更换云会话工作人员后，批准的 MCP 资源工具不可用时克劳德没有被告知的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/mcp` not showing why a local (stdio) MCP server failed to start", "中文内容": "修复了`/mcp`未显示本地（stdio）MCP 服务器无法启动的原因"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc doing nothing while an MCP server reconnects: Esc, or Ctrl+C pressed twice, now closes the wait and the reconnect continues in the background", "中文内容": "修复了 MCP 服务器重新连接时 Esc 不执行任何操作的问题：Esc 或按两次 Ctrl+C，现在会关闭等待，重新连接将在后台继续"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Enable in `/mcp` showing no progress for a slow server, and a second Enter disabling it again", "中文内容": "修复了`/mcp`中的“启用”显示慢速服务器没有进度，第二个 Enter 再次禁用它的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude mcp add-json` answering most mistakes with \"Invalid configuration: : Invalid input\"; it now says what to change", "中文内容": "修复了`claude mcp add-json`回答大多数错误“无效配置：：无效输入”的问题；它现在说明要更改什么"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the Ctrl+C hint on a background MCP task's question saying \"cancel\" when the second press leaves the question to answer later", "中文内容": "修复了当第二次按下将问题留待稍后回答时，后台 MCP 任务的问题上的 Ctrl+C 提示显示“取消”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed pressing `c` to copy an MCP sign-in URL leaving a stray `c` in the paste field", "中文内容": "修复了按`c`复制 MCP 登录 URL，在粘贴字段中留下杂散的`c`的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Tab and Shift+Tab not moving between fields in an MCP server's input form, and a required field there keeping its tick after being emptied", "中文内容": "修复了 Tab 和 Shift+Tab 不在 MCP 服务器输入表单中的字段之间移动，以及必填字段在清空后保持勾选状态的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Fixed a session disconnecting mid-reply when the server was briefly unavailable", "中文内容": "远程控制：修复了服务器短暂不可用时会话在回复中断开连接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Fixed the QR code in `/remote-control` being cut off in short terminal windows such as 80×24", "中文内容": "远程控制：修复了`/remote-control`中的二维码在短终端窗口（例如80×24）中被切断的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "其他", "内容": "Remote Control: Fixed terminal sessions showing as idle on your phone while background subagents were still running; Stop on your phone or the web now ends them together with the turn", "中文内容": "远程控制：修复了当后台子代理仍在运行时终端会话在手机上显示为空闲的问题；停止在你的手机或网络上，现在将它们与转弯一起结束"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Remote Control showing a session as running while it waited on a prompt that can only be answered in the terminal, and as idle when turned on while a tool was running", "中文内容": "修复了远程控制在等待只能在终端中应答的提示时显示会话正在运行的问题，以及在工具运行时打开会话时显示为空闲的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a reply in a remote session running again after a restart when Stop had been pressed while Claude Code was restarting", "中文内容": "修复了在 Claude Code 重新启动时按下“停止”时重新启动后再次运行的远程会话中的回复"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Stop in cloud and self-hosted runner sessions sometimes waiting for slow MCP servers to connect before taking effect", "中文内容": "修复了云中的停止和自托管运行器会话有时会等待慢速 MCP 服务器连接才能生效的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed files Claude sends from cloud and Remote Control sessions failing at once when a proxy answers an upload with its own HTTP 502, 504 or 520 to 524; the upload now gets a second try", "中文内容": "修复了当代理使用自己的 HTTP 502、504 或 520 到 524 应答上传时，Claude 从云和远程控制会话发送的文件立即失败的问题；现在可以再次尝试上传"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed claude.ai chats and Cowork tasks sometimes not sending a file after you chose \"Send it\" at the check for secret keys", "中文内容": "修复了在检查密钥时选择“发送”后，claude.ai 聊天和 Cowork 任务有时不发送文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed claude.ai chats and Cowork tasks asking about a plugin file only because it holds a Word, Excel or other zip-type file; such files are now read for secret keys first", "中文内容": "修复了 claude.ai 聊天和 Cowork 任务仅因为插件文件包含 Word、Excel 或其他 zip 类型文件而询问插件文件的问题；现在首先读取此类文件的密钥"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude self-hosted-runner` asking for new tokens nonstop when a refreshed token was already due, such as when the machine's clock runs ahead", "中文内容": "修复了`claude self-hosted-runner`在刷新令牌已到期时不间断地请求新令牌的问题，例如当机器时钟提前运行时"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/autofix-pr` reporting a run as cancelled when its cloud session could not be stopped; it now links the session so you can stop it", "中文内容": "修复了`/autofix-pr`在云会话无法停止时报告运行已取消的问题；它现在链接会话，以便您可以停止它"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/teleport` hiding a session from its list in narrow terminals", "中文内容": "修复了`/teleport`在狭窄终端的列表中隐藏会话的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed artifact publishing refusing files in a background session's temporary folder", "中文内容": "修复了工件发布拒绝后台会话临时文件夹中的文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed subagents whose `disallowedTools` lists `Artifact` still being offered artifact tools in some cloud sessions", "中文内容": "修复了`disallowedTools`列出`Artifact`的子代理在某些云会话中仍提供工件工具的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude calling a just-published artifact private when people with access to its folder can open it", "中文内容": "修复了当有权访问其文件夹的人可以打开刚刚发布的工件时，克劳德将其称为私有的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the terminal not showing an artifact's link after Claude publishes or updates it", "中文内容": "修复了克劳德发布或更新工件后终端不显示工件的链接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the main conversation of a terminal session waiting in silence for a background subagent that another subagent had messaged: it's now told which agent the subagent reports to", "中文内容": "修复了终端会话的主要对话，默默地等待另一个子代理发送消息的后台子代理：现在被告知子代理向哪个代理报告"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed background agents being told you refused their tool call when a session ended by Ctrl+C twice at the exit dialog, or after an interface crash", "中文内容": "修复了在退出对话框中按 Ctrl+C 两次结束会话时或界面崩溃后后台代理被告知您拒绝其工具调用的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Up and Esc moving the main conversation's queued messages into the prompt box of a subagent or teammate you are viewing", "中文内容": "修复了向上和 Esc 将主对话的排队消息移动到您正在查看的子代理或队友的提示框中"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the agent rows under the prompt showing an agent as busy after its turn ended: the row now says what it is waiting on, and `/tasks` names the subagent behind each background command", "中文内容": "修复了提示下的代理行在轮次结束后显示代理忙的问题：该行现在显示正在等待的内容，并且`/tasks`命名每个后台命令后面的子代理"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed stopped and failed agents looking like running ones in the agent rows under the prompt, or showing \"Done\" when run in parallel, and a stopped agent's last command still showing \"Running…\"", "中文内容": "修复了停止和失败的代理看起来像在提示下的代理行中正在运行的代理，或者在并行运行时显示“完成”，并且停止的代理的最后一个命令仍然显示“正在运行...”"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an opened background agent showing a normal spinner while its requests were being retried", "中文内容": "修复了打开的后台代理在重试其请求时显示正常旋转器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"background agents launched\" line stopping at two when Claude starts three or more agents in one reply", "中文内容": "修复了当克劳德在一次回复中启动三个或更多代理时，“启动后台代理”行停止在两个的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed every earlier turn's \"done\" line showing \"1 shell still running\" while a background task ran", "中文内容": "修复了后台任务运行时每个较早回合的“完成”行显示“1 个 shell 仍在运行”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed subagent tool counts in auto mode including the call that delivers the agent's final report", "中文内容": "修复了自动模式下的子代理工具计数，包括提供代理最终报告的调用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the welcome header outside fullscreen mode showing the session's model while viewing a subagent or teammate that runs on a different model", "中文内容": "修复了全屏模式外的欢迎标题在查看在不同模型上运行的子代理或队友时显示会话模型的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed images pasted while viewing a background agent arriving as the text `[Image #1]`", "中文内容": "修复了查看以文本“[图像 #1]”形式到达的后台代理时粘贴的图像"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long background agent and background command results wrapping under the bullet instead of lining up with their text", "中文内容": "修复了长后台代理和后台命令结果包裹在项目符号下方而不是与其文本对齐的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude --worktree` showing nothing while a slow worktree is set up", "中文内容": "修复了设置慢速工作树时`claude --worktree`不显示任何内容的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the worktree exit dialog counting a new folder as one uncommitted file", "中文内容": "修复了工作树退出对话框将新文件夹计为一个未提交文件的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed workflow resume telling Claude every finished agent would be reused after a call failed; Claude is now told how many results were reused and where reuse stopped", "中文内容": "修复了工作流程恢复，告诉克劳德每个完成的代理将在呼叫失败后重新使用；克劳德现在被告知有多少结果被重复使用以及重复使用在哪里停止"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a hang on malformed glob patterns in settings, plugin marketplace entries and Grep file filters", "中文内容": "修复了设置、插件市场条目和 Grep 文件过滤器中格式错误的 glob 模式的挂起"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed plugin and marketplace requests waiting forever when `ALL_PROXY` is the only proxy set and the proxy never answers; they now fail after 25 seconds", "中文内容": "修复了当`ALL_PROXY`是唯一代理集并且代理永远不会应答时插件和市场请求永远等待的问题；他们现在会在 25 秒后失败"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the `/` menu, `/skills` and `/plugin` repeating rows and losing the cursor when two skills or commands in one place share a name", "中文内容": "修复了`/`菜单、`/skills`和`/plugin`重复行并在一个位置的两个技能或命令共享名称时丢失光标的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed search in `/resume`, `/plugin`, `/permissions` and `/config` ignoring IME input, dictation and fast typing", "中文内容": "修复了`/resume`、`/plugin`、`/permissions`和`/config`中的搜索忽略 IME 输入、听写和快速打字的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the cursor disappearing after clearing a search on the `/plugin` Installed tab", "中文内容": "修复了清除`/plugin`已安装选项卡上的搜索后光标消失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a mod's `Text` with `wrap=\"truncate-end\"` losing rows on the terminal when it holds a line feed", "中文内容": "修复了带有 `wrap=\"truncate-end\"` 的 mod 的 `Text` 在保存换行符时在终端上丢失行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/model` showing your saved model as \"Default (recommended)\": Default now names your plan's default model, and choosing it in the terminal switches you back to that default", "中文内容": "修复了`/model`将您保存的模型显示为“默认（推荐）”的问题：默认现在命名您计划的默认模型，并在终端中选择它会将您切换回默认值"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a first skill, command or agent created during a session not being found right away", "中文内容": "修复了无法立即找到会话期间创建的第一个技能、命令或代理的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/clear --help` and other built-in commands running at an idle prompt instead of showing usage; added `/help <command>`", "中文内容": "修复了`/clear --help`和其他内置命令在空闲提示符下运行而不是显示用法的问题；添加了 `/help <命令>`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a half-written reply sitting frozen with no spinner while Claude Code retried after a mid-response server error", "中文内容": "修复了克劳德代码在中间响应服务器错误后重试时，半写回复冻结且没有旋转器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the API retry notice sitting at \"Retrying in 0s\" during the next attempt, now \"retrying…\", and the \"will retry in\" countdown freezing when a reply stalled or with Reduce motion on", "中文内容": "修复了 API 重试通知在下一次尝试期间处于“0 秒内重试”状态，现在“正在重试...”，以及当回复停滞或打开“减少”动作时“将重试”倒计时冻结"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the transcript dropping a few rows, or the prompt jumping up, as a reply started streaming", "中文内容": "修复了当回复开始流式传输时，文字记录会丢失几行，或者提示会跳起的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a line of a long list or code block going missing from scrollback, and text jumping a row, while a response streams", "中文内容": "修复了长列表或代码块中的一行在回滚时丢失，以及文本在响应流时跳跃一行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a long queued message hiding Claude's reply while it streams, and erasing it from scrollback in the classic renderer", "中文内容": "修复了一条长队消息在流式传输时隐藏克劳德的回复，并在经典渲染器中将其从回滚中删除"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed fullscreen text jumping when a reply finishes while you're scrolled up or after answering an Edit or Write prompt, and losing your place or jumping turns when resizing", "中文内容": "修复了当您向上滚动或回答“编辑”或“写入”提示后回复完成时全屏文本跳转，以及在调整大小时丢失位置或跳转的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the fullscreen transcript going blank when searching or jumping far back, and freezing partway through a fast scroll, in long sessions", "中文内容": "修复了在长时间会话中搜索或向后跳转时全屏文字记录变为空白，以及在快速滚动过程中冻结的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the pinned prompt in fullscreen showing an older question while a reply streams, and being copied with the reply when you drag a selection past the top", "中文内容": "修复了全屏固定提示在回复流时显示较旧的问题，以及当您将选择拖过顶部时与回复一起复制的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the screen going blank and dropping keys after picking a model in `/model`, and `/model <alias>` and `/effort <level>` briefly hiding the prompt and dropping letters typed right after", "中文内容": "修复了在`/model`中选择模型后屏幕变黑并丢失按键的问题，以及`/model <alias>`和`/effort <level>`短暂隐藏提示并丢失之后键入的字母"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the screen scrambling after `/tui default` in a long conversation, or when the `tui` setting changed in another window (anthropics/claude-code#94879)", "中文内容": "修复了长时间对话中`/tui default`之后或在另一个窗口中更改`tui`设置时的屏幕乱码 (anthropics/claude-code#94879)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the screen freezing for seconds when showing long newly created files in the permission prompt and the Ctrl+O transcript", "中文内容": "修复了在权限提示和 Ctrl+O 记录中显示长的新创建文件时屏幕冻结几秒钟的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed some very long Bash or PowerShell commands freezing the session for seconds", "中文内容": "修复了一些非常长的 Bash 或 PowerShell 命令将会话冻结几秒钟的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Shift+Enter or Option+Enter pressed right after a paste sending the prompt instead of adding a new line", "中文内容": "修复了粘贴后立即按下 Shift+Enter 或 Option+Enter 发送提示而不是添加新行的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Up, Down, End and mouse clicks putting the cursor on the wrong row of a prompt that wraps", "中文内容": "修复了向上、向下、结束和鼠标单击将光标置于换行提示的错误行上的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed undo (Ctrl+_) losing the last words typed when pressed after deleting a line or word", "中文内容": "修复了删除行或单词后按下撤消 (Ctrl+_) 时丢失最后输入的单词的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed code or a diff pasted into a prompt losing its indentation in the transcript, and a pasted diff's added lines showing as removed", "中文内容": "修复了粘贴到提示中的代码或差异在转录中丢失缩进的问题，并且粘贴差异的添加行显示为已删除"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `[Image #N]` landing in the middle of a word when typing right after pasting, and a pasted image not being sent after deleting its placeholder and pasting it back with Ctrl+Y", "中文内容": "修复了粘贴后立即输入时`[Image #N]`落在单词中间的问题，以及删除其占位符并使用 Ctrl+Y 将其粘贴回来后未发送粘贴的图像的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed asterisks disappearing from your own prompts in the transcript, such as `src/**/*.ts` or `2*3*4`", "中文内容": "修复了转录中您自己的提示中星号消失的问题，例如`src/**/*.ts`或`2*3*4`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `claude -p` showing nothing in the terminal while it retried an overloaded or failing API request, or when it failed with its text output redirected or captured", "中文内容": "修复了`claude -p`在重试超载或失败的 API 请求时，或者在其文本输出重定向或捕获失败时在终端中不显示任何内容的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Windows paths in Claude's responses losing the backslash before folders like `.claude` or `_build`", "中文内容": "修复了 Claude 响应中的 Windows 路径在`.claude`或`_build`等文件夹之前丢失反斜杠的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed bold text showing as raw `**` in Japanese, Chinese and Korean replies when it starts or ends with punctuation", "中文内容": "修复了日语、中文和韩语回复中以标点符号开头或结尾时显示为原始`**`的粗体文本"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/memory` opening a read-only file with no warning that changes may not save", "中文内容": "修复了`/memory`打开只读文件时没有警告更改可能无法保存的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude editing `~/.claude/keybindings.json`, which has no effect in Claude Desktop, when asked to change a shortcut there", "中文内容": "修复了克劳德编辑`~/.claude/keybindings.json`的问题，当要求更改那里的快捷方式时，该编辑在克劳德桌面中不起作用"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude saying that an administrator can turn on Claude in Chrome when your organization's policy disables it, in apps that provide its tools such as Claude Desktop's Code tab", "中文内容": "修复了 Claude 表示，当您的组织的策略禁用 Chrome 时，管理员可以在提供其工具（例如 Claude Desktop 的“代码”选项卡）的应用程序中打开 Claude 的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the suggested next prompt sometimes being a bare tag, such as `<signal type=\"empty\" />`", "中文内容": "修复了建议的下一个提示有时是裸标签的问题，例如`<signal type=\"empty\" />`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long command output ending mid-line in the expanded view with no sign it was cut; it now names the saved file", "中文内容": "修复了长命令输出在展开视图中以中线结束且没有被剪切的迹象；它现在命名保存的文件"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed collapsed tool lines reading \"Ran\" or \"Called\" while still asking permission, and \"Running…\" or \"Reading…\" again when a panel opened after a call was stopped or refused", "中文内容": "修复了折叠工具行在仍在请求许可的情况下读取“Ran”或“Called”的问题，以及在呼叫停止或拒绝后打开面板时再次“Running...”或“Reading...”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed failed, blocked or refused commands looking like passing ones in a collapsed tool line: it now shows \"· 1 failed\" or says they did not run", "中文内容": "修复了失败、阻止或拒绝的命令，看起来像是在折叠的工具行中传递命令：它现在显示“· 1 失败”或说它们没有运行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"done\" line showing after a turn that failed or was refused at a permission prompt", "中文内容": "修复了在权限提示下失败或被拒绝的回合后显示的“完成”行"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed failed or refused skill and agent calls still showing \"Initializing…\"", "中文内容": "修复了失败或拒绝的技能以及代理呼叫仍显示“正在初始化...”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/btw` showing only a lead-in such as \"Let me check that file.\" with no notice when the model tried to use a tool (anthropics/claude-code#90314)", "中文内容": "修复了仅显示导入内容的`/btw`，例如“让我检查该文件”。当模型尝试使用工具时没有任何通知（anthropics/claude-code#90314）"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed long `/btw` answers looking finished and ignoring PgUp, PgDn, Home, End and the mouse wheel", "中文内容": "修复了长`/btw`答案看起来已完成并忽略 PgUp、PgDn、Home、End 和鼠标滚轮的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/resume` search saying \"No sessions match\" for older sessions that exist, and a typed number opening a session instead of searching", "中文内容": "修复了`/resume`搜索对存在的较旧会话显示“没有会话匹配”的问题，以及输入数字打开会话而不是搜索的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed pressing Ctrl+R again in fullscreen prompt search not moving to the next older match", "中文内容": "修复了在全屏提示搜索中再次按 Ctrl+R 不会移至下一个旧匹配的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Tab not completing file names without a slash in shell mode (`!`), and completed paths with spaces or shell characters not being quoted", "中文内容": "修复了在 shell 模式下 Tab 无法完成没有斜线的文件名 (`!`) 的问题，以及未用引号引起来的包含空格或 shell 字符的完整路径"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a rebound `chat:submit` key doing nothing while the slash command or @ file menu was open", "中文内容": "修复了当斜杠命令或@文件菜单打开时反弹“聊天：提交”键不执行任何操作的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed holding Esc over typed text opening Rewind after the text was cleared", "中文内容": "修复了在清除文本后按住 Esc 键在键入的文本上打开“倒带”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Esc over typed text cancelling a pending `/loop`", "中文内容": "修复了键入文本上的 Esc 取消挂起的`/loop`的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"Esc again to clear\" staying on screen after a second Esc would no longer clear the prompt", "中文内容": "修复了第二次 Esc 后“再次 Esc 清除”停留在屏幕上将不再清除提示的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed typing landing in the wrong place in a question's note after going back to it or editing it in an external editor", "中文内容": "修复了返回问题注释或在外部编辑器中编辑问题注释后在问题注释中的错误位置输入登陆的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the \"paste again to expand\" hint hiding the mode and \"esc to interrupt\" after a paste was sent or deleted", "中文内容": "修复了发送或删除粘贴后“再次粘贴以展开”提示隐藏模式和“ESC 以中断”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed \"paste again to expand\" hiding the middle of a paste longer than 10,000 characters in fullscreen mode, and a prompt collapsing while you type past that length", "中文内容": "修复了“再次粘贴以展开”在全屏模式下隐藏超过 10,000 个字符的粘贴中间部分，以及当您输入超过该长度时提示崩溃的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the arrow keys and `q` not working in a pager that `claude --help` is piped to, as in `claude --help | less`", "中文内容": "修复了箭头键和`q`在`claude --help`通过管道传输到的寻呼机中不起作用的问题，如“claude --help |”中所示。少`"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Claude Desktop's Code tab blaming the internet connection when a certificate's signature couldn't be verified", "中文内容": "修复了当无法验证证书签名时 Claude Desktop 的“代码”选项卡会指责互联网连接的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Web Search showing nothing while its request was being retried", "中文内容": "修复了重试请求时 Web 搜索不显示任何内容的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed desktop notifications not being sent inside tmux (with `allow-passthrough` on), or to iTerm2 over SSH, on the default setting", "中文内容": "修复了在默认设置下，桌面通知未在 tmux 内发送（启用`allow-passthrough`）或通过 SSH 发送至 iTerm2 的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/copy` and `/export` saying \"copied to clipboard\" over SSH when the terminal may not have copied anything", "中文内容": "修复了当终端可能没有复制任何内容时通过 SSH 说`/copy`和`/export`“复制到剪贴板”的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/usage-credits` saying \"Request sent to your admin\" when the request was refused; people who have billing access themselves are now pointed to the usage settings page", "中文内容": "修复了`/usage-credits`在请求被拒绝时显示“请求已发送至您的管理员”的问题；本身具有计费访问权限的人现在会被指向使用设置页面"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the transcript share question for Pro and Max users staying open after the next message, `/clear` or `/resume`", "中文内容": "修复了 Pro 和 Max 用户在下一条消息`/clear`或`/resume`后保持打开状态的文字记录共享问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed an upgrade hint appearing under an old usage limit message after the limit had reset", "中文内容": "修复了重置限制后旧使用限制消息下出现的升级提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the effort level notice reappearing after every permission prompt or dialog, and the usage limit warning and other notices not appearing while the context warning showed", "中文内容": "修复了每次权限提示或对话框后重新出现工作量级别通知，以及在显示上下文警告时不出现使用限制警告和其他通知的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/tui default` saying it had switched back to the classic renderer when a setting kept fullscreen on; after a `/tui` that can't switch, Claude Code now says what keeps the renderer", "中文内容": "修复了`/tui default`，表示当设置保持全屏打开时它已切换回经典渲染器；在无法切换的`/tui`之后，Claude Code 现在会说明是什么保留了渲染器"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a new account's first session using a different renderer from later ones", "中文内容": "修复了新帐户的第一个会话使用与后续帐户不同的渲染器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Reduce motion and Show tips in `/config` applying only to the current folder", "中文内容": "修复了仅适用于当前文件夹的`/config`中的减少运动和显示提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed typing and spinners redrawing the whole pane in tmux 3.7", "中文内容": "修复了 tmux 3.7 中打字和旋转器重绘整个窗格的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Option+T typing † instead of toggling thinking over SSH from iTerm2 when Option isn't set as Meta", "中文内容": "修复了 Option+T 键入 †，而不是在 Option 未设置为 Meta 时从 iTerm2 切换对 SSH 的思考"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `/terminal-setup` not naming the tmux settings that Shift+Enter needs, and promising Shift+Enter in Windows Terminal before 1.25, where it sends the prompt", "中文内容": "修复了 `/terminal-setup` 未命名 Shift+Enter 所需的 tmux 设置，并承诺在 1.25 之前的 Windows 终端中使用 Shift+Enter 发送提示"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed Program Status Protocol (OSC 7501) terminals showing a finished turn after idle compaction, or no status for background sessions opened with `claude agents`, `claude attach` or `--resume`", "中文内容": "修复了程序状态协议 (OSC 7501) 终端在空闲压缩后显示已完成的回合，或者使用“claude Agents”、“claude Attach”或`--resume`打开的后台会话没有状态的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed terminals that support the Program Status Protocol (OSC 7501) not seeing Claude Code as waiting on you while the folder trust prompt is open (anthropics/claude-code#105801)", "中文内容": "修复了支持程序状态协议 (OSC 7501) 的终端在文件夹信任提示打开时看不到 Claude Code 正在等待您的问题 (anthropics/claude-code#105801)"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the terminal progress bar showing Claude as working while it waited for your answer or was suspended with Ctrl+Z, and disappearing in Ghostty after 15 seconds while Claude was still working", "中文内容": "修复了终端进度条在等待您的答复时显示 Claude 正在工作或使用 Ctrl+Z 暂停，并在 Claude 仍在工作时 15 秒后在 Ghostty 中消失的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed fullscreen giving no sign that a permission prompt or question was waiting while you were scrolled up", "中文内容": "修复了全屏向上滚动时没有任何迹象表明权限提示或问题正在等待的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the fullscreen tool group headline naming a finished or queued call instead of the running one", "中文内容": "修复了全屏工具组标题命名已完成或排队的呼叫而不是正在运行的呼叫"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed finished tool groups in fullscreen counting a search or listing also as a shell command, and the tool timer there counting time at a permission prompt or queued behind another command", "中文内容": "修复了全屏中已完成的工具组也将搜索或列表也作为 shell 命令进行计数，以及工具计时器在权限提示下计算时间或在另一个命令后面排队的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a multi-line shell command filling the screen in fullscreen while it runs", "中文内容": "修复了多行 shell 命令在运行时以全屏方式填充屏幕的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed `!` shell commands showing no output for their first three seconds", "中文内容": "修复了`!` shell 命令在前三秒内没有显示输出的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed a running command showing no output or timer when its collapsed row was clicked open in fullscreen mode", "中文内容": "修复了在全屏模式下单击打开折叠行时运行命令不显示输出或计时器的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the jump-to-bottom pill disappearing in fullscreen while more of the reply was still below", "中文内容": "修复了跳至底部药丸在全屏下消失而更多回复仍在下方的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed the prompt disappearing in short fullscreen windows while a survey or notice showed above it", "中文内容": "修复了提示在短全屏窗口中消失而上方显示调查或通知的问题"}, {"日期": "2026-11-16", "版本": "2.1.326", "类型": "修复", "内容": "Fixed
